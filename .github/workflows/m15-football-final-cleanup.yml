name: M15 football final cleanup verify
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-football-final-cleanup.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: verify-football-cleanup
    steps:
      - name: Verify production football cleanup
        shell: bash
        run: |
          set -euo pipefail
          base='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          for attempt in $(seq 1 120); do
            health="$(curl -sS -o /tmp/sources.json -w '%{http_code}' "$base/api/v1/sources" || true)"
            proof="$(curl -sS -o /tmp/proof.json -w '%{http_code}' "$base/api/v1/internal/m15-football-sameday-proof-20260918-31f0c7" || true)"
            echo "M15_FOOTBALL_CLEANUP attempt=$attempt health=$health proof=$proof"
            if [[ "$health" = "200" && "$proof" = "404" ]]; then
              echo "M15_FOOTBALL_CLEANUP_VERIFIED=1"
              exit 0
            fi
            sleep 5
          done
          echo "football cleanup verification did not converge" >&2
          exit 1
