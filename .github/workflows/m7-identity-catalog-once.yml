name: One-shot M7 identity catalog

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-identity-catalog-once.yml

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production volleyball identity catalog
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-identity-catalog-d2bd775959894b2d'
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 120 -o catalog.json -w '%{http_code}' "$URL" || true)
            echo "M7_CATALOG_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then cat catalog.json || true; exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const p=require('./catalog.json');
          console.log('M7_CATALOG_D1='+JSON.stringify(p.d1||{}));
          console.log('M7_CATALOG_TEAMS='+JSON.stringify(p.teams||[]));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Catalog read wrote to D1');
          if(Number(p.d1?.rows_read||0)>2000) throw new Error(`Catalog read too high: ${p.d1.rows_read}`);
          NODE
