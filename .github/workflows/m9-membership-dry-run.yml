name: M9 membership dry run

# final one-shot read-only statewide planner evidence after residual alias cleanup
on:
  push:
    branches:
      - m9/statewide-conference-membership-20260915
    paths:
      - .github/workflows/m9-membership-dry-run.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query authoritative read-only statewide planner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-dry-run
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m9-membership-dry-run-20260915-a3f91c2e?source=all'
          code=$(curl --silent --show-error --max-time 300 -w '%{http_code}' "$URL" -o m9-dry-run/statewide.json)
          if [ "$code" != "200" ]; then
            echo "planner HTTP $code"
            cat m9-dry-run/statewide.json
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('m9-dry-run/statewide.json','utf8'));
          if(body.status!=='DRY_RUN') throw new Error(`expected DRY_RUN, got ${body.status || body.error || 'unknown'}`);
          if(body.safe!==true) throw new Error('authoritative M9 planner did not report safe=true');
          if(Number(body?.d1?.rows_written||0)!==0) throw new Error('M9 dry-run wrote D1 rows');
          if(Number(body?.coverage?.invalid||0)!==0) throw new Error('M9 payload contains invalid memberships');
          if(body?.planned?.migration!=='0016_conference_membership_truth.sql') throw new Error('unexpected M9 migration');
          const summary={status:body.status,safe:body.safe,fingerprint:body.fingerprint,active_eligible_teams:body.active_eligible_teams,coverage:body.coverage,excluded_high_school_teams:body.excluded_high_school_teams,known_source_gaps:body.known_source_gaps,high_school_source_stats:body.high_school?.source_stats,college:body.college,planned:body.planned,d1:body.d1};
          fs.writeFileSync('m9-dry-run/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Upload final dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-membership-final-dry-run
          path: m9-dry-run
          if-no-files-found: error
          retention-days: 7
