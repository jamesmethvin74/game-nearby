name: School branding diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/school-branding-diagnostics.yml"
      - "backend/src/school-branding.js"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect MaxPreps general Arkansas directory markup
        run: |
          node --input-type=module <<'JS'
          const response=await fetch('https://www.maxpreps.com/ar/schools/',{headers:{'user-agent':'Mozilla/5.0 LocalBleachersAR branding diagnostics'}});
          const html=await response.text();
          console.log('HTTP',response.status,'bytes',html.length);
          for(const needle of ['school-mascot','Dardanelle','Valley Springs','schoolid=']){
            let from=0;
            for(let i=0;i<3;i++){
              const idx=html.toLowerCase().indexOf(needle.toLowerCase(),from);
              if(idx<0) break;
              console.log('\nNEEDLE',needle,'INDEX',idx,'SNIPPET',html.slice(Math.max(0,idx-900),idx+1600).replace(/\s+/g,' '));
              from=idx+needle.length;
            }
          }
          JS
