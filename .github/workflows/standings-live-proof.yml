name: Standings live proof

on:
  pull_request:
    paths:
      - "backend/src/calculated-standings.js"
      - "backend/src/published-standings.js"
      - "backend/src/record-rebuild.js"
      - "backend/src/standings-worker.js"
      - "backend/src/football-record-reconciliation.js"
      - "backend/src/public-cors-worker.js"
      - "backend/src/worker.js"
      - "backend/test/immediate-standings-final.test.js"
      - "backend/test/published-standings.test.js"
      - "backend/test/football-record-reconciliation.test.js"
      - "backend/test/standings-ui.test.js"
      - "standings.html"
      - "standings.js"
      - "standings.css"
      - "service-worker.js"
      - ".github/workflows/standings-live-proof.yml"
  push:
    branches: [feature/standings-page-v1]
    paths:
      - "backend/src/calculated-standings.js"
      - "backend/src/published-standings.js"
      - "backend/src/record-rebuild.js"
      - "backend/src/standings-worker.js"
      - "backend/src/football-record-reconciliation.js"
      - "backend/src/public-cors-worker.js"
      - "backend/src/worker.js"
      - "backend/test/immediate-standings-final.test.js"
      - "backend/test/published-standings.test.js"
      - "backend/test/football-record-reconciliation.test.js"
      - "backend/test/standings-ui.test.js"
      - "standings.html"
      - "standings.js"
      - "standings.css"
      - "service-worker.js"
      - ".github/workflows/standings-live-proof.yml"

jobs:
  proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify current Arkansas published standings fallback
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { listPublishedStandingsOptions, fetchPublishedStandings } from './src/published-standings.js';
          import { reconcileFootballGameRecords, reconcileFootballOverallRecords } from './src/football-record-reconciliation.js';

          const recordGames = value => (String(value || '').match(/\d+/g)?.map(Number) || []).reduce((sum, part) => sum + part, 0);

          const options = await listPublishedStandingsOptions({ sport: 'volleyball' });
          assert.ok(options.conferences.length >= 10, `expected broad Arkansas conference discovery, found ${options.conferences.length}`);
          const central = options.conferences.find(row => row.id === '6a-central');
          assert.ok(central, 'current 6A Central volleyball conference was not discovered');
          assert.match(central.source_url, /\/ar\/volleyball\/26-27\/conference\/6a-central\//);

          const standings = await fetchPublishedStandings({ sport: 'volleyball', conferenceId: '6a-central' });
          assert.ok(standings.standings.length >= 5, `6A Central standings suspiciously small: ${standings.standings.length}`);
          const names = new Set(standings.standings.map(row => row.school_name.toLowerCase()));
          assert.ok([...names].some(name => name.includes('conway')), '6A Central live standings missing Conway');
          assert.ok(standings.standings.every(row => /^\d+-\d+(?:-\d+)?$/.test(row.overall_record)), 'invalid overall record in live standings');
          assert.ok(standings.standings.every(row => /^\d+-\d+(?:-\d+)?$/.test(row.conference_record)), 'invalid conference record in live standings');

          const footballPublished = await fetchPublishedStandings({ sport: 'football', conferenceId: '7a-central' });
          const publishedConway = footballPublished.standings.find(row => row.school_name.toLowerCase().includes('conway'));
          const football = await reconcileFootballOverallRecords(footballPublished, { sport: 'football', season: 2026 });
          const conwayFootball = football.standings.find(row => row.school_name.toLowerCase().includes('conway'));
          assert.ok(conwayFootball, '7A Central live football standings missing Conway');
          assert.equal(conwayFootball.conference_record, '0-0', 'Conway should not have a conference result yet');
          assert.ok(recordGames(conwayFootball.overall_record) >= recordGames(publishedConway?.overall_record), 'football reconciliation must not move Conway backward');
          assert.ok(recordGames(conwayFootball.overall_record) >= 1, `expected at least one completed Conway football game; got ${conwayFootball.overall_record}`);

          const cards = await reconcileFootballGameRecords([{
            id: 'conway-home-proof',
            team_id: 'conway-football-2026',
            school_name: 'Conway High School',
            level: 'high-school',
            sport: 'football',
            season: '2026',
            wins: 0,
            losses: 0,
            ties: 0,
            conference_wins: 0,
            conference_losses: 0,
            conference_ties: 0
          }]);
          assert.ok(cards[0].wins + cards[0].losses + cards[0].ties >= 1, `Home card Conway record should have at least one completed game; got ${cards[0].wins}-${cards[0].losses}`);
          assert.equal(cards[0].conference_wins, 0);

          console.log(JSON.stringify({
            verified: true,
            volleyball: {
              conferences: options.conferences.length,
              source: standings.conference.source_url,
              rows: standings.standings.length
            },
            football: {
              conference: football.conference.name,
              conway: {
                conference: conwayFootball.conference_record,
                overall: conwayFootball.overall_record,
                source: conwayFootball.overall_record_source_url || conwayFootball.source_url || null,
                home_card: `${cards[0].wins}-${cards[0].losses}`
              }
            }
          }, null, 2));
          JS
