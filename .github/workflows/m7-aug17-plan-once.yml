name: One-shot M7 Aug 17 repair plan

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-aug17-plan-once.yml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run zero-write production repair planner
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-plan-aug17-6f1e1dd2b0b74b78'
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 60 -o m7-plan.json -w '%{http_code}' "$URL" || true)
            echo "M7_PLAN_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('m7-plan.json','utf8'));
          const d1=payload.d1||{};
          console.log('M7_PLAN_D1='+JSON.stringify(d1));
          console.log('M7_PLAN_SAFE='+JSON.stringify({safe_to_execute:payload.safe_to_execute,blockers:payload.blockers||[]}));
          console.log('M7_PLAN_FINGERPRINT='+String(payload.plan_fingerprint||''));
          console.log('M7_PLAN_WRITE_SCOPE='+JSON.stringify({expected_rows_written_if_approved:payload.expected_rows_written_if_approved,repair_statement_budget:payload.repair_statement_budget,write_scope:payload.write_scope||{}}));
          console.log('M7_PLAN_CANONICAL='+JSON.stringify(payload.canonical_plan||[]));
          console.log('M7_PLAN_SOURCES='+JSON.stringify(payload.source_plan||[]));
          console.log('M7_PLAN_GAMES='+JSON.stringify(payload.game_plan||[]));
          console.log('M7_PLAN_MEMBERS='+JSON.stringify(payload.member_plan||[]));
          if(Number(d1.rows_written||0)!==0) throw new Error(`Planner wrote ${d1.rows_written} D1 rows`);
          NODE
