name: M7 final post-cleanup read-only verification

on:
  push:
    branches:
      - m7/final-postcleanup-verify-http

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify retired routes and four public schedules
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'

          for path in \
            /api/v1/internal/m7-final-three-version-e4b7c631 \
            /api/v1/internal/m7-final-four-team-evidence-e4b7c631 \
            /api/v1/internal/m7-final-three-plan-e4b7c631 \
            /api/v1/internal/m7-final-three-execute-e4b7c631; do
            code=$(curl -sS --max-time 30 -o /tmp/retired.json -w '%{http_code}' "$BASE$path")
            echo "$path HTTP=$code"
            test "$code" = "404"
          done

          for team in \
            df-7x4sxh-volleyball-2026 \
            df-ht8yyh-volleyball-2026 \
            df-dxgr8r-volleyball-2026 \
            df-rpnt3m-volleyball-2026; do
            curl -fsS --max-time 60 "$BASE/api/v1/teams/$team/schedule" -o "$team.json"
          done

          node <<'NODE'
          const fs=require('fs');
          const load=id=>JSON.parse(fs.readFileSync(`${id}.json`,'utf8'));
          const pea=load('df-7x4sxh-volleyball-2026');
          const har=load('df-ht8yyh-volleyball-2026');
          const mh=load('df-dxgr8r-volleyball-2026');
          const bat=load('df-rpnt3m-volleyball-2026');
          const games=p=>Array.isArray(p.games)?p.games:[];
          const final=(p,pred)=>games(p).find(g=>g.status==='FINAL'&&pred(g));
          const bad='ce:volleyball:girls:2026:df-7x4sxh:df-ht8yyh:20260824:t1800';
          const pc='ce:volleyball:girls:2026:df-7x4sxh:df-k7ketx:20260824:df-69b361f98d3c020536000002';
          const hc='ce:volleyball:girls:2026:df-ht8yyh:df-t5drr3:20260824:df-697285d2b5fdd10017000004';
          const bc='ce:volleyball:girls:2026:df-dxgr8r:df-rpnt3m:20260903:t1830';

          if(games(pea).some(g=>g.canonical_event_id===bad)||games(har).some(g=>g.canonical_event_id===bad)) throw new Error('False Pea Ridge/Harrison canonical is still public');
          const pp=final(pea,g=>g.canonical_event_id===pc&&Number(g.team_score)===2&&Number(g.opponent_score)===3);
          const hv=final(har,g=>g.canonical_event_id===hc&&Number(g.team_score)===3&&Number(g.opponent_score)===0);
          const m=final(mh,g=>g.canonical_event_id===bc&&Number(g.team_score)===3&&Number(g.opponent_score)===0);
          const b=final(bat,g=>g.canonical_event_id===bc&&Number(g.team_score)===0&&Number(g.opponent_score)===3);
          if(!pp||!hv||!m||!b) throw new Error('Final public schedule proof failed');
          for(const [name,p] of [['Pea Ridge',pea],['Harrison',har],['Mountain Home',mh],['Batesville',bat]]) if(!p.record) throw new Error(`${name} record missing`);
          console.log('FINAL_PUBLIC_VERIFY='+JSON.stringify({
            pea_providence:{scheduled_at:pp.scheduled_at,team_score:pp.team_score,opponent_score:pp.opponent_score,canonical_event_id:pp.canonical_event_id},
            harrison_valley:{scheduled_at:hv.scheduled_at,team_score:hv.team_score,opponent_score:hv.opponent_score,canonical_event_id:hv.canonical_event_id},
            mountain_home_batesville:{mountain_home:[m.team_score,m.opponent_score],batesville:[b.team_score,b.opponent_score],canonical_event_id:b.canonical_event_id},
            records:{pea:pea.record,harrison:har.record,mountain_home:mh.record,batesville:bat.record}
          }));
          NODE
