name: Milestone 1 DragonFly team inventory diagnostic

on:
  push:
    branches:
      - diagnostics/milestone1-dragonfly-team-inventory
    paths:
      - .github/workflows/milestone1-dragonfly-team-inventory-diagnostic.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Arkansas-only varsity inventory from official feeds
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { fetchDragonFlyPagedPayload } from './backend/src/dragonfly-feed.js';
          import { fetchArkansasSchoolLocationFeatures, matchArkansasSchoolLocations } from './backend/src/arkansas-school-locations.js';

          const feeds = [
            {sport:'football',gender:'boys',code:'MFB_Varsity'},
            {sport:'basketball',gender:'boys',code:'MBB_Varsity'},
            {sport:'basketball',gender:'girls',code:'WBB_Varsity'},
            {sport:'soccer',gender:'boys',code:'MSO_Varsity'},
            {sport:'soccer',gender:'girls',code:'WSO_Varsity'},
            {sport:'volleyball',gender:'girls',code:'WVB_Varsity'}
          ];
          const base = code => `https://maxinfosite-api-live.dragonflyathletics.com/states/ArkAA/schedules/2026/${code}/0`;
          const headers = {'user-agent':'LocalBleachersAR-milestone1-diagnostic/3.0','accept':'application/json'};
          const participants = new Map();
          const targets = [];
          const feedSummary = [];

          for (const feed of feeds) {
            const {payload,pageCount} = await fetchDragonFlyPagedPayload(base(feed.code), {headers,maxPages:20});
            const byTeam = new Map();
            for (const event of payload.schedule || []) {
              for (const participant of event.participants || []) {
                const team = participant.team || {};
                const teamId = String(team.teamId || '').trim();
                const orgShortCode = String(participant.orgShortCode || '').trim().toUpperCase();
                const name = String(participant.name || '').replace(/\s+/g,' ').trim();
                const level = String(team.level || '').toLowerCase();
                if (!teamId || !orgShortCode || !name || /^(?:TBD|TBA)$/i.test(name) || (level && !level.includes('varsity'))) continue;
                participants.set(orgShortCode,{id:orgShortCode,name,city:''});
                byTeam.set(teamId,{external_team_id:teamId,external_school_id:orgShortCode,school_name:name,sport:feed.sport,gender:feed.gender,team_code:String(team.code || ''),feed_code:feed.code});
              }
            }
            targets.push(...byTeam.values());
            feedSummary.push({sport:feed.sport,gender:feed.gender,feed_code:feed.code,pages:pageCount,events:payload.schedule.length,participant_teams:byTeam.size});
          }

          const gis = await fetchArkansasSchoolLocationFeatures({pageSize:500});
          const locationMatches = matchArkansasSchoolLocations([...participants.values()], gis.features);
          const matchedIds = new Set(locationMatches.matched.map(row => row.school_id));
          const arkansasTargets = targets.filter(row => matchedIds.has(row.external_school_id));
          const uniqueTargetKeys = new Map();
          for (const row of arkansasTargets) uniqueTargetKeys.set(`${row.external_school_id}|${row.sport}|${row.gender}`, row);
          const expectedTeams = [...uniqueTargetKeys.values()].sort((a,b)=>a.school_name.localeCompare(b.school_name)||a.sport.localeCompare(b.sport)||a.gender.localeCompare(b.gender));
          const schoolById = new Map(locationMatches.matched.map(row => [row.school_id,row]));
          const expectedSchools = [...new Set(expectedTeams.map(row=>row.external_school_id))].map(id=>schoolById.get(id)).filter(Boolean).sort((a,b)=>a.school_name.localeCompare(b.school_name));

          const perSport = feeds.map(feed => {
            const all = targets.filter(row=>row.sport===feed.sport && row.gender===feed.gender);
            const ar = expectedTeams.filter(row=>row.sport===feed.sport && row.gender===feed.gender);
            return {sport:feed.sport,gender:feed.gender,participant_team_ids:all.length,arkansas_expected_teams:ar.length};
          });

          const output = {
            generated_at:new Date().toISOString(),
            authority:'DragonFly ArkAA varsity feeds filtered through Arkansas GIS public/private school layers',
            feed_summary:feedSummary,
            summary:{
              dragonfly_participant_orgs:participants.size,
              gis_public_features:gis.publicFeatures.length,
              gis_private_features:gis.privateFeatures.length,
              matched_arkansas_schools:expectedSchools.length,
              expected_team_targets:expectedTeams.length,
              unresolved_participant_orgs:locationMatches.unresolved.length,
              ambiguous_participant_orgs:locationMatches.ambiguous.length
            },
            per_sport:perSport,
            schools:expectedSchools,
            teams:expectedTeams,
            unresolved:locationMatches.unresolved,
            ambiguous:locationMatches.ambiguous
          };
          fs.writeFileSync('arkansas-high-school-team-inventory.json',JSON.stringify(output,null,2));
          console.log(JSON.stringify({summary:output.summary,per_sport:output.per_sport,feeds:feedSummary},null,2));
          if (expectedSchools.length < 150 || expectedTeams.length < 500) throw new Error('Arkansas-only inventory unexpectedly small');
          NODE

      - name: Upload Arkansas-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-arkansas-high-school-team-inventory
          path: arkansas-high-school-team-inventory.json
          retention-days: 1
