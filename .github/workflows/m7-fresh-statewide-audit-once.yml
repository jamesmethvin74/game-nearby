name: One-shot fresh M7 statewide volleyball audit

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-fresh-statewide-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run zero-write statewide audit after identity hardening
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-audit-7e49c2a1bd6f4083'
          code=000
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 180 -o m7-audit.json -w '%{http_code}' "$URL" || true)
            echo "M7_AUDIT_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then cat m7-audit.json || true; exit 1; fi
            sleep 5
          done
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('m7-audit.json','utf8'));
          const counts=Object.fromEntries(Object.entries(p.exceptions_by_deficiency||{}).map(([k,v])=>[k,v.count]));
          console.log('M7_FRESH_D1='+JSON.stringify(p.d1||{}));
          console.log('M7_FRESH_SUMMARY='+JSON.stringify(p.summary||{}));
          console.log('M7_FRESH_COUNTS='+JSON.stringify(counts));
          console.log('M7_FRESH_AUTHORITY='+JSON.stringify(p.authority_fetch||{}));
          console.log('M7_FRESH_IDENTITY='+JSON.stringify(p.audit_corrections||{}));
          console.log('M7_FRESH_FINAL_PLAN='+JSON.stringify(p.final_gap_plan||{}));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error(`Audit wrote ${p.d1.rows_written} rows`);
          NODE
