name: One-shot M15 integrity gate proof

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-integrity-gate-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run live statewide integrity gate proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const PATH='/api/v1/internal/m15-integrity-gate-proof-20260918-7fd31c84';
          const FP='m15-integrity-gate-v1-proof-20260918';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function call(method,body=null,timeoutMs=1800000){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeoutMs);
            try{
              const response=await fetch(BASE+PATH,{
                method,
                headers:body?{'content-type':'application/json'}:{},
                body:body?JSON.stringify(body):undefined,
                signal:controller.signal
              });
              const text=await response.text();
              let payload={};
              try{payload=text?JSON.parse(text):{};}catch{payload={raw:text.slice(0,2000)};}
              return {status:response.status,payload};
            }finally{clearTimeout(timer);}
          }

          let ready=false;
          for(let attempt=1;attempt<=120;attempt++){
            try{
              const response=await call('GET',null,300000);
              if(response.status===200 && response.payload?.status==='READY' && response.payload?.fingerprint===FP){
                ready=true;
                console.log('M15_GATE_READY='+JSON.stringify(response.payload));
                break;
              }
              console.log('M15_GATE_WAIT='+JSON.stringify({attempt,http:response.status,status:response.payload?.status||null}));
            }catch(error){
              console.log('M15_GATE_WAIT='+JSON.stringify({attempt,error:String(error.message).slice(0,300)}));
            }
            await sleep(5000);
          }
          if(!ready) throw new Error('integrity proof route never became ready');

          const response=await call('POST',{fingerprint:FP},2400000);
          if(response.status!==200) throw new Error('gate POST failed HTTP '+response.status+' '+JSON.stringify(response.payload).slice(0,4000));
          const result=response.payload?.result||{};
          console.log('M15_GATE_RESULT='+JSON.stringify({
            status:result.status,
            generated_at:result.generated_at,
            reason:result.reason,
            presentation:result.presentation,
            record:result.record,
            repairs:result.repairs,
            fuses:result.fuses,
            blocker_examples:result.blocker_examples,
            state_write:result.state_write
          }));
          if(result.status!=='CLEAN'){
            throw new Error('integrity gate did not finish CLEAN: '+JSON.stringify({
              status:result.status,fuses:result.fuses,blocker_examples:result.blocker_examples
            }).slice(0,8000));
          }
          NODE
