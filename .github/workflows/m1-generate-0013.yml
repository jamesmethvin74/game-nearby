name: Generate corrective M1 migration 0013

on:
  push:
    branches:
      - probe/m1-generate-0013

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate migration
        run: node backend/scripts/generate-m1-0013.mjs
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: m1-generated-0013
          path: 0013_milestone1_complete_team_materialization.sql
          if-no-files-found: error
