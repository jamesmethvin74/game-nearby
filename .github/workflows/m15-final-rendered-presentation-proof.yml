name: M15 final rendered presentation proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/m15-final-rendered-presentation-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium proof dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove rendered presentation contract
        env:
          BASE_URL: https://jamesmethvin74.github.io/game-nearby
        run: |
          cat > m15-proof.mjs <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 430, height: 932 } });
          await context.addInitScript(() => {
            localStorage.setItem('followedTeams', JSON.stringify(['conway']));
            localStorage.setItem('localBleachersAR:standings:lastSport', 'volleyball');
            localStorage.setItem('localBleachersAR:standings:lastConferenceBySport', JSON.stringify({ volleyball: '6a-central' }));
          });
          const page = await context.newPage();
          const normalize = s => String(s || '').replace(/\s+/g, ' ').trim();
          const result = { release: '', home: '', detail: '', standings: '', maxPrepsSchedulePresent: false, errors: [] };

          try {
            await page.goto(base + '/?m15proof=74', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v74', null, { timeout: 45000 });
            result.release = await page.evaluate(() => window.LocalBleachersRuntime?.releaseGeneration || '');

            await page.waitForFunction(() => {
              return [...document.querySelectorAll('#followedEvents .event-card')].some(card => /Conway/i.test(card.innerText) && /Volleyball/i.test(card.innerText));
            }, null, { timeout: 45000 });

            const card = page.locator('#followedEvents .event-card').filter({ hasText: /Conway/i }).filter({ hasText: /Volleyball/i }).first();
            result.home = normalize(await card.innerText());
            const wholeHome = normalize(await page.locator('body').innerText());
            result.maxPrepsSchedulePresent = /MaxPreps schedule/i.test(wholeHome);

            if (!/Overall\s+9-4/i.test(result.home)) result.errors.push('HOME overall is not 9-4');
            if (!/Conference\s+4-0/i.test(result.home)) result.errors.push('HOME conference is not 4-0');
            if (!/Standing\s+#1\s*[·•]\s*6A Central/i.test(result.home)) result.errors.push('HOME standing is not #1 · 6A Central');
            if (/11-6/.test(result.home)) result.errors.push('HOME leaked raw 11-6');
            if (!/View schedule & results/i.test(result.home)) result.errors.push('HOME missing View schedule & results');
            if (result.maxPrepsSchedulePresent) result.errors.push('Page contains MaxPreps schedule');

            await card.getByText('View schedule & results', { exact: true }).click();
            const dialog = page.locator('#teamDetailDialog');
            await dialog.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForTimeout(2500);
            result.detail = normalize(await dialog.innerText());

            if (!/Overall\s+9-4/i.test(result.detail)) result.errors.push('DETAIL overall is not 9-4');
            if (!/Conference\s+4-0/i.test(result.detail)) result.errors.push('DETAIL conference is not 4-0');
            if (!/Standing\s+#1\s+6A Central/i.test(result.detail)) result.errors.push('DETAIL standing is not #1 / 6A Central');

            await page.goto(base + '/standings.html?m15proof=74', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => [...document.querySelectorAll('#standingsBody tr')].some(row => /Conway/i.test(row.innerText)), null, { timeout: 45000 });
            const row = page.locator('#standingsBody tr').filter({ hasText: /Conway/i }).first();
            result.standings = normalize(await row.innerText());
            const cells = await row.locator('td').allInnerTexts();
            const c = cells.map(normalize);
            if (!(c[0] === '1' || c[0] === '#1')) result.errors.push('STANDINGS rank is not 1/#1');
            if (c[2] !== '4-0') result.errors.push('STANDINGS conference is not 4-0');
            if (c[3] !== '9-4') result.errors.push('STANDINGS overall is not 9-4');

            console.log('M15_RENDERED_PROOF=' + JSON.stringify(result));
            if (result.errors.length) throw new Error(result.errors.join('; '));
          } finally {
            await browser.close();
          }
          NODE
          node m15-proof.mjs
