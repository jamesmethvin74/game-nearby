name: M15 preseason evidence
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-preseason-evidence.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: inspect-preseason
    steps:
      - name: Inspect live early-season schedule rows
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const get=async path=>{
            const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});
            const text=await r.text();
            let body={}; try{body=JSON.parse(text);}catch{body={raw:text.slice(0,2000)}}
            return {status:r.status,body};
          };
          const normalize=s=>String(s||'').toLowerCase().replace(/\bhigh school\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const schools=(await get('/api/v1/schools')).body.schools||[];
          for(const name of ['North Little Rock High School','Bryant High School','Van Buren High School']){
            const school=schools.find(s=>normalize(s.name)===normalize(name));
            if(!school){console.log('EARLY_SCHOOL='+JSON.stringify({name,error:'not_found'}));continue;}
            const res=await get('/api/v1/schools/'+encodeURIComponent(school.id)+'/schedule');
            const rows=(res.body.games||[]).filter(g=>{
              const d=String(g.scheduled_at||g.canonical_scheduled_at||'');
              return /^2026-08-/.test(d);
            }).map(g=>({
              id:g.id,
              reporting_team_id:g.reporting_team_id||g.team_id,
              sport:g.sport,gender:g.gender,
              opponent:g.opponent,
              opponent_school_id:g.opponent_school_id||null,
              scheduled_at:g.scheduled_at||g.canonical_scheduled_at,
              status:g.status,
              result:g.result,
              team_score:g.team_score,
              opponent_score:g.opponent_score,
              venue:g.venue,
              notes:g.notes||null,
              source_type:g.source_type,
              parser_type:g.parser_type,
              source_url:g.source_url||null,
              conference_game:g.conference_game,
              canonical_event_id:g.canonical_event_id||null,
              schedule_observation_count:g.schedule_observation_count||1
            }));
            console.log('EARLY_SCHOOL='+JSON.stringify({name,id:school.id,http:res.status,rows}));
          }
          NODE
