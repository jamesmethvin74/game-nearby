name: M2 certified DragonFly feed audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit full paginated certified coverage
        working-directory: backend
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee ../m2-certified-feed-audit.json
          import fs from 'node:fs';
          import { fetchDragonFlyPagedPayload } from './src/dragonfly-feed.js';
          import { discoverCertifiedSportParticipants } from './src/dragonfly-certified-sport-catalog.js';
          import { STATEWIDE_HIGH_SCHOOL_SPORTS } from './src/statewide-sport-config.js';

          const inventory=JSON.parse(fs.readFileSync('./data/arkansas-high-school-team-inventory.json','utf8'));
          const certified=inventory.certified_school_team_codes||{};
          const report=[];
          for (const config of STATEWIDE_HIGH_SCHOOL_SPORTS) {
            const {payload,pageCount}=await fetchDragonFlyPagedPayload(config.feedUrl,{
              headers:{'user-agent':'LocalBleachersAR-M2-audit/1.0','accept':'application/json'}
            });
            const entries=discoverCertifiedSportParticipants(payload,config);
            const expectedSchools=new Set(Object.entries(certified).filter(([,codes])=>codes.includes(config.teamCode)).map(([id])=>id.toUpperCase()));
            const discoveredCertifiedSchools=new Set(entries.filter(item=>expectedSchools.has(item.externalSchoolId)).map(item=>item.externalSchoolId));
            const unknownSchools=[...new Set(entries.filter(item=>!expectedSchools.has(item.externalSchoolId)).map(item=>item.externalSchoolId))].sort();
            const missingSchools=[...expectedSchools].filter(id=>!discoveredCertifiedSchools.has(id)).sort();
            report.push({
              key:config.key,
              teamCode:config.teamCode,
              feedCode:config.feedCode,
              pages:pageCount,
              events:payload.schedule.length,
              expectedTargets:config.expectedTargets,
              discoveredParticipantIds:entries.length,
              discoveredCertifiedSchools:discoveredCertifiedSchools.size,
              missingCertifiedSchools:missingSchools.length,
              unknownOrNonTargetSchools:unknownSchools.length,
              missingSchoolIds:missingSchools,
              quarantinedSchoolIds:unknownSchools
            });
          }
          console.log(JSON.stringify({generatedAt:new Date().toISOString(),report},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: m2-certified-feed-audit
          path: m2-certified-feed-audit.json
          if-no-files-found: error
