name: M1 corrected verification Worker dry-run

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: backend
        run: npm install
      - name: Check and dry-run bundle
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ../m1-check-v2.log
          npx wrangler deploy --dry-run 2>&1 | tee ../m1-wrangler-dry-run-v2.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-worker-build-dry-run-v2
          path: |
            m1-check-v2.log
            m1-wrangler-dry-run-v2.log
          if-no-files-found: warn
