name: M15 final fresh-client proof
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-live-maumelle-evidence.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: verify-fresh-client-live
    steps:
      - name: Verify fresh production client and factual payloads
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const text=async path=>{
            const r=await fetch(base+path,{cache:'no-store'});
            return {status:r.status,body:await r.text()};
          };
          const json=async path=>{
            const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});
            return {status:r.status,body:await r.json()};
          };
          let ready=false;
          for(let attempt=1;attempt<=120;attempt++){
            const [sw,index,standingsHtml,standingsJs,scheduleJs]=await Promise.all([
              text('/service-worker.js'),
              text('/index.html'),
              text('/standings.html'),
              text('/standings.js'),
              text('/school-schedule.js')
            ]);
            const markers={
              sw67:/localbleachersar-shell-v67/.test(sw.body),
              navNetworkFirst:/fetch\(event\.request, \{ cache: "no-store" \}\)/.test(sw.body),
              index67:/team-detail\.js\?v=67/.test(index.body)&&/school-schedule\.js\?v=67/.test(index.body)&&/service-worker\.js\?v=67/.test(index.body),
              standings67:/standings\.js\?v=67/.test(standingsHtml.body)&&/service-worker\.js\?v=67/.test(standingsHtml.body),
              scheduleV5:/localBleachersAR:teamSchedule:v5:/.test(scheduleJs.body),
              displayFields:/display_rank/.test(standingsJs.body)&&/display_conference_record/.test(standingsJs.body)&&/display_overall_record/.test(standingsJs.body),
              oldMessage:/Published standings are available only as evidence/.test(standingsJs.body)
            };
            console.log('FRESH_WAIT='+JSON.stringify({attempt,markers}));
            if(Object.entries(markers).every(([k,v])=>k==='oldMessage'?!v:v)){ready=true;break;}
            await sleep(5000);
          }
          if(!ready) throw new Error('fresh client contract did not reach production');

          const schools=(await json('/api/v1/schools')).body.schools||[];
          const normalize=s=>String(s||'').toLowerCase().replace(/\bhigh school\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const maumelle=schools.find(s=>normalize(s.name)===normalize('Maumelle High School'));
          const schedule=await json('/api/v1/schools/'+encodeURIComponent(maumelle.id)+'/schedule');
          const football=(schedule.body.team_statuses||[]).find(s=>s.sport==='football');
          const volleyball=(schedule.body.team_statuses||[]).find(s=>s.sport==='volleyball');
          const standings=await json('/api/v1/standings?sport=volleyball&conference=6a-central');

          console.log('FRESH_RESULT='+JSON.stringify({
            maumelle_football:{
              overall:football?.display_overall_record,
              conference:football?.display_conference_record,
              rank:football?.display_rank,
              method:football?.display_method
            },
            maumelle_volleyball:{
              overall:volleyball?.display_overall_record,
              conference:volleyball?.display_conference_record,
              rank:volleyball?.display_rank,
              method:volleyball?.display_method
            },
            six_a_central:(standings.body.standings||[]).map(r=>({
              school:r.school_name,rank:r.display_rank,conference:r.display_conference_record,overall:r.display_overall_record,method:r.display_method
            }))
          }));

          if(!football?.display_overall_record || !volleyball?.display_overall_record) throw new Error('Maumelle factual display records missing');
          if((standings.body.standings||[]).some(r=>r.display_conference_record==null||r.display_overall_record==null)) throw new Error('6A Central factual display values missing');
          NODE
