name: M15 live Maumelle evidence
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-live-maumelle-evidence.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect live Maumelle and 6A Central
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const get=async path=>{
            const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});
            const text=await r.text();
            let body; try{body=JSON.parse(text);}catch{body=text;}
            return {status:r.status,headers:Object.fromEntries(r.headers),body};
          };
          const normalize=s=>String(s||'').toLowerCase().replace(/\bhigh school\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const schools=(await get('/api/v1/schools')).body.schools||[];
          const maumelle=schools.find(s=>normalize(s.name)===normalize('Maumelle High School'));
          console.log('MAUMELLE_SCHOOL='+JSON.stringify(maumelle||null));
          if(maumelle){
            const sched=await get('/api/v1/schools/'+encodeURIComponent(maumelle.id)+'/schedule');
            console.log('MAUMELLE_SCHEDULE='+JSON.stringify({
              http:sched.status,
              team_statuses:(sched.body.team_statuses||[]).map(s=>({
                team_id:s.team_id,sport:s.sport,gender:s.gender,
                conference_id:s.conference_id,conference_name:s.conference_name,
                overall_record:s.overall_record,conference_record:s.conference_record,rank:s.rank,
                display_overall_record:s.display_overall_record,
                display_conference_record:s.display_conference_record,
                display_rank:s.display_rank,
                display_method:s.display_method,
                record_verified:s.record_verified,standing_state:s.standing_state,
                source:s.source
              })),
              games:(sched.body.games||[]).slice(0,20).map(g=>({
                id:g.id,team_id:g.reporting_team_id||g.team_id,sport:g.sport,gender:g.gender,
                opponent:g.opponent,scheduled_at:g.scheduled_at||g.canonical_scheduled_at,
                status:g.status,team_score:g.team_score,opponent_score:g.opponent_score,
                notes:g.notes||null,parser_type:g.parser_type,counts_for_record:g.counts_for_record,
                source_type:g.source_type
              }))
            }));
          }
          const standings=await get('/api/v1/standings?sport=volleyball&conference=6a-central');
          console.log('VB_6A_CENTRAL='+JSON.stringify({
            http:standings.status,
            conference:standings.body.conference||null,
            standings:(standings.body.standings||[]).map(r=>({
              team_id:r.team_id,school_name:r.school_name,rank:r.rank,
              conference_record:r.conference_record,overall_record:r.overall_record,
              published_rank:r.published_rank,published_conference_record:r.published_conference_record,published_overall_record:r.published_overall_record,
              display_rank:r.display_rank,display_conference_record:r.display_conference_record,display_overall_record:r.display_overall_record,
              display_method:r.display_method
            }))
          }));
          for(const p of ['/standings.html','/standings.js','/team-detail.js','/service-worker.js']){
            const r=await fetch(base+p,{cache:'no-store'});
            const t=await r.text();
            console.log('ASSET='+JSON.stringify({path:p,http:r.status,len:t.length,head:t.slice(0,500),markers:{
              hasDisplay:/display_overall_record|display_conference_record|display_rank/.test(t),
              shellV66:/localbleachersar-shell-v66/.test(t),
              standingsV65:/standings\.js\?v=65/.test(t)
            }}));
          }
          NODE
