name: One-shot Bauxite exact evidence

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/one-shot-bauxite-exact-evidence.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for zero-D1 marker, then fetch exact evidence once
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/bauxite-evidence-marker-20260914"
          EVIDENCE="$BASE/api/v1/internal/bauxite-evidence-20260914"

          rm -f marker.json evidence.json
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o marker.tmp -w '%{http_code}' "$MARKER" || true)
            if [ "$code" = "200" ] && node <<'NODE'
          const fs=require('fs');
          try {
            const r=JSON.parse(fs.readFileSync('marker.tmp','utf8'));
            process.exit(r.marker==='bauxite-evidence-20260914' && r.d1_access===false && Number(r.rows_written||0)===0 ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then
              mv marker.tmp marker.json
              break
            fi
            sleep 2
          done
          test -f marker.json

          curl -fsS --max-time 60 "$EVIDENCE" -o evidence.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence.json','utf8'));
          if(Number(r?.d1?.rows_written||0)!==0) throw new Error(`Evidence read wrote rows: ${r?.d1?.rows_written}`);
          console.log('BAUXITE_EXACT_EVIDENCE='+JSON.stringify(r,null,2));
          NODE
