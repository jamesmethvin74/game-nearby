name: One-shot M15 statewide collector repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-statewide-refresh-once.yml

permissions:
  contents: read

concurrency:
  group: m15-statewide-authoritative-refresh
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Run bounded statewide football and volleyball collectors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const PATH_ONCE='/api/v1/internal/m15-statewide-repair-20260917-4c8e2f7a91bd';
          const FP='m15-statewide-presentation-repair-1426-364-20260917';
          const VERSION='m15-v4';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function request(method,body=null,timeoutMs=2400000){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeoutMs);
            try {
              const response=await fetch(BASE+PATH_ONCE,{
                method,
                headers:body?{'content-type':'application/json'}:{},
                body:body?JSON.stringify(body):undefined,
                signal:controller.signal
              });
              const text=await response.text();
              let payload={};
              try{payload=text?JSON.parse(text):{};}catch{payload={raw:text.slice(0,4000)};}
              if(!response.ok) throw new Error(`${method} HTTP ${response.status}: ${JSON.stringify(payload).slice(0,12000)}`);
              return payload;
            } finally { clearTimeout(timer); }
          }

          async function main(){
            let ready=null;
            for(let attempt=1;attempt<=120;attempt++){
              try{
                const payload=await request('GET',null,300000);
                if(payload.status==='READY'&&payload.fingerprint===FP&&payload.transport_version===VERSION){ready=payload;break;}
                console.log(`M15_V4_WAIT attempt=${attempt} got=${String(payload.transport_version||'legacy')}`);
              }catch(error){console.log(`M15_V4_WAIT attempt=${attempt} error=${String(error.message).slice(0,500)}`);}
              await sleep(5000);
            }
            if(!ready) throw new Error('M15 v4 transport never reached READY');
            console.log('M15_PRE_STATEWIDE='+JSON.stringify({summary:ready.summary,d1:ready.d1,issue_counts:ready.issue_counts,blocking_issue_rows:ready.blocking_issue_rows}));

            const result=await request('POST',{
              fingerprint:FP,
              transport_version:VERSION,
              action:'statewide-collect',
              keys:['football-boys','volleyball-girls']
            });
            console.log('M15_STATEWIDE_RESULT='+JSON.stringify({
              status:result.status,
              keys:result.keys,
              outcomes:(result.outcomes||[]).map(item=>({
                key:item.key,status:item.status,error:item.error||null,
                collector_status:item.result?.status||null,
                rawEventCount:item.result?.rawEventCount??null,
                canonicalEvents:item.result?.canonicalEvents??null,
                observations:item.result?.observations??null,
                sources:item.result?.sources??null,
                touchedTeams:item.result?.touchedTeams??null,
                recordRebuild:item.result?.recordRebuild??null
              })),
              before:result.before,
              after:result.after
            }));

            const after=await request('GET',null,300000);
            console.log('M15_POST_STATEWIDE='+JSON.stringify({summary:after.summary,d1:after.d1,issue_counts:after.issue_counts,blocking_issue_rows:after.blocking_issue_rows}));
          }
          main().catch(error=>{console.error(error?.stack||String(error));process.exit(1);});
          NODE
