name: One-shot M15 canonical repair and verification

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-statewide-refresh-once.yml

permissions:
  contents: read

concurrency:
  group: m15-statewide-authoritative-refresh
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Execute audit-proven canonical and missing-score repairs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const PATH_ONCE='/api/v1/internal/m15-statewide-repair-20260917-4c8e2f7a91bd';
          const FP='m15-statewide-presentation-repair-1426-364-20260917';
          const VERSION='m15-v3';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function request(method,body=null,timeoutMs=1800000){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeoutMs);
            try{
              const response=await fetch(BASE+PATH_ONCE,{
                method,
                headers:body?{'content-type':'application/json'}:{},
                body:body?JSON.stringify(body):undefined,
                signal:controller.signal
              });
              const text=await response.text();
              let payload={};
              try{payload=text?JSON.parse(text):{};}catch{payload={raw:text.slice(0,4000)};}
              if(!response.ok) throw new Error(`${method} HTTP ${response.status}: ${JSON.stringify(payload).slice(0,12000)}`);
              return payload;
            }finally{clearTimeout(timer);}
          }

          function compact(plan){
            return {
              summary:plan.summary,
              d1:plan.d1,
              issue_counts:plan.issue_counts,
              blocking_issue_rows:plan.blocking_issue_rows,
              affected_teams:Array.isArray(plan.affected_team_ids)?plan.affected_team_ids.length:0,
              enabled_sources:Array.isArray(plan.source_ids)?plan.source_ids.length:0
            };
          }

          async function main(){
            let before=null;
            for(let attempt=1;attempt<=120;attempt++){
              try{
                const plan=await request('GET',null,300000);
                if(plan.status==='READY'&&plan.fingerprint===FP&&plan.transport_version===VERSION){
                  before=plan;
                  break;
                }
                console.log(`M15_V3_WAIT attempt=${attempt} got=${String(plan.transport_version||'legacy')}`);
              }catch(error){
                console.log(`M15_V3_WAIT attempt=${attempt} error=${String(error.message).slice(0,500)}`);
              }
              await sleep(5000);
            }
            if(!before) throw new Error('M15 v3 transport never reached READY');
            console.log('M15_PRE_CANONICAL='+JSON.stringify(compact(before)));

            const canonical=await request('POST',{fingerprint:FP,transport_version:VERSION,action:'canonical-reconcile'});
            console.log('M15_CANONICAL_RESULT='+JSON.stringify({
              status:canonical.status,
              before:canonical.before,
              clustersExamined:canonical.repair?.clustersExamined,
              clustersRepaired:canonical.repair?.clustersRepaired,
              affectedTeamCount:canonical.repair?.affectedTeamIds?.length||0,
              recordRebuild:canonical.repair?.recordRebuild,
              after:canonical.after
            }));

            const missing=await request('POST',{fingerprint:FP,transport_version:VERSION,action:'missing-score-repair'});
            console.log('M15_MISSING_SCORE_RESULT='+JSON.stringify({
              status:missing.status,
              plan:{safe:missing.plan?.safe,reasons:missing.plan?.reasons,cases:missing.plan?.cases,d1:missing.plan?.d1},
              repair:missing.repair,
              after:missing.after
            }));

            const after=await request('GET',null,300000);
            console.log('M15_AFTER_CANONICAL_AND_SCORE='+JSON.stringify(compact(after)));
          }

          main().catch(error=>{
            console.error(error?.stack||String(error));
            process.exit(1);
          });
          NODE
