name: One-shot M15 remaining defect evidence

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-statewide-refresh-once.yml

permissions:
  contents: read

concurrency:
  group: m15-statewide-authoritative-refresh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read exact remaining overdue and presentation defects
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const PATH_ONCE='/api/v1/internal/m15-statewide-repair-20260917-4c8e2f7a91bd';
          const FP='m15-statewide-presentation-repair-1426-364-20260917';
          const VERSION='m15-v3';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function get(detail){
            const response=await fetch(`${BASE}${PATH_ONCE}?detail=${detail}`);
            const text=await response.text();
            let payload={};
            try{payload=text?JSON.parse(text):{};}catch{payload={raw:text.slice(0,4000)};}
            if(!response.ok) throw new Error(`GET ${detail} HTTP ${response.status}: ${JSON.stringify(payload).slice(0,4000)}`);
            return payload;
          }

          function aggregate(rows,key){
            const out={};
            for(const row of rows||[]){
              const value=String(row?.[key]??'unknown');
              out[value]=(out[value]||0)+Number(row.game_rows||0);
            }
            return Object.fromEntries(Object.entries(out).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])));
          }

          async function waitForDetail(detail){
            for(let attempt=1;attempt<=90;attempt++){
              try{
                const payload=await get(detail);
                if(payload.status==='READY'&&payload.fingerprint===FP&&payload.transport_version===VERSION&&payload.detail===detail) return payload;
                console.log(`M15_DETAIL_WAIT detail=${detail} attempt=${attempt} got=${String(payload.detail||'none')}`);
              }catch(error){console.log(`M15_DETAIL_WAIT detail=${detail} attempt=${attempt} error=${String(error.message).slice(0,500)}`);}
              await sleep(5000);
            }
            throw new Error(`M15 detail ${detail} never became ready`);
          }

          async function main(){
            const overdue=await waitForDetail('overdue');
            const rows=overdue.overdue_breakdown?.rows||[];
            console.log('M15_OVERDUE_SUMMARY='+JSON.stringify({
              summary:overdue.summary,
              issue_counts:overdue.issue_counts,
              d1:overdue.overdue_breakdown?.d1,
              groups:rows.length,
              by_sport:aggregate(rows,'sport'),
              by_level:aggregate(rows,'level'),
              by_source_type:aggregate(rows,'source_type'),
              by_parser_type:aggregate(rows,'parser_type'),
              by_collection_mode:aggregate(rows,'collection_mode'),
              disabled_rows:rows.filter(row=>Number(row.source_enabled)!==1).reduce((sum,row)=>sum+Number(row.game_rows||0),0)
            }));
            console.log('M15_OVERDUE_GROUPS='+JSON.stringify(rows));

            const defects=await waitForDetail('defects');
            console.log('M15_DEFECT_SUMMARY='+JSON.stringify({summary:defects.summary,issue_counts:defects.issue_counts,d1:defects.defects?.d1,issues:defects.defects?.issues?.length||0,rows:defects.defects?.rows?.length||0}));
            console.log('M15_DEFECT_ISSUES='+JSON.stringify(defects.defects?.issues||[]));
            console.log('M15_DEFECT_ROWS='+JSON.stringify(defects.defects?.rows||[]));
          }
          main().catch(error=>{console.error(error?.stack||String(error));process.exit(1);});
          NODE
