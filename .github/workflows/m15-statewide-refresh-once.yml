name: One-shot M15 exact presentation repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-statewide-refresh-once.yml

permissions:
  contents: read

concurrency:
  group: m15-statewide-authoritative-refresh
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Run audit-proven presentation repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const PATH_ONCE='/api/v1/internal/m15-statewide-repair-20260917-4c8e2f7a91bd';
          const FP='m15-statewide-presentation-repair-1426-364-20260917';
          const VERSION='m15-v5';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function request(method,body=null,timeoutMs=2400000){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeoutMs);
            try{
              const response=await fetch(BASE+PATH_ONCE,{
                method,
                headers:body?{'content-type':'application/json'}:{},
                body:body?JSON.stringify(body):undefined,
                signal:controller.signal
              });
              const text=await response.text();
              let payload={};
              try{payload=text?JSON.parse(text):{};}catch{payload={raw:text.slice(0,4000)};}
              if(!response.ok) throw new Error(`${method} HTTP ${response.status}: ${JSON.stringify(payload).slice(0,12000)}`);
              return payload;
            } finally { clearTimeout(timer); }
          }

          async function main(){
            let before=null;
            for(let attempt=1;attempt<=120;attempt++){
              try{
                const payload=await request('GET',null,300000);
                if(payload.status==='READY'&&payload.fingerprint===FP&&payload.transport_version===VERSION){before=payload;break;}
                console.log(`M15_V5_WAIT attempt=${attempt} got=${String(payload.transport_version||'legacy')}`);
              }catch(error){console.log(`M15_V5_WAIT attempt=${attempt} error=${String(error.message).slice(0,500)}`);}
              await sleep(5000);
            }
            if(!before) throw new Error('M15 v5 transport never reached READY');
            console.log('M15_REPAIR_BEFORE='+JSON.stringify({
              summary:before.summary,d1:before.d1,issue_counts:before.issue_counts,
              blocking_issue_rows:before.blocking_issue_rows,
              affected_team_count:(before.affected_team_ids||[]).length
            }));

            const result=await request('POST',{
              fingerprint:FP,
              transport_version:VERSION,
              action:'presentation-repair'
            },3600000);
            console.log('M15_REPAIR_RESULT='+JSON.stringify({
              status:result.status,
              before:result.before,
              canonical:result.repair?.canonical,
              score_repair:result.repair?.score_repair,
              suppression_count:result.repair?.suppression?.game_ids?.length||0,
              suppression_rows_written:result.repair?.suppression?.rows_written||0,
              affected_team_ids:result.repair?.affected_team_ids||[],
              record_rebuild:result.repair?.record_rebuild,
              repair_after_summary:result.repair?.after_summary,
              repair_after_issue_counts:result.repair?.after_issue_counts,
              repair_d1:result.repair?.d1,
              after:result.after
            }));

            const after=await request('GET',null,300000);
            console.log('M15_REPAIR_AFTER='+JSON.stringify({
              summary:after.summary,d1:after.d1,issue_counts:after.issue_counts,
              blocking_issue_rows:after.blocking_issue_rows,
              affected_team_count:(after.affected_team_ids||[]).length
            }));
          }
          main().catch(error=>{console.error(error?.stack||String(error));process.exit(1);});
          NODE
