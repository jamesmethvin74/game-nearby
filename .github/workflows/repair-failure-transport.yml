name: Repair Failure One-Shot Transport

on:
  push:
    paths:
      - ".github/workflows/repair-failure-transport.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact failed build from Ops Bridge
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachers-ops.methvindigitalworks.com/v1/build?sha=2ccc313ba26f00b2967e5739321710cf72573eec"
          HTTP="$(curl -sS --max-time 120 -o result.json -w '%{http_code}' "$URL")"
          echo "OPS_BRIDGE_HTTP=$HTTP"
          cat result.json
          test "$HTTP" = "200"
