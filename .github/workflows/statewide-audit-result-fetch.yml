name: Statewide Audit Result One-Shot Transport

on:
  push:
    paths:
      - ".github/workflows/statewide-audit-result-fetch.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch statewide audit JSON
        shell: bash
        run: |
          set -euo pipefail
          URL="https://statewide-integrity-audit-result-localbleachersar-sports-api.james-methvin74.workers.dev/api/statewide-integrity-audit-result"
          HTTP_STATUS="$(curl -sS --max-time 120 -o statewide-audit.json -w '%{http_code}'             -H 'accept: application/json'             -H 'cache-control: no-store'             "$URL")"
          echo "STATEWIDE_AUDIT_RESULT_HTTP_STATUS=$HTTP_STATUS"
          test "$HTTP_STATUS" = "200"
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("statewide-audit.json","utf8"));
            const written=Number(p?.d1?.rows_written ?? p?.d1?.rowsWritten ?? 0);
            if(!p?.audit_version) throw new Error("missing audit_version");
            if(written!==0) throw new Error("rows_written="+written);
            console.log("AUDIT_VERSION="+p.audit_version);
            console.log("ROWS_WRITTEN="+written);
          '

      - name: Upload statewide audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: statewide-audit-json
          path: statewide-audit.json
          if-no-files-found: error
          retention-days: 1
