name: Result-only record repair once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/result-only-record-repair-once.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted backend tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          node --test test/result-only-source-truth.test.js test/record-rebuild.test.js test/result-only-record-repair.test.js test/team-read-worker.test.js test/canonical-game-read.test.js

      - name: Execute bounded production repair after deploy
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REFRESH_TOKEN"
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          PATHNAME="/api/v1/internal/result-only-record-rebuild"
          code=0
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/repair.json -w "%{http_code}" -X POST "$BASE$PATHNAME" -H "x-refresh-token: $REFRESH_TOKEN")
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" != "404" ]; then
              echo "repair endpoint HTTP $code"
              cat /tmp/repair.json
              exit 1
            fi
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "repair endpoint never became available"
            exit 1
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/repair.json','utf8'));
          console.log('RESULT_ONLY_REPAIR='+JSON.stringify({
            status:p.status,
            teams:p.team_ids?.length||0,
            schools:p.school_ids?.length||0,
            rebuilt:p.rebuilt
          }));
          if(p.status!=='SUCCESS') process.exit(1);
          fs.writeFileSync('/tmp/schools.json',JSON.stringify(p.school_ids||[]));
          JS

      - name: Verify repaired public truth
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';

          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const schoolIds=JSON.parse(fs.readFileSync('/tmp/schools.json','utf8'));
          const bad=[];
          const statuses=[];
          for(let i=0;i<schoolIds.length;i+=4){
            const chunk=schoolIds.slice(i,i+4);
            const body=execFileSync('curl',['-fsS',`${base}/api/v1/team-statuses?school_ids=${chunk.join(',')}&verify=${Date.now()}-${i}`],{encoding:'utf8'});
            const p=JSON.parse(body);
            for(const s of p.team_statuses||[]){
              statuses.push(s);
              const stale=(s.record_issues||[]).filter(x=>['STORED_RECORD_EXCEEDS_FINAL_EVIDENCE','STORED_CONFERENCE_RECORD_EXCEEDS_FINAL_EVIDENCE'].includes(x.code));
              if(stale.length) bad.push({school_id:s.school_id,team_id:s.team_id,sport:s.sport,gender:s.gender,issues:stale});
            }
          }

          const pea=statuses.find(s=>s.school_id==='df-7x4sxh'&&s.sport==='football'&&s.gender==='boys');
          console.log('PEA_AFTER_REPAIR='+JSON.stringify(pea));
          console.log('RESULT_ONLY_STATUS_AUDIT='+JSON.stringify({schools:schoolIds.length,statuses:statuses.length,stale_record_issues:bad}));

          if(!pea) throw new Error('Pea Ridge football status missing');
          if(pea.display_overall_record!=='1-2') throw new Error(`Pea Ridge overall still wrong: ${pea.display_overall_record}`);
          if(pea.display_conference_record!=='0-0') throw new Error(`Pea Ridge conference still wrong: ${pea.display_conference_record}`);
          if(bad.length) throw new Error(`stale record issues remain: ${JSON.stringify(bad.slice(0,10))}`);

          const schedule=JSON.parse(execFileSync('curl',['-fsS',`${base}/api/v1/schools/df-7x4sxh/schedule?verify=${Date.now()}`],{encoding:'utf8'}));
          const football=(schedule.games||[]).filter(g=>g.sport==='football'&&g.gender==='boys');
          const extras=football.filter(g=>['mascot-media','rankone-public'].includes(String(g.parser_type||'').toLowerCase()));
          if(extras.length) throw new Error('result-only rows still visible on Pea Ridge schedule');

          const standings=JSON.parse(execFileSync('curl',['-fsS',`${base}/api/v1/standings?sport=football&conference=5a-west&verify=${Date.now()}`],{encoding:'utf8'}));
          const row=(standings.standings||[]).find(x=>x.team_id==='df-7x4sxh-football-2026'||/Pea Ridge/i.test(String(x.school_name||'')));
          console.log('PEA_STANDING_AFTER_REPAIR='+JSON.stringify(row));
          if(!row||row.display_overall_record!=='1-2'||row.display_conference_record!=='0-0') throw new Error('Pea Ridge standings presentation still stale');
          JS
