name: Results diagnostics

on:
  push:
    branches: [feature/statewide-results-v1]
    paths:
      - ".github/workflows/results-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect production results and records
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const API='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const j=async url=>{const r=await fetch(url); if(!r.ok) throw new Error(`${r.status} ${url}`); return r.json();};
          const schools=(await j(`${API}/api/v1/schools`)).schools||[];
          let next=0;
          const rows=[];
          async function worker(){
            while(true){
              const i=next++; if(i>=schools.length) return;
              const s=schools[i];
              const teamId=`${s.id}-volleyball-2026`;
              try{
                const [recordPayload,schedulePayload]=await Promise.all([
                  j(`${API}/api/v1/teams/${encodeURIComponent(teamId)}/record`),
                  j(`${API}/api/v1/teams/${encodeURIComponent(teamId)}/schedule`)
                ]);
                const record=recordPayload.record||{};
                const games=schedulePayload.games||[];
                const finals=games.filter(g=>g.status==='FINAL');
                const scoredFinals=finals.filter(g=>g.team_score!=null&&g.opponent_score!=null);
                rows.push({school:String(s.location_matched_name||s.name),id:s.id,record,finals:finals.length,scoredFinals:scoredFinals.length,schedule:games.length});
              }catch(e){rows.push({school:String(s.location_matched_name||s.name),id:s.id,error:String(e)});}
            }
          }
          await Promise.all(Array.from({length:12},worker));
          const failures=rows.filter(r=>r.error);
          const withFinals=rows.filter(r=>r.finals>0);
          const nonzero=rows.filter(r=>Number(r.record?.wins||0)+Number(r.record?.losses||0)+Number(r.record?.ties||0)>0);
          const mismatch=rows.filter(r=>r.scoredFinals>0 && Number(r.record?.wins||0)+Number(r.record?.losses||0)+Number(r.record?.ties||0)!==r.scoredFinals);
          const totalFinals=rows.reduce((n,r)=>n+(r.finals||0),0);
          const totalScored=rows.reduce((n,r)=>n+(r.scoredFinals||0),0);
          console.log(JSON.stringify({schools:schools.length,queried:rows.length,failures:failures.length,schoolsWithFinals:withFinals.length,schoolsWithNonzeroRecord:nonzero.length,totalFinals,totalScored,mismatches:mismatch.length},null,2));
          for(const wanted of ['Conway High School','Valley Springs High School','Greenbrier High School','Vilonia High School']){
            const r=rows.find(x=>x.school.toLowerCase()===wanted.toLowerCase());
            console.log('SAMPLE',wanted,JSON.stringify(r));
          }
          if(failures.length) console.log('FAILURES',failures.slice(0,20));
          if(mismatch.length) console.log('MISMATCHES',mismatch.slice(0,20));
          NODE
