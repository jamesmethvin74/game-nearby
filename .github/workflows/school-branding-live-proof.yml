name: School branding live proof

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run statewide mascot/logo dry import
        run: |
          node --input-type=module <<'JS'
          import {
            parseMaxPrepsSchoolDirectory,
            parseMaxPrepsSchoolPage,
            matchMaxPrepsBranding
          } from './backend/src/school-branding.js';

          const API='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const directoryUrl='https://www.maxpreps.com/ar/volleyball/schools/';
          const headers={'user-agent':'Mozilla/5.0 LocalBleachersAR branding import','accept':'text/html'};
          const [schoolResponse,directoryResponse]=await Promise.all([
            fetch(`${API}/api/v1/schools`,{headers:{accept:'application/json'}}),
            fetch(directoryUrl,{headers})
          ]);
          if(!schoolResponse.ok) throw new Error(`schools HTTP ${schoolResponse.status}`);
          if(!directoryResponse.ok) throw new Error(`directory HTTP ${directoryResponse.status}`);

          const schools=(await schoolResponse.json()).schools||[];
          const highSchools=schools.filter(s=>String(s.level||'high-school')==='high-school');
          const nonHighSchools=schools.filter(s=>String(s.level||'high-school')!=='high-school');
          const entries=parseMaxPrepsSchoolDirectory(await directoryResponse.text());
          const result=matchMaxPrepsBranding(entries,highSchools,[]);

          let cursor=0;
          const mascotRows=[];
          const mascotFailures=[];
          async function worker(){
            while(true){
              const index=cursor++;
              if(index>=result.matches.length) return;
              const match=result.matches[index];
              try{
                const response=await fetch(match.entry.sourceUrl,{headers,redirect:'follow'});
                if(!response.ok) throw new Error(`HTTP ${response.status}`);
                const school=highSchools.find(s=>s.id===match.schoolId);
                const parsed=parseMaxPrepsSchoolPage(await response.text(),{
                  name:school?.location_matched_name||school?.name||match.entry.name,
                  sourceName:match.entry.name,
                  city:school?.city||match.entry.city,
                  sourceUrl:match.entry.sourceUrl,
                  finalUrl:response.url
                });
                mascotRows.push({
                  schoolId:match.schoolId,
                  name:school?.location_matched_name||school?.name||match.entry.name,
                  providerName:match.entry.name,
                  city:school?.city||match.entry.city,
                  mascot:parsed.mascot||null,
                  canonicalUrl:parsed.canonicalUrl||null,
                  logoUrl:match.entry.logoUrl,
                  matchMethod:match.matchMethod,
                  confidence:match.confidence
                });
              }catch(error){
                mascotFailures.push({schoolId:match.schoolId,name:match.entry.name,error:String(error?.message||error)});
              }
            }
          }
          await Promise.all(Array.from({length:8},()=>worker()));
          mascotRows.sort((a,b)=>a.name.localeCompare(b.name));
          const missingMascot=mascotRows.filter(row=>!row.mascot);
          const unresolved=result.unresolved.map(s=>({id:s.id,name:s.location_matched_name||s.name,city:s.city}));
          const report={
            visibleSchools:schools.length,
            highSchoolTargets:highSchools.length,
            nonHighSchoolTargets:nonHighSchools.map(s=>({id:s.id,name:s.location_matched_name||s.name,city:s.city,level:s.level})),
            sourceEntries:entries.length,
            matchedLogos:result.matches.length,
            unresolvedLogos:unresolved,
            ambiguousEntries:result.ambiguous,
            mascotResolved:mascotRows.filter(row=>row.mascot).length,
            missingMascot,
            mascotFailures,
            matchedBranding:mascotRows
          };
          console.log('LOCALBLEACHERS_BRANDING_REPORT_START');
          console.log(JSON.stringify(report,null,2));
          console.log('LOCALBLEACHERS_BRANDING_REPORT_END');

          if(schools.length<190) throw new Error(`Expected statewide catalog, got ${schools.length}`);
          if(entries.length<185) throw new Error(`Expected statewide logo directory, got ${entries.length}`);
          if(result.matches.length<160) throw new Error(`Expected at least 160 deterministic logo matches, got ${result.matches.length}`);
          if(mascotRows.filter(row=>row.mascot).length<150) throw new Error(`Expected at least 150 mascot names, got ${mascotRows.filter(row=>row.mascot).length}`);

          const expected=new Map([['Conway High School','Wampus Cats'],['Valley Springs High School','Tigers']]);
          for(const [name,mascot] of expected){
            const row=mascotRows.find(item=>item.name.toLowerCase()===name.toLowerCase());
            if(!row) throw new Error(`No deterministic mascot/logo match for ${name}`);
            if(row.mascot!==mascot) throw new Error(`${name} mascot expected ${mascot}, got ${row.mascot}`);
            if(!row.logoUrl.startsWith('https://image.maxpreps.io/school-mascot/')) throw new Error(`Bad logo URL for ${name}`);
            console.log(`${name}: ${row.mascot} · ${row.logoUrl}`);
          }

          const lakeside=mascotRows.find(item=>item.name==='Lakeside High School' && item.city==='Hot Springs');
          if(lakeside && /hot-springs-trojans/i.test(String(lakeside.canonicalUrl||''))) throw new Error('Lakeside incorrectly received Hot Springs Trojans branding');
          JS
