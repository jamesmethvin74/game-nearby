name: M15 standings production proof

on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-standings-evidence-v2.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: prove-live-standings
    steps:
      - name: Wait for repaired standings and prove live output
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function load(conference){
            const url=base+'/api/v1/standings?sport=football&conference='+encodeURIComponent(conference);
            const response=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
            const text=await response.text();
            let body={};
            try{body=JSON.parse(text);}catch{body={raw:text.slice(0,2000)};}
            return {http:response.status,body};
          }

          for(let attempt=1;attempt<=120;attempt++){
            const central=await load('7a-central');
            const west=await load('7a-west');
            const centralRows=central.body?.standings||[];
            const westRows=west.body?.standings||[];
            const good=
              central.http===200 &&
              west.http===200 &&
              central.body?.conference?.membership_complete===true &&
              west.body?.conference?.membership_complete===true &&
              central.body?.conference?.result_evidence_complete===true &&
              west.body?.conference?.result_evidence_complete===true &&
              centralRows.length===8 &&
              westRows.length===8 &&
              centralRows.every(r=>r.conference_record==='0-0' && r.rank==null) &&
              westRows.every(r=>r.conference_record==='0-0' && r.rank==null);

            console.log('STANDINGS_PROBE='+JSON.stringify({
              attempt,
              central:{
                http:central.http,
                rows:centralRows.length,
                membership:central.body?.conference?.membership_complete,
                resultEvidence:central.body?.conference?.result_evidence_complete,
                sample:centralRows.slice(0,2).map(r=>({school:r.school_name,conf:r.conference_record,rank:r.rank,overall:r.overall_record}))
              },
              west:{
                http:west.http,
                rows:westRows.length,
                membership:west.body?.conference?.membership_complete,
                resultEvidence:west.body?.conference?.result_evidence_complete,
                sample:westRows.slice(0,2).map(r=>({school:r.school_name,conf:r.conference_record,rank:r.rank,overall:r.overall_record}))
              }
            }));

            if(good){
              console.log('STANDINGS_PROOF='+JSON.stringify({
                central:{conference:central.body.conference,standings:centralRows},
                west:{conference:west.body.conference,standings:westRows}
              }));
              process.exit(0);
            }
            await sleep(5000);
          }
          throw new Error('repaired standings did not reach production within bounded proof window');
          NODE
