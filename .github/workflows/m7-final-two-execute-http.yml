name: M7 final two execute HTTP

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/m7-final-two-execute-http.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify marker, preflight, execute once
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/m7-final-two-version-76d5f110"
          PLAN="$BASE/api/v1/internal/m7-final-two-plan-76d5f110"
          EXECUTE="$BASE/api/v1/internal/m7-final-two-execute-76d5f110"

          curl -fsS --max-time 30 "$MARKER" -o marker.json
          node <<'NODE'
          const r=require('./marker.json');
          console.log('M7_FINAL_TWO_MARKER='+JSON.stringify(r));
          if(r.marker!=='m7-final-two-repair-v1-945b2087') throw new Error(`unexpected marker ${r.marker}`);
          if(r.d1_access!==false) throw new Error('marker is not zero-D1');
          NODE

          curl -fsS --max-time 120 "$PLAN" -o plan.json
          node <<'NODE'
          const r=require('./plan.json');
          console.log('M7_FINAL_TWO_PLAN='+JSON.stringify(r));
          if(r.fingerprint!=='m7-final-two-repair-v1') throw new Error(`unexpected fingerprint ${r.fingerprint}`);
          if(r.safe!==true) throw new Error(`unsafe plan: ${JSON.stringify(r.reasons)}`);
          if(Number(r.d1?.rows_written||0)!==0) throw new Error('preflight wrote to D1');
          if(Number(r.d1?.rows_read||0)>5000) throw new Error(`preflight read fuse exceeded: ${r.d1?.rows_read}`);
          if(!['delete_false_event','already_removed'].includes(r.false_action)) throw new Error(`bad false action ${r.false_action}`);
          if(!['create_secondary_observation','reconcile_existing_observation','already_attached'].includes(r.batesville_action)) throw new Error(`bad Batesville action ${r.batesville_action}`);
          NODE

          curl -fsS --max-time 180 -X POST -H 'content-type: application/json' \
            --data '{"fingerprint":"m7-final-two-repair-v1"}' "$EXECUTE" -o execute.json
          node <<'NODE'
          const r=require('./execute.json');
          console.log('M7_FINAL_TWO_EXECUTE='+JSON.stringify(r));
          if(r.status!=='SUCCESS') throw new Error(`execution failed: ${JSON.stringify(r)}`);
          if(r.fingerprint!=='m7-final-two-repair-v1') throw new Error(`unexpected execution fingerprint ${r.fingerprint}`);
          if(r.verification?.verified!==true) throw new Error(`verification failed: ${JSON.stringify(r.verification)}`);
          if(Number(r.verification?.member_count||0)!==2) throw new Error(`expected two true-final members, got ${r.verification?.member_count}`);
          const teams=[...(r.verification?.reporting_teams||[])].sort();
          const expected=['df-dxgr8r-volleyball-2026','df-rpnt3m-volleyball-2026'].sort();
          if(JSON.stringify(teams)!==JSON.stringify(expected)) throw new Error(`unexpected reporting teams ${teams}`);
          NODE
