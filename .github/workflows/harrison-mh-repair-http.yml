name: Harrison Mountain Home repair HTTP

on:
  push:
    branches:
      - volleyball/harrison-mh-repair-http

jobs:
  repair-once:
    runs-on: ubuntu-latest
    steps:
      - name: Marker, preflight, one repair POST, verify
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/harrison-mountain-home-version-42f7c9b1"
          PLAN="$BASE/api/v1/internal/harrison-mountain-home-plan-42f7c9b1"
          EXECUTE="$BASE/api/v1/internal/harrison-mountain-home-execute-42f7c9b1"
          CID='ce:volleyball:girls:2026:df-dxgr8r:df-ht8yyh:20260825:df-69b2c51d453393061a000000'

          curl -fsS --max-time 30 "$MARKER" -o marker.json
          node <<'NODE'
          const r=require('./marker.json');
          if(r.marker!=='harrison-mountain-home-venue-fix-v1'||r.d1_access!==false) throw new Error(`bad marker ${JSON.stringify(r)}`);
          console.log('MARKER_OK='+JSON.stringify(r));
          NODE

          curl -fsS --max-time 60 "$PLAN" -o before.json
          node <<'NODE'
          const r=require('./before.json');
          if(r.fingerprint!=='harrison-mountain-home-venue-fix-v1'||r.safe!==true) throw new Error(`unsafe preflight ${JSON.stringify(r)}`);
          if(r.action!=='resolve_verified_venue_alias') throw new Error(`unexpected action ${r.action}`);
          if(Number(r.d1?.rows_written||0)!==0||Number(r.d1?.rows_read||0)>500) throw new Error(`unsafe D1 preflight ${JSON.stringify(r.d1)}`);
          console.log('PREFLIGHT_OK='+JSON.stringify({action:r.action,active_conflict_id:r.active_conflict_id,d1:r.d1,event:r.event,records:r.records}));
          NODE

          # Exactly one production POST. Intentionally no retry loop.
          code=$(curl -sS --max-time 90 -X POST -H 'content-type: application/json' \
            --data '{"fingerprint":"harrison-mountain-home-venue-fix-v1"}' \
            -o execute.json -w '%{http_code}' "$EXECUTE")
          echo "execute HTTP=$code"
          cat execute.json; echo
          test "$code" = "200"
          node <<'NODE'
          const r=require('./execute.json');
          if(r.status!=='SUCCESS'||r.action!=='resolved_verified_venue_alias') throw new Error(`execution failed ${JSON.stringify(r)}`);
          if(Number(r.d1?.rows_written||0)!==2||Number(r.d1?.rows_read||0)>50) throw new Error(`unexpected repair D1 ${JSON.stringify(r.d1)}`);
          if(r.verification?.action!=='already_resolved'||r.verification?.safe!==true) throw new Error('post-write verification failed');
          console.log('EXECUTION_OK='+JSON.stringify({action:r.action,d1:r.d1,verification:{action:r.verification.action,event:r.verification.event,d1:r.verification.d1}}));
          NODE

          curl -fsS --max-time 60 "$PLAN" -o after.json
          node <<'NODE'
          const r=require('./after.json');
          if(r.safe!==true||r.action!=='already_resolved') throw new Error(`post-plan wrong ${JSON.stringify(r)}`);
          if(r.event?.trust_state!=='CORROBORATED'||Number(r.event?.conflict_count)!==0) throw new Error(`canonical conflict not cleared ${JSON.stringify(r.event)}`);
          if(Number(r.event?.home_score)!==1||Number(r.event?.away_score)!==3) throw new Error('score changed unexpectedly');
          if(Number(r.d1?.rows_written||0)!==0||Number(r.d1?.rows_read||0)>500) throw new Error(`unsafe post-plan D1 ${JSON.stringify(r.d1)}`);
          console.log('POST_PLAN_OK='+JSON.stringify({action:r.action,d1:r.d1,event:r.event,records:r.records}));
          NODE

          for team in df-dxgr8r-volleyball-2026 df-ht8yyh-volleyball-2026; do
            curl -fsS --max-time 60 "$BASE/api/v1/teams/$team/schedule" -o "$team.json"
          done
          node <<'NODE'
          const fs=require('fs');
          const cid='ce:volleyball:girls:2026:df-dxgr8r:df-ht8yyh:20260825:df-69b2c51d453393061a000000';
          const mh=JSON.parse(fs.readFileSync('df-dxgr8r-volleyball-2026.json','utf8'));
          const har=JSON.parse(fs.readFileSync('df-ht8yyh-volleyball-2026.json','utf8'));
          const game=(p)=>p.games.find(g=>g.canonical_event_id===cid&&g.status==='FINAL');
          const m=game(mh),h=game(har);
          if(!m||Number(m.team_score)!==3||Number(m.opponent_score)!==1) throw new Error('Mountain Home public result wrong');
          if(!h||Number(h.team_score)!==1||Number(h.opponent_score)!==3) throw new Error('Harrison public result wrong');
          if(Number(mh.record?.wins)!==4||Number(mh.record?.losses)!==10) throw new Error(`Mountain Home record changed ${JSON.stringify(mh.record)}`);
          if(Number(har.record?.wins)!==7||Number(har.record?.losses)!==2) throw new Error(`Harrison record changed ${JSON.stringify(har.record)}`);
          console.log('PUBLIC_VERIFY_OK='+JSON.stringify({mountain_home:{score:[m.team_score,m.opponent_score],record:mh.record},harrison:{score:[h.team_score,h.opponent_score],record:har.record}}));
          NODE
