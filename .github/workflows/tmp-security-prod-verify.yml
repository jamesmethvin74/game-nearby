name: Temporary security production verification

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - ".github/workflows/tmp-security-prod-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact build and hardened production surfaces
        shell: bash
        run: |
          set -u
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          OPS="https://localbleachers-ops.methvindigitalworks.com"
          TARGET_SHA="3842e0dcd1efed5bada7dedc8af251182cf51fd6"

          request() {
            local label="$1"
            local method="$2"
            local url="$3"
            shift 3
            rm -f /tmp/h /tmp/b
            code=$(curl -sS -X "$method" -D /tmp/h -o /tmp/b -w "%{http_code}" "$@" "$url" || true)
            echo "=== $label ==="
            echo "HTTP $code"
            grep -iE '^(content-security-policy|strict-transport-security|x-content-type-options|referrer-policy|permissions-policy|x-frame-options|x-localbleachers-cache|access-control-allow-origin):' /tmp/h || true
            head -c 500 /tmp/b || true
            echo
          }

          request "exact-build" GET "$OPS/v1/build?sha=$TARGET_SHA"
          request "root-headers" GET "$BASE/"
          request "schools" GET "$BASE/api/v1/schools"
          request "team-statuses" GET "$BASE/api/v1/team-statuses?school_ids=conway"
          request "school-schedule" GET "$BASE/api/v1/schools/conway/schedule"
          request "standings" GET "$BASE/api/v1/standings?sport=football&conference=7a-central"

          NEARBY="$BASE/api/v1/games?lat=35.089&lon=-92.442&radius=25&since=2026-09-29T00%3A00%3A00.000Z&until=2026-10-30T00%3A00%3A00.000Z"
          request "nearby-normal" GET "$NEARBY"
          request "nearby-forged-debug" GET "$NEARBY" -H "x-localbleachers-debug: team-detail"
          request "nearby-forged-diagnostic" GET "$NEARBY" -H "x-localbleachers-diagnostic: read-v1"

          request "nearby-extreme-radius" GET "$BASE/api/v1/games?lat=35.089&lon=-92.442&radius=999"
          request "nearby-missing-location" GET "$BASE/api/v1/games?radius=25"
          request "nearby-excessive-window" GET "$BASE/api/v1/games?lat=35.089&lon=-92.442&radius=25&since=2026-01-01T00%3A00%3A00.000Z&until=2026-09-30T00%3A00%3A00.000Z"

          request "branding-report-unauthorized" GET "$BASE/api/v1/branding/report"
          request "sources-unauthorized" GET "$BASE/api/v1/sources"
          request "conflicts-unauthorized" GET "$BASE/api/v1/conflicts"
          request "coverage-report-unauthorized" GET "$BASE/api/v1/coverage-report"
          request "d1-budget-unauthorized" GET "$BASE/api/v1/d1-budget"
          request "refresh-unauthorized" POST "$BASE/api/v1/refresh"
