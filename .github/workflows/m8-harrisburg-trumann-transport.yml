name: M8 Harrisburg-Trumann repair transport

on:
  push:
    branches:
      - ops/m8-bounded-repair-20260914
    paths:
      - .github/workflows/m8-harrisburg-trumann-transport.yml

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Approved exact production repair
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          PLAN="$BASE/api/v1/internal/m8-harrisburg-trumann-plan-20260914-27c4f9a1"
          EXEC="$BASE/api/v1/internal/m8-harrisburg-trumann-execute-20260914-27c4f9a1"

          curl --fail-with-body --silent --show-error "$PLAN" -o plan.json
          python - <<'PY'
          import json
          p=json.load(open('plan.json'))
          print(json.dumps({'safe':p.get('safe'),'fingerprint':p.get('fingerprint'),'case':p.get('case'),'write_scope':p.get('write_scope'),'d1':p.get('d1')},separators=(',',':')))
          if p.get('safe') is not True or p.get('case',{}).get('action') not in ('apply_canonical_resolution','already_complete'):
            raise SystemExit('preflight not safe/applicable')
          open('fingerprint.txt','w').write(p['fingerprint'])
          PY

          python - <<'PY' > payload.json
          import json
          print(json.dumps({'fingerprint':open('fingerprint.txt').read().strip()}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H 'content-type: application/json' \
            --data-binary @payload.json "$EXEC" -o execute.json
          python - <<'PY'
          import json
          r=json.load(open('execute.json'))
          print(json.dumps({'status':r.get('status'),'fingerprint':r.get('fingerprint'),'corrected_case':r.get('corrected_case'),'direct_write_telemetry':r.get('direct_write_telemetry'),'record_result':r.get('record_result')},separators=(',',':')))
          if r.get('status') not in ('SUCCESS','ALREADY_COMPLETE'):
            raise SystemExit('repair failed')
          PY

          curl --fail-with-body --silent --show-error "$PLAN" -o verify.json
          python - <<'PY'
          import json
          p=json.load(open('verify.json'))
          print(json.dumps({'safe':p.get('safe'),'case':p.get('case'),'records_before':p.get('records_before'),'d1':p.get('d1')},separators=(',',':')))
          if p.get('safe') is not True or p.get('case',{}).get('action')!='already_complete':
            raise SystemExit('post-write verification failed')
          PY
