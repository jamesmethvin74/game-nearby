name: M15 Team Schedule order proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m15-team-schedule-order-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove Home stays chronological and Team Schedule owns hierarchy
        env:
          BASE_URL: https://jamesmethvin74.github.io/game-nearby
        run: |
          cat > proof.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:430,height:932},timezoneId:'America/Chicago'});
          const page = await context.newPage();

          try {
            await page.goto(process.env.BASE_URL + '/?team-schedule-order=v80',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v80', null, {timeout:45000});

            const synthetic = await page.evaluate(() => {
              const sample = [
                {id:'v',teamId:'conway',schoolIds:['conway'],sport:'volleyball',date:'2026-09-20T18:00:00-05:00'},
                {id:'f',teamId:'conway',schoolIds:['conway'],sport:'football',date:'2026-09-25T19:00:00-05:00'},
                {id:'s',teamId:'conway',schoolIds:['conway'],sport:'soccer',date:'2026-09-22T18:00:00-05:00'}
              ];
              const oldFollowed = followed.slice();
              followed.splice(0, followed.length, 'conway');
              const chosen = featuredEventsFor(sample)[0]?.id || null;
              followed.splice(0, followed.length, ...oldFollowed);
              return chosen;
            });
            console.log('HOME_CHRONOLOGICAL_SYNTHETIC='+synthetic);
            if (synthetic !== 'v') throw new Error('Home featured selection is not chronological');

            await page.evaluate(() => localStorage.setItem('followedTeams',JSON.stringify(['conway'])));
            await page.reload({waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v80', null, {timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersLive?.getState?.().nearbyLoadedAt, null, {timeout:45000});

            const trigger=page.locator('#followedEvents .event-card.priority .team-detail-trigger').first();
            await trigger.waitFor({state:'visible',timeout:15000});
            const home = {
              sport: await trigger.getAttribute('data-sport'),
              text: String(await trigger.locator('..').innerText().catch(async()=>await trigger.innerText())).replace(/\s+/g,' ').trim()
            };
            console.log('HOME_RENDERED_FEATURED='+JSON.stringify(home));

            await trigger.click();
            const dialog=page.locator('#teamDetailDialog');
            await dialog.waitFor({state:'visible',timeout:15000});
            await page.waitForFunction(() => document.querySelectorAll('#teamDetailSports .team-detail-sport').length >= 4, null, {timeout:30000});
            const tabs=await page.locator('#teamDetailSports .team-detail-sport').allInnerTexts();
            console.log('TEAM_SCHEDULE_TABS='+JSON.stringify(tabs));

            const normalized=tabs.map(x=>x.toLowerCase());
            const football=normalized.findIndex(x=>x.includes('football'));
            const volleyball=normalized.findIndex(x=>x.includes('volleyball'));
            const soccer=normalized.findIndex(x=>x.includes('soccer'));
            const basketball=normalized.findIndex(x=>x.includes('basketball'));

            if (football < 0 || volleyball < 0) throw new Error('Expected Conway football and volleyball Team Schedule tabs');
            if (!(football < volleyball)) throw new Error('Team Schedule fall order is not Football before Volleyball: '+JSON.stringify(tabs));
            if (soccer >= 0 && !(volleyball < soccer)) throw new Error('Team Schedule fall order is not Volleyball before Soccer: '+JSON.stringify(tabs));
            if (basketball >= 0 && !(volleyball < basketball)) throw new Error('Basketball incorrectly moved ahead of active fall Team Schedule tabs: '+JSON.stringify(tabs));
          } finally {
            await browser.close();
          }
          NODE
          node proof.mjs
