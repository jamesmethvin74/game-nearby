name: M15 final systemwide season integrity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m15-final-systemwide-season-integrity.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-sports-pipeline-m1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted production-chain regression tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          node --test test/canonical-game-read.test.js test/statewide-nearby-route.test.js test/schedule-response-normalizer.test.js test/sidearm-modern.test.js
      - name: Audit system-wide regular-season presentation
        env:
          BASE_URL: https://localbleachersar-sports-api.james-methvin74.workers.dev
        run: |
          cat > /tmp/audit.mjs <<'NODE'
          const base=process.env.BASE_URL;
          const bust=Date.now();
          const get=async path=>{
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache','x-localbleachers-diagnostic':'read-v1'}});
            if(!r.ok) throw new Error(path+' HTTP '+r.status);
            return r.json();
          };

          const catalog=await get('/api/v1/schools?finalSeasonAudit='+bust);
          const schools=Array.isArray(catalog.schools)?catalog.schools:[];
          const colleges=schools.filter(s=>String(s.level||'').toLowerCase()==='college');
          const collegeIds=new Set(colleges.map(s=>String(s.id)));
          const nonRecord=/\b(?:benefit game|exhibition|scrimmage|jamboree|meet the cats)\b/i;
          const terminal=new Set(['FINAL','CANCELED','CANCELLED','POSTPONED']);
          const problems=[];
          const scheduleSummaries=[];
          const firstFinalByTeam=new Map();

          const auditVisibleRow=(game,context,school=null)=>{
            const desc=[game.notes,game.opponent,game.venue,game.location_text].filter(Boolean).join(' ');
            if(nonRecord.test(desc)){
              problems.push({code:'NON_RECORD_EVENT_VISIBLE',context,school_id:school?.id||game.school_id,school_name:school?.name||game.school_name,sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent});
            }
            if(Number(game.counts_for_record)===0 && ['sidearm','dragonfly-public'].includes(String(game.parser_type||'').toLowerCase())){
              problems.push({code:'EXPLICIT_NON_RECORD_FLAG_VISIBLE',context,school_id:school?.id||game.school_id,school_name:school?.name||game.school_name,sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent});
            }

            if(String(game.level||'').toLowerCase()==='high-school'){
              const sport=String(game.sport||'').toLowerCase();
              const date=String(game.scheduled_at||game.canonical_scheduled_at||'').slice(0,10);
              const boundary={football:'2026-08-27',volleyball:'2026-08-24',basketball:'2026-11-05'}[sport];
              if(boundary && date && date<boundary){
                problems.push({code:'HIGH_SCHOOL_PRESEASON_VISIBLE',context,school_id:school?.id||game.school_id,school_name:school?.name||game.school_name,sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent,boundary});
              }
            }
          };

          for(let offset=0;offset<colleges.length;offset+=8){
            const chunk=colleges.slice(offset,offset+8);
            const results=await Promise.all(chunk.map(async school=>{
              try{
                const payload=await get('/api/v1/schools/'+encodeURIComponent(school.id)+'/schedule?finalSeasonAudit='+bust);
                return {school,payload};
              }catch(error){
                return {school,error:String(error.message||error)};
              }
            }));

            for(const item of results){
              if(item.error){
                problems.push({code:'SCHEDULE_FETCH_FAILED',context:'team-schedule',school_id:item.school.id,school_name:item.school.name,detail:item.error});
                continue;
              }
              const games=Array.isArray(item.payload.games)?item.payload.games:[];
              scheduleSummaries.push({school_id:item.school.id,school_name:item.school.name,games:games.length});

              const byTeam=new Map();
              for(const game of games){
                auditVisibleRow(game,'team-schedule',item.school);
                const key=String(game.reporting_team_id||game.team_id||'');
                if(!key) continue;
                if(!byTeam.has(key)) byTeam.set(key,[]);
                byTeam.get(key).push(game);
              }

              for(const [teamId,rows] of byTeam){
                const verifiedFinals=rows
                  .filter(g=>String(g.status||'').toUpperCase()==='FINAL' && g.team_score!=null && g.opponent_score!=null)
                  .map(g=>Date.parse(g.scheduled_at||g.canonical_scheduled_at))
                  .filter(Number.isFinite);
                if(!verifiedFinals.length) continue;
                const firstFinal=Math.min(...verifiedFinals);
                firstFinalByTeam.set(teamId,firstFinal);

                for(const game of rows){
                  const when=Date.parse(game.scheduled_at||game.canonical_scheduled_at);
                  if(!Number.isFinite(when)||when>=firstFinal) continue;
                  const status=String(game.status||'').toUpperCase();
                  if(terminal.has(status)) continue;
                  if(game.team_score!=null||game.opponent_score!=null||String(game.result||'').trim()) continue;
                  problems.push({
                    code:'COLLEGE_PREFINAL_SCORELESS_NONTERMINAL_VISIBLE',
                    context:'team-schedule',school_id:item.school.id,school_name:item.school.name,team_id:teamId,
                    sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent,status:game.status
                  });
                }
              }
            }
          }

          const statewide=await get('/api/v1/games?lat=34.8&lon=-92.3&radius=260&since=2026-08-01T00:00:00.000Z&until=2026-12-31T23:59:59.999Z&finalSeasonAudit='+bust);
          const nearby=Array.isArray(statewide.games)?statewide.games:[];
          let collegeNearby=0;
          for(const game of nearby){
            auditVisibleRow(game,'nearby-home');
            if(!collegeIds.has(String(game.school_id||''))) continue;
            collegeNearby += 1;

            const teamId=String(game.reporting_team_id||game.team_id||'');
            const firstFinal=firstFinalByTeam.get(teamId);
            if(!Number.isFinite(firstFinal)) continue;
            const when=Date.parse(game.scheduled_at||game.canonical_scheduled_at);
            if(!Number.isFinite(when)||when>=firstFinal) continue;
            const status=String(game.status||'').toUpperCase();
            if(terminal.has(status)) continue;
            if(game.team_score!=null||game.opponent_score!=null||String(game.result||'').trim()) continue;
            problems.push({
              code:'COLLEGE_PREFINAL_SCORELESS_NONTERMINAL_VISIBLE',
              context:'nearby-home',school_id:game.school_id,school_name:game.school_name,team_id:teamId,
              sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent,status:game.status
            });
          }

          const uca=await get('/api/v1/schools/uca/schedule?finalSeasonAudit=uca-'+bust);
          const ucaVolleyball=(uca.games||[]).filter(g=>String(g.sport||'').toLowerCase()==='volleyball');
          const ucaOpponents=ucaVolleyball.map(g=>String(g.opponent||''));
          const ucaProof={
            hasArkansasTech:ucaOpponents.some(x=>/Arkansas Tech/i.test(x)),
            hasMissouriState:ucaOpponents.some(x=>/Missouri State/i.test(x)),
            hasDenver:ucaOpponents.some(x=>/^Denver$/i.test(x)),
            firstFive:ucaVolleyball.slice(0,5).map(g=>({scheduled_at:g.scheduled_at,opponent:g.opponent,status:g.status,result:g.result}))
          };

          const summary={
            schools:schools.length,
            colleges:colleges.length,
            collegeSchedulesChecked:scheduleSummaries.length,
            collegeScheduleGames:scheduleSummaries.reduce((n,s)=>n+s.games,0),
            statewideNearbyGames:nearby.length,
            statewideCollegeNearbyGames:collegeNearby,
            problems,
            ucaProof
          };
          console.log('SYSTEMWIDE_SEASON_INTEGRITY='+JSON.stringify(summary));

          if(problems.length) throw new Error('system-wide season integrity defects remain: '+JSON.stringify(problems.slice(0,25)));
          if(ucaProof.hasArkansasTech||ucaProof.hasMissouriState||!ucaProof.hasDenver){
            throw new Error('UCA regular-season boundary still wrong: '+JSON.stringify(ucaProof));
          }
          NODE
          node /tmp/audit.mjs
