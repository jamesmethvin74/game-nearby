name: Live pipeline final certification once
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/live-pipeline-cert-once.yml]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run targeted regression tests
        working-directory: backend
        run: |
          node --test             test/statewide-integrity-gate.test.js             test/one-truth-contract.test.js             test/statewide-data-integrity-repair.test.js

      - name: Wait for exact production code deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="17fe361546e380ff157a5c260537e85b2e28c30c"
          for i in $(seq 1 36); do
            state=$(gh api "repos/jamesmethvin74/game-nearby/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name=="Workers Builds: localbleachersar-sports-api")] | first | (.status + ":" + (.conclusion // ""))' 2>/dev/null || true)
            echo "DEPLOY_STATE=$state"
            if [ "$state" = "completed:success" ]; then exit 0; fi
            if [[ "$state" == completed:* && "$state" != "completed:success" ]]; then exit 1; fi
            sleep 5
          done
          exit 1

      - name: Repair current bounded defects and certify production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          REPAIR="$BASE/api/v1/internal/live-pipeline-repair-20260921-61c4a9ef"
          CERT="$BASE/api/v1/internal/live-pipeline-cert-20260921-8f3c1d72"

          code=$(curl --max-time 180 -sS -o /tmp/repair.json -w '%{http_code}' -X POST "$REPAIR")
          echo "REPAIR_HTTP=$code"
          test "$code" = "200"

          curl --max-time 180 -fsS "$CERT" > /tmp/cert.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const repair=JSON.parse(fs.readFileSync('/tmp/repair.json','utf8'));
          const cert=JSON.parse(fs.readFileSync('/tmp/cert.json','utf8'));
          const assert=(v,m)=>{if(!v) throw new Error(m);};
          const enc=encodeURIComponent;
          const get=async url=>{
            const r=await fetch(url);
            const text=await r.text();
            if(!r.ok) throw new Error('HTTP '+r.status+' '+url+' '+text.slice(0,300));
            return JSON.parse(text);
          };

          const after=repair.after||{};
          const sourceCodes=after.source_codes||{};
          const forbidden=[
            'PAST_DUE_NONTERMINAL_DISPLAY',
            'STALE_NONTERMINAL_TWIN_OF_FINAL',
            'SAME_DAY_STALE_TWIN_OF_FINAL',
            'SPLIT_CANONICAL_LOGICAL_GAME',
            'DUPLICATE_SCHEDULE_ENTRY',
            'FOOTBALL_SAME_DAY_COLLISION',
            'DISPLAY_FINAL_MISSING_SCORE'
          ];
          assert(repair.status==='SUCCESS','repair did not complete');
          assert(Number(after.active_teams)===1227,'statewide coverage != 1227');
          assert(Number(after.one_truth_blocking||0)===0,'ONE_TRUTH blocker remains');
          assert(Number(after.source_vs_truth_blocking||0)===0,'source-vs-truth blocker remains');
          for(const code of forbidden) assert(Number(sourceCodes[code]||0)===0,'source defect remains '+code);
          assert(Number(sourceCodes.DISPLAY_FINAL_SOURCE_QUARANTINED||0)<=2,'quarantined-final warnings increased above baseline');
          assert(Number(cert.one_truth?.stale_football_volleyball_teams||0)===0,'football/volleyball ONE_TRUTH stale teams remain');

          const samples={};
          for(const sport of ['football','volleyball']){
            const sample=cert.recent_finals?.newest_by_sport?.[sport];
            assert(sample,'missing recent '+sport+' final');
            assert(sample.canonical_event_id,'recent '+sport+' final did not canonicalize');
            assert(sample.canonical_status==='FINAL','recent '+sport+' canonical event is not FINAL');
            assert(sample.canonical_home_score!=null && sample.canonical_away_score!=null,'recent '+sport+' canonical final missing score');
            assert(sample.truth_status==='FINAL','recent '+sport+' final missing from ONE_TRUTH');
            assert(sample.truth_team_refreshed_at,'recent '+sport+' team truth refresh missing');

            const statuses=await get(BASE+'/api/v1/team-statuses?school_ids='+enc(sample.school_id));
            const status=(statuses.team_statuses||[]).find(x=>x.team_id===sample.team_id);
            assert(status,'missing app team status '+sample.team_id);
            const schedule=await get(BASE+'/api/v1/schools/'+enc(sample.school_id)+'/schedule');
            const game=(schedule.games||[]).find(g=>
              g.canonical_event_id===sample.canonical_event_id
              || (String(g.scheduled_at||'').slice(0,10)===String(sample.scheduled_at||'').slice(0,10)
                  && String(g.opponent||'').toLowerCase()===String(sample.opponent||'').toLowerCase())
            );
            assert(game,'recent final missing from app schedule '+sample.team_id);
            assert(game.status==='FINAL' && game.team_score!=null && game.opponent_score!=null,'app final incomplete '+sample.team_id);

            const recordPayload=await get(BASE+'/api/v1/teams/'+enc(sample.team_id)+'/record');
            const record=recordPayload.record||{};
            assert(record.display_overall_record===status.display_overall_record,'record/status mismatch '+sample.team_id);

            let standing=null;
            if(sample.conference_id){
              const p=await get(BASE+'/api/v1/standings?sport='+enc(sample.sport)+'&conference='+enc(sample.conference_id));
              standing=(p.standings||[]).find(x=>x.team_id===sample.team_id)||null;
              if(standing){
                assert(standing.display_overall_record===status.display_overall_record,'standings overall mismatch '+sample.team_id);
                assert(standing.display_conference_record===status.display_conference_record,'standings conference mismatch '+sample.team_id);
                assert(Number(standing.display_rank||0)===Number(status.display_rank||0),'standings rank mismatch '+sample.team_id);
              }
            }

            samples[sport]={
              team_id:sample.team_id,
              school_name:sample.school_name,
              source_id:sample.source_id,
              source_type:sample.source_type,
              parser_type:sample.parser_type,
              scheduled_at:sample.scheduled_at,
              observation_updated_at:sample.updated_at,
              source_last_successful_fetch_at:sample.last_successful_fetch_at,
              canonical_event_id:sample.canonical_event_id,
              canonical_last_reconciled_at:sample.last_reconciled_at,
              truth_game_refreshed_at:sample.truth_game_refreshed_at,
              truth_team_refreshed_at:sample.truth_team_refreshed_at,
              record_calculated_at:sample.record_calculated_at,
              app_game:[game.status,game.team_score,game.opponent_score],
              app_record:status.display_overall_record,
              app_conference_record:status.display_conference_record,
              app_rank:status.display_rank,
              standing:standing?[standing.display_overall_record,standing.display_conference_record,standing.display_rank]:null
            };
          }

          const conwayStatuses=await get(BASE+'/api/v1/team-statuses?school_ids=conway');
          const conwayVolleyball=(conwayStatuses.team_statuses||[]).find(x=>x.team_id==='conway-volleyball-2026');
          const conwayStandings=await get(BASE+'/api/v1/standings?sport=volleyball&conference=7a-central');
          const conwayRow=(conwayStandings.standings||[]).find(x=>x.team_id==='conway-volleyball-2026');
          assert(conwayVolleyball&&conwayRow,'Conway volleyball standings proof missing');
          assert(conwayVolleyball.display_overall_record===conwayRow.display_overall_record,'Conway overall mismatch');
          assert(conwayVolleyball.display_conference_record===conwayRow.display_conference_record,'Conway conference mismatch');
          assert(Number(conwayVolleyball.display_rank||0)===Number(conwayRow.display_rank||0),'Conway rank mismatch');

          const nearby=await get(BASE+'/api/v1/games?lat=35.0887&lon=-92.4421&radius=35&since=2026-09-15T00%3A00%3A00.000Z&until=2026-10-15T23%3A59%3A59.000Z');
          const nearbyGames=nearby.games||[];
          const schoolIds=[...new Set(nearbyGames.map(g=>g.school_id).filter(Boolean))];
          const allStatuses=[];
          for(let i=0;i<schoolIds.length;i+=10){
            const p=await get(BASE+'/api/v1/team-statuses?school_ids='+enc(schoolIds.slice(i,i+10).join(',')));
            allStatuses.push(...(p.team_statuses||[]));
          }
          let cardsChecked=0;
          for(const game of nearbyGames){
            const st=allStatuses.find(x=>x.team_id===game.team_id);
            if(!st) continue;
            assert(Number(game.wins||0)===Number(st.wins||0),'nearby wins mismatch '+game.team_id);
            assert(Number(game.losses||0)===Number(st.losses||0),'nearby losses mismatch '+game.team_id);
            assert(Number(game.ties||0)===Number(st.ties||0),'nearby ties mismatch '+game.team_id);
            assert(Number(game.rank||0)===Number(st.rank||0),'nearby rank mismatch '+game.team_id);
            cardsChecked++;
          }
          assert(cardsChecked>0,'no nearby cards checked');

          console.log('LIVE_PIPELINE_FINAL='+JSON.stringify({
            repair:{
              gate_status:repair.gate?.status,
              repaired_issue_count:repair.gate?.repairs?.[0]?.issue_count||0,
              repaired_issue_counts:repair.gate?.repairs?.[0]?.issue_counts||{},
              affected_team_count:repair.gate?.refresh_team_ids?.length||0,
              stale_batches:repair.stale_batches,
              stale_refreshed:repair.stale_refreshed
            },
            after,
            scheduler:{
              cron:cert.scheduler?.cloudflare_cron,
              recent_collection_runs:cert.scheduler?.recent_collection_runs,
              recent_success_or_not_modified:cert.scheduler?.recent_success_or_not_modified,
              football_runs:(cert.scheduler?.by_sport?.football||[]).slice(0,5),
              volleyball_runs:(cert.scheduler?.by_sport?.volleyball||[]).slice(0,8)
            },
            recent_finals:{
              observations:cert.recent_finals?.observations,
              canonicalized:cert.recent_finals?.canonicalized,
              canonical_final_complete:cert.recent_finals?.canonical_final_complete,
              present_as_scored_final_in_one_truth:cert.recent_finals?.present_as_scored_final_in_one_truth
            },
            samples,
            conway_volleyball:{
              record:conwayVolleyball.display_overall_record,
              conference_record:conwayVolleyball.display_conference_record,
              rank:conwayVolleyball.display_rank
            },
            nearby:{games:nearbyGames.length,schools:schoolIds.length,cards_checked:cardsChecked}
          }));
          NODE
