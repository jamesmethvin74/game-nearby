name: Live pipeline post-failure snapshot once
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/live-pipeline-cert-once.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read current production certification
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/live-pipeline-cert-20260921-8f3c1d72"
          curl --max-time 180 -fsS "$URL" > /tmp/cert.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('/tmp/cert.json','utf8'));
          console.log('POST_FAILURE='+JSON.stringify({
            generated_at:c.generated_at,
            one_truth:c.one_truth,
            integrity:c.integrity,
            recent_finals:{
              observations:c.recent_finals?.observations,
              canonicalized:c.recent_finals?.canonicalized,
              canonical_final_complete:c.recent_finals?.canonical_final_complete,
              present_as_scored_final_in_one_truth:c.recent_finals?.present_as_scored_final_in_one_truth,
              newest_by_sport:c.recent_finals?.newest_by_sport
            }
          }));
          NODE
