name: Live pipeline evidence once
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/live-pipeline-cert-once.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read production pipeline evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          CERT="$BASE/api/v1/internal/live-pipeline-cert-20260921-8f3c1d72"
          curl --max-time 180 -fsS "$CERT" > /tmp/cert.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cert=JSON.parse(fs.readFileSync('/tmp/cert.json','utf8'));
          const enc=encodeURIComponent;
          const get=async url=>{
            try {
              const r=await fetch(url);
              const body=await r.text();
              if(!r.ok) return {error:'HTTP '+r.status,body:body.slice(0,500),url};
              return JSON.parse(body);
            } catch(e) {
              return {error:String(e?.message||e),url};
            }
          };
          const samples={};
          for(const sport of ['football','volleyball']){
            const s=cert.recent_finals?.newest_by_sport?.[sport]||null;
            if(!s){ samples[sport]={error:'no recent final sample'}; continue; }
            const statusPayload=await get(BASE+'/api/v1/team-statuses?school_ids='+enc(s.school_id));
            const status=(statusPayload.team_statuses||[]).find(x=>x.team_id===s.team_id)||null;
            const schedule=await get(BASE+'/api/v1/teams/'+enc(s.team_id)+'/schedule');
            const game=(schedule.games||[]).find(g=>g.canonical_event_id===s.canonical_event_id)||null;
            const recordPayload=await get(BASE+'/api/v1/teams/'+enc(s.team_id)+'/record');
            const record=recordPayload.record||null;
            let standing=null;
            let standingsError=null;
            if(s.conference_id){
              const p=await get(BASE+'/api/v1/standings?sport='+enc(s.sport)+'&conference='+enc(s.conference_id));
              standingsError=p.error||null;
              standing=(p.standings||[]).find(x=>x.team_id===s.team_id)||null;
            }
            samples[sport]={
              source:{
                game_id:s.game_id,team_id:s.team_id,school_id:s.school_id,school_name:s.school_name,
                source_id:s.source_id,source_type:s.source_type,parser_type:s.parser_type,
                scheduled_at:s.scheduled_at,updated_at:s.updated_at,last_successful_fetch_at:s.last_successful_fetch_at,
                status:s.status,team_score:s.team_score,opponent_score:s.opponent_score
              },
              canonical:{
                event_id:s.canonical_event_id,status:s.canonical_status,
                home_score:s.canonical_home_score,away_score:s.canonical_away_score,
                last_reconciled_at:s.last_reconciled_at,trust_state:s.canonical_trust_state,
                conflict_count:s.canonical_conflict_count
              },
              one_truth:{
                game_status:s.truth_status,team_score:s.truth_team_score,opponent_score:s.truth_opponent_score,
                game_refreshed_at:s.truth_game_refreshed_at,overall_record:s.truth_overall_record,
                conference_record:s.truth_conference_record,rank:s.truth_rank,
                team_refreshed_at:s.truth_team_refreshed_at,record_calculated_at:s.record_calculated_at
              },
              app:{
                team_status:status,
                schedule_game:game,
                record,
                standing,
                standings_error:standingsError,
                schedule_error:schedule.error||null,
                status_error:statusPayload.error||null,
                record_error:recordPayload.error||null
              }
            };
          }

          const nearby=await get(BASE+'/api/v1/games?lat=35.0887&lon=-92.4421&radius=35&since=2026-09-15T00%3A00%3A00.000Z&until=2026-10-15T23%3A59%3A59.000Z');
          const games=nearby.games||[];
          const schoolIds=[...new Set(games.map(g=>g.school_id).filter(Boolean))];
          const statuses=[];
          for(let i=0;i<schoolIds.length;i+=10){
            const p=await get(BASE+'/api/v1/team-statuses?school_ids='+enc(schoolIds.slice(i,i+10).join(',')));
            statuses.push(...(p.team_statuses||[]));
          }
          const mismatches=[];
          let compared=0;
          for(const g of games){
            const st=statuses.find(x=>x.team_id===g.team_id);
            if(!st) continue;
            compared++;
            const fields=['wins','losses','ties','rank'];
            const bad=fields.filter(k=>Number(g[k]||0)!==Number(st[k]||0));
            if(bad.length) mismatches.push({team_id:g.team_id,school_id:g.school_id,bad,card:{wins:g.wins,losses:g.losses,ties:g.ties,rank:g.rank},status:{wins:st.wins,losses:st.losses,ties:st.ties,rank:st.rank}});
          }

          const out={
            marker:'LIVE_PIPELINE_EVIDENCE_20260921',
            generated_at:cert.generated_at,
            scheduler:{
              cron:cert.scheduler?.cloudflare_cron,
              recent_collection_runs:cert.scheduler?.recent_collection_runs,
              recent_success_or_not_modified:cert.scheduler?.recent_success_or_not_modified,
              football:(cert.scheduler?.by_sport?.football||[]).slice(0,10),
              volleyball:(cert.scheduler?.by_sport?.volleyball||[]).slice(0,10)
            },
            recent_finals:{
              observations:cert.recent_finals?.observations,
              canonicalized:cert.recent_finals?.canonicalized,
              canonical_final_complete:cert.recent_finals?.canonical_final_complete,
              present_as_scored_final_in_one_truth:cert.recent_finals?.present_as_scored_final_in_one_truth
            },
            one_truth:cert.one_truth,
            integrity:cert.integrity,
            samples,
            nearby:{games:games.length,schools:schoolIds.length,compared,mismatch_count:mismatches.length,mismatches:mismatches.slice(0,25),error:nearby.error||null},
            d1:cert.d1
          };
          console.log('PIPELINE_EVIDENCE='+JSON.stringify(out));
          NODE
