name: Temporary seven-team root-cause read

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - ".github/workflows/tmp-seven-root-cause.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read seven source-vs-truth issues
        shell: bash
        run: |
          set -euo pipefail
          url="https://statewide-integrity-audit-result-localbleachersar-sports-api.james-methvin74.workers.dev/api/statewide-integrity-audit-result"
          curl -fsS --max-time 60 "$url" > audit.json
          node - <<'NODE'
const fs=require('fs');
const p=JSON.parse(fs.readFileSync('audit.json','utf8'));
const ids=new Set(["df-3awfes-volleyball-2026","df-blzxrg-volleyball-2026","df-cy8ct5-volleyball-2026","df-hrdb8f-volleyball-2026","df-q7bveq-volleyball-2026","df-tnebcj-volleyball-2026","df-z44bdn-volleyball-2026"]);
const issues=(p.source_vs_truth?.issues||p.issues||[]).filter(x=>ids.has(x.team_id)&&x.code==="SOURCE_FINAL_COUNT_VS_ONE_TRUTH");
for(const x of issues){
  console.log(JSON.stringify({
    team_id:x.team_id,
    school_name:x.school_name,
    detail:x.detail,
    source_only_finals:(x.source_only_finals||[]).map(g=>({
      game_id:g.game_id,
      canonical_event_id:g.canonical_event_id,
      opponent:g.opponent,
      scheduled_at:g.scheduled_at,
      source_id:g.source_id,
      parser_type:g.parser_type,
      status:g.status,
      team_score:g.team_score,
      opponent_score:g.opponent_score
    }))
  }));
}
NODE
