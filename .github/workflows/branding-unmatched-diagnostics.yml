name: Branding unmatched diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/branding-unmatched-diagnostics.yml'
      - 'backend/src/school-branding.js'
      - 'backend/src/school-branding-curated.js'
      - 'backend/src/school-branding-curated-sync.js'
      - 'backend/test/school-branding.test.js'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Print production unmatched branding identities
        run: |
          curl -fsSL \
            -A 'Mozilla/5.0 LocalBleachersAR branding diagnostics' \
            -H 'Accept: application/json' \
            'https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/branding/report' \
            -o /tmp/branding.json
          python - <<'PY'
          import json
          with open('/tmp/branding.json') as f:
              data=json.load(f)
          print(json.dumps(data.get('unmatched', []), indent=2))
          PY
