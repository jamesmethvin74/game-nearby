name: Branding unmatched diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/branding-unmatched-diagnostics.yml'
      - 'backend/src/school-branding-curated.js'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect academy image URLs
        run: |
          for url in \
            'https://mail.friendshipaspire.org/extended-learning' \
            'https://www.exaltacademies.org/exalt-early-learning-academy'; do
            echo "### $url"
            curl -kfsSL -A 'Mozilla/5.0 LocalBleachersAR branding audit' "$url" \
              | tr '>' '>\n' \
              | grep -Eio '<img[^>]+>' \
              | grep -Ei 'friendship|aspire|icon|eagle|exalt|logo' \
              | head -30 || true
          done
