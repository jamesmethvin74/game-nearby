name: Branding unmatched diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/branding-unmatched-diagnostics.yml'
      - 'backend/src/school-branding.js'
      - 'backend/src/school-branding-curated.js'
      - 'backend/src/school-branding-curated-sync.js'
      - 'backend/test/school-branding.test.js'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect canonical MaxPreps IDs
        run: |
          node --input-type=module <<'JS'
          import { CURATED_SCHOOL_BRANDING_IDENTITIES as rows } from './backend/src/school-branding-curated.js';
          const targets=rows.filter(r=>!r.sourceType);
          const out=[];
          for (const row of targets) {
            const r=await fetch(row.sourceUrl,{headers:{'user-agent':'Mozilla/5.0 LocalBleachersAR branding audit','accept':'text/html'},redirect:'follow'});
            const html=await r.text();
            const ids=[...new Set([...html.matchAll(/(?:schoolId|schoolID|schoolid)[^0-9a-f]{0,30}([0-9a-f]{8}-[0-9a-f-]{27})/gi)].map(m=>m[1].toLowerCase()))];
            const imageIds=[...new Set([...html.matchAll(/image\.maxpreps\.io\/school-mascot\/(?:[0-9a-f]\/){3}([0-9a-f-]{36})\.(?:gif|png|jpe?g|webp)/gi)].map(m=>m[1].toLowerCase()))];
            out.push({sourceName:row.sourceName,status:r.status,finalUrl:r.url,ids,imageIds,intersection:ids.filter(id=>imageIds.includes(id))});
          }
          console.log(JSON.stringify(out,null,2));
          JS
