name: M2 bootstrap diagnostic capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Allow Cloudflare diagnostic deployment to settle
        shell: bash
        run: sleep 30

      - name: Capture bounded read-only M2 bootstrap status exactly once
        shell: bash
        run: |
          set -euo pipefail
          status_url="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/_m2-bootstrap-status-20260903-1102"
          status=$(curl -sS -L --max-time 60 \
            -H 'x-localbleachers-m2-bootstrap: approved-certified-1102-20260903' \
            -o m2-bootstrap-status.json \
            -w '%{http_code}' \
            "$status_url")
          printf '%s\n' "$status" > m2-bootstrap-status-http-status.txt
          cat m2-bootstrap-status.json
          if [ "$status" != "200" ]; then
            echo "Status probe returned HTTP $status" >&2
            exit 1
          fi

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-bootstrap-diagnostic-result
          path: |
            m2-bootstrap-status.json
            m2-bootstrap-status-http-status.txt
          if-no-files-found: warn
