name: Apply statewide results v1

on:
  push:
    branches: [feature/statewide-results-v1]
    paths:
      - ".github/workflows/apply-results-v1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/statewide-results-v1
      - name: Apply results and records fixes
        run: python scripts/apply_results_v1.py
      - name: Run backend checks
        run: cd backend && npm run check
      - name: Commit branch changes
        run: |
          git rm -f .github/workflows/apply-results-v1.yml .github/workflows/results-diagnostics.yml scripts/apply_results_v1.py
          git config user.name "LocalBleachersAR CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use live statewide results and records"
          git push origin HEAD:feature/statewide-results-v1
