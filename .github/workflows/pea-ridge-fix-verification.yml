name: Pea Ridge fix verification
# rerun after targeted test correction

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/pea-ridge-fix-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted backend tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          node --test test/result-only-source-truth.test.js test/record-rebuild.test.js test/team-read-worker.test.js test/canonical-game-read.test.js
      - name: Verify production Pea Ridge truth after deploy
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          ID="df-7x4sxh"

          ok=0
          for attempt in $(seq 1 30); do
            curl -fsS "$BASE/api/v1/schools/$ID/schedule?verify=$(date +%s)-$attempt" > /tmp/schedule.json
            if node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/schedule.json','utf8'));
          const rows=(p.games||[]).filter(g=>String(g.sport||'').toLowerCase()==='football' && String(g.gender||'').toLowerCase()==='boys');
          const bad=rows.filter(g=>['mascot-media','rankone-public'].includes(String(g.parser_type||'').toLowerCase()));
          const extras=rows.filter(g=>['Gentry High School','Huntsville High School','Prairie Grove High School'].some(n=>String(g.opponent||'').toLowerCase()===n.toLowerCase()) || (String(g.opponent||'').toLowerCase().includes('dardanelle') && String(g.scheduled_at||'').startsWith('2026-09-30')));
          const expectedFinals=rows.filter(g=>String(g.status||'').toUpperCase()==='FINAL').map(g=>({opponent:g.opponent,result:g.result,team_score:g.team_score,opponent_score:g.opponent_score}));
          console.log('PEA_VERIFY_ATTEMPT='+JSON.stringify({rows:rows.length,bad:bad.length,extras:extras.length,expectedFinals}));
          if(bad.length||extras.length) process.exit(1);
          const finalOpps=expectedFinals.map(x=>String(x.opponent||'').toLowerCase());
          if(!(finalOpps.some(x=>x.includes('elkins')) && finalOpps.some(x=>x.includes('booneville')) && finalOpps.some(x=>x.includes('siloam springs')))) process.exit(1);
          if(expectedFinals.length!==3) process.exit(1);
          JS
            then ok=1; break; fi
            sleep 4
          done
          if [ "$ok" != "1" ]; then
            echo "production schedule did not converge"
            exit 1
          fi

          curl -fsS "$BASE/api/v1/team-statuses?school_ids=$ID&verify=$(date +%s)" > /tmp/status.json
          curl -fsS "$BASE/api/v1/standings?sport=football&conference=5a-west&verify=$(date +%s)" > /tmp/standings.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          const st=JSON.parse(fs.readFileSync('/tmp/standings.json','utf8'));
          const status=(s.team_statuses||[]).find(x=>String(x.school_id)==='df-7x4sxh'&&String(x.sport)==='football');
          const standing=(st.standings||[]).find(x=>String(x.school_id)==='df-7x4sxh'||/Pea Ridge/i.test(String(x.school_name||'')));
          console.log('PEA_TEAM_STATUS='+JSON.stringify(status));
          console.log('PEA_STANDING='+JSON.stringify(standing));
          JS
