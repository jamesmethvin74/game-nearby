name: ONE_TRUTH remaining blocker extraction once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/one-truth-accuracy-repair-once.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact remaining production blockers and live surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --max-time 120 -fsS "$BASE/api/v1/internal/one-truth-audit-20260919-7c4b1d9e3" > /tmp/audit.json
          curl --max-time 30 -fsS "$BASE/api/v1/team-statuses?school_ids=conway,df-7x4sxh" > /tmp/status.json
          curl --max-time 30 -fsS "$BASE/api/v1/schools/conway/schedule" > /tmp/conway.json
          curl --max-time 30 -fsS "$BASE/api/v1/schools/df-7x4sxh/schedule" > /tmp/pea.json
          curl --max-time 30 -fsS "$BASE/api/v1/standings?sport=volleyball&conference=7a-central" > /tmp/standings.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const a=read('/tmp/audit.json');
          const issues=a.statewide_audit?.issues||[];
          const truth=issues.filter(x=>x.surface==='ONE_TRUTH_TB'&&x.severity==='blocking');
          const source=issues.filter(x=>x.surface==='source-schedule'&&x.severity==='blocking');
          const statuses=read('/tmp/status.json').team_statuses||[];
          const conway=read('/tmp/conway.json').games||[];
          const pea=read('/tmp/pea.json').games||[];
          const standings=read('/tmp/standings.json').standings||[];
          const cf=statuses.find(x=>x.school_id==='conway'&&x.sport==='football'&&x.gender==='boys');
          const cv=statuses.find(x=>x.school_id==='conway'&&x.sport==='volleyball'&&x.gender==='girls');
          const pf=statuses.find(x=>x.school_id==='df-7x4sxh'&&x.sport==='football'&&x.gender==='boys');
          const payload={
            marker:'ONE_TRUTH_REMAINING_BLOCKERS_20260920',
            problems:a.problems,
            truth_blockers:truth,
            source_blockers:source,
            live:{
              conway_football:cf,
              conway_volleyball:cv,
              pea_ridge:pf,
              conway_capital:conway.find(g=>g.sport==='football'&&/Capital High School/i.test(String(g.opponent||''))),
              conway_volleyball_standing:standings.find(x=>x.team_id==='conway-volleyball-2026'),
              pea_result_only_rows:pea.filter(g=>String(g.source_id||'').toLowerCase().endsWith('-official-school-results')).length
            }
          };
          fs.writeFileSync('/tmp/comment.md','### ONE_TRUTH remaining blockers\n\n```json\n'+JSON.stringify(payload,null,2)+'\n```');
          NODE
          gh pr comment 366 --repo jamesmethvin74/game-nearby --body-file /tmp/comment.md
