name: ONE_TRUTH app-surface probe once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/one-truth-accuracy-repair-once.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe exact production presentation endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          cat > /tmp/endpoints.tsv <<'EOF'
          team_statuses	/api/v1/team-statuses?school_ids=conway,df-7x4sxh
          conway_schedule	/api/v1/schools/conway/schedule
          pea_schedule	/api/v1/schools/df-7x4sxh/schedule
          conway_football_record	/api/v1/teams/conway-football-2026/record
          conway_volleyball_record	/api/v1/teams/conway-volleyball-2026/record
          pea_football_record	/api/v1/teams/df-7x4sxh-football-2026/record
          standings	/api/v1/standings?sport=volleyball&conference=7a-central
          nearby	/api/v1/games?lat=35.0887&lon=-92.4421&radius=35&since=2026-09-15T00%3A00%3A00.000Z&until=2026-10-15T23%3A59%3A59.000Z
          EOF
          : > /tmp/results.ndjson
          while IFS=$'\t' read -r name route; do
            code=$(curl --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 -sS -o "/tmp/$name.json" -w "%{http_code}" "$BASE$route" || true)
            bytes=$(wc -c < "/tmp/$name.json" 2>/dev/null || echo 0)
            printf '{"name":"%s","code":"%s","bytes":%s}\n' "$name" "$code" "$bytes" >> /tmp/results.ndjson
          done < /tmp/endpoints.tsv
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=fs.readFileSync('/tmp/results.ndjson','utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const bodies={};
          for(const row of rows){
            if(row.code!=='200'){
              try{bodies[row.name]=fs.readFileSync('/tmp/'+row.name+'.json','utf8').slice(0,2000);}catch{}
            }
          }
          const payload={marker:'ONE_TRUTH_APP_SURFACE_PROBE_20260920',workflow_commit:process.env.GITHUB_SHA,rows,failures:bodies};
          fs.writeFileSync('/tmp/comment.md','### ONE_TRUTH app-surface probe\n\n'+JSON.stringify(payload,null,2));
          console.log(JSON.stringify(payload,null,2));
          NODE
          gh pr comment 366 --repo jamesmethvin74/game-nearby --body-file /tmp/comment.md
