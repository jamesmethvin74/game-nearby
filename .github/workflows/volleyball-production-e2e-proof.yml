name: Volleyball production E2E proof

on:
  pull_request:
    paths:
      - ".github/workflows/volleyball-production-e2e-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dump bounded representative production volleyball state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const API='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const stamp=Date.now();
          const alias=value=>String(value||'').toLowerCase().replace(/high school/g,'').replace(/[^a-z0-9]+/g,'');
          async function getJson(path){
            const join=path.includes('?')?'&':'?';
            const r=await fetch(`${API}${path}${join}_proof=${stamp}`,{headers:{accept:'application/json','cache-control':'no-cache'},signal:AbortSignal.timeout(45000)});
            const t=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${t.slice(0,300)}`);
            return JSON.parse(t);
          }
          function recordText(record,prefix=''){
            const w=Number(record?.[`${prefix}wins`]||0),l=Number(record?.[`${prefix}losses`]||0),t=Number(record?.[`${prefix}ties`]||0);
            return t?`${w}-${l}-${t}`:`${w}-${l}`;
          }
          function finalRows(games){
            return (games||[]).filter(g=>g.status==='FINAL' && g.team_score!=null && g.opponent_score!=null).map(g=>({
              id:g.id,canonical_event_id:g.canonical_event_id,scheduled_at:g.scheduled_at,opponent:g.opponent,
              score:`${g.team_score}-${g.opponent_score}`,result:g.result,counts_for_record:g.counts_for_record,
              conference_game:g.conference_game,trust:g.data_trust,conflict_count:g.conflict_count,
              source_type:g.source_type,parser_type:g.parser_type,source_id:g.source_id
            }));
          }
          const catalog=await getJson('/api/v1/schools');
          const schools=catalog.schools||[];
          const names=['Conway High School','Little Rock Southwest High School','Flippin High School','Melbourne High School'];
          const report={teams:[],standings:{}};
          for(const name of names){
            const target=alias(name);
            const school=schools.find(s=>alias(s.location_matched_name||s.name)===target||alias(s.name)===target);
            assert.ok(school,`missing ${name}`);
            const teamId=`${school.id}-volleyball-2026`;
            const [schedule,record]=await Promise.all([
              getJson(`/api/v1/teams/${encodeURIComponent(teamId)}/schedule`),
              getJson(`/api/v1/teams/${encodeURIComponent(teamId)}/record`)
            ]);
            report.teams.push({name,schoolId:school.id,teamId,record:{overall:recordText(record.record),conference:recordText(record.record,'conference_'),calculated_at:record.record?.calculated_at||null},finals:finalRows(schedule.games)});
          }
          for(const conference of ['6a-central','3a-2']){
            const payload=await getJson(`/api/v1/standings?sport=volleyball&conference=${conference}`);
            report.standings[conference]={conference:payload.conference,rows:(payload.standings||[]).map(row=>({school_name:row.school_name,conference_record:row.conference_record,overall_record:row.overall_record,method:row.method,calculated_at:row.calculated_at||null}))};
          }
          const day=await getJson('/api/v1/games?since=2026-09-03T05%3A00%3A00.000Z&until=2026-09-04T05%3A00%3A00.000Z');
          report.publicDayGames=(day.games||[]).map(g=>({canonical_event_id:g.canonical_event_id,school_name:g.school_name,opponent:g.opponent,status:g.status,score:`${g.team_score}-${g.opponent_score}`,conference_game:g.conference_game,trust:g.data_trust}));
          console.log('LOCALBLEACHERS_VOLLEYBALL_DIAGNOSTIC_START');
          console.log(JSON.stringify(report,null,2));
          console.log('LOCALBLEACHERS_VOLLEYBALL_DIAGNOSTIC_END');
          JS
