name: Source reconciliation HTTP transport once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/source-reconciliation-http-once.yml

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for exact Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:8}"
          for i in $(seq 1 36); do
            body=$(gh api repos/jamesmethvin74/game-nearby/issues/366/comments --paginate --jq '[.[] | select(.user.login=="cloudflare-workers-and-pages[bot]")] | last | .body // ""')
            if printf '%s' "$body" | grep -q "Deployment successful" && printf '%s' "$body" | grep -q "$short"; then
              echo "DEPLOYED=$short"
              exit 0
            fi
            sleep 5
          done
          echo "Exact Cloudflare deployment not confirmed"
          exit 1

      - name: Audit, repair, rebuild, verify
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          AUDIT="$BASE/api/v1/internal/source-recovery-audit-20260920-b72f9c31"
          APPLY="$BASE/api/v1/internal/source-recovery-apply-20260920-b72f9c31"
          REBUILD="$BASE/api/v1/internal/source-recovery-rebuild-20260920-b72f9c31"

          code=$(curl --max-time 120 -sS -o /tmp/before.json -w '%{http_code}' "$AUDIT")
          echo "BEFORE_HTTP=$code"
          cat /tmp/before.json
          test "$code" = "200"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const outer=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));
          const audit=outer.statewide_audit;
          if(!audit?.issues || !audit?.summary) throw new Error('missing statewide_audit');
          fs.writeFileSync('/tmp/apply.json',JSON.stringify({audit}));
          console.log('BEFORE_SUMMARY='+JSON.stringify({
            active_teams:audit.summary.total_active_teams_examined,
            source_issues:audit.summary.upstream_source_observation_issues,
            source_codes:audit.summary.upstream_source_issues_by_code,
            one_truth_blocking:audit.summary.one_truth_surface_blocking_issues,
            source_vs_truth_blocking:audit.summary.source_vs_truth_blocking_issues
          }));
          NODE

          code=$(curl --max-time 120 -sS -o /tmp/apply-result.json -w '%{http_code}'             -X POST -H 'content-type: application/json' --data-binary @/tmp/apply.json "$APPLY")
          echo "APPLY_HTTP=$code"
          cat /tmp/apply-result.json
          test "$code" = "200"

          code=$(curl --max-time 120 -sS -o /tmp/rebuild.json -w '%{http_code}' -X POST "$REBUILD")
          echo "REBUILD_HTTP=$code"
          cat /tmp/rebuild.json
          test "$code" = "200"

          code=$(curl --max-time 120 -sS -o /tmp/after.json -w '%{http_code}' "$AUDIT")
          echo "AFTER_HTTP=$code"
          cat /tmp/after.json
          test "$code" = "200"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync('/tmp/before.json','utf8')).statewide_audit;
          const a=JSON.parse(fs.readFileSync('/tmp/after.json','utf8')).statewide_audit;
          const p=JSON.parse(fs.readFileSync('/tmp/apply-result.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/rebuild.json','utf8'));
          const remaining=(a.issues||[]).filter(x=>[
            'PAST_DUE_NONTERMINAL_DISPLAY',
            'SPLIT_CANONICAL_LOGICAL_GAME',
            'STALE_NONTERMINAL_TWIN_OF_FINAL',
            'FOOTBALL_SAME_DAY_COLLISION',
            'DUPLICATE_SCHEDULE_ENTRY',
            'SAME_DAY_STALE_TWIN_OF_FINAL',
            'DISPLAY_FINAL_SOURCE_QUARANTINED',
            'DISPLAY_FINAL_MISSING_SCORE'
          ].includes(x.code)).slice(0,40);
          console.log('SOURCE_RECONCILIATION_RESULT='+JSON.stringify({
            before:{
              source_issues:b.summary?.upstream_source_observation_issues,
              source_codes:b.summary?.upstream_source_issues_by_code
            },
            apply:{
              source_issue_count:p.source_issue_count,
              canonical:p.canonical,
              suppression_rows:p.suppression?.rows_written,
              affected_team_count:(p.affected_team_ids||[]).length,
              record_rebuild:p.record_rebuild,
              d1:p.d1
            },
            rebuild:r.one_truth,
            after:{
              source_issues:a.summary?.upstream_source_observation_issues,
              source_codes:a.summary?.upstream_source_issues_by_code,
              one_truth_blocking:a.summary?.one_truth_surface_blocking_issues,
              source_vs_truth_blocking:a.summary?.source_vs_truth_blocking_issues
            },
            remaining_samples:remaining
          }));
          if(Number(r.one_truth?.teams)!==1227) throw new Error('ONE_TRUTH team count != 1227');
          NODE
