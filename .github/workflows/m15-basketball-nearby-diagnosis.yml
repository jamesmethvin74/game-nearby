name: M15 basketball nearby diagnosis

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m15-basketball-nearby-diagnosis.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove basketball is hidden from near-term Upcoming and dates are explicit
        env:
          BASE_URL: https://jamesmethvin74.github.io/game-nearby
        run: |
          cat > proof.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:430,height:932}, timezoneId:'America/Chicago'});
          const page = await context.newPage();
          const followed=['aaa-3qbpwe','aaa-2qzd2q','conway'];
          const clean=v=>String(v||'').replace(/\s+/g,' ').trim();

          try {
            await page.goto(process.env.BASE_URL + '/?basketball-proof=v78',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v78', null, {timeout:45000});
            await page.evaluate(ids=>localStorage.setItem('followedTeams',JSON.stringify(ids)), followed);
            await page.reload({waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v78', null, {timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersLive?.getState?.().nearbyLoadedAt, null, {timeout:45000});
            await page.waitForTimeout(750);

            const upcoming = await page.evaluate(() => [...document.querySelectorAll('.event-card .team-detail-trigger')].map(t=>({
              teamId:t.dataset.teamId,
              sport:t.dataset.sport,
              gender:t.dataset.gender,
              text:String(t.closest('.event-card')?.innerText||'').replace(/\s+/g,' ').trim()
            })));
            const badUpcoming = upcoming.filter(x=>['aaa-3qbpwe','aaa-2qzd2q','conway'].includes(x.teamId) && x.sport==='basketball');
            console.log('BB_UPCOMING='+JSON.stringify({count:upcoming.length,badUpcoming}));
            if (badUpcoming.length) throw new Error('Far-future basketball leaked into Upcoming: '+JSON.stringify(badUpcoming));

            await page.evaluate(() => {
              const input=document.querySelector('#datePicker');
              input.value='2026-12-08';
              input.dispatchEvent(new Event('change',{bubbles:true}));
            });
            await page.waitForTimeout(250);
            const picked = await page.evaluate(() => [...document.querySelectorAll('.event-card .team-detail-trigger')].map(t=>({
              teamId:t.dataset.teamId,
              sport:t.dataset.sport,
              gender:t.dataset.gender,
              text:String(t.closest('.event-card')?.innerText||'').replace(/\s+/g,' ').trim()
            })));
            const basketball=picked.filter(x=>x.sport==='basketball');
            console.log('BB_PICKED_DEC8='+JSON.stringify(basketball));
            if (!basketball.some(x=>x.teamId==='aaa-3qbpwe' && x.gender==='girls' && /Dec 8/.test(x.text))) {
              throw new Error('Bradford Dec 8 girls basketball card missing explicit date');
            }
            if (!basketball.some(x=>x.teamId==='conway' && x.gender==='boys' && /Dec 8/.test(x.text))) {
              throw new Error('Conway Dec 8 boys basketball card missing explicit date');
            }
          } finally {
            await browser.close();
          }
          NODE
          node proof.mjs
