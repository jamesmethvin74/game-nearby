name: Standings check diagnostics

on:
  push:
    branches: [feature/standings-page-v1]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture backend check output
        shell: bash
        run: |
          set +e
          npm run check > standings-check.log 2>&1
          code=$?
          cat standings-check.log
          echo "$code" > standings-check-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: standings-check-diagnostics
          path: |
            backend/standings-check.log
            backend/standings-check-exit.txt
          retention-days: 1
