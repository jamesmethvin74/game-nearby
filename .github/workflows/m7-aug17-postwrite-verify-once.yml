name: One-shot M7 Aug 17 post-write verify

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-aug17-postwrite-verify-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live planner state after approved repair
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-plan-aug17-6f1e1dd2b0b74b78'
          code=$(curl -sS --max-time 60 -o m7-postwrite.json -w '%{http_code}' "$URL")
          echo "M7_POSTWRITE_HTTP=$code"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('m7-postwrite.json','utf8'));
          console.log('M7_POSTWRITE_D1='+JSON.stringify(payload.d1||{}));
          console.log('M7_POSTWRITE_SAFE='+JSON.stringify({safe_to_execute:payload.safe_to_execute,blockers:payload.blockers||[]}));
          console.log('M7_POSTWRITE_FINGERPRINT='+String(payload.plan_fingerprint||''));
          console.log('M7_POSTWRITE_WRITE_SCOPE='+JSON.stringify({expected_rows_written_if_approved:payload.expected_rows_written_if_approved,write_scope:payload.write_scope||{}}));
          console.log('M7_POSTWRITE_CANONICAL='+JSON.stringify(payload.canonical_plan||[]));
          console.log('M7_POSTWRITE_SOURCES='+JSON.stringify(payload.source_plan||[]));
          console.log('M7_POSTWRITE_GAMES='+JSON.stringify(payload.game_plan||[]));
          console.log('M7_POSTWRITE_MEMBERS='+JSON.stringify(payload.member_plan||[]));
          console.log('M7_POSTWRITE_LIVE_ROWS='+JSON.stringify(payload.live_rows||{}));
          if(Number(payload.d1?.rows_written||0)!==0) throw new Error('Verification query wrote to D1');
          NODE
