name: Nearby status isolation once
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/final-app-proof-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Isolate failing nearby school status
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --max-time 90 -fsS "$BASE/api/v1/games?lat=35.0887&lon=-92.4421&radius=35&since=2026-09-15T00%3A00%3A00.000Z&until=2026-10-15T23%3A59%3A59.000Z" > /tmp/nearby.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const nearby=JSON.parse(fs.readFileSync('/tmp/nearby.json','utf8')).games||[];
          const schoolIds=[...new Set(nearby.map(g=>g.school_id).filter(Boolean))];
          console.log('SCHOOLS='+JSON.stringify(schoolIds));
          for(const id of schoolIds){
            const url='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/team-statuses?school_ids='+encodeURIComponent(id);
            const r=await fetch(url);
            const body=await r.text();
            console.log('STATUS',id,r.status,body.slice(0,220).replace(/\s+/g,' '));
            if(!r.ok) process.exit(2);
          }
          console.log('ALL_SINGLE_SCHOOL_STATUS_OK='+schoolIds.length);
          NODE
