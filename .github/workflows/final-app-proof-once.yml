name: Final app proof once
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/final-app-proof-once.yml]
permissions:
  contents: read
  issues: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for exact Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short="972aa91e"
          for i in $(seq 1 36); do
            body=$(gh api repos/jamesmethvin74/game-nearby/issues/366/comments --paginate --jq '[.[] | select(.user.login=="cloudflare-workers-and-pages[bot]")] | last | .body // ""')
            if printf '%s' "$body" | grep -q "Deployment successful" && printf '%s' "$body" | grep -q "$short"; then
              echo "DEPLOYED=$short"
              exit 0
            fi
            sleep 5
          done
          echo "deployment not confirmed"
          exit 1

      - name: Verify public app surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          get(){ curl --max-time 90 -fsS "$1"; }
          get "$BASE/api/v1/team-statuses?school_ids=conway,df-7x4sxh,df-7ds5mt,df-rpnt3m" > /tmp/status.json
          get "$BASE/api/v1/schools/conway/schedule" > /tmp/conway.json
          get "$BASE/api/v1/schools/df-7x4sxh/schedule" > /tmp/pea.json
          get "$BASE/api/v1/schools/df-7ds5mt/schedule" > /tmp/brookland.json
          get "$BASE/api/v1/schools/df-rpnt3m/schedule" > /tmp/batesville.json
          get "$BASE/api/v1/teams/conway-football-2026/record" > /tmp/cf.json
          get "$BASE/api/v1/teams/conway-volleyball-2026/record" > /tmp/cv.json
          get "$BASE/api/v1/teams/df-7x4sxh-football-2026/record" > /tmp/pf.json
          get "$BASE/api/v1/standings?sport=volleyball&conference=7a-central" > /tmp/standings.json
          get "$BASE/api/v1/games?lat=35.0887&lon=-92.4421&radius=35&since=2026-09-15T00%3A00%3A00.000Z&until=2026-10-15T23%3A59%3A59.000Z" > /tmp/nearby.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const statuses=read('/tmp/status.json').team_statuses||[];
          const conway=read('/tmp/conway.json').games||[];
          const pea=read('/tmp/pea.json').games||[];
          const brookland=read('/tmp/brookland.json').games||[];
          const batesville=read('/tmp/batesville.json').games||[];
          const cf=read('/tmp/cf.json').record||{};
          const cv=read('/tmp/cv.json').record||{};
          const pf=read('/tmp/pf.json').record||{};
          const standings=read('/tmp/standings.json');
          const rows=standings.standings||[];
          const nearby=read('/tmp/nearby.json').games||[];
          const assert=(v,m)=>{if(!v) throw new Error(m);};

          const cfs=statuses.find(x=>x.team_id==='conway-football-2026');
          const cvs=statuses.find(x=>x.team_id==='conway-volleyball-2026');
          const pfs=statuses.find(x=>x.team_id==='df-7x4sxh-football-2026');
          assert(cfs&&cvs&&pfs,'known team status missing');
          assert(cf.display_overall_record===cfs.display_overall_record,'Conway football record mismatch');
          assert(cv.display_overall_record===cvs.display_overall_record,'Conway volleyball record mismatch');
          assert(pf.display_overall_record===pfs.display_overall_record,'Pea Ridge football record mismatch');

          const cvr=rows.find(x=>x.team_id==='conway-volleyball-2026');
          assert(cvr,'Conway volleyball standing missing');
          assert(cvr.display_overall_record===cvs.display_overall_record,'Conway volleyball standings overall mismatch');
          assert(cvr.display_conference_record===cvs.display_conference_record,'Conway volleyball conference mismatch');
          assert(Number(cvr.display_rank)===Number(cvs.display_rank),'Conway volleyball rank mismatch');

          const capital=conway.find(g=>g.sport==='football'&&/Capital High School/i.test(String(g.opponent||'')));
          assert(capital?.status==='FINAL'&&Number(capital.team_score)===45&&Number(capital.opponent_score)===7,'Conway-Capital final missing');

          const brooklandVsBatesville=brookland.find(g=>g.sport==='volleyball'&&/Batesville/i.test(String(g.opponent||''))&&String(g.scheduled_at||'').startsWith('2026-08-29'));
          const batesvilleVsBrookland=batesville.find(g=>g.sport==='volleyball'&&/Brookland/i.test(String(g.opponent||''))&&String(g.scheduled_at||'').startsWith('2026-08-29'));
          assert(brooklandVsBatesville,'Brookland-Batesville game missing from Brookland schedule');
          assert(batesvilleVsBrookland,'Brookland-Batesville game missing from Batesville schedule');
          for(const g of [brooklandVsBatesville,batesvilleVsBrookland]){
            assert(!(g.status==='FINAL'&&Number(g.team_score)===1&&Number(g.opponent_score)===1),'quarantined 1-1 displayed as FINAL');
          }

          const schoolIds=[...new Set(nearby.map(g=>g.school_id).filter(Boolean))];
          let checked=0;
          for(let i=0;i<schoolIds.length;i+=100){
            const ids=schoolIds.slice(i,i+100).join(',');
            const r=await fetch('https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/team-statuses?school_ids='+encodeURIComponent(ids));
            assert(r.ok,'nearby status request failed');
            const p=await r.json();
            const sts=p.team_statuses||[];
            for(const g of nearby){
              const st=sts.find(x=>x.team_id===g.team_id);
              if(!st) continue;
              assert(Number(g.wins||0)===Number(st.wins||0)&&Number(g.losses||0)===Number(st.losses||0)&&Number(g.ties||0)===Number(st.ties||0),'nearby record mismatch '+g.team_id);
              assert(Number(g.rank||0)===Number(st.rank||0),'nearby rank mismatch '+g.team_id);
              checked++;
            }
          }
          assert(checked>0,'no nearby cards verified');

          console.log('FINAL_APP_PROOF='+JSON.stringify({
            conway_football:{record:cfs.display_overall_record,capital:[capital.status,capital.team_score,capital.opponent_score]},
            conway_volleyball:{overall:cvs.display_overall_record,conference:cvs.display_conference_record,rank:cvs.display_rank,standing:[cvr.display_overall_record,cvr.display_conference_record,cvr.display_rank]},
            pea_ridge:{record:pfs.display_overall_record},
            brookland_batesville:{
              brookland:[brooklandVsBatesville.status,brooklandVsBatesville.team_score,brooklandVsBatesville.opponent_score],
              batesville:[batesvilleVsBrookland.status,batesvilleVsBrookland.team_score,batesvilleVsBrookland.opponent_score]
            },
            nearby_cards_checked:checked,
            standings_conference:standings.conference
          }));
          NODE
