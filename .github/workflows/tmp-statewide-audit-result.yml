name: Temporary statewide audit result transport

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - ".github/workflows/tmp-statewide-audit-result.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Read statewide audit result
        shell: bash
        run: |
          set -euo pipefail
          echo "observed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS --max-time 60 "https://statewide-integrity-audit-result-localbleachersar-sports-api.james-methvin74.workers.dev/api/statewide-integrity-audit-result"
          echo
