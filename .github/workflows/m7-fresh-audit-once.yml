name: One-shot M7 fresh volleyball audit

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-fresh-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read corrected zero-write production audit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-audit-7e49c2a1bd6f4083'
          code=$(curl -sS --max-time 300 -o audit.json -w '%{http_code}' "$URL")
          echo "M7_FRESH_AUDIT_HTTP=$code"
          test "$code" = "200" || { cat audit.json; exit 1; }
          node <<'NODE'
          const a=require('./audit.json');
          const deficiencies=Object.fromEntries(Object.entries(a.exceptions_by_deficiency||{}).map(([k,v])=>[k,Number(v.count||0)]));
          const gap=a.final_gap_plan||{};
          const out={summary:a.summary,d1:a.d1,authority_fetch:a.authority_fetch,final_gap_plan:{unique_actionable_contests:gap.unique_actionable_contests,by_type:gap.by_type,unresolved_identity_finals:gap.unresolved_identity_finals,date_cohorts:gap.date_cohorts},deficiencies,membership_unmatched:a.audit_corrections?.membership_unmatched?.length||0,membership_ambiguous:a.audit_corrections?.membership_ambiguous?.length||0};
          console.log('M7_FRESH_AUDIT='+JSON.stringify(out));
          if(Number(a.d1?.rows_written||0)!==0) throw new Error('fresh audit wrote to D1');
          NODE
