name: MaxPreps volleyball score shape

on:
  pull_request:
    paths:
      - ".github/workflows/maxpreps-volleyball-score-shape.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect bounded score HTML
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const cases=[
            {date:'8/27/2026',pairs:[['Flippin','Bergman']]},
            {date:'8/29/2026',pairs:[['Flippin','Cotter']]},
            {date:'9/3/2026',pairs:[['Conway','Southwest'],['Flippin','Melbourne']]}
          ];
          for (const c of cases) {
            const url=`https://www.maxpreps.com/ar/volleyball/scores/?date=${encodeURIComponent(c.date)}`;
            const r=await fetch(url,{headers:{'user-agent':'LocalBleachersAR-diagnostic/1.0','accept':'text/html,application/xhtml+xml'}});
            const html=await r.text();
            console.log(`DATE=${c.date} STATUS=${r.status} LEN=${html.length} FINAL=${r.url}`);
            const cards=[...html.matchAll(/<li\b[^>]*class=["']c["'][^>]*data-teams=["']([^"']+)["'][^>]*data-contest-id=["']([^"']+)["'][^>]*>[\s\S]*?(?=<li\b[^>]*class=["']c["']|<\/ul>\s*<\/section>|$)/gi)].map(m=>({teams:m[1],contestId:m[2],html:m[0]}));
            for(const pair of c.pairs){
              const found=cards.filter(card=>pair.every(name=>card.html.toLowerCase().includes(name.toLowerCase())));
              console.log(`PAIR=${pair.join(' vs ')} FOUND=${found.length}`);
              for(const card of found.slice(0,3)) console.log(`CARD teams=${card.teams} contest=${card.contestId} html=${card.html.slice(0,1800).replace(/\s+/g,' ')}`);
            }
          }
          NODE
