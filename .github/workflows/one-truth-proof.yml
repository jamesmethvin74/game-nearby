name: ONE_TRUTH_TB statewide source proof
# final rerun after complete-final canonical authority correction

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/one-truth-proof.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ONE_TRUTH source-integrity tests
        working-directory: backend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/current-schedule-truth.js
          node --check src/schedule-response-normalizer.js
          node --check src/one-truth.js
          node --check src/one-truth-worker.js
          node --check src/one-truth-source-integrity-audit.js
          node --check src/statewide-data-integrity-audit.js
          node --test \
            test/one-truth-contract.test.js \
            test/result-only-source-truth.test.js \
            test/one-truth-source-integrity-audit.test.js \
            test/statewide-data-integrity-audit.test.js \
            test/final-result-truth.test.js \
            test/schedule-response-normalizer.test.js \
            test/record-rebuild.test.js \
            test/m10-conference-standings-truth.test.js \
            test/m15-presentation-truth.test.js \
            test/unified-team-status.test.js

      - name: Wait for production and rebuild ONE_TRUTH_TB statewide
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          PATHNAME="/api/v1/internal/one-truth-bootstrap-20260919-7c4b1d9e3"

          ready=0
          for attempt in $(seq 1 48); do
            code=$(curl --max-time 25 -sS -o /tmp/bootstrap.json -w "%{http_code}" -X POST "$BASE$PATHNAME?after=" || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" = "500" ]; then
              echo "ONE_TRUTH_TB bootstrap returned HTTP 500"
              cat /tmp/bootstrap.json || true
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "ONE_TRUTH_TB bootstrap endpoint did not become ready"
            cat /tmp/bootstrap.json || true
            exit 1
          fi

          after=""
          batches=0
          teams=0
          while true; do
            code=$(curl --max-time 30 -sS -o /tmp/bootstrap.json -w "%{http_code}" -X POST "$BASE$PATHNAME?after=$after")
            test "$code" = "200"
            line=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/bootstrap.json','utf8'));
          if(p.status!=='SUCCESS') process.exit(1);
          console.log([p.done?'1':'0',p.next_after||'',Number(p.teams||0)].join('|'));
          NODE
            )
            IFS='|' read -r done next count <<< "$line"
            batches=$((batches+1))
            teams=$((teams+count))
            if [ "$done" = "1" ]; then break; fi
            after="$next"
            if [ "$batches" -gt 60 ]; then echo "bootstrap fuse exceeded"; exit 1; fi
          done
          echo "{\"batches\":$batches,\"teams\":$teams}" > /tmp/bootstrap-summary.json
          cat /tmp/bootstrap-summary.json

      - name: Run real statewide source-vs-ONE_TRUTH audit
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          code=$(curl --max-time 90 -sS -o /tmp/audit.json -w "%{http_code}" \
            "$BASE/api/v1/internal/one-truth-audit-20260919-7c4b1d9e3")
          test "$code" = "200"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          console.log('AUDIT_STATUS='+a.status);
          console.log('AUDIT_PROBLEMS='+JSON.stringify(a.problems||{}));
          console.log('STATEWIDE_SUMMARY='+JSON.stringify(a.statewide_audit?.summary||{}));
          console.log('SOURCE_VS_TRUTH='+JSON.stringify(a.statewide_audit?.source_vs_truth?.summary||{}));
          NODE

      - name: Prove Conway football, Conway volleyball, and Pea Ridge live surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --max-time 30 -fsS "$BASE/api/v1/team-statuses?school_ids=conway,df-7x4sxh&proof=status" > /tmp/status.json
          curl --max-time 30 -fsS "$BASE/api/v1/schools/conway/schedule?proof=conway" > /tmp/conway.json
          curl --max-time 30 -fsS "$BASE/api/v1/standings?sport=volleyball&conference=6a-central&proof=conway-standings" > /tmp/conway-standings.json
          curl --max-time 30 -fsS "$BASE/api/v1/schools/df-7x4sxh/schedule?proof=pea" > /tmp/pea.json
          curl --max-time 30 -fsS "$BASE/api/v1/standings?sport=football&conference=5a-west&proof=pea-standings" > /tmp/pea-standings.json
          curl --max-time 30 -fsS "$BASE/api/v1/games?lat=35.0887&lon=-92.4421&radius=25&since=2026-09-19T00:00:00.000Z&until=2026-10-05T00:00:00.000Z&proof=nearby" > /tmp/games.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const statuses=read('/tmp/status.json').team_statuses||[];
          const conway=read('/tmp/conway.json');
          const conwayStandings=read('/tmp/conway-standings.json');
          const pea=read('/tmp/pea.json');
          const peaStandings=read('/tmp/pea-standings.json');
          const nearby=read('/tmp/games.json').games||[];

          const recordFromGames=(games,sport,gender)=>{
            let w=0,l=0,t=0,cw=0,cl=0,ct=0,finals=0;
            for(const g of games.filter(x=>x.sport===sport&&x.gender===gender)){
              if(String(g.status||'').toUpperCase()!=='FINAL'||g.team_score==null||g.opponent_score==null||Number(g.counts_for_record)===0) continue;
              finals++;
              const a=Number(g.team_score),b=Number(g.opponent_score);
              const r=a>b?'W':a<b?'L':'T';
              if(r==='W')w++; else if(r==='L')l++; else t++;
              if(Number(g.conference_game||0)===1){
                if(r==='W')cw++; else if(r==='L')cl++; else ct++;
              }
            }
            return {overall:t?`${w}-${l}-${t}`:`${w}-${l}`,conference:ct?`${cw}-${cl}-${ct}`:`${cw}-${cl}`,finals};
          };

          const findStatus=(school,sport,gender)=>statuses.find(s=>s.school_id===school&&s.sport===sport&&s.gender===gender);
          const cv=findStatus('conway','volleyball','girls');
          const cf=findStatus('conway','football','boys');
          const pf=findStatus('df-7x4sxh','football','boys');
          if(!cv||!cf||!pf) throw new Error('Required ONE_TRUTH_TB statuses missing');

          const conwayFootball=recordFromGames(conway.games||[],'football','boys');
          const conwayVolleyball=recordFromGames(conway.games||[],'volleyball','girls');
          const peaFootball=recordFromGames(pea.games||[],'football','boys');
          const capital=(conway.games||[]).find(g=>
            g.sport==='football'&&g.gender==='boys'
            && /Capital High School/i.test(String(g.opponent||''))
            && String(g.status||'').toUpperCase()==='FINAL'
          );
          const cvStanding=(conwayStandings.standings||[]).find(r=>r.school_id==='conway'||/Conway/i.test(String(r.school_name||'')));
          const pfStanding=(peaStandings.standings||[]).find(r=>r.school_id==='df-7x4sxh'||/Pea Ridge/i.test(String(r.school_name||'')));
          const cvNearby=nearby.find(g=>g.school_id==='conway'&&g.sport==='volleyball'&&g.gender==='girls');
          const peaResultOnly=(pea.games||[]).filter(g=>String(g.source_id||'').toLowerCase().endsWith('-official-school-results'));

          const proof={
            conway_football:{
              schedule:conwayFootball,
              status:{overall:cf.display_overall_record,conference:cf.display_conference_record,rank:cf.display_rank},
              capital:capital&&{
                date:capital.scheduled_at,opponent:capital.opponent,result:capital.result,
                team_score:capital.team_score,opponent_score:capital.opponent_score,
                game_id:capital.id,canonical_event_id:capital.canonical_event_id,
                source_id:capital.source_id,source_type:capital.source_type,parser_type:capital.parser_type
              }
            },
            conway_volleyball:{
              schedule:conwayVolleyball,
              status:{overall:cv.display_overall_record,conference:cv.display_conference_record,rank:cv.display_rank},
              standings:cvStanding&&{overall:cvStanding.display_overall_record,conference:cvStanding.display_conference_record,rank:cvStanding.display_rank},
              nearby:cvNearby&&{overall:`${cvNearby.wins}-${cvNearby.losses}`,conference:`${cvNearby.conference_wins}-${cvNearby.conference_losses}`,rank:cvNearby.rank},
              finals:(conway.games||[]).filter(g=>g.sport==='volleyball'&&g.gender==='girls'&&String(g.status||'').toUpperCase()==='FINAL')
                .map(g=>({date:g.scheduled_at,opponent:g.opponent,result:g.result,team_score:g.team_score,opponent_score:g.opponent_score,conference_game:g.conference_game,source_id:g.source_id,canonical_event_id:g.canonical_event_id}))
            },
            pea_ridge_football:{
              schedule:peaFootball,
              status:{overall:pf.display_overall_record,conference:pf.display_conference_record,rank:pf.display_rank},
              standings:pfStanding&&{overall:pfStanding.display_overall_record,conference:pfStanding.display_conference_record,rank:pfStanding.display_rank},
              result_only_standalone_rows:peaResultOnly.length,
              games:(pea.games||[]).length
            }
          };
          fs.writeFileSync('/tmp/proof.json',JSON.stringify(proof,null,2));
          console.log('LIVE_PROOF='+JSON.stringify(proof));

          if(conwayFootball.finals!==3||conwayFootball.overall!=='2-1'||cf.display_overall_record!=='2-1') {
            throw new Error('Conway football is not exactly 3 completed games / 2-1');
          }
          if(!capital||capital.result!=='W'||Number(capital.team_score)!==45||Number(capital.opponent_score)!==7) {
            throw new Error('Conway Capital 45-7 final missing from ONE_TRUTH');
          }
          if(cv.display_overall_record!==conwayVolleyball.overall) throw new Error('Conway volleyball status != schedule');
          if(cv.display_conference_record!==conwayVolleyball.conference) throw new Error('Conway volleyball conference status != schedule');
          if(cv.display_conference_record!=='4-0'||cv.display_rank!==1) throw new Error('Conway volleyball conference truth is not 4-0 / #1');
          if(!cvStanding||cvStanding.display_overall_record!==cv.display_overall_record||cvStanding.display_conference_record!==cv.display_conference_record||cvStanding.display_rank!==cv.display_rank) {
            throw new Error('Conway volleyball standings != status');
          }
          if(cvNearby&&(`${cvNearby.wins}-${cvNearby.losses}`!==cv.display_overall_record||cvNearby.rank!==cv.display_rank)) {
            throw new Error('Conway volleyball nearby != status');
          }
          if(peaFootball.overall!=='1-2'||pf.display_overall_record!=='1-2'||pf.display_conference_record!=='0-0') {
            throw new Error('Pea Ridge football is not 1-2 / 0-0');
          }
          if(!pfStanding||pfStanding.display_overall_record!==pf.display_overall_record||pfStanding.display_conference_record!==pf.display_conference_record||pfStanding.display_rank!==pf.display_rank) {
            throw new Error('Pea Ridge standings != status');
          }
          if(peaResultOnly.length) throw new Error('Result-only source manufactured a Pea Ridge schedule row');
          NODE

      - name: Publish bounded audit evidence to deployment anchor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const safeRead=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'));}catch{return null;}};
          const audit=safeRead('/tmp/audit.json');
          const proof=safeRead('/tmp/proof.json');
          const bootstrap=safeRead('/tmp/bootstrap-summary.json');
          const payload={
            marker:'ONE_TRUTH_STATEWIDE_SOURCE_AUDIT_20260919',
            workflow_commit:process.env.GITHUB_SHA,
            bootstrap,
            audit_status:audit?.status||null,
            audit_problems:audit?.problems||null,
            statewide_summary:audit?.statewide_audit?.summary||null,
            source_vs_truth:audit?.statewide_audit?.source_vs_truth||null,
            live_proof:proof
          };
          const text='### ONE_TRUTH statewide source audit\n\n```json\n'+JSON.stringify(payload,null,2)+'\n```';
          const max=54000;
          const parts=[];
          for(let i=0;i<text.length;i+=max) parts.push(text.slice(i,i+max));
          fs.mkdirSync('/tmp/audit-comments',{recursive:true});
          parts.forEach((part,i)=>fs.writeFileSync(`/tmp/audit-comments/part-${String(i+1).padStart(2,'0')}.md`,
            `ONE_TRUTH_STATEWIDE_SOURCE_AUDIT_20260919 part ${i+1}/${parts.length}\n\n${part}`));
          NODE
          for file in /tmp/audit-comments/*.md; do
            gh pr comment 366 --repo jamesmethvin74/game-nearby --body-file "$file"
          done
