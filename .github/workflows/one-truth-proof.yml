name: ONE_TRUTH_TB proof
# rerun after source-role audit correction
# rerun after result-role regression test correction
# source-role correction: full schedule parsers are not result-only
# deploy-gated bootstrap v3

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/one-truth-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run truth-contract tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          node --check src/one-truth.js
          node --check src/one-truth-worker.js
          node --test \
            test/one-truth-contract.test.js \
            test/result-only-source-truth.test.js \
            test/record-rebuild.test.js \
            test/m10-conference-standings-truth.test.js \
            test/m15-presentation-truth.test.js \
            test/unified-team-status.test.js

      - name: Wait for production and bootstrap ONE_TRUTH_TB in bounded batches
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          PATHNAME="/api/v1/internal/one-truth-bootstrap-20260919-7c4b1d9e3"

          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl --max-time 25 -sS -o /tmp/bootstrap.json -w "%{http_code}" -X POST "$BASE$PATHNAME?after=" || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" = "500" ]; then
              echo "ONE_TRUTH_TB bootstrap returned HTTP 500"
              cat /tmp/bootstrap.json || true
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "ONE_TRUTH_TB bootstrap endpoint did not become ready"
            cat /tmp/bootstrap.json || true
            exit 1
          fi

          after=""
          batches=0
          teams=0
          while true; do
            code=$(curl --max-time 25 -sS -o /tmp/bootstrap.json -w "%{http_code}" -X POST "$BASE$PATHNAME?after=$after")
            test "$code" = "200"
            line=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/bootstrap.json','utf8'));
          if(p.status!=='SUCCESS') process.exit(1);
          console.log([p.done?'1':'0',p.next_after||'',Number(p.teams||0)].join('|'));
          NODE
            )
            IFS='|' read -r done next count <<< "$line"
            batches=$((batches+1))
            teams=$((teams+count))
            if [ "$done" = "1" ]; then break; fi
            after="$next"
            if [ "$batches" -gt 60 ]; then echo "bootstrap fuse exceeded"; exit 1; fi
          done
          echo "ONE_TRUTH_BOOTSTRAP={\"batches\":$batches,\"teams\":$teams}"

          code=$(curl --max-time 25 -sS -o /tmp/audit.json -w "%{http_code}" \
            "$BASE/api/v1/internal/one-truth-audit-20260919-7c4b1d9e3")
          cat /tmp/audit.json
          echo
          test "$code" = "200"

      - name: Prove Conway and Pea Ridge share one truth across every surface
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --max-time 25 -fsS "$BASE/api/v1/team-statuses?school_ids=conway,df-7x4sxh,df-bkc4ux,df-hrdb8f,df-kq5hlr,df-t2mq54&proof=status" > /tmp/status.json
          curl --max-time 25 -fsS "$BASE/api/v1/schools/conway/schedule?proof=conway" > /tmp/conway.json
          curl --max-time 25 -fsS "$BASE/api/v1/standings?sport=volleyball&conference=6a-central&proof=conway-standings" > /tmp/conway-standings.json
          curl --max-time 25 -fsS "$BASE/api/v1/schools/df-7x4sxh/schedule?proof=pea" > /tmp/pea.json
          curl --max-time 25 -fsS "$BASE/api/v1/standings?sport=football&conference=5a-west&proof=pea-standings" > /tmp/pea-standings.json
          curl --max-time 25 -fsS "$BASE/api/v1/games?lat=35.0887&lon=-92.4421&radius=25&since=2026-09-19T00:00:00.000Z&until=2026-10-05T00:00:00.000Z&proof=nearby" > /tmp/games.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const statuses=read('/tmp/status.json').team_statuses||[];
          const conway=read('/tmp/conway.json');
          const conwayStandings=read('/tmp/conway-standings.json');
          const pea=read('/tmp/pea.json');
          const peaStandings=read('/tmp/pea-standings.json');
          const nearby=read('/tmp/games.json').games||[];

          const recordFromGames=(games,sport,gender)=>{
            let w=0,l=0,t=0,cw=0,cl=0,ct=0;
            for(const g of games.filter(x=>x.sport===sport&&x.gender===gender)){
              if(String(g.status||'').toUpperCase()!=='FINAL'||g.team_score==null||g.opponent_score==null||Number(g.counts_for_record)===0) continue;
              const a=Number(g.team_score),b=Number(g.opponent_score);
              const r=a>b?'W':a<b?'L':'T';
              if(r==='W')w++; else if(r==='L')l++; else t++;
              if(Number(g.conference_game||0)===1){
                if(r==='W')cw++; else if(r==='L')cl++; else ct++;
              }
            }
            return {
              overall:t?`${w}-${l}-${t}`:`${w}-${l}`,
              conference:ct?`${cw}-${cl}-${ct}`:`${cw}-${cl}`
            };
          };

          const findStatus=(school,sport,gender)=>statuses.find(s=>s.school_id===school&&s.sport===sport&&s.gender===gender);
          const cs=findStatus('conway','volleyball','girls');
          const ps=findStatus('df-7x4sxh','football','boys');
          console.log('CONFERENCE_STATUS_DIAG='+JSON.stringify(statuses
            .filter(x=>x.sport==='volleyball'&&x.gender==='girls')
            .map(x=>({school_id:x.school_id,conference_id:x.conference_id,conference_name:x.conference_name,
              membership:x.conference_membership_state,record:x.display_conference_record,rank:x.display_rank}))));
          if(!cs||!ps) throw new Error('Required ONE_TRUTH_TB statuses missing');

          const conwayRecord=recordFromGames(conway.games||[],'volleyball','girls');
          const peaRecord=recordFromGames(pea.games||[],'football','boys');
          const conwayFootball=recordFromGames(conway.games||[],'football','boys');
          const capital=(conway.games||[]).find(g=>
            g.sport==='football'&&g.gender==='boys'
            && /Capital High School/i.test(String(g.opponent||''))
            && String(g.status||'').toUpperCase()==='FINAL'
          );
          console.log('CONWAY_FB_SOURCE_ROLE_PROOF='+JSON.stringify({
            record:conwayFootball,
            capital:capital&&{
              date:capital.scheduled_at,opponent:capital.opponent,result:capital.result,
              team_score:capital.team_score,opponent_score:capital.opponent_score,
              source_id:capital.source_id,parser_type:capital.parser_type
            }
          }));
          if(conwayFootball.overall!=='2-1') throw new Error(`Conway football ONE_TRUTH is not 2-1: ${JSON.stringify(conwayFootball)}`);
          if(!capital||capital.result!=='W'||Number(capital.team_score)!==45||Number(capital.opponent_score)!==7) {
            throw new Error(`Conway Capital final missing from ONE_TRUTH: ${JSON.stringify(capital)}`);
          }
          console.log('CONWAY_VB_FINALS='+JSON.stringify((conway.games||[])
            .filter(g=>g.sport==='volleyball'&&g.gender==='girls'&&String(g.status||'').toUpperCase()==='FINAL')
            .map(g=>({date:g.scheduled_at,opponent:g.opponent,opponent_school_id:g.opponent_school_id,
              conference_game:g.conference_game,conference_id:g.conference_id,result:g.result,
              team_score:g.team_score,opponent_score:g.opponent_score}))));

          const cStanding=(conwayStandings.standings||[]).find(r=>r.school_id==='conway'||/Conway/i.test(String(r.school_name||'')));
          const pStanding=(peaStandings.standings||[]).find(r=>r.school_id==='df-7x4sxh'||/Pea Ridge/i.test(String(r.school_name||'')));
          const cNearby=nearby.find(g=>g.school_id==='conway'&&g.sport==='volleyball'&&g.gender==='girls');
          const resultOnly=(pea.games||[]).filter(g=>['mascot-media','rankone-public'].includes(String(g.parser_type||'').toLowerCase()));

          const proof={
            conway:{
              schedule:conwayRecord,
              status:{overall:cs.display_overall_record,conference:cs.display_conference_record,rank:cs.display_rank},
              standings:cStanding&&{overall:cStanding.display_overall_record,conference:cStanding.display_conference_record,rank:cStanding.display_rank},
              nearby:cNearby&&{overall:`${cNearby.wins}-${cNearby.losses}`,conference:`${cNearby.conference_wins}-${cNearby.conference_losses}`,rank:cNearby.rank}
            },
            pea:{
              schedule:peaRecord,
              status:{overall:ps.display_overall_record,conference:ps.display_conference_record,rank:ps.display_rank},
              standings:pStanding&&{overall:pStanding.display_overall_record,conference:pStanding.display_conference_record,rank:pStanding.display_rank},
              resultOnlyVisible:resultOnly.length,
              games:(pea.games||[]).length
            }
          };
          console.log('ONE_TRUTH_PROOF='+JSON.stringify(proof));

          if(cs.display_overall_record!==conwayRecord.overall) throw new Error('Conway status != schedule');
          if(cs.display_conference_record!==conwayRecord.conference) throw new Error('Conway conference status != schedule');
          if(cs.display_conference_record!=='4-0') throw new Error('Conway canonical conference record is not 4-0');
          if(cs.display_rank!==1) throw new Error('Conway canonical rank is not #1');
          if(!cStanding||cStanding.display_overall_record!==cs.display_overall_record||cStanding.display_conference_record!==cs.display_conference_record||cStanding.display_rank!==cs.display_rank) throw new Error('Conway standings != status');
          if(cNearby && (`${cNearby.wins}-${cNearby.losses}`!==cs.display_overall_record || cNearby.rank!==cs.display_rank)) throw new Error('Conway nearby != status');

          if(ps.display_overall_record!==peaRecord.overall) throw new Error('Pea Ridge status != schedule');
          if(ps.display_conference_record!==peaRecord.conference) throw new Error('Pea Ridge conference status != schedule');
          if(!pStanding||pStanding.display_overall_record!==ps.display_overall_record||pStanding.display_conference_record!==ps.display_conference_record||pStanding.display_rank!==ps.display_rank) throw new Error('Pea Ridge standings != status');
          if(resultOnly.length) throw new Error('Result-only observations remain visible in Pea Ridge schedule');
          NODE
