name: Source reconciliation production once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/source-reconcile-production-once.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test reconciliation changes
        working-directory: backend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/schedule-authority-core.js
          node --check src/canonical-observation-writer.js
          node --check src/dragonfly-statewide.js
          node --check src/dragonfly-certified-statewide.js
          node --check src/statewide-data-integrity-repair.js
          node --check src/m8-final-audit-worker.js
          node --test \
            test/schedule-authority-v2.test.js \
            test/dragonfly-certified-statewide.test.js \
            test/dragonfly-statewide.test.js \
            test/statewide-data-integrity-repair.test.js \
            test/one-truth-contract.test.js

      - name: Wait for this commit in Cloudflare production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          for attempt in $(seq 1 48); do
            body=$(gh api repos/jamesmethvin74/game-nearby/issues/366/comments --paginate \
              --jq '[.[] | select(.user.login=="cloudflare-workers-and-pages[bot]")] | last | .body // ""')
            if printf '%s' "$body" | grep -q "Deployment successful" && printf '%s' "$body" | grep -q "$SHORT_SHA"; then
              echo "Cloudflare deployed $SHORT_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare deployment confirmation timed out"
          exit 1

      - name: Execute bounded source reconciliation
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          http=$(curl --retry 2 --retry-all-errors --retry-delay 2 --max-time 420 -sS \
            -o /tmp/repair.json -w '%{http_code}' \
            -X POST \
            -H "x-refresh-token: $REFRESH_TOKEN" \
            "$BASE/api/v1/internal/source-reconcile-20260920-6e8d4b2a")
          echo "HTTP=$http"
          if [ "$http" != "200" ]; then
            cat /tmp/repair.json
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/repair.json','utf8'));
          if(p.status!=='EXECUTED') throw new Error('repair did not execute');
          const compact={
            status:p.status,
            before:{
              active_teams:p.before_summary?.total_active_teams_examined,
              upstream_source_observation_issues:p.before_summary?.upstream_source_observation_issues,
              upstream_source_issues_by_code:p.before_summary?.upstream_source_issues_by_code,
              one_truth_surface_blocking_issues:p.before_summary?.one_truth_surface_blocking_issues,
              source_vs_truth_blocking_issues:p.before_summary?.source_vs_truth_blocking_issues
            },
            repair:{
              before_blocking:p.repair?.before_blocking,
              canonical:p.repair?.canonical,
              score_repair:p.repair?.score_repair,
              suppression:{
                rows_written:p.repair?.suppression?.rows_written,
                game_count:(p.repair?.suppression?.game_ids||[]).length
              },
              affected_team_count:(p.repair?.affected_team_ids||[]).length,
              record_rebuild:p.repair?.record_rebuild,
              d1:p.repair?.d1
            },
            one_truth_rebuild:p.one_truth_rebuild,
            after:{
              active_teams:p.after_summary?.total_active_teams_examined,
              upstream_source_observation_issues:p.after_summary?.upstream_source_observation_issues,
              upstream_source_issues_by_code:p.after_summary?.upstream_source_issues_by_code,
              one_truth_surface_blocking_issues:p.after_summary?.one_truth_surface_blocking_issues,
              source_vs_truth_blocking_issues:p.after_summary?.source_vs_truth_blocking_issues,
              presentation_issues_by_code:p.after_summary?.issues_by_code
            },
            remaining_issue_sample:(p.remaining_issues||[]).slice(0,40)
          };
          if(Number(compact.one_truth_rebuild?.teams)!==1227) throw new Error('ONE_TRUTH rebuild team count is not 1227');
          console.log('SOURCE_REPAIR_RESULT='+JSON.stringify(compact));
          NODE
