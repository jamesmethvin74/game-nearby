name: Direct Cloudflare Build Log One-Shot

on:
  push:
    paths:
      - ".github/workflows/direct-build-log-transport.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch failed Cloudflare build log directly
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachers-ops.methvindigitalworks.com/v1/build-log?build_id=e134b0e0-bc4c-453c-8075-400d8c39ae19"
          HTTP="$(curl -sS --max-time 120 -o result.json -w '%{http_code}' "$URL")"
          echo "OPS_BRIDGE_HTTP=$HTTP"
          cat result.json
          test "$HTTP" = "200"
