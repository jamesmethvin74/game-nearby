name: M15 final cleanup verify
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-final-cleanup-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify Worker healthy and proof route removed
        shell: bash
        run: |
          set -euo pipefail
          base='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          for attempt in $(seq 1 120); do
            health="$(curl -sS -o /tmp/sources.json -w '%{http_code}' "$base/api/v1/sources" || true)"
            proof="$(curl -sS -o /tmp/proof.json -w '%{http_code}' "$base/api/v1/internal/m15-integrity-gate-proof-20260918-7fd31c84" || true)"
            echo "M15_FINAL_CLEANUP attempt=$attempt health=$health proof=$proof"
            if [[ "$health" = "200" && "$proof" = "404" ]]; then
              echo "M15_FINAL_CLEANUP_VERIFIED=1"
              exit 0
            fi
            sleep 5
          done
          echo "final cleanup verification did not converge" >&2
          exit 1
