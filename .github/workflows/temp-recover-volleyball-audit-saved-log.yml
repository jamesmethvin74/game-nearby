name: Temporary recover saved volleyball audit output
on:
  push:
    branches: [temp/recover-volleyball-audit-saved-log]
permissions:
  actions: read
  issues: write
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover saved successful audit output only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/actions/jobs/101894329625/logs" -o recovered-audit.log
          python <<'PY'
          import io,json,os,urllib.request,zipfile
          raw=open('recovered-audit.log','rb').read()
          if raw[:2]==b'PK':
              z=zipfile.ZipFile(io.BytesIO(raw)); text='\n'.join(z.read(n).decode('utf-8','replace') for n in z.namelist())
          else: text=raw.decode('utf-8','replace')
          def marker(name):
              token=name+'='
              for line in reversed(text.splitlines()):
                  pos=line.find(token)
                  if pos<0: continue
                  value=line[pos+len(token):].strip()
                  if not value.startswith('{'): continue
                  try: json.loads(value)
                  except json.JSONDecodeError: continue
                  return value
          raw_json=marker('VOLLEYBALL_AUDIT_JSON') or marker('VOLLEYBALL_AUDIT_HTTP_BODY')
          if not raw_json: raise SystemExit('No emitted JSON marker found in saved successful job')
          p=json.loads(raw_json); groups=p.get('exceptions_by_deficiency',{})
          counts={k:int(v.get('count',0)) for k,v in groups.items()}
          target=groups.get('authority_final_unmatched_opponent',{}).get('exceptions',[])
          representatives={k:v.get('exceptions',[])[:3] for k,v in groups.items() if int(v.get('count',0))}
          report={'source_job':101894329625,'production_recalled':False,'d1':p.get('d1',{}),'summary':p.get('summary',{}),'authority_fetch':p.get('authority_fetch',{}),'deficiency_counts':counts,'authority_final_unmatched_opponent':target,'representatives':representatives}
          body='SAVED_AUDIT_RECOVERY_V2\n\n```json\n'+json.dumps(report,indent=2,sort_keys=True)+'\n```'
          if len(body)>64000:
              report.pop('representatives',None)
              body='SAVED_AUDIT_RECOVERY_V2\n\n```json\n'+json.dumps(report,indent=2,sort_keys=True)+'\n```'
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/403/comments",data=json.dumps({'body':body}).encode(),headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print('posted',r.status)
          PY
