name: M7 attachment gap diagnostic once

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/m7-attachment-gap-diagnostic-once.yml'
      - 'backend/src/m7-attachment-gap-diagnostic.js'
      - 'backend/src/logo-bootstrap-worker.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for diagnostic route and prove attachment gaps
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-attachment-gap-965f15d17e244eb6'
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 180 -o result.json -w '%{http_code}' "$URL" || true)
            echo "M7_ATTACHMENT_DIAGNOSTIC attempt=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              cat result.json || true
              exit 1
            fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const r=require('./result.json');
          console.log('M7_ATTACHMENT_GAPS='+JSON.stringify(r));
          if(Number(r.d1?.rows_written||0)!==0) throw new Error('Diagnostic wrote to D1');
          if(Number(r.d1?.rows_read||0)>50000) throw new Error(`Read fuse exceeded: ${r.d1?.rows_read}`);
          if(Number(r.missing_attachment_count||0)>20) throw new Error(`Gap fuse exceeded: ${r.missing_attachment_count}`);
          NODE
