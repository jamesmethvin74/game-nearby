name: One-shot M15 front-card live render proof

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-front-card-live-render-proof.yml

permissions:
  contents: read

concurrency:
  group: m15-front-card-live-render-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full watched-branch check
        working-directory: backend
        run: npm run check

      - name: Wait for deployed public CORS contract
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          ok=0
          for attempt in $(seq 1 15); do
            rm -f headers.txt status.json
            if curl -fsS -D headers.txt --max-time 25 "$API/api/v1/team-statuses?school_ids=conway" -o status.json; then
              if grep -qi 'access-control-allow-origin: \*' headers.txt \
                && grep -qi 'x-localbleachers-api-cors: outer-public-read-v1' headers.txt \
                && node -e 'const p=require("./status.json"); if(!(p.team_statuses||[]).some(s=>s.school_id==="conway")) process.exit(1)'; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "PUBLIC_TEAM_STATUS_CORS_OK"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove rendered production front card
        run: |
          node <<'JS'
          const { chromium } = require("playwright");
          const assert = require("node:assert/strict");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 691, height: 1536 },
              deviceScaleFactor: 1
            });

            await context.addInitScript(() => {
              localStorage.setItem("followedTeams", JSON.stringify(["conway"]));
              localStorage.removeItem("localBleachersAR:nearbyGames:v1");
              localStorage.removeItem("localBleachersAR:teamSchedule:v5:2026:conway");
            });

            const page = await context.newPage();
            const pageErrors = [];
            page.on("pageerror", err => {
              pageErrors.push(err.message);
              console.log("PAGEERROR", err.message);
            });
            page.on("console", msg => {
              if (msg.type() === "error") console.log("BROWSER_ERROR", msg.text());
            });

            let release = "";
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              await page.goto("https://jamesmethvin74.github.io/game-nearby/?renderProof=" + Date.now() + "-" + attempt, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await page.waitForTimeout(1200);
              release = await page.evaluate(() => window.LocalBleachersRuntime?.releaseGeneration || "");
              if (release === "m15-presentation-v73") break;
              await page.waitForTimeout(5000);
            }
            assert.equal(release, "m15-presentation-v73", "GitHub Pages never advanced to v73");

            const conway = page.locator(".event-card.priority").filter({ hasText: "Conway" }).first();
            await conway.waitFor({ state: "visible", timeout: 45000 });

            const scheduleCue = conway.locator(".card-schedule-link");
            await scheduleCue.waitFor({ state: "visible", timeout: 10000 });
            assert.match(await scheduleCue.innerText(), /View schedule & results/i);

            await page.waitForFunction(() => {
              const card = [...document.querySelectorAll(".event-card.priority")]
                .find(node => /Conway/i.test(node.innerText));
              if (!card) return false;
              const values = [...card.querySelectorAll(".team-status .status-value")]
                .map(node => node.textContent.trim());
              return values[0] === "9-4" && values[1] === "4-0" && /^#1\b/.test(values[2] || "");
            }, null, { timeout: 45000 });

            const frontStatus = await conway.locator(".team-status .status-value").allInnerTexts();
            assert.equal(frontStatus[0].trim(), "9-4");
            assert.equal(frontStatus[1].trim(), "4-0");
            assert.match(frontStatus[2].trim(), /^#1\b/);

            const pageText = await page.locator("body").innerText();
            assert.doesNotMatch(pageText, /MaxPreps schedule/i);
            assert.match(pageText, /View schedule & results/i);
            assert.equal(pageErrors.length, 0, "browser page errors: " + pageErrors.join(" | "));

            await conway.locator(".event-main.team-detail-trigger").click();
            const dialog = page.locator("dialog.team-detail-dialog[open]");
            await dialog.waitFor({ state: "visible", timeout: 15000 });
            await page.waitForFunction(
              () => document.querySelectorAll("dialog.team-detail-dialog[open] .team-detail-game").length > 0,
              null,
              { timeout: 30000 }
            );

            const detailStatus = await dialog.locator(".team-detail-stat strong").allInnerTexts();
            const games = await dialog.locator(".team-detail-game").count();
            assert.ok(games > 0, "schedule dialog has no games");
            assert.equal(detailStatus[0]?.trim(), "9-4");
            assert.equal(detailStatus[1]?.trim(), "4-0");
            assert.match(detailStatus[2]?.trim() || "", /^#1\b/);

            console.log("CONWAY_FRONT_STATUS", JSON.stringify(frontStatus));
            console.log("CONWAY_DETAIL_STATUS", JSON.stringify(detailStatus));
            console.log("CONWAY_DETAIL_GAME_COUNT", games);
            console.log("FRONT_CARD_RENDER_PROOF_OK");
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
