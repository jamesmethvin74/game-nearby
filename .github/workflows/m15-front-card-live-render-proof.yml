# v73 render proof retry
name: One-shot M15 front-card live render proof

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-front-card-live-render-proof.yml

permissions:
  contents: read

concurrency:
  group: m15-front-card-live-render-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full watched-branch check
        working-directory: backend
        run: npm run check
      - name: Prove public team-status CORS
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS -D headers.txt --max-time 25 "$API/api/v1/team-statuses?school_ids=conway" -o status.json
          grep -iq '^access-control-allow-origin: \*        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove rendered production front card
        run: |
          node <<'JS'
          const { chromium } = require("playwright");
          const assert = require("node:assert/strict");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 691, height: 1536 },
              deviceScaleFactor: 1
            });
            await context.addInitScript(() => {
              localStorage.setItem("followedTeams", JSON.stringify(["conway"]));
              localStorage.removeItem("localBleachersAR:nearbyGames:v1");
              localStorage.removeItem("localBleachersAR:teamSchedule:v4:2026:conway");
              localStorage.removeItem("localBleachersAR:teamSchedule:v5:2026:conway");
            });
            const page = await context.newPage();
            page.on("console", msg => console.log("BROWSER", msg.type(), msg.text()));
            page.on("pageerror", err => console.log("PAGEERROR", err.message));

            let release = "";
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              await page.goto(`https://jamesmethvin74.github.io/game-nearby/?renderProof=${Date.now()}-${attempt}`, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
              await page.waitForTimeout(1200);
              release = await page.evaluate(() => window.LocalBleachersRuntime?.releaseGeneration || "");
              console.log("release attempt", attempt, release);
              if (release === "m15-presentation-v73") break;
              await page.waitForTimeout(5000);
            }
            assert.equal(release, "m15-presentation-v73", "GitHub Pages never advanced to v72");

            const conway = page.locator(".event-card.priority").filter({ hasText: "Conway" }).first();
            await conway.waitFor({ state: "visible", timeout: 45000 });

            const scheduleCue = conway.locator(".card-schedule-link");
            await scheduleCue.waitFor({ state: "visible", timeout: 10000 });
            assert.match(await scheduleCue.innerText(), /View schedule & results/i);

            await page.waitForFunction(() => {
              const cards = [...document.querySelectorAll(".event-card.priority")];
              const card = cards.find(node => /Conway/i.test(node.innerText));
              if (!card) return false;
              const values = [...card.querySelectorAll(".team-status .status-value")].map(node => node.textContent.trim());
              return values[0] === "9-4" && values[1] === "4-0" && /^#1\b/.test(values[2] || "");
            }, null, { timeout: 45000 });

            const values = await conway.locator(".team-status .status-value").allInnerTexts();
            console.log("CONWAY_FRONT_STATUS", JSON.stringify(values));
            assert.equal(values[0].trim(), "9-4");
            assert.equal(values[1].trim(), "4-0");
            assert.match(values[2].trim(), /^#1\b/);

            const visiblePageText = await page.locator("body").innerText();
            assert.doesNotMatch(visiblePageText, /MaxPreps schedule/i);
            assert.match(visiblePageText, /View schedule & results/i);

            await conway.locator(".event-main.team-detail-trigger").click();
            const dialog = page.locator("dialog.team-detail-dialog[open]");
            await dialog.waitFor({ state: "visible", timeout: 15000 });
            assert.match(await dialog.locator(".team-detail-section-title").innerText(), /Schedule/i);
            await page.waitForFunction(() => document.querySelectorAll("dialog.team-detail-dialog[open] .team-detail-game").length > 0, null, { timeout: 30000 });

            const detailStatus = await dialog.locator(".team-detail-stat strong").allInnerTexts();
            const games = await dialog.locator(".team-detail-game").count();
            console.log("CONWAY_DETAIL_STATUS", JSON.stringify(detailStatus));
            console.log("CONWAY_DETAIL_GAME_COUNT", games);
            assert.ok(games > 0, "schedule dialog has no games");
            assert.equal(detailStatus[0]?.trim(), "9-4");
            assert.equal(detailStatus[1]?.trim(), "4-0");
            assert.match(detailStatus[2]?.trim() || "", /^#1\b/);

            console.log("FRONT_CARD_RENDER_PROOF_OK");
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
