name: One-shot final missing score plan

on:
  pull_request:
    branches: [feature/live-sports-pipeline-m1]

jobs:
  plan:
    if: github.head_ref == 'audit/final-missing-score-plan-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read exact production repair plan
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/final-missing-score-plan-20260912-4fd5a1c7'
          curl --fail --silent --show-error "$URL" -o plan.json
          cat plan.json | jq .
          jq -e '.safe == true and .d1.rows_written == 0 and (.cases | length) == 2' plan.json >/dev/null
