name: One-shot final missing score plan

on:
  pull_request:
    branches: [feature/live-sports-pipeline-m1]

jobs:
  plan:
    if: github.head_ref == 'audit/final-missing-score-plan-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm exact production repair preflight
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/final-missing-score-plan-20260912-4fd5a1c7'
          curl --fail --silent --show-error "$URL" -o plan.json
          jq . plan.json
          jq -e '.safe == true and .d1.rows_written == 0 and (.cases | length) == 2 and ([.cases[].action] | all(. == "apply_canonical_resolution")) and .write_scope.canonical_events_max == 2 and .write_scope.game_rows_max == 0 and .write_scope.conflict_rows_max == 0' plan.json >/dev/null
