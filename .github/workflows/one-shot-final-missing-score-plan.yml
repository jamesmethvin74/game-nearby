name: One-shot final missing score plan

on:
  pull_request:
    branches: [feature/live-sports-pipeline-m1]

jobs:
  plan:
    if: github.head_ref == 'audit/final-missing-score-plan-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read exact production repair plan and evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal'
          curl --fail --silent --show-error "$BASE/final-missing-score-plan-20260912-4fd5a1c7" -o plan.json
          curl --fail --silent --show-error "$BASE/final-missing-score-evidence-20260912-4fd5a1c7" -o evidence.json
          echo '=== PLAN ==='
          jq . plan.json
          echo '=== EVIDENCE ==='
          jq . evidence.json
          jq -e '.d1.rows_written == 0 and (.canonical_ids | length) == 2' evidence.json >/dev/null
