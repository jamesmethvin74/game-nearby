name: Volleyball production proof

on:
  pull_request:
    paths:
      - ".github/workflows/volleyball-production-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove two real volleyball finals end to end
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const API = 'https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const failures = [];
          const check = (condition, message) => { if (!condition) failures.push(message); };
          const norm = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          const sameName = (value, target) => norm(value).includes(norm(target)) || norm(target).includes(norm(value));

          async function raw(path) {
            const response = await fetch(`${API}${path}`, { headers: { accept:'application/json', 'cache-control':'no-cache' } });
            const text = await response.text();
            return { status:response.status, text, payload:response.ok ? JSON.parse(text) : null };
          }
          async function get(path) {
            const out = await raw(path);
            if (out.status !== 200) throw new Error(`${path} -> HTTP ${out.status}: ${out.text.slice(0,300)}`);
            return out.payload;
          }
          const centralDate = value => {
            const parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
            const p = Object.fromEntries(parts.map(x => [x.type,x.value]));
            return `${p.year}-${p.month}-${p.day}`;
          };
          async function loadTeam(candidates) {
            for (const teamId of candidates) {
              const out = await raw(`/api/v1/teams/${encodeURIComponent(teamId)}/schedule`);
              if (out.status === 404) continue;
              if (out.status !== 200) throw new Error(`${teamId} schedule -> HTTP ${out.status}: ${out.text.slice(0,300)}`);
              return { teamId, schedule:out.payload };
            }
            throw new Error(`No production team route found for ${candidates.join(', ')}`);
          }
          function findMatch(schedule,date,opponent) {
            return (schedule.games||[]).find(g => centralDate(g.scheduled_at||g.canonical_scheduled_at)===date && sameName(g.opponent,opponent));
          }
          function countedOverall(games) {
            const out={wins:0,losses:0,ties:0};
            for(const g of games||[]){
              if(g.status!=='FINAL'||Number(g.counts_for_record??1)===0||g.team_score==null||g.opponent_score==null) continue;
              const a=Number(g.team_score),b=Number(g.opponent_score);
              out[a===b?'ties':a>b?'wins':'losses']++;
            }
            return out;
          }
          const recordText = r => `${Number(r?.wins||0)}-${Number(r?.losses||0)}${Number(r?.ties||0)?`-${Number(r.ties)}`:''}`;
          function parseRecord(value){const n=String(value||'').match(/\d+/g)?.map(Number)||[];return{wins:n[0]||0,losses:n[1]||0,ties:n[2]||0};}
          function sameOverall(a,b){return Number(a?.wins||0)===Number(b?.wins||0)&&Number(a?.losses||0)===Number(b?.losses||0)&&Number(a?.ties||0)===Number(b?.ties||0);}

          async function prove(spec){
            const first=await loadTeam(spec.firstTeamIds), second=await loadTeam(spec.secondTeamIds);
            const firstGame=findMatch(first.schedule,spec.date,spec.secondName);
            const secondGame=findMatch(second.schedule,spec.date,spec.firstName);
            check(Boolean(firstGame),`${spec.label}: missing ${spec.firstName} schedule row`);
            check(Boolean(secondGame),`${spec.label}: missing ${spec.secondName} schedule row`);
            if(!firstGame||!secondGame) return {spec,first,second,firstGame,secondGame};
            check(firstGame.status==='FINAL'&&secondGame.status==='FINAL',`${spec.label}: both sides are not FINAL`);
            check(Number(firstGame.team_score)===spec.firstScore&&Number(firstGame.opponent_score)===spec.secondScore,`${spec.label}: ${spec.firstName} score ${firstGame.team_score}-${firstGame.opponent_score} != ${spec.firstScore}-${spec.secondScore}`);
            check(Number(secondGame.team_score)===spec.secondScore&&Number(secondGame.opponent_score)===spec.firstScore,`${spec.label}: ${spec.secondName} score ${secondGame.team_score}-${secondGame.opponent_score} != ${spec.secondScore}-${spec.firstScore}`);
            check(firstGame.canonical_event_id&&firstGame.canonical_event_id===secondGame.canonical_event_id,`${spec.label}: canonical event differs between team schedules`);
            check(firstGame.result==='W'&&secondGame.result==='L',`${spec.label}: W/L orientation mismatch`);
            const firstExpected=countedOverall(first.schedule.games),secondExpected=countedOverall(second.schedule.games);
            check(sameOverall(first.schedule.record,firstExpected),`${spec.firstName}: embedded overall ${recordText(first.schedule.record)} != counted finals ${recordText(firstExpected)}`);
            check(sameOverall(second.schedule.record,secondExpected),`${spec.secondName}: embedded overall ${recordText(second.schedule.record)} != counted finals ${recordText(secondExpected)}`);
            const firstRoute=(await get(`/api/v1/teams/${encodeURIComponent(first.teamId)}/record`)).record;
            const secondRoute=(await get(`/api/v1/teams/${encodeURIComponent(second.teamId)}/record`)).record;
            check(sameOverall(firstRoute,firstExpected),`${spec.firstName}: /record overall ${recordText(firstRoute)} != counted finals ${recordText(firstExpected)}`);
            check(sameOverall(secondRoute,secondExpected),`${spec.secondName}: /record overall ${recordText(secondRoute)} != counted finals ${recordText(secondExpected)}`);
            if(spec.realConferenceGame){
              check(Number(firstGame.conference_game||0)===1,`${spec.label}: canonical conference_game=0 on ${spec.firstName}`);
              check(Number(secondGame.conference_game||0)===1,`${spec.label}: canonical conference_game=0 on ${spec.secondName}`);
              check(Number(firstRoute.conference_wins||0)>=1,`${spec.firstName}: conference record did not include this conference win (${Number(firstRoute.conference_wins||0)}-${Number(firstRoute.conference_losses||0)})`);
              check(Number(secondRoute.conference_losses||0)>=1,`${spec.secondName}: conference record did not include this conference loss (${Number(secondRoute.conference_wins||0)}-${Number(secondRoute.conference_losses||0)})`);
            }
            return {spec,first,second,firstGame,secondGame,firstExpected,secondExpected,firstRoute,secondRoute};
          }

          const conway=await prove({label:'Conway at Little Rock Southwest',date:'2026-09-03',firstName:'Conway',secondName:'Little Rock Southwest',firstScore:3,secondScore:0,realConferenceGame:true,firstTeamIds:['conway-volleyball-2026','df-hnhrp8-volleyball-2026'],secondTeamIds:['df-bkc4ux-volleyball-2026','little-rock-southwest-volleyball-2026']});
          const flippin=await prove({label:'Flippin vs Melbourne',date:'2026-09-03',firstName:'Flippin',secondName:'Melbourne',firstScore:3,secondScore:0,realConferenceGame:true,firstTeamIds:['df-qyu4f7-volleyball-2026','flippin-volleyball-2026'],secondTeamIds:['df-x7qmns-volleyball-2026','melbourne-volleyball-2026']});

          async function standings(conference,proof){
            const payload=await get(`/api/v1/standings?sport=volleyball&conference=${encodeURIComponent(conference)}`);
            check((payload.standings||[]).length>=5,`${conference}: roster only ${(payload.standings||[]).length} rows`);
            const first=(payload.standings||[]).find(r=>sameName(r.school_name,proof.spec.firstName));
            const second=(payload.standings||[]).find(r=>sameName(r.school_name,proof.spec.secondName));
            check(Boolean(first),`${conference}: missing ${proof.spec.firstName}`);
            check(Boolean(second),`${conference}: missing ${proof.spec.secondName}`);
            if(first&&proof.firstExpected){
              const r=parseRecord(first.overall_record);check(sameOverall(r,proof.firstExpected),`${conference}: ${proof.spec.firstName} standings overall ${first.overall_record} != canonical ${recordText(proof.firstExpected)}`);
              if(proof.spec.realConferenceGame) check(parseRecord(first.conference_record).wins>=1,`${conference}: ${proof.spec.firstName} standings conference ${first.conference_record} does not include conference win`);
            }
            if(second&&proof.secondExpected){
              const r=parseRecord(second.overall_record);check(sameOverall(r,proof.secondExpected),`${conference}: ${proof.spec.secondName} standings overall ${second.overall_record} != canonical ${recordText(proof.secondExpected)}`);
              if(proof.spec.realConferenceGame) check(parseRecord(second.conference_record).losses>=1,`${conference}: ${proof.spec.secondName} standings conference ${second.conference_record} does not include conference loss`);
            }
            return {rows:(payload.standings||[]).length,first,second};
          }
          const s6=await standings('6a-central',conway);
          const s3=await standings('3a-2',flippin);

          const day=await get('/api/v1/games?since=2026-09-03T05%3A00%3A00.000Z&until=2026-09-04T05%3A00%3A00.000Z');
          const ids=new Set((day.games||[]).map(g=>g.canonical_event_id||g.id));
          if(conway.firstGame) check(ids.has(conway.firstGame.canonical_event_id),'Home/nearby feed missing Conway-Southwest final');
          if(flippin.firstGame) check(ids.has(flippin.firstGame.canonical_event_id),'Home/nearby feed missing Flippin-Melbourne final');

          const summarize=p=>({teamIds:[p.first?.teamId,p.second?.teamId],event:p.firstGame?.canonical_event_id||null,status:[p.firstGame?.status,p.secondGame?.status],scores:[`${p.firstGame?.team_score}-${p.firstGame?.opponent_score}`,`${p.secondGame?.team_score}-${p.secondGame?.opponent_score}`],conferenceFlags:[p.firstGame?.conference_game,p.secondGame?.conference_game],records:{first:p.firstRoute?{overall:recordText(p.firstRoute),conference:`${p.firstRoute.conference_wins||0}-${p.firstRoute.conference_losses||0}-${p.firstRoute.conference_ties||0}`} : null,second:p.secondRoute?{overall:recordText(p.secondRoute),conference:`${p.secondRoute.conference_wins||0}-${p.secondRoute.conference_losses||0}-${p.secondRoute.conference_ties||0}`} : null}});
          console.log('PRODUCTION_PROOF='+JSON.stringify({conway:summarize(conway),conwayStandings:s6,flippin:summarize(flippin),flippinStandings:s3,statewideDayRows:(day.games||[]).length,failures},null,2));
          if(failures.length) throw new Error(`Production proof found ${failures.length} defect(s): ${failures.join(' | ')}`);
          NODE
