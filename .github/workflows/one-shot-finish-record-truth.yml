name: One-shot finish record truth

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/one-shot-finish-record-truth.yml'

permissions:
  contents: read

jobs:
  finish:
    if: github.head_ref == 'audit/finish-record-truth-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Finish exact Beebe materialization and run final statewide audit
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/record-truth-finish-marker-ab1d996b"
          MATERIALIZE="$BASE/api/v1/internal/record-truth-finish-materialize-ab1d996b"
          AUDIT="$BASE/api/v1/internal/record-truth-finish-audit-ab1d996b"
          rm -f marker.json materialize.json audit.json audit-summary.json

          curl -fsS --max-time 20 "$MARKER" -o marker.json
          jq -e '.marker == "record-truth-finish-temp-v2-8a90e172" and .repair_version == "record-truth-six-games-v2" and .d1_access == false' marker.json >/dev/null

          code=$(curl -sS --max-time 120 -o materialize.json -w '%{http_code}' -X POST "$MATERIALIZE")
          cat materialize.json
          test "$code" = "200"
          jq -e '.status == "SUCCESS" and .repair_version == "record-truth-six-games-v2" and (.conflict_count_rows_written|tonumber)<=1 and (.record_result.teams|tonumber)==2 and .verification.cases != null and ([.verification.cases[].action] | all(. == "already_complete"))' materialize.json >/dev/null

          # Exactly one statewide read-only audit after the two-team materialization succeeds.
          curl -fsS --max-time 180 "$AUDIT" -o audit.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('audit.json','utf8'));
          if(r?.audit_contract?.version!=='record-truth-v1') throw new Error(`Unexpected audit contract ${r?.audit_contract?.version}`);
          if(Number(r?.d1?.rows_written||0)!==0) throw new Error(`Audit wrote D1 rows: ${r?.d1?.rows_written}`);
          const s=r.summary||{};
          const teams=Array.isArray(r.teams)?r.teams:[];
          const contradictions=teams.filter(t=>Number(t.unexplained_contradiction_count||0)>0).map(t=>({team_id:t.team_id,school_name:t.school_name,sport:t.sport,classification:t.classification,unexplained_contradiction_count:t.unexplained_contradiction_count,issues:(t.issues||[]).filter(i=>i.severity!=='info'&&i.resolved!==true)}));
          const arkansas=teams.find(t=>t.school_id==='uark'&&t.sport==='football')||null;
          const out={generated_at:r.generated_at,d1:r.d1,summary:s,arkansas,contradictions};
          fs.writeFileSync('audit-summary.json',JSON.stringify(out,null,2));
          console.log('FINAL_RECORD_TRUTH_AUDIT='+JSON.stringify(out,null,2));
          if(Number(s.unexplained_record_contradictions)!==0) throw new Error(`Merge gate failed: ${s.unexplained_record_contradictions} unexplained record contradictions`);
          NODE

      - name: Preserve exact final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-truth-final-v2
          path: |
            marker.json
            materialize.json
            audit.json
            audit-summary.json
          if-no-files-found: warn
          retention-days: 1
