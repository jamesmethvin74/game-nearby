name: One-shot finish record truth

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/one-shot-finish-record-truth.yml'

permissions:
  contents: read

jobs:
  finish:
    if: github.head_ref == 'audit/finish-record-truth-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact post-execute state read-only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/record-truth-finish-marker-ab1d996b"
          PLAN="$BASE/api/v1/internal/record-truth-finish-plan-ab1d996b"
          curl -fsS --max-time 20 "$MARKER" -o marker.json
          jq -e '.marker == "record-truth-finish-temp-v2-8a90e172" and .repair_version == "record-truth-six-games-v2" and .d1_access == false' marker.json >/dev/null
          curl -fsS --max-time 60 "$PLAN" -o plan.json
          jq . plan.json
          jq -e '.version == "record-truth-six-games-v2" and (.d1.rows_written|tonumber)==0 and (.d1.rows_read|tonumber)<=300' plan.json >/dev/null
      - name: Preserve exact post-execute state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-truth-post-execute-state-v2
          path: |
            marker.json
            plan.json
          if-no-files-found: warn
          retention-days: 1
