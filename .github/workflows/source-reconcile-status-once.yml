name: Source reconciliation status once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/source-reconcile-status-once.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read persisted reconciliation status
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 45 -fsS \
            "$BASE/api/v1/internal/source-reconcile-status-20260920-6e8d4b2a" > /tmp/status.json
          echo "SOURCE_RECONCILE_STATUS=$(cat /tmp/status.json)"
