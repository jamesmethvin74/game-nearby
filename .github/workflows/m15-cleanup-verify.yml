name: M15 cleanup verify
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-cleanup-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: verify-cleanup
    steps:
      - name: Verify production cleanup
        shell: bash
        run: |
          set -euo pipefail
          base='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          health_code="$(curl -sS -o /tmp/sources.json -w '%{http_code}' "$base/api/v1/sources")"
          echo "M15_CLEANUP_HEALTH_HTTP=$health_code"
          test "$health_code" = "200"
          for attempt in $(seq 1 120); do
            code="$(curl -sS -o /tmp/m15.json -w '%{http_code}' "$base/api/v1/internal/m15-statewide-repair-20260917-4c8e2f7a91bd")"
            body="$(cat /tmp/m15.json)"
            echo "M15_CLEANUP_ROUTE attempt=$attempt http=$code body=${body:0:240}"
            if [[ "$code" = "404" ]] && [[ "$body" != *"m15-statewide-presentation-repair-1426-364-20260917"* ]]; then
              echo "M15_CLEANUP_VERIFIED=1"
              exit 0
            fi
            sleep 5
          done
          echo "M15 cleanup route still surfaced after bounded verification window" >&2
          exit 1
