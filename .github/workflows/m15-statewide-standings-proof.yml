name: M15 statewide standings presentation proof
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-statewide-standings-proof.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: audit-statewide-standings
    steps:
      - name: Audit every published conference through public API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const get=async path=>{
            const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});
            const text=await r.text();
            let body={}; try{body=JSON.parse(text);}catch{body={raw:text.slice(0,4000)}}
            if(!r.ok) throw new Error(path+' HTTP '+r.status+' '+JSON.stringify(body).slice(0,1000));
            return body;
          };
          const schoolKey=s=>String(s||'').toLowerCase().replace(/\b(?:senior|sr\.?)[\s-]+high[\s-]+school\b/g,' ').replace(/\bhigh[\s-]+school\b/g,' ').replace(/\bhs\b/g,' ').replace(/[^a-z0-9]+/g,'').trim();

          let ready=false;
          for(let attempt=1;attempt<=120;attempt++){
            try{
              const probe=await get('/api/v1/standings?sport=football&conference=7a-central');
              const rows=probe.standings||[];
              if(probe.conference?.presentation_method && rows.length && rows.every(r=>'display_conference_record' in r && 'display_overall_record' in r)){
                ready=true;
                console.log('STANDINGS_CONTRACT_READY='+JSON.stringify({attempt,method:probe.conference.presentation_method,rows:rows.length}));
                break;
              }
              console.log('STANDINGS_CONTRACT_WAIT='+JSON.stringify({attempt,method:probe.conference?.presentation_method||null,rows:rows.length}));
            }catch(error){
              console.log('STANDINGS_CONTRACT_WAIT='+JSON.stringify({attempt,error:String(error.message).slice(0,300)}));
            }
            await sleep(5000);
          }
          if(!ready) throw new Error('new standings presentation contract never reached production');

          const issues=[];
          const conferences=[];
          for(const sport of ['football','volleyball']){
            const options=await get('/api/v1/standings/options?sport='+sport);
            for(const conference of options.conferences||[]){
              const payload=await get('/api/v1/standings?sport='+sport+'&conference='+encodeURIComponent(conference.id));
              const rows=payload.standings||[];
              const meta=payload.conference||{};
              conferences.push({sport,id:conference.id,name:conference.name,rows:rows.length,presentation_method:meta.presentation_method,membership_complete:meta.membership_complete,result_evidence_complete:meta.result_evidence_complete});
              if(!rows.length) issues.push({severity:'blocking',code:'STANDINGS_EMPTY',sport,conference_id:conference.id});
              const seen=new Set();
              for(const row of rows){
                const key=schoolKey(row.school_name);
                if(key&&seen.has(key)) issues.push({severity:'blocking',code:'STANDINGS_DUPLICATE_TEAM',sport,conference_id:conference.id,school_name:row.school_name});
                if(key) seen.add(key);
                const hasPublished=row.published_rank!=null||row.published_conference_record!=null||row.published_overall_record!=null;
                if(hasPublished&&(row.display_conference_record==null||row.display_overall_record==null)){
                  issues.push({severity:'blocking',code:'STANDINGS_PUBLISHED_VALUE_HIDDEN',sport,conference_id:conference.id,school_name:row.school_name});
                }
                if(row.display_conference_record==null||row.display_overall_record==null){
                  issues.push({severity:'blocking',code:'STANDINGS_PRESENTATION_RECORD_MISSING',sport,conference_id:conference.id,school_name:row.school_name});
                }
              }
              if(meta.presentation_complete===false) issues.push({severity:'blocking',code:'STANDINGS_PRESENTATION_INCOMPLETE',sport,conference_id:conference.id});
              if(sport==='football'){
                const expected=conference.id.endsWith('-football')?conference.id:conference.id+'-football';
                if(meta.durable_conference_id && meta.durable_conference_id!==expected) issues.push({severity:'blocking',code:'STANDINGS_CONFERENCE_ID_CONTRACT',sport,conference_id:conference.id,durable:meta.durable_conference_id,expected});
              }
              if(meta.presentation_method==='published'||meta.presentation_method==='mixed') issues.push({severity:'warning',code:'STANDINGS_USING_PUBLISHED_FALLBACK',sport,conference_id:conference.id});
              if(meta.membership_complete===false) issues.push({severity:'warning',code:'STANDINGS_MEMBERSHIP_INCOMPLETE',sport,conference_id:conference.id});
              if(meta.result_evidence_complete===false) issues.push({severity:'warning',code:'STANDINGS_RESULT_EVIDENCE_INCOMPLETE',sport,conference_id:conference.id});
            }
          }
          const blocking=issues.filter(i=>i.severity==='blocking');
          const warnings=issues.filter(i=>i.severity==='warning');
          const counts={}; for(const i of issues) counts[i.code]=(counts[i.code]||0)+1;
          console.log('STATEWIDE_STANDINGS_SUMMARY='+JSON.stringify({
            conferences_examined:conferences.length,
            football:conferences.filter(c=>c.sport==='football').length,
            volleyball:conferences.filter(c=>c.sport==='volleyball').length,
            blocking_issues:blocking.length,
            warning_issues:warnings.length,
            issues_by_code:counts
          }));
          console.log('STATEWIDE_STANDINGS_BLOCKERS='+JSON.stringify(blocking));
          console.log('STATEWIDE_STANDINGS_WARNINGS='+JSON.stringify(warnings.slice(0,100)));
          if(blocking.length) process.exit(1);
          NODE
