name: Temporary official source coverage
on:
  push:
    paths:
      - ".github/workflows/tmp-official-source-coverage.yml"
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read production official-source coverage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30             "https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/sources"             -o /tmp/sources.json
          python3 - <<'PY'
          import json
          from collections import Counter
          rows=json.load(open('/tmp/sources.json')).get('sources',[])
          target=[]
          for r in rows:
              if r.get('source_type')!='official-school': continue
              if r.get('parser_type') not in ('mascot-media','rankone-public'): continue
              url=str(r.get('source_url') or '').lower()
              if '/sport/volleyball/girls/' in url: sport='volleyball-girls'
              elif '/sport/basketball/boys/' in url: sport='basketball-boys'
              elif '/sport/basketball/girls/' in url: sport='basketball-girls'
              elif '/sport/football/boys/' in url: sport='football-boys'
              else: sport='other'
              target.append((str(r.get('team_id') or ''),r.get('parser_type'),sport,r.get('source_url')))
          print('TOTAL_ENABLED_SOURCES',len(rows))
          print('OFFICIAL_SOURCE_ROWS_ALL_TARGET_PARSERS',len(target))
          print('BY_PARSER',dict(Counter(r[1] for r in target)))
          print('BY_SPORT',dict(Counter(r[2] for r in target)))
          wanted=[r for r in target if r[2] in ('volleyball-girls','basketball-boys','basketball-girls')]
          print('VB_BB_SOURCE_ROWS',len(wanted))
          print('VB_BB_UNIQUE_TEAM_IDS',len({r[0] for r in wanted}))
          print('ROWS_BEGIN')
          for row in sorted(wanted,key=lambda r:(r[2],r[0],r[1])):
              print('\t'.join('' if x is None else str(x) for x in row))
          print('ROWS_END')
          PY
