name: Milestone 1 high school inventory diagnostic

on:
  push:
    branches:
      - diagnostics/milestone1-high-school-inventory
    paths:
      - .github/workflows/milestone1-high-school-inventory-diagnostic.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch six bounded Arkansas team directories
        shell: python
        run: |
          import json, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          SOURCES = [
            ("football", "boys", "https://www.maxpreps.com/ar/football/schools/"),
            ("basketball", "boys", "https://www.maxpreps.com/ar/basketball/schools/"),
            ("basketball", "girls", "https://www.maxpreps.com/ar/basketball/girls/schools/"),
            ("soccer", "boys", "https://www.maxpreps.com/ar/soccer/schools/"),
            ("soccer", "girls", "https://www.maxpreps.com/ar/soccer/girls/schools/"),
            ("volleyball", "girls", "https://www.maxpreps.com/ar/volleyball/schools/"),
          ]

          class Links(HTMLParser):
            def __init__(self):
              super().__init__(); self.current = None; self.links = []
            def handle_starttag(self, tag, attrs):
              if tag.lower() != "a": return
              href = dict(attrs).get("href")
              if href: self.current = [href, []]
            def handle_data(self, data):
              if self.current is not None: self.current[1].append(data)
            def handle_endtag(self, tag):
              if tag.lower() == "a" and self.current is not None:
                href, text = self.current
                self.links.append((href, " ".join("".join(text).split())))
                self.current = None

          def is_team_path(parts, sport, gender):
            if len(parts) < 4 or parts[0].lower() != "ar": return False
            tail = [p.lower() for p in parts[3:]]
            if not tail or tail[0] != sport: return False
            if sport in ("basketball", "soccer"):
              has_girls = "girls" in tail[1:]
              return has_girls if gender == "girls" else not has_girls
            if sport == "football": return gender == "boys" and "girls" not in tail[1:]
            if sport == "volleyball": return gender == "girls" and "boys" not in tail[1:]
            return False

          out = {"generated_by":"milestone1-high-school-inventory-diagnostic", "sources":[], "teams":[]}
          headers = {"User-Agent":"Mozilla/5.0 LocalBleachersAR-inventory-diagnostic/1.0", "Accept":"text/html"}
          all_rows = {}

          for sport, gender, source_url in SOURCES:
            req = urllib.request.Request(source_url, headers=headers)
            with urllib.request.urlopen(req, timeout=25) as response:
              html = response.read().decode("utf-8", errors="replace")
            parser = Links(); parser.feed(html)
            per_source = {}
            for href, label in parser.links:
              absolute = urljoin(source_url, href)
              path = urlparse(absolute).path
              parts = [p for p in path.split("/") if p]
              if not is_team_path(parts, sport, gender): continue
              key = (sport, gender, parts[1].lower(), parts[2].lower())
              row = {
                "sport":sport, "gender":gender, "source_url":source_url,
                "team_url":absolute, "directory_label":label,
                "city_slug":parts[1], "school_slug":parts[2]
              }
              current = per_source.get(key)
              if current is None or len(urlparse(absolute).path) < len(urlparse(current["team_url"]).path) or (label and not current["directory_label"]):
                per_source[key] = row
            all_rows.update(per_source)
            out["sources"].append({"sport":sport,"gender":gender,"url":source_url,"team_count":len(per_source)})

          out["teams"] = sorted(all_rows.values(), key=lambda x:(x["sport"],x["gender"],x["city_slug"],x["school_slug"]))
          with open("high-school-team-inventory.json","w",encoding="utf-8") as f:
            json.dump(out,f,indent=2,ensure_ascii=False)
          print(json.dumps(out["sources"], indent=2))
          print("TOTAL TEAM TARGETS", len(out["teams"]))
          if any(row["team_count"] == 0 for row in out["sources"]):
            raise SystemExit("At least one sport directory parsed zero teams; refusing snapshot")
          if len(out["teams"]) < 700:
            raise SystemExit("Inventory unexpectedly small; refusing to treat diagnostic as valid")

      - name: Upload inventory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-high-school-team-inventory
          path: high-school-team-inventory.json
          retention-days: 1
