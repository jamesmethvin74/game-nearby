name: Milestone 1 high school inventory diagnostic

on:
  push:
    branches:
      - diagnostics/milestone1-high-school-inventory
    paths:
      - .github/workflows/milestone1-high-school-inventory-diagnostic.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pagination metadata on capped directories
        shell: python
        run: |
          import json, re, urllib.request
          from html.parser import HTMLParser

          SOURCES = [
            ("football", "boys", "https://www.maxpreps.com/ar/football/schools/"),
            ("volleyball", "girls", "https://www.maxpreps.com/ar/volleyball/schools/"),
            ("soccer", "girls", "https://www.maxpreps.com/ar/soccer/girls/schools/"),
          ]

          class NextData(HTMLParser):
            def __init__(self): super().__init__(); self.capture=False; self.parts=[]
            def handle_starttag(self, tag, attrs):
              if tag.lower()=="script" and dict(attrs).get("id")=="__NEXT_DATA__": self.capture=True
            def handle_data(self, data):
              if self.capture: self.parts.append(data)
            def handle_endtag(self, tag):
              if tag.lower()=="script" and self.capture: self.capture=False

          def find_grouping_parents(value, path="$"):
            found=[]
            if isinstance(value,dict):
              g=value.get("groupings")
              if isinstance(g,list) and g and any(isinstance(row,dict) and "teamId" in row for row in g):
                found.append((path,value))
              for k,v in value.items(): found.extend(find_grouping_parents(v,f"{path}.{k}"))
            elif isinstance(value,list):
              for i,v in enumerate(value): found.extend(find_grouping_parents(v,f"{path}[{i}]"))
            return found

          def primitives(value, path="$"):
            out=[]
            if isinstance(value,dict):
              for k,v in value.items():
                p=f"{path}.{k}"
                if isinstance(v,(str,int,float,bool)) or v is None:
                  if re.search(r"count|total|page|size|limit|offset|skip|take|next|cursor|hasmore|has_more",k,re.I): out.append((p,v))
                else: out.extend(primitives(v,p))
            elif isinstance(value,list):
              for i,v in enumerate(value): out.extend(primitives(v,f"{path}[{i}]"))
            return out

          headers={"User-Agent":"Mozilla/5.0 LocalBleachersAR-inventory-diagnostic/1.0","Accept":"text/html"}
          report=[]
          for sport,gender,url in SOURCES:
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=25) as r: html=r.read().decode("utf-8",errors="replace")
            parser=NextData(); parser.feed(html)
            data=json.loads("".join(parser.parts))
            parents=find_grouping_parents(data)
            if not parents: raise SystemExit(f"No grouping parent for {url}")
            path,parent=max(parents,key=lambda pair:len(pair[1].get("groupings",[])))
            siblings={k:v for k,v in parent.items() if k!="groupings" and (isinstance(v,(str,int,float,bool)) or v is None)}
            nearby={k:(len(v) if isinstance(v,list) else list(v.keys())[:30] if isinstance(v,dict) else v) for k,v in parent.items() if k!="groupings"}
            report.append({
              "sport":sport,"gender":gender,"url":url,"groupings_count":len(parent["groupings"]),
              "parent_path":path,"parent_keys":list(parent.keys()),"parent_primitive_siblings":siblings,
              "parent_other_shapes":nearby,"pagination_like_values":primitives(data)[:300]
            })
          with open("pagination-metadata.json","w",encoding="utf-8") as f: json.dump(report,f,indent=2,ensure_ascii=False)
          print(json.dumps([{k:v for k,v in r.items() if k not in ("pagination_like_values",)} for r in report],indent=2))

      - name: Upload pagination metadata
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-high-school-pagination-metadata
          path: pagination-metadata.json
          retention-days: 1
