name: Milestone 1 high school inventory diagnostic

on:
  push:
    branches:
      - diagnostics/milestone1-high-school-inventory
    paths:
      - .github/workflows/milestone1-high-school-inventory-diagnostic.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch six bounded Arkansas team directories
        shell: python
        run: |
          import json, urllib.request
          from html.parser import HTMLParser

          SOURCES = [
            ("football", "boys", "https://www.maxpreps.com/ar/football/schools/"),
            ("basketball", "boys", "https://www.maxpreps.com/ar/basketball/schools/"),
            ("basketball", "girls", "https://www.maxpreps.com/ar/basketball/girls/schools/"),
            ("soccer", "boys", "https://www.maxpreps.com/ar/soccer/schools/"),
            ("soccer", "girls", "https://www.maxpreps.com/ar/soccer/girls/schools/"),
            ("volleyball", "girls", "https://www.maxpreps.com/ar/volleyball/schools/"),
          ]

          class NextData(HTMLParser):
            def __init__(self):
              super().__init__(); self.capture=False; self.parts=[]
            def handle_starttag(self, tag, attrs):
              if tag.lower()=="script" and dict(attrs).get("id")=="__NEXT_DATA__": self.capture=True
            def handle_data(self, data):
              if self.capture: self.parts.append(data)
            def handle_endtag(self, tag):
              if tag.lower()=="script" and self.capture: self.capture=False

          def grouping_lists(value):
            found=[]
            if isinstance(value,dict):
              for key,item in value.items():
                if key=="groupings" and isinstance(item,list) and item:
                  if all(isinstance(row,dict) for row in item) and any("teamId" in row and "name" in row for row in item):
                    found.append(item)
                found.extend(grouping_lists(item))
            elif isinstance(value,list):
              for item in value: found.extend(grouping_lists(item))
            return found

          headers={"User-Agent":"Mozilla/5.0 LocalBleachersAR-inventory-diagnostic/1.0","Accept":"text/html"}
          snapshot={"generated_by":"milestone1-high-school-inventory-diagnostic","sources":[],"teams":[]}
          unique_schools={}
          for sport,gender,url in SOURCES:
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=25) as r:
              html=r.read().decode("utf-8",errors="replace")
            parser=NextData(); parser.feed(html)
            if not parser.parts: raise SystemExit(f"No __NEXT_DATA__ for {url}")
            data=json.loads("".join(parser.parts))
            candidates=grouping_lists(data)
            if not candidates: raise SystemExit(f"No groupings for {url}")
            groupings=max(candidates,key=len)
            rows={}
            for item in groupings:
              external_id=str(item.get("teamId") or "").strip()
              name=str(item.get("name") or "").strip()
              state=str(item.get("state") or "").strip().upper()
              if not external_id or not name or state!="AR": continue
              row={
                "external_school_id":external_id,
                "school_name":name,
                "city":str(item.get("city") or "").strip(),
                "state":"AR",
                "sport":sport,
                "gender":gender,
                "directory_url":url,
                "team_url":str(item.get("canonicalUrl") or "").replace("\\u0026","&"),
                "mascot_url":str(item.get("mascotUrl") or "").replace("\\u0026","&")
              }
              rows[external_id]=row
              unique_schools.setdefault(external_id,{"external_school_id":external_id,"school_name":name,"city":row["city"],"state":"AR"})
            snapshot["teams"].extend(rows.values())
            snapshot["sources"].append({"sport":sport,"gender":gender,"url":url,"team_count":len(rows)})

          snapshot["teams"].sort(key=lambda r:(r["school_name"],r["sport"],r["gender"],r["external_school_id"]))
          snapshot["schools"]=sorted(unique_schools.values(),key=lambda r:(r["school_name"],r["city"],r["external_school_id"]))
          snapshot["summary"]={"expected_team_targets":len(snapshot["teams"]),"unique_schools":len(snapshot["schools"])}
          with open("high-school-team-inventory.json","w",encoding="utf-8") as f:
            json.dump(snapshot,f,indent=2,ensure_ascii=False)
          print(json.dumps(snapshot["sources"],indent=2))
          print(json.dumps(snapshot["summary"],indent=2))
          if any(row["team_count"] < 50 for row in snapshot["sources"]):
            raise SystemExit("A sport directory parsed implausibly few teams")
          if len(snapshot["teams"]) < 700:
            raise SystemExit("Inventory unexpectedly small")

      - name: Upload inventory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-high-school-team-inventory
          path: high-school-team-inventory.json
          retention-days: 1
