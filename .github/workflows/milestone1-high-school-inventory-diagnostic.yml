name: Milestone 1 high school inventory diagnostic

on:
  push:
    branches:
      - diagnostics/milestone1-high-school-inventory
    paths:
      - .github/workflows/milestone1-high-school-inventory-diagnostic.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect six bounded Arkansas team directories
        shell: python
        run: |
          import json, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          SOURCES = [
            ("football", "boys", "https://www.maxpreps.com/ar/football/schools/"),
            ("basketball", "boys", "https://www.maxpreps.com/ar/basketball/schools/"),
            ("basketball", "girls", "https://www.maxpreps.com/ar/basketball/girls/schools/"),
            ("soccer", "boys", "https://www.maxpreps.com/ar/soccer/schools/"),
            ("soccer", "girls", "https://www.maxpreps.com/ar/soccer/girls/schools/"),
            ("volleyball", "girls", "https://www.maxpreps.com/ar/volleyball/schools/"),
          ]

          class Links(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]
            def handle_starttag(self, tag, attrs):
              if tag.lower()=="a":
                href=dict(attrs).get("href")
                if href: self.links.append(href)

          headers={"User-Agent":"Mozilla/5.0 LocalBleachersAR-inventory-diagnostic/1.0","Accept":"text/html"}
          diagnostic=[]
          for sport,gender,url in SOURCES:
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=25) as r:
              html=r.read().decode("utf-8",errors="replace")
            p=Links(); p.feed(html)
            hrefs=[urljoin(url,h) for h in p.links]
            marker_candidates=["Alma","alma-airedales",sport,"schoolId","schoolName","teamId","__NEXT_DATA__","apollo"]
            markers={m:html.lower().find(m.lower()) for m in marker_candidates}
            first=max([v for v in markers.values() if v>=0],default=-1)
            snippet=html[max(0,first-500):first+2000] if first>=0 else html[:1500]
            sport_hrefs=[h for h in hrefs if sport in urlparse(h).path.lower()][:20]
            diagnostic.append({
              "sport":sport,"gender":gender,"url":url,"html_length":len(html),
              "link_count":len(hrefs),"markers":markers,"sport_hrefs":sport_hrefs,
              "snippet":snippet
            })
          with open("directory-shapes.json","w",encoding="utf-8") as f:
            json.dump(diagnostic,f,indent=2,ensure_ascii=False)
          print(json.dumps([{k:v for k,v in d.items() if k not in ("snippet","sport_hrefs")} for d in diagnostic],indent=2))

      - name: Upload page-shape diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-high-school-directory-shapes
          path: directory-shapes.json
          retention-days: 1
