name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Conway nearby processing exception
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          URL="$API/api/v1/games?lat=35.0887&lon=-92.4421&radius=25&since=2026-08-28T00%3A00%3A00.000Z&until=2026-12-31T23%3A59%3A59.000Z"
          for attempt in $(seq 1 12); do
            rm -f body.json headers.txt
            code=$(curl -sS --max-time 30 -D headers.txt -o body.json -w '%{http_code}' -H 'x-localbleachers-diagnostic: read-v1' "$URL" || true)
            echo "attempt=$attempt HTTP=$code"
            cat body.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              count=$(node -e 'const p=require("./body.json");console.log(Array.isArray(p.games)?p.games.length:-1)')
              echo "Recovered current-game response count=$count"
              if [ "$count" -ge 0 ]; then exit 0; fi
            fi
            if node -e 'try{const p=require("./body.json");process.exit(typeof p.diagnostic==="string"&&p.diagnostic.length?0:1)}catch{process.exit(1)}'; then
              echo "GATED_CURRENT_GAMES_DIAGNOSTIC_CAPTURED"
              exit 0
            fi
            sleep 5
          done
          echo "Could not capture current-game result or diagnostic."
          exit 1
