name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read post-cron volleyball production state
        shell: bash
        run: |
          set -euo pipefail
          API='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          for id in conway-volleyball-2026 df-bkc4ux-volleyball-2026 df-qyu4f7-volleyball-2026 df-x7qmns-volleyball-2026; do
            curl -fsS --max-time 45 "$API/api/v1/teams/$id/schedule" -o "$id.json"
          done
          node <<'NODE'
          const fs=require('fs');
          for(const id of ['conway-volleyball-2026','df-bkc4ux-volleyball-2026','df-qyu4f7-volleyball-2026','df-x7qmns-volleyball-2026']){
            const p=JSON.parse(fs.readFileSync(`${id}.json`,'utf8'));
            const r=p.record||{};
            console.log(`${id} overall=${r.wins||0}-${r.losses||0} conf=${r.conference_wins||0}-${r.conference_losses||0} conference_id=${r.conference_id||''}`);
            if(id==='df-qyu4f7-volleyball-2026'){
              for(const g of p.games||[]){
                const o=String(g.opponent||'').toLowerCase();
                if(o.startsWith('bergman')||o.startsWith('cotter')||o.includes('melbourne')) console.log(`FLIPPIN ${g.scheduled_at} ${g.opponent} ${g.status} ${g.team_score}-${g.opponent_score} ${g.result||''} conf=${g.conference_game}`);
              }
            }
          }
          NODE
