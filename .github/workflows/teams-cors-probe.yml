name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live MaxPreps with production parsers
        shell: bash
        run: |
          set -euo pipefail
          REPO='https://raw.githubusercontent.com/jamesmethvin74/game-nearby/feature/live-sports-pipeline-m1'
          mkdir -p diag
          curl -fsSL "$REPO/backend/src/maxpreps-volleyball-results.js" -o diag/maxpreps-volleyball-results.js
          curl -fsSL "$REPO/backend/src/schedule-authority-core.js" -o diag/schedule-authority-core.js
          curl -fsSL "$REPO/backend/src/published-standings.js" -o diag/published-standings.js

          node --input-type=module <<'NODE'
          import { parseMaxPrepsVolleyballScores, matchLocalVolleyballTeams, maxPrepsScoresUrl } from './diag/maxpreps-volleyball-results.js';
          import { parseConferenceLinks, fetchPublishedStandings } from './diag/published-standings.js';
          const headers={'user-agent':'LocalBleachersAR-diagnostic/1.0 (+https://github.com/jamesmethvin74/game-nearby)','accept':'text/html,application/xhtml+xml'};
          const get=async url=>{const r=await fetch(url,{headers});const text=await r.text();console.log(`GET ${url} -> ${r.status} final=${r.url} bytes=${text.length}`);return {r,text};};

          const dir=await get('https://www.maxpreps.com/ar/volleyball/');
          const links=parseConferenceLinks(dir.text,{sport:'volleyball'});
          const central=links.find(x=>x.id==='6a-central');
          console.log('CENTRAL_LINK='+JSON.stringify(central));
          if(central){
            const live=await get(central.source_url);
            console.log('CENTRAL_HAS_SW='+/Little Rock Southwest/i.test(live.text));
            try {
              const parsed=await fetchPublishedStandings({sport:'volleyball',conferenceId:'6a-central',fetchFn:fetch});
              console.log('CENTRAL_PARSED='+JSON.stringify(parsed.standings.filter(x=>/Conway|Southwest/i.test(x.school_name))));
            } catch(e) { console.log('CENTRAL_PARSE_ERROR='+String(e?.message||e)); }
          }

          const localTeams=[
            {team_id:'df-qyu4f7-volleyball-2026',school_id:'df-qyu4f7',school_name:'Flippin High School'},
            {team_id:'df-bergman-volleyball-2026',school_id:'df-bergman',school_name:'Bergman High School'},
            {team_id:'df-cotter-volleyball-2026',school_id:'df-cotter',school_name:'Cotter High School'}
          ];
          for(const date of ['2026-08-27','2026-08-29']){
            const url=maxPrepsScoresUrl(date);
            const page=await get(url);
            const finals=parseMaxPrepsVolleyballScores(page.text,{localDate:date,sourceUrl:page.r.url||url});
            console.log(`${date}_PARSED_FINALS=${finals.length}`);
            const relevant=finals.filter(x=>/Flippin|Bergman|Cotter/i.test(`${x.home.name} ${x.away.name}`));
            console.log(`${date}_RELEVANT=${JSON.stringify(relevant)}`);
            const matched=matchLocalVolleyballTeams(relevant,localTeams);
            console.log(`${date}_MATCHED=${JSON.stringify(matched)}`);
          }
          NODE
