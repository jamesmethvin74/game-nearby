name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed public GET CORS
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/schools"
          rm -f headers.txt body.json
          for attempt in $(seq 1 20); do
            echo "Deployment probe ${attempt}/20"
            curl -sS -D headers.txt -o body.json -H "Origin: https://example.com" "$API"
            cat headers.txt
            if grep -Eqi '^access-control-allow-origin: \*$' headers.txt \
              && grep -Eqi '^x-localbleachers-api-cors: public-get-v1$' headers.txt \
              && node -e 'const p=require("./body.json"); process.exit(Array.isArray(p.schools)&&p.schools.length>=100?0:1)'; then
              echo "Production public GET CORS deployment verified."
              exit 0
            fi
            sleep 15
          done
          echo "Production Worker did not expose the expected CORS marker in time."
          exit 1
