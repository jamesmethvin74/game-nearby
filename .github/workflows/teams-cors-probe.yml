name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production volleyball identities
        shell: bash
        run: |
          set -euo pipefail
          API='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          curl -fsS --max-time 45 "$API/api/v1/schools" -o schools.json
          for id in \
            df-bkc4ux-volleyball-2026 \
            df-qyu4f7-volleyball-2026 \
            df-wgx266-volleyball-2026 \
            df-sz3b5e-volleyball-2026; do
            code=$(curl -sS --max-time 45 -o "${id}.json" -w '%{http_code}' "$API/api/v1/teams/$id" || true)
            echo "$id HTTP=$code"
          done
          node <<'NODE'
          const fs=require('fs');
          const schools=(JSON.parse(fs.readFileSync('schools.json','utf8')).schools||[]);
          for(const [label,id] of [['Southwest','df-bkc4ux'],['Flippin','df-qyu4f7'],['Bergman','df-wgx266'],['Cotter','df-sz3b5e']]){
            const s=schools.find(x=>x.id===id);
            console.log(label+'_SCHOOL='+JSON.stringify(s&&{id:s.id,name:s.name,location_matched_name:s.location_matched_name,catalog_scope:s.catalog_scope,level:s.level,team_count:s.team_count}));
          }
          for(const id of ['df-bkc4ux-volleyball-2026','df-qyu4f7-volleyball-2026','df-wgx266-volleyball-2026','df-sz3b5e-volleyball-2026']){
            try { const p=JSON.parse(fs.readFileSync(`${id}.json`,'utf8')); console.log(id+'='+JSON.stringify({team:p.team,record:p.record})); }
            catch(e){ console.log(id+'_PARSE_ERROR='+e.message); }
          }
          NODE
