name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current school route
        shell: bash
        run: |
          set -uo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/schools"
          rm -f headers.txt headers.norm body.json
          code=$(curl -sS -D headers.txt -o body.json -w '%{http_code}' -H "Origin: https://example.com" "$API" || true)
          tr -d '\r' < headers.txt > headers.norm 2>/dev/null || true
          cat headers.norm 2>/dev/null || true
          echo "HTTP $code"
          echo "BODY:"
          head -c 500 body.json 2>/dev/null || true
          echo

      - name: Probe API route boundaries
        shell: bash
        run: |
          set -uo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          probe() {
            label="$1"; url="$2"
            rm -f probe.headers probe.body probe.norm
            code=$(curl -sS --max-time 60 -D probe.headers -o probe.body -w '%{http_code}' "$url" || true)
            tr -d '\r' < probe.headers > probe.norm 2>/dev/null || true
            echo "===== $label ====="
            echo "HTTP $code"
            grep -Ei '^(content-type|content-length|x-localbleachers-api-cors|x-localbleachers-api-release):' probe.norm || true
            echo "BODY:"
            head -c 500 probe.body 2>/dev/null || true
            echo
          }

          probe "health" "$API/api/v1/health"
          probe "schools" "$API/api/v1/schools"
          probe "conway schedule" "$API/api/v1/teams/conway-volleyball-2026/schedule"
          probe "games date only" "$API/api/v1/games?since=2026-08-20T00%3A00%3A00.000Z&until=2026-08-22T00%3A00%3A00.000Z"
          probe "games geo only" "$API/api/v1/games?lat=36.329374987912615&lon=-93.43432233996029&radius=5"
          probe "games geo and date" "$API/api/v1/games?lat=36.329374987912615&lon=-93.43432233996029&radius=5&since=2026-08-20T00%3A00%3A00.000Z&until=2026-08-22T00%3A00%3A00.000Z"
