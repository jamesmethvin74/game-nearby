# production volleyball proof recheck after convergence cron
name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production volleyball proof cases
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS --max-time 45 "$API/api/v1/schools" -o schools.json
          curl -fsS --max-time 45 "$API/api/v1/sources" -o sources.json

          node <<'NODE' > ids.env
          const p=require('./schools.json');
          const schools=Array.isArray(p.schools)?p.schools:[];
          const name=s=>String(s.location_matched_name||s.name||'').toLowerCase();
          function find(label,pattern){
            const matches=schools.filter(s=>pattern.test(name(s)));
            if(matches.length!==1) throw new Error(`${label}: expected one school, found ${matches.length}: ${matches.map(x=>`${x.id}:${name(x)}`).join(', ')}`);
            console.error(`${label}=${matches[0].id}:${name(matches[0])}`);
            return matches[0].id;
          }
          console.log(`CONWAY=${find('Conway',/^conway high school$/)}`);
          console.log(`SOUTHWEST=${find('Southwest',/little rock southwest high school/)}`);
          console.log(`FLIPPIN=${find('Flippin',/^flippin high school$/)}`);
          NODE
          cat ids.env
          source ids.env

          for school in CONWAY SOUTHWEST FLIPPIN; do
            id="${!school}-volleyball-2026"
            echo "--- $school team=$id ---"
            curl -fsS --max-time 45 "$API/api/v1/teams/$id" -o "${school,,}-team.json"
            curl -fsS --max-time 45 "$API/api/v1/teams/$id/schedule" -o "${school,,}-schedule.json"
          done

          node <<'NODE'
          const fs=require('fs');
          function read(name){return JSON.parse(fs.readFileSync(name,'utf8'))}
          const sources=(read('sources.json').sources||[]).filter(s=>s.team_id==='conway-volleyball-2026');
          console.log(`CONWAY_SOURCES=${JSON.stringify(sources.map(s=>({id:s.id,source_type:s.source_type,parser_type:s.parser_type,authority_rank:s.authority_rank,url:s.source_url,last_successful_fetch_at:s.last_successful_fetch_at})))}`);
          function summarize(key){
            const teamPayload=read(`${key}-team.json`);
            const schedulePayload=read(`${key}-schedule.json`);
            const t=teamPayload.team||{};
            const r=schedulePayload.record||teamPayload.record||{};
            const finals=(schedulePayload.games||[]).filter(g=>g.status==='FINAL').map(g=>({
              date:String(g.scheduled_at||'').slice(0,10),opponent:g.opponent,
              score:`${g.team_score}-${g.opponent_score}`,result:g.result,
              conference:Number(g.conference_game||0),counts:Number(g.counts_for_record||0)
            }));
            console.log(JSON.stringify({
              key,team_id:t.id,school_id:t.school_id,conference_id:t.conference_id,
              conference_name:t.conference_name,
              record:{wins:r.wins,losses:r.losses,ties:r.ties,conference_wins:r.conference_wins,conference_losses:r.conference_losses,conference_ties:r.conference_ties},
              finals
            }));
          }
          summarize('conway');
          summarize('southwest');
          summarize('flippin');
          NODE
