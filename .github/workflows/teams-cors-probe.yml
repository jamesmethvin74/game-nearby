name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for gated nearby diagnostic and capture exception
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          URL="$API/api/v1/games?lat=35.0887&lon=-92.4421&radius=5&since=2030-01-01T00%3A00%3A00.000Z&until=2030-01-02T00%3A00%3A00.000Z"
          for attempt in $(seq 1 28); do
            rm -f body.json headers.txt
            code=$(curl -sS --max-time 30 -D headers.txt -o body.json -w '%{http_code}' -H 'x-localbleachers-diagnostic: read-v1' "$URL" || true)
            echo "attempt=$attempt HTTP=$code"
            cat body.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              echo "Nearby route recovered before diagnostic detail was needed."
              exit 0
            fi
            if node -e 'try{const p=require("./body.json");process.exit(typeof p.diagnostic==="string"&&p.diagnostic.length?0:1)}catch{process.exit(1)}'; then
              echo "GATED_DIAGNOSTIC_CAPTURED"
              exit 0
            fi
            sleep 15
          done
          echo "Gated diagnostic did not reach production in time."
          exit 1
