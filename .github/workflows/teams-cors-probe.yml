name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove production 6A Central standings source
        shell: bash
        run: |
          set -euo pipefail
          API='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          curl -fsS --max-time 45 "$API/api/v1/standings?sport=volleyball&conference=6a-central" -o standings.json
          node <<'NODE'
          const p=require('./standings.json');
          const rows=Array.isArray(p.standings)?p.standings:[];
          console.log('CONFERENCE='+JSON.stringify(p.conference||{}));
          console.log('SOURCE_URL='+(p.source_url||p.conference?.source_url||''));
          console.log('ROWS='+rows.length);
          console.log('CONWAY='+JSON.stringify(rows.find(r=>/^conway$/i.test(String(r.school_name||'')))||null));
          console.log('SOUTHWEST='+JSON.stringify(rows.find(r=>/little rock southwest/i.test(String(r.school_name||'')))||null));
          if(rows.length<5) throw new Error(`expected full 6A Central standings, got ${rows.length}`);
          if(!rows.some(r=>/^conway$/i.test(String(r.school_name||'')))) throw new Error('Conway missing');
          if(!rows.some(r=>/little rock southwest/i.test(String(r.school_name||'')))) throw new Error('Southwest missing');
          NODE
