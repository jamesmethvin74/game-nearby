name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live MaxPreps volleyball pages
        shell: bash
        run: |
          set -euo pipefail
          UA='LocalBleachersAR-diagnostic/1.0 (+https://github.com/jamesmethvin74/game-nearby)'
          fetch_page() {
            local label="$1" url="$2" out="$3"
            code=$(curl -L -sS --max-time 45 -A "$UA" -H 'accept: text/html,application/xhtml+xml' -o "$out" -w '%{http_code}' "$url" || true)
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            echo "$label HTTP=$code bytes=$bytes"
          }
          fetch_page DIRECTORY 'https://www.maxpreps.com/ar/volleyball/' directory.html
          fetch_page CENTRAL 'https://www.maxpreps.com/ar/volleyball/26-27/conference/6a-central/' central.html
          fetch_page AUG27 'https://www.maxpreps.com/ar/volleyball/scores/?date=8%2F27%2F2026' aug27.html
          fetch_page AUG29 'https://www.maxpreps.com/ar/volleyball/scores/?date=8%2F29%2F2026' aug29.html

          node <<'NODE'
          const fs=require('fs');
          const read=f=>fs.readFileSync(f,'utf8');
          const clean=s=>String(s).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();
          const directory=read('directory.html'), central=read('central.html'), a27=read('aug27.html'), a29=read('aug29.html');
          const links=[...directory.matchAll(/<a\b[^>]*href=["']([^"']*\/ar\/volleyball\/26-27\/conference\/([^\/?#"']+)\/?[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi)].map(m=>({slug:m[2],text:clean(m[3])}));
          console.log('DIRECTORY_6A_CENTRAL='+JSON.stringify(links.filter(x=>x.slug.toLowerCase()==='6a-central')));
          const rows=[...central.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)].map(m=>clean(m[1]));
          console.log('CENTRAL_SOUTHWEST_ROWS='+JSON.stringify(rows.filter(x=>/little rock southwest/i.test(x))));
          console.log('CENTRAL_CONWAY_ROWS='+JSON.stringify(rows.filter(x=>/(^|\s)conway(\s|$)/i.test(x))));
          function inspectScores(label,html,names){
            console.log(label+'_HAS_FINAL='+(html.match(/>\s*Final\s*</gi)||[]).length);
            console.log(label+'_CARDS='+(html.match(/<li\b[^>]*class=["']c["'][^>]*data-contest-id=/gi)||[]).length);
            for(const name of names) console.log(`${label}_${name.toUpperCase().replace(/\s+/g,'_')}=${new RegExp(name,'i').test(html)}`);
            const contexts=[];
            for(const name of names){const i=html.toLowerCase().indexOf(name.toLowerCase()); if(i>=0) contexts.push(clean(html.slice(Math.max(0,i-500),i+1000)).slice(0,1200));}
            console.log(label+'_CONTEXT='+JSON.stringify(contexts));
          }
          inspectScores('AUG27',a27,['Flippin','Bergman']);
          inspectScores('AUG29',a29,['Flippin','Cotter']);
          NODE
