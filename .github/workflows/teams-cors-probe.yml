name: Teams CORS probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/teams-cors-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture current Arkansas volleyball conference URLs
        shell: bash
        run: |
          set -euo pipefail
          REPO='https://raw.githubusercontent.com/jamesmethvin74/game-nearby/feature/live-sports-pipeline-m1'
          mkdir -p diag
          curl -fsSL "$REPO/backend/src/published-standings.js" -o diag/published-standings.js
          node --input-type=module <<'NODE'
          import { parseConferenceLinks } from './diag/published-standings.js';
          const url='https://www.maxpreps.com/ar/volleyball/';
          const r=await fetch(url,{headers:{'user-agent':'LocalBleachersAR-diagnostic/1.0 (+https://github.com/jamesmethvin74/game-nearby)','accept':'text/html,application/xhtml+xml'}});
          if(!r.ok) throw new Error(`directory HTTP ${r.status}`);
          const html=await r.text();
          const links=parseConferenceLinks(html,{sport:'volleyball'});
          console.log('COUNT='+links.length);
          console.log('CONFERENCE_URLS='+JSON.stringify(Object.fromEntries(links.map(x=>[x.id,{name:x.name,url:x.source_url}]))));
          NODE
