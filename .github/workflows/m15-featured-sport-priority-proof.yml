name: M15 featured sport priority proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m15-featured-sport-priority-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove featured card sport hierarchy
        env:
          BASE_URL: https://jamesmethvin74.github.io/game-nearby
        run: |
          cat > proof.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:430,height:932},timezoneId:'America/Chicago'});
          const page = await context.newPage();

          try {
            await page.goto(process.env.BASE_URL + '/?sport-priority=v79',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v79', null, {timeout:45000});

            const synthetic = await page.evaluate(() => {
              const fall = window.featuredEventForSchool([
                {id:'v',sport:'volleyball',date:'2026-09-20T18:00:00-05:00'},
                {id:'s',sport:'soccer',date:'2026-09-21T18:00:00-05:00'},
                {id:'f',sport:'football',date:'2026-10-01T19:00:00-05:00'}
              ]);
              const winter = window.featuredEventForSchool([
                {id:'x',sport:'swimming',date:'2026-12-01T17:00:00-06:00'},
                {id:'b',sport:'basketball',date:'2026-12-10T18:00:00-06:00'}
              ]);
              return {fall:fall?.id || null,winter:winter?.id || null};
            });
            console.log('SPORT_PRIORITY_SYNTHETIC='+JSON.stringify(synthetic));
            if (synthetic.fall !== 'f') throw new Error('Fall hierarchy did not choose football');
            if (synthetic.winter !== 'b') throw new Error('Winter hierarchy did not choose basketball');

            await page.evaluate(() => localStorage.setItem('followedTeams',JSON.stringify(['conway'])));
            await page.reload({waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v79', null, {timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersLive?.getState?.().nearbyLoadedAt, null, {timeout:45000});
            await page.waitForTimeout(500);

            const rendered = await page.evaluate(() => {
              const trigger=document.querySelector('#followedEvents .event-card.priority .team-detail-trigger');
              return {
                teamId:trigger?.dataset.teamId || null,
                sport:trigger?.dataset.sport || null,
                text:String(trigger?.closest('.event-card')?.innerText || '').replace(/\s+/g,' ').trim()
              };
            });
            console.log('SPORT_PRIORITY_RENDERED='+JSON.stringify(rendered));
            if (rendered.teamId !== 'conway') throw new Error('Conway featured card not rendered');
            if (rendered.sport !== 'football') throw new Error('Conway fall featured card was not football: '+JSON.stringify(rendered));
          } finally {
            await browser.close();
          }
          NODE
          node proof.mjs
