name: M7 record mismatch diagnostic once

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/m7-record-mismatch-diagnostic-once.yml'
      - 'backend/src/m7-record-mismatch-diagnostic.js'
      - 'backend/src/logo-bootstrap-worker.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for diagnostic route and prove mismatch scope
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-record-mismatch-4d8abf7c3d814d42'
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 180 -o result.json -w '%{http_code}' "$URL" || true)
            echo "M7_RECORD_DIAGNOSTIC attempt=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              cat result.json || true
              exit 1
            fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const r=require('./result.json');
          console.log('M7_RECORD_MISMATCHES='+JSON.stringify(r));
          if(Number(r.d1?.rows_written||0)!==0) throw new Error('Diagnostic wrote to D1');
          if(Number(r.d1?.rows_read||0)>100000) throw new Error(`Read fuse exceeded: ${r.d1?.rows_read}`);
          if(Number(r.mismatch_count||0)>10) throw new Error(`Mismatch fuse exceeded: ${r.mismatch_count}`);
          const teams=Number(r.scope?.active_local_arkansas_2026_girls_volleyball_teams||0);
          if(teams<190||teams>220) throw new Error(`Unexpected team scope: ${teams}`);
          NODE
