name: One-shot M7 full school catalog proof

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-full-school-catalog-proof-once.yml

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read candidate local school identities
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-identity-catalog-d2bd775959894b2d'
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 120 -o catalog.json -w '%{http_code}' "$URL" || true)
            echo "M7_FULL_CATALOG_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then cat catalog.json || true; exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const p=require('./catalog.json');
          const needles=['robinson','founders','joseph','mansfield','providence','gospel','westside','abundant','benton','hot springs','homeschool','arkansas','ozark','exalt','izard','kipp','trinity','christian ministries','lisa'];
          const rows=(p.teams||[]).filter(r=>{
            const s=[r.raw_school_name,r.school_name,r.city].filter(Boolean).join(' ').toLowerCase();
            return needles.some(n=>s.includes(n));
          });
          console.log('M7_FULL_CATALOG_D1='+JSON.stringify(p.d1||{}));
          console.log('M7_IDENTITY_CANDIDATES='+JSON.stringify(rows));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Catalog read wrote to D1');
          if(Number(p.d1?.rows_read||0)>3000) throw new Error(`Catalog read too high: ${p.d1.rows_read}`);
          NODE
