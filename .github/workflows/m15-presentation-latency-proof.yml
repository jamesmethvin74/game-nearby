name: M15 presentation latency proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m15-presentation-latency-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure followed-team truth readiness
        env:
          BASE_URL: https://jamesmethvin74.github.io/game-nearby
        run: |
          cat > latency-proof.mjs <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const followed = [
            'conway','df-ezw3f9','df-xpb38v','df-wlwrfa','df-hrdb8f',
            'df-h73ln2','df-kq5hlr','df-pz2b7r','df-28tzpd','df-2afyyj',
            'df-8j9f3x','df-dss449','df-epraq7'
          ];

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:430,height:932}});
          const page = await context.newPage();

          try {
            let deployed = false;
            for (let i=0;i<30;i++) {
              const response = await context.request.get(base + '/runtime-build.js?latency=v77-' + i, {
                headers:{'cache-control':'no-cache'}
              });
              const text = response.ok() ? await response.text() : '';
              if (text.includes('m15-presentation-v77')) { deployed = true; break; }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (!deployed) throw new Error('v77 did not deploy within proof window');

            await page.goto(base + '/?latency=seed', {waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => typeof SCHOOL_REGISTRY !== 'undefined' && SCHOOL_REGISTRY.length > 100, null, {timeout:45000});
            await page.evaluate(ids => localStorage.setItem('followedTeams', JSON.stringify(ids)), followed);

            const start = Date.now();
            await page.reload({waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v77', null, {timeout:45000});

            await page.waitForFunction(() => {
              const get=(id,sport,gender)=>window.LocalBleachersLive?.getPresentationStatus?.(id,sport,gender);
              return Boolean(
                get('conway','volleyball','girls')
                && get('df-ezw3f9','basketball','girls')
                && get('df-xpb38v','volleyball','girls')
                && get('df-wlwrfa','volleyball','girls')
                && get('df-hrdb8f','volleyball','girls')
              );
            }, null, {timeout:45000});
            const truthReadyMs = Date.now() - start;

            await page.waitForFunction(() => {
              const cards=[...document.querySelectorAll('.event-card .team-detail-trigger')];
              const conway=cards.find(t=>t.dataset.teamId==='conway' && t.dataset.sport==='volleyball');
              return conway && /9-4/.test(conway.closest('.event-card')?.innerText || '')
                && /4-0/.test(conway.closest('.event-card')?.innerText || '')
                && /#1/.test(conway.closest('.event-card')?.innerText || '');
            }, null, {timeout:15000});
            const conwayRenderedMs = Date.now() - start;

            const result = await page.evaluate(() => {
              const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
              const cards=[...document.querySelectorAll('.event-card .team-detail-trigger')];
              const conway=cards.find(t=>t.dataset.teamId==='conway' && t.dataset.sport==='volleyball');
              const maumelle=cards.find(t=>t.dataset.teamId==='df-xpb38v' && t.dataset.sport==='volleyball');
              const morrilton=cards.find(t=>t.dataset.teamId==='df-wlwrfa' && t.dataset.sport==='volleyball');
              const nlr=cards.find(t=>t.dataset.teamId==='df-hrdb8f' && t.dataset.sport==='volleyball');
              const marion=cards.find(t=>t.dataset.teamId==='df-ezw3f9' && t.dataset.sport==='basketball' && t.dataset.gender==='girls');
              return {
                release:window.LocalBleachersRuntime?.releaseGeneration,
                conway:clean(conway?.closest('.event-card')?.innerText),
                maumelle:clean(maumelle?.closest('.event-card')?.innerText),
                morrilton:clean(morrilton?.closest('.event-card')?.innerText),
                nlr:clean(nlr?.closest('.event-card')?.innerText),
                marion:clean(marion?.closest('.event-card')?.innerText)
              };
            });

            console.log('M15_LATENCY=' + JSON.stringify({truthReadyMs,conwayRenderedMs,...result}));
            if (truthReadyMs > 5000) throw new Error('Canonical truth readiness exceeded 5s: ' + truthReadyMs);
          } finally {
            await browser.close();
          }
          NODE
          node latency-proof.mjs
