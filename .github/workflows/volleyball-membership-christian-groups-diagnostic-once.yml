name: One-shot approved Arkansas Christian volleyball membership repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - backend/src/logo-bootstrap-worker.js
      - .github/workflows/volleyball-membership-christian-groups-diagnostic-once.yml

permissions:
  contents: read

jobs:
  approved-write:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Execute exact two-row Christian group membership repair
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          URL="$BASE/api/v1/maintenance/volleyball-membership/christian-groups-approved-20260910-b814e3"

          health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/v1/health" || true)
          echo "Health HTTP ${health_code}"
          cat health.json || true
          echo
          test "$health_code" = "200"
          node -e "const p=require('./health.json'); if(p.ok!==true||p.service!=='localbleachersar-sports-api') process.exit(1);"

          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 90 -o repair.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" = "404" ]; then
              echo "Repair route not deployed yet; retry ${attempt}/12 after 5s"
              sleep 5
              continue
            fi
            if grep -q 'standings source HTTP 403' repair.json 2>/dev/null; then
              echo "Transient MaxPreps 403; retry ${attempt}/12 after 15s"
              sleep 15
              continue
            fi
            break
          done

          echo "Christian groups repair HTTP ${code}"
          cat repair.json || true
          echo
          test "$code" = "200"

          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('repair.json','utf8'));
          const expected={
            'df-xhqftl-volleyball-2026':'arkansas-christian--central-volleyball',
            'df-uqet7h-volleyball-2026':'arkansas-christian--south-volleyball'
          };
          const rows=Array.isArray(p.verification)?p.verification:[];
          const exact=rows.length===2
            && new Set(rows.map(row=>row.team_id)).size===2
            && rows.every(row=>expected[row.team_id]===row.conference_id);
          const success=p.status==='SUCCESS'
            && p.change_count===2
            && p.missing_count===2
            && p.wrong_count===0
            && p.d1Statements===2
            && p.teamWrites===2
            && Number(p.conferenceWrites)<=2
            && exact;
          const already=p.status==='ALREADY_APPLIED'
            && p.change_count===0
            && p.teamWrites===0
            && p.d1Statements===0
            && exact;
          if(!success && !already) throw new Error('exact Christian group membership repair validation failed');
          console.log('VOLLEYBALL_CHRISTIAN_GROUPS_REPAIR='+JSON.stringify(p));
          NODE
