name: One-shot M7 finalization plan

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-finalization-plan-once.yml

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read zero-write M7 finalization plan
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-finalization-plan-7bc9c3e42f6a4f8b'
          ready=0
          for attempt in $(seq 1 40); do
            code=$(curl -sS --max-time 240 -o plan.json -w '%{http_code}' "$URL" || true)
            echo "M7_FINALIZATION_PLAN attempt=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ] && [ "$code" != "500" ]; then cat plan.json || true; exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const p=require('./plan.json');
          const duplicateLosers=(p.duplicates?.merges||[]).reduce((n,row)=>n+(row.loser_ids||[]).length,0);
          const out={
            safe_to_execute:p.safe_to_execute,
            fingerprint:p.plan_fingerprint,
            d1:p.d1,
            local_team_count:p.local_team_count,
            duplicates:{merges:p.duplicates?.merges?.length||0,losers:duplicateLosers,blocked:p.duplicates?.blocked?.length||0,rows:p.duplicates?.merges||[]},
            orphans:{attachments:p.orphans?.attachments?.length||0,blocked:p.orphans?.blocked?.length||0,rows:p.orphans?.attachments||[]},
            coordinates:{updates:p.coordinates?.updates?.length||0,blocked:p.coordinates?.blocked?.length||0},
            membership:{change_count:p.membership?.plan?.change_count||0,changes:p.membership?.plan?.changes||[],unmatched:p.membership?.plan?.unmatched?.length||0,ambiguous:p.membership?.plan?.ambiguous?.length||0},
            write_scope:p.write_scope
          };
          console.log('M7_FINALIZATION_PLAN='+JSON.stringify(out));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Finalization planner wrote to D1');
          if(!p.plan_fingerprint?.startsWith('m7-finalize-')) throw new Error('Missing finalization fingerprint');
          NODE
