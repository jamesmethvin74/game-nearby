name: Production statewide smoke

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/production-statewide-smoke.yml

permissions:
  contents: read

jobs:
  m10-bounded-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch read-only M10 production verification
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m10-production-verify-20260915-4e81b7c2'
          code=$(curl -sS --max-time 60 -w '%{http_code}' "$URL" -o result.json)
          cat result.json
          echo
          echo "HTTP $code"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('result.json','utf8'));
          if(body.status!=='PASS') throw new Error(`verification status ${body.status}`);
          const v=body.verification||{};
          const expected={
            expected_teams:1220,
            explicit_memberships:1220,
            member:1190,
            independent:1,
            unknown:29,
            missing_memberships:0,
            invalid_memberships:0,
            conference_pointer_mismatches:0,
            nonmember_pointer_mismatches:0,
            unexplained_record_contradictions:0
          };
          for(const [key,value] of Object.entries(expected)) {
            if(Number(v[key])!==value) throw new Error(`${key}: ${v[key]} != ${value}`);
          }
          if(Number(body.d1?.rows_written||0)!==0) throw new Error('verification wrote rows');
          console.log('M10 bounded production verification PASS');
          NODE
