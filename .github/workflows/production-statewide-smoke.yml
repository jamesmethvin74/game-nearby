name: Production API post-37 diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-statewide-smoke.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live core routes
        shell: bash
        run: |
          set +e
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          probe() {
            path="$1"
            echo
            echo "============================================================"
            echo "GET $path"
            echo "============================================================"
            curl -sS -i --max-time 30 "$API$path"
            echo
          }
          probe "/api/v1/health"
          probe "/api/v1/schools"
          probe "/api/v1/games?lat=36.329374987912615&lon=-93.43432233996029&radius=5&since=2026-08-20T00%3A00%3A00.000Z&until=2026-08-22T00%3A00%3A00.000Z"
          exit 0
