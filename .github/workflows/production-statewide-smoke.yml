name: Production statewide smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-statewide-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for statewide production catalog
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          rm -f schools.json

          for attempt in $(seq 1 20); do
            echo "Catalog attempt ${attempt}/20"
            code=$(curl -sS --max-time 180 -o schools.tmp -w '%{http_code}' "$API/api/v1/schools" || true)
            if [ "$code" = "200" ]; then
              count=$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("schools.tmp","utf8")); console.log(Array.isArray(p.schools)?p.schools.length:0)')
              echo "Visible schools: $count"
              if [ "$count" -ge 100 ]; then
                mv schools.tmp schools.json
                break
              fi
            else
              echo "HTTP $code"
            fi
            sleep 15
          done

          test -f schools.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('schools.json','utf8'));
          const schools = Array.isArray(payload.schools) ? payload.schools : [];
          const canonicalName = school => String(school.location_matched_name || school.name || '').trim();
          if (schools.length < 100) throw new Error(`Expected at least 100 visible statewide schools, got ${schools.length}`);
          for (const name of ['Green Forest High School','Eureka Springs High School','Valley Springs High School']) {
            if (!schools.some(s => canonicalName(s).toLowerCase() === name.toLowerCase())) throw new Error(`Missing production school: ${name}`);
          }
          const valley = schools.find(s => canonicalName(s).toLowerCase() === 'valley springs high school');
          if (!valley) throw new Error('Valley Springs High School is missing from production');
          if (valley.catalog_scope !== 'local') throw new Error(`Valley Springs catalog_scope is ${valley.catalog_scope}`);
          if (!(Number(valley.team_count || 0) > 0)) throw new Error(`Valley Springs team_count is ${valley.team_count}`);
          if (valley.location_matched_name !== 'Valley Springs High School') throw new Error(`Valley Springs authoritative GIS name is ${valley.location_matched_name}`);
          console.log(`Production statewide catalog verified with ${schools.length} visible schools; Valley Springs is local and active.`);
          NODE

      - name: Prove real non-pilot nearby game
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS --max-time 60 \
            "$API/api/v1/games?lat=36.329374987912615&lon=-93.43432233996029&radius=5&since=2026-08-20T00%3A00%3A00.000Z&until=2026-08-22T00%3A00%3A00.000Z" \
            -o nearby.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('nearby.json','utf8'));
          const games = Array.isArray(payload.games) ? payload.games : [];
          const expected = new Set(['Green Forest High School','Eureka Springs High School']);
          const match = games.find(game => {
            const names = new Set([game.school_name, game.opponent]);
            return [...expected].every(name => names.has(name));
          });
          if (!match) throw new Error(`Green Forest/Eureka Springs was not returned by production nearby route. Returned ${games.length} games.`);
          if (!(Number(match.distance_miles) <= 0.1)) throw new Error(`Expected nearby proof at venue point, got ${match.distance_miles} miles.`);
          console.log(`Production nearby proof: ${match.school_name} vs ${match.opponent}, distance ${match.distance_miles} miles, canonical ${match.canonical_event_id || match.id}`);
          NODE

      - name: Verify normalized production schedules
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          rm -f conway.json valley.json

          for attempt in $(seq 1 20); do
            echo "Schedule normalization attempt ${attempt}/20"
            curl -fsS --max-time 60 "$API/api/v1/teams/conway-volleyball-2026/schedule" -o conway.tmp || true
            curl -fsS --max-time 60 "$API/api/v1/teams/df-t5drr3-volleyball-2026/schedule" -o valley.tmp || true
            if node <<'NODE'
          const fs=require('fs');
          try {
            const conway=JSON.parse(fs.readFileSync('conway.tmp','utf8')).games||[];
            const valley=JSON.parse(fs.readFileSync('valley.tmp','utf8')).games||[];
            const lakeside=conway.filter(g=>/lakeside/i.test(String(g.opponent||'')) && String(g.scheduled_at||'').startsWith('2026-08-31T23:00'));
            const melbourne=valley.find(g=>/melbourne/i.test(String(g.opponent||'')));
            process.exit(lakeside.length===1 && lakeside[0].canonical_event_id && lakeside[0].venue==='Buzz Bolding Arena' && Number(lakeside[0].schedule_observation_count)>=2 && lakeside[0].schedule_confirmed_by_school===true && melbourne?.opponent==='Melbourne High School' ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then
              mv conway.tmp conway.json
              mv valley.tmp valley.json
              break
            fi
            sleep 15
          done

          test -f conway.json
          test -f valley.json
          node <<'NODE'
          const fs=require('fs');
          const conway=JSON.parse(fs.readFileSync('conway.json','utf8')).games||[];
          const valley=JSON.parse(fs.readFileSync('valley.json','utf8')).games||[];
          const lakeside=conway.filter(g=>/lakeside/i.test(String(g.opponent||'')) && String(g.scheduled_at||'').startsWith('2026-08-31T23:00'));
          if(lakeside.length!==1) throw new Error(`Expected one Conway/Lakeside schedule row, got ${lakeside.length}`);
          const game=lakeside[0];
          if(!game.canonical_event_id) throw new Error('Conway/Lakeside lost its canonical event id');
          if(game.venue!=='Buzz Bolding Arena') throw new Error(`Expected Buzz Bolding Arena, got ${game.venue}`);
          if(Number(game.schedule_observation_count)<2 || game.schedule_confirmed_by_school!==true) throw new Error('Conway/Lakeside did not retain multi-source confirmation');
          if(valley.some(g=>g.opponent==='MELBOURNE HIGH SCHOOL')) throw new Error('Valley Springs schedule still exposes raw all-caps Melbourne name');
          if(!valley.some(g=>g.opponent==='Melbourne High School')) throw new Error('Valley Springs schedule is missing cleaned Melbourne High School');
          console.log(`Production schedule normalization verified: Conway ${conway.length} rows; Valley Springs ${valley.length} rows.`);
          NODE

      - name: Verify GitHub Pages serves statewide frontend
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APP="https://jamesmethvin74.github.io/game-nearby"
          rm -f live-data.js school-follow-logic.js

          for attempt in $(seq 1 20); do
            echo "Pages attempt ${attempt}/20"
            curl -fsS --max-time 30 "$APP/live-data.js?v=48" -o live-data.tmp || true
            curl -fsS --max-time 30 "$APP/school-follow-logic.js?v=48" -o follow.tmp || true
            if grep -q '/api/v1/schools' live-data.tmp 2>/dev/null \
              && grep -q 'scheduleSourceLabel' live-data.tmp 2>/dev/null \
              && grep -q '/api/v1/games?' live-data.tmp 2>/dev/null \
              && grep -q 'orientEventToFollowedSchool' follow.tmp 2>/dev/null; then
              mv live-data.tmp live-data.js
              mv follow.tmp school-follow-logic.js
              break
            fi
            sleep 15
          done

          test -f live-data.js
          test -f school-follow-logic.js
          echo "GitHub Pages v48 schedule frontend verified."
