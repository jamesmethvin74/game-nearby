name: Production statewide smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-statewide-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose production API layers
        shell: bash
        run: |
          set +e
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"

          probe() {
            path="$1"
            echo
            echo "============================================================"
            echo "GET $path"
            echo "============================================================"
            curl -sS -i --max-time 30 "$API$path"
            echo
          }

          # Control route handled entirely by standings-worker.js before D1/core worker code.
          probe "/api/v1/standings/options?sport=volleyball"

          # D1-backed core route, but does not run the /schools public response filter.
          probe "/api/v1/health"

          # Failing production route.
          probe "/api/v1/schools"

          # Diagnostic run is informational only; preserve logs regardless of HTTP status.
          exit 0
