name: Production statewide smoke

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/production-statewide-smoke.yml

permissions:
  contents: read

jobs:
  m10-final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify final M10 production truth
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m10-final-verify-20260915-6d4c9e21'
          code=$(curl -sS --max-time 60 -w '%{http_code}' "$URL" -o result.json)
          cat result.json
          echo
          echo "HTTP $code"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('result.json','utf8'));
          if(body.status!=='PASS') throw new Error(`verification status ${body.status}`);
          const v=body.verification||{};
          if(Number(v.started_members_missing_materialized_standings)!==0) throw new Error(`started_members_missing_materialized_standings=${v.started_members_missing_materialized_standings}`);
          if(Number(v.unexplained_record_contradictions)!==0) throw new Error(`unexplained_record_contradictions=${v.unexplained_record_contradictions}`);
          if(Number(body.d1?.rows_written||0)!==0) throw new Error(`rows_written=${body.d1?.rows_written}`);
          console.log('M10 final production verification PASS');
          NODE
