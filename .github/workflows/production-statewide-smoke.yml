name: Production statewide smoke

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/production-statewide-smoke.yml

permissions:
  contents: read

jobs:
  m10-missing-standings-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch missing M10 standings members
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m10-missing-standings-20260915-b76f4a91'
          code=$(curl -sS --max-time 60 -w '%{http_code}' "$URL" -o result.json)
          cat result.json
          echo
          echo "HTTP $code"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('result.json','utf8'));
          if(Number(body.missing_count)!==7) throw new Error(`expected 7 missing rows, got ${body.missing_count}`);
          if(Number(body.d1?.rows_written||0)!==0) throw new Error('probe wrote D1 rows');
          console.log('M10 missing-standings probe identified all 7 rows');
          NODE
