name: One-shot approved remaining AAA volleyball membership repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/volleyball-membership-remaining-aaa-diagnostic-once.yml

permissions:
  contents: read

jobs:
  approved-write:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resume remaining AAA repairs with MaxPreps backoff
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          PATH_BASE="/api/v1/maintenance/volleyball-membership/remaining-aaa-approved-20260910-5c1d8e"
          conferences=(
            4a-3 4a-4 4a-6 5a-south
            2a-4 2a-5 2a-7 3a-1 3a-3 3a-5 3a-6 5a-central
            2a-8 3a-4 5a-west
            4a-1 5a-east 6a-west
          )

          health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/v1/health" || true)
          echo "Health HTTP ${health_code}"
          cat health.json || true
          echo
          test "$health_code" = "200"
          node -e "const p=require('./health.json'); if(p.ok!==true||p.service!=='localbleachersar-sports-api') process.exit(1);"

          : > results.ndjson
          for conf in "${conferences[@]}"; do
            echo "=== ${conf} ==="
            code=000
            for attempt in $(seq 1 4); do
              code=$(curl -sS --max-time 90 -o repair.json -w '%{http_code}' "$BASE$PATH_BASE?conference=$conf" || true)
              if [ "$code" = "200" ]; then break; fi
              if [ "$code" = "409" ] && grep -q 'standings source HTTP 403' repair.json; then
                echo "MaxPreps throttled ${conf} on attempt ${attempt}; backing off 30 seconds"
                sleep 30
                continue
              fi
              break
            done
            echo "HTTP ${code}"
            cat repair.json || true
            echo
            test "$code" = "200"

            node - "$conf" <<'NODE' | tee -a results.ndjson
          const fs=require('fs');
          const conf=process.argv[2];
          const p=JSON.parse(fs.readFileSync('repair.json','utf8'));
          if(p.conferenceId!==conf) throw new Error(`conference mismatch ${p.conferenceId} vs ${conf}`);
          const rows=Array.isArray(p.verification)?p.verification:[];
          const expected=`${conf}-volleyball`;
          const success=p.status==='SUCCESS'
            && p.wrong_count===0
            && p.change_count===p.missing_count
            && p.teamWrites===p.change_count
            && p.d1WriteStatements===2
            && Number(p.conferenceWrites)<=1
            && rows.length===p.teamWrites
            && rows.every(row=>row.conference_id===expected && row.expected_conference_id===expected);
          const already=p.status==='ALREADY_APPLIED'
            && p.wrong_count===0
            && p.teamWrites===0
            && p.conferenceWrites===0
            && p.d1WriteStatements===0;
          if(!success && !already) throw new Error(`repair validation failed for ${conf}`);
          console.log(JSON.stringify({
            conferenceId:conf,
            status:p.status,
            change_count:Number(p.change_count||0),
            teamWrites:Number(p.teamWrites||0),
            conferenceWrites:Number(p.conferenceWrites||0),
            unmatched:Number(p.unmatched||0),
            ambiguousCount:Array.isArray(p.ambiguous)?p.ambiguous.length:0,
            verification:rows
          }));
          NODE

            sleep 15
          done

          node <<'NODE'
          const fs=require('fs');
          const rows=fs.readFileSync('results.ndjson','utf8').trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          if(rows.length!==18) throw new Error(`expected 18 conference results, got ${rows.length}`);
          console.log('VOLLEYBALL_REMAINING_AAA_RESUME='+JSON.stringify({
            conferences:rows.length,
            successConferences:rows.filter(row=>row.status==='SUCCESS').length,
            alreadyAppliedConferences:rows.filter(row=>row.status==='ALREADY_APPLIED').length,
            teamWrites:rows.reduce((n,row)=>n+row.teamWrites,0),
            conferenceWrites:rows.reduce((n,row)=>n+row.conferenceWrites,0),
            unmatched:rows.reduce((n,row)=>n+row.unmatched,0),
            ambiguousCount:rows.reduce((n,row)=>n+row.ambiguousCount,0),
            results:rows
          }));
          NODE
