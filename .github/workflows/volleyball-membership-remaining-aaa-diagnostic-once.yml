name: One-shot approved remaining AAA volleyball membership repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - backend/src/logo-bootstrap-worker.js
      - .github/workflows/volleyball-membership-remaining-aaa-diagnostic-once.yml

permissions:
  contents: read

jobs:
  approved-write:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Repair final 6A West conference and verify
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          PATH_BASE="/api/v1/maintenance/volleyball-membership/remaining-aaa-approved-20260910-5c1d8e"
          conf="6a-west"

          health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/v1/health" || true)
          echo "Health HTTP ${health_code}"
          cat health.json || true
          echo
          test "$health_code" = "200"
          node -e "const p=require('./health.json'); if(p.ok!==true||p.service!=='localbleachersar-sports-api') process.exit(1);"

          code=000
          for attempt in $(seq 1 8); do
            code=$(curl -sS --max-time 90 -o repair.json -w '%{http_code}' "$BASE$PATH_BASE?conference=$conf" || true)
            if [ "$code" = "200" ]; then break; fi
            if grep -q 'standings source HTTP 403' repair.json 2>/dev/null; then
              echo "Transient MaxPreps 403 for ${conf}; retry ${attempt}/8 after 15s"
              sleep 15
              continue
            fi
            if [ "$code" = "404" ]; then sleep 5; continue; fi
            break
          done
          echo "HTTP ${code}"
          cat repair.json || true
          echo
          test "$code" = "200"

          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('repair.json','utf8'));
          const rows=Array.isArray(p.verification)?p.verification:[];
          const expected='6a-west-volleyball';
          const success=p.status==='SUCCESS'
            && p.conferenceId==='6a-west'
            && p.wrong_count===0
            && p.change_count===10
            && p.missing_count===10
            && p.teamWrites===10
            && p.d1WriteStatements===2
            && Number(p.conferenceWrites)<=1
            && rows.length===10
            && rows.every(row=>row.conference_id===expected && row.expected_conference_id===expected);
          const already=p.status==='ALREADY_APPLIED'
            && p.conferenceId==='6a-west'
            && p.wrong_count===0
            && p.teamWrites===0
            && p.conferenceWrites===0
            && p.d1WriteStatements===0;
          if(!success && !already) throw new Error('final 6A West repair validation failed');
          console.log('VOLLEYBALL_6A_WEST_FINAL_REPAIR='+JSON.stringify(p));
          NODE
