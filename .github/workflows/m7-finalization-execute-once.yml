name: One-shot M7 finalization execute

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-finalization-execute-once.yml

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify exact plan, execute once, and audit
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          PLAN="$BASE/api/v1/internal/m7-vb-finalization-plan-7bc9c3e42f6a4f8b"
          EXEC="$BASE/api/v1/internal/m7-vb-finalization-execute-d34c08d0f6cf44a8"
          AUDIT="$BASE/api/v1/internal/m7-vb-final-audit-8e04df761c9142f1"
          EXPECTED='m7-finalize-d6fd6ee7'

          code=$(curl -sS --max-time 300 -o preflight.json -w '%{http_code}' "$PLAN")
          echo "M7_CLOSEOUT_PREFLIGHT_HTTP=$code"
          test "$code" = "200" || { cat preflight.json; exit 1; }
          node <<'NODE'
          const p=require('./preflight.json');
          const expected='m7-finalize-d6fd6ee7';
          console.log('M7_CLOSEOUT_PREFLIGHT='+JSON.stringify({safe:p.safe_to_execute,fingerprint:p.plan_fingerprint,d1:p.d1,write_scope:p.write_scope,membership_changes:p.membership?.plan?.changes||[],duplicates:p.duplicates,orphans:p.orphans,coordinates:p.coordinates}));
          if(p.plan_fingerprint!==expected) throw new Error(`Fingerprint changed: ${p.plan_fingerprint}`);
          if(p.safe_to_execute!==true) throw new Error('Closeout plan is not safe');
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Preflight wrote to D1');
          if(Number(p.write_scope?.logical_application_rows)!==204) throw new Error('Closeout logical scope changed');
          if(Number(p.membership?.plan?.change_count)!==4) throw new Error('Membership scope changed');
          if((p.duplicates?.merges||[]).length||(p.orphans?.attachments||[]).length||(p.coordinates?.updates||[]).length) throw new Error('Unexpected canonical mutation entered closeout scope');
          NODE

          code=$(curl -sS --max-time 600 -o result.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"approved_scope":"m7-volleyball-finalization-approved","plan_fingerprint":"m7-finalize-d6fd6ee7"}' \
            "$EXEC")
          echo "M7_CLOSEOUT_EXEC_HTTP=$code"
          cat result.json
          test "$code" = "200"
          node <<'NODE'
          const r=require('./result.json');
          console.log('M7_CLOSEOUT_RESULT='+JSON.stringify({status:r.status,executed_at:r.executed_at,fingerprint:r.plan_fingerprint,planned_write_scope:r.planned_write_scope,membership:{status:r.membership?.status,conferenceWrites:r.membership?.conferenceWrites,teamWrites:r.membership?.teamWrites,change_count:r.membership?.plan?.change_count},records:r.records,verification:r.verification}));
          if(r.status!=='SUCCESS') throw new Error(`Unexpected status ${r.status}`);
          if(Number(r.verification?.membership_changes_remaining)!==0) throw new Error('Membership changes remain after closeout');
          if(Number(r.records?.teams)!==200) throw new Error(`Expected 200 rebuilt teams, got ${r.records?.teams}`);
          NODE

          code=$(curl -sS --max-time 600 -o audit.json -w '%{http_code}' "$AUDIT")
          echo "M7_FINAL_AUDIT_HTTP=$code"
          test "$code" = "200" || { cat audit.json; exit 1; }
          node <<'NODE'
          const a=require('./audit.json');
          console.log('M7_FINAL_AUDIT='+JSON.stringify(a));
          if(Number(a.d1?.rows_written||0)!==0) throw new Error('Final audit wrote to D1');
          if(Number(a.convergence?.d1?.rows_written||0)!==0) throw new Error('Final convergence verification wrote to D1');
          if(Number(a.convergence?.candidates?.total||0)!==0) throw new Error('Safe final-result candidates remain');
          NODE
