name: Finalize statewide results v1

on:
  push:
    branches: [feature/statewide-results-v1]
    paths:
      - ".github/workflows/finalize-results-v1.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/statewide-results-v1
      - name: Finalize record engine
        run: python scripts/finalize_results_v1.py
      - name: Run backend checks
        run: cd backend && npm run check
      - name: Commit finalized results engine
        run: |
          git rm -f .github/workflows/finalize-results-v1.yml scripts/finalize_results_v1.py
          git config user.name "LocalBleachersAR CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize statewide result record engine"
          git push origin HEAD:feature/statewide-results-v1
