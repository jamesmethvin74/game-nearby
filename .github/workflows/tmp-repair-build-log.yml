name: Temporary Cloudflare repair build log reader

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - ".github/workflows/tmp-repair-build-log.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact repair build log
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 "https://localbleachers-ops.methvindigitalworks.com/v1/build-log?build_id=cac01560-e736-4723-ad9e-fceb4b57eb54"
          echo
