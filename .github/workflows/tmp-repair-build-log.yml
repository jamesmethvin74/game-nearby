name: Temporary Cloudflare repair build lookup

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - ".github/workflows/tmp-repair-build-log.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact repair build metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 60 -w '\nHTTP_STATUS=%{http_code}\n' "https://localbleachers-ops.methvindigitalworks.com/v1/build?sha=bdfde6b8bab43ba3e95527b36cb78b350609068c"
