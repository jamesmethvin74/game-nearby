name: M7 final closeout read-only HTTP

on:
  push:
    branches:
      - m7/final-closeout-read-http

jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Marker, exact evidence, and bounded plan
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/m7-final-three-version-9c27e4ad"
          EVIDENCE="$BASE/api/v1/internal/m7-final-four-team-evidence-9c27e4ad"
          PLAN="$BASE/api/v1/internal/m7-final-three-plan-9c27e4ad"

          code=$(curl -sS --max-time 30 -o marker.json -w '%{http_code}' "$MARKER")
          echo "marker HTTP=$code"
          cat marker.json; echo
          test "$code" = "200"
          node <<'NODE'
          const r=require('./marker.json');
          if(r.marker!=='m7-final-three-corrections-v2-bed011f5') throw new Error(`Unexpected marker ${r.marker}`);
          if(r.d1_access!==false) throw new Error('Marker did not prove d1_access=false');
          console.log('MARKER_OK='+JSON.stringify(r));
          NODE

          code=$(curl -sS --max-time 60 -o evidence.json -w '%{http_code}' "$EVIDENCE")
          echo "evidence HTTP=$code"
          cat evidence.json; echo
          test "$code" = "200"
          node <<'NODE'
          const r=require('./evidence.json');
          if(r.fingerprint!=='m7-final-four-team-evidence-v1') throw new Error(`Unexpected evidence fingerprint ${r.fingerprint}`);
          if(Number(r.d1?.rows_written||0)!==0) throw new Error(`Evidence wrote ${r.d1?.rows_written}`);
          if(Number(r.d1?.rows_read||0)>5000) throw new Error(`Evidence read fuse exceeded ${r.d1?.rows_read}`);
          console.log('EVIDENCE_OK='+JSON.stringify(r));
          NODE

          code=$(curl -sS --max-time 60 -o plan.json -w '%{http_code}' "$PLAN")
          echo "plan HTTP=$code"
          cat plan.json; echo
          test "$code" = "200"
          node <<'NODE'
          const r=require('./plan.json');
          if(r.fingerprint!=='m7-final-three-corrections-v2') throw new Error(`Unexpected plan fingerprint ${r.fingerprint}`);
          if(Number(r.d1?.rows_written||0)!==0) throw new Error(`Plan wrote ${r.d1?.rows_written}`);
          if(Number(r.d1?.rows_read||0)>5000) throw new Error(`Plan read fuse exceeded ${r.d1?.rows_read}`);
          console.log('PLAN_OK='+JSON.stringify(r));
          NODE
