name: One-shot volleyball membership dry-run

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/volleyball-membership-dry-run-once.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print bounded membership source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/diagnostics/volleyball-membership"
          code=$(curl -sS --max-time 60 -o membership.json -w '%{http_code}' "$URL" || true)
          echo "Diagnostic HTTP ${code}"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('membership.json','utf8'));
          const plan=p.plan||{};
          console.log('VOLLEYBALL_MEMBERSHIP_SOURCE_DIAGNOSTIC='+JSON.stringify({
            status:p.status,
            discoveredConferences:p.discoveredConferences??null,
            selectedConferences:p.selectedConferences??null,
            fetchedConferences:p.fetchedConferences??null,
            failedConferences:p.failedConferences??null,
            conferenceRows:p.conferenceRows??null,
            assignments:p.assignments??null,
            unmatched:p.unmatched??null,
            ambiguousCount:Array.isArray(p.ambiguous)?p.ambiguous.length:null,
            missing_count:Number(plan.missing_count||0),
            wrong_count:Number(plan.wrong_count||0),
            change_count:Number(plan.change_count||0)
          }));
          NODE
