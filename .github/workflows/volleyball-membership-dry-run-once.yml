name: One-shot approved volleyball membership repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/volleyball-membership-dry-run-once.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Execute and prove exact approved 4A 5 repair
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/diagnostics/volleyball-membership/repair-4a5-20260909-7f31d2"
          code=$(curl -sS --max-time 60 -o membership.json -w '%{http_code}' "$URL" || true)
          echo "Repair HTTP ${code}"
          cat membership.json
          echo
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('membership.json','utf8'));
          const expectedIds=[
            'df-vvme46-volleyball-2026',
            'df-y85lbp-volleyball-2026'
          ].sort();
          const rows=Array.isArray(p.verification?.rows)?p.verification.rows:[];
          const ids=rows.map(row=>String(row.team_id)).sort();
          const exactIds=JSON.stringify(ids)===JSON.stringify(expectedIds);
          const memberships=rows.length===2 && rows.every(row=>row.conference_id==='4a-5-volleyball');
          const ok=p.status==='SUCCESS'
            && p.verification?.ok===true
            && p.approvedScope?.conference_id==='4a-5'
            && Number(p.plan?.change_count)===2
            && Number(p.teamWrites)===2
            && Number(p.conferenceWrites)<=1
            && exactIds
            && memberships;
          if(!ok){
            console.error('Approved repair verification failed',JSON.stringify({
              status:p.status,
              plan_change_count:p.plan?.change_count,
              teamWrites:p.teamWrites,
              conferenceWrites:p.conferenceWrites,
              verification:p.verification,
              approvedScope:p.approvedScope
            }));
            process.exit(1);
          }
          console.log('VOLLEYBALL_4A5_REPAIR_VERIFIED='+JSON.stringify({
            status:p.status,
            plan_change_count:p.plan.change_count,
            teamWrites:p.teamWrites,
            conferenceWrites:p.conferenceWrites,
            rows
          }));
          NODE
