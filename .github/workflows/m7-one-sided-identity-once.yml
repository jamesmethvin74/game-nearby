name: One-shot M7 one-sided identity diagnostic

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-one-sided-identity-once.yml

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run zero-write one-sided identity planner
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-one-sided-identity-36ea42b0ea994312'
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 240 -o identity.json -w '%{http_code}' "$URL" || true)
            echo "M7_IDENTITY_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then cat identity.json || true; exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const p=require('./identity.json');
          console.log('M7_IDENTITY_D1='+JSON.stringify(p.d1||{}));
          console.log('M7_IDENTITY_AUTHORITY='+JSON.stringify(p.authority||{}));
          console.log('M7_IDENTITY_COUNTS='+JSON.stringify(p.counts||{}));
          console.log('M7_IDENTITY_UNIQUE='+JSON.stringify(p.unique_opponents||[]));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Identity planner wrote to D1');
          if(Number(p.d1?.rows_read||0)>10000) throw new Error(`Identity planner read too much: ${p.d1.rows_read}`);
          NODE
