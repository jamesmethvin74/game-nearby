name: One-shot corrected M7 volleyball audit

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-corrected-volleyball-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run corrected zero-write production audit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-audit-7e49c2a1bd6f4083'
          code=$(curl -sS --retry 2 --retry-delay 2 --max-time 300 -o m7-corrected-audit.json -w '%{http_code}' "$URL")
          echo "M7_AUDIT_HTTP=$code"
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('m7-corrected-audit.json','utf8'));
          const d1=payload.d1||{};
          const summary=payload.summary||{};
          const gaps=payload.final_gap_plan||{};
          const corrections=payload.audit_corrections||{};
          console.log('M7_AUDIT_D1='+JSON.stringify(d1));
          console.log('M7_AUDIT_SUMMARY='+JSON.stringify(summary));
          console.log('M7_AUDIT_CORRECTIONS='+JSON.stringify({
            published_identity_assignment_team_count:(corrections.published_identity_assignment_team_ids||[]).length,
            membership_unmatched_count:(corrections.membership_unmatched||[]).length,
            membership_ambiguous_count:(corrections.membership_ambiguous||[]).length,
            membership_unmatched:corrections.membership_unmatched||[],
            membership_ambiguous:corrections.membership_ambiguous||[]
          }));
          const counts={};
          for(const [type,group] of Object.entries(payload.exceptions_by_deficiency||{})) counts[type]=group.count;
          console.log('M7_DEFICIENCY_COUNTS='+JSON.stringify(counts));
          console.log('M7_GAP_SUMMARY='+JSON.stringify({
            unique_actionable_contests:gaps.unique_actionable_contests||0,
            by_type:gaps.by_type||{},
            unresolved_identity_finals:gaps.unresolved_identity_finals||0
          }));
          console.log('M7_GAP_DATE_COHORTS='+JSON.stringify(gaps.date_cohorts||[]));
          const priority=new Set(['external_final_score_conflict','stale_scheduled_external_final','missing_externally_published_final']);
          const first=(gaps.date_cohorts||[]).find(row=>Object.keys(row.by_type||{}).some(type=>priority.has(type)));
          const firstRows=first?(gaps.exact_contests||[]).filter(row=>row.local_date===first.local_date && priority.has(row.type)):[];
          console.log('M7_FIRST_FINAL_COHORT='+JSON.stringify({local_date:first?.local_date||null,rows:firstRows}));
          if(Number(d1.rows_written||0)!==0) throw new Error(`Audit wrote ${d1.rows_written} D1 rows`);
          NODE
          test "$code" = "200"
