name: ONE_TRUTH targeted mismatch diagnostic
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/one-truth-diagnostic.yml
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve production evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --max-time 90 -fsS "$BASE/api/v1/internal/one-truth-audit-20260919-7c4b1d9e3" > /tmp/audit.json
          for school in df-7ds5mt df-jys3ef df-rpnt3m; do
            curl --max-time 30 -fsS "$BASE/api/v1/schools/$school/schedule?diagnostic=one-truth" > "/tmp/$school.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const teamIds=new Set([
            'df-7ds5mt-volleyball-2026',
            'df-jys3ef-football-2026',
            'df-rpnt3m-volleyball-2026'
          ]);
          const issues=(audit.statewide_audit?.issues||[]).filter(x=>teamIds.has(String(x.team_id||'')));
          const schedules={};
          for(const school of ['df-7ds5mt','df-jys3ef','df-rpnt3m']){
            const body=JSON.parse(fs.readFileSync('/tmp/'+school+'.json','utf8'));
            schedules[school]={
              team_statuses:(body.team_statuses||[]).filter(x=>teamIds.has(String(x.team_id||''))),
              games:(body.games||[]).filter(x=>teamIds.has(String(x.team_id||''))).map(g=>({
                id:g.id,canonical_event_id:g.canonical_event_id,scheduled_at:g.scheduled_at,
                opponent:g.opponent,opponent_school_id:g.opponent_school_id,status:g.status,
                team_score:g.team_score,opponent_score:g.opponent_score,result:g.result,
                counts_for_record:g.counts_for_record,source_id:g.source_id,parser_type:g.parser_type
              }))
            };
          }
          const payload={
            marker:'ONE_TRUTH_TARGETED_MISMATCH_DIAGNOSTIC_20260919',
            audit_status:audit.status,
            issues,
            source_vs_truth:(audit.statewide_audit?.source_vs_truth?.issues||[]).filter(x=>teamIds.has(String(x.team_id||''))),
            schedules
          };
          fs.writeFileSync('/tmp/diag.md','### ONE_TRUTH targeted mismatch diagnostic\n\n```json\n'+JSON.stringify(payload,null,2)+'\n```');
          NODE
          gh pr comment 366 --repo jamesmethvin74/game-nearby --body-file /tmp/diag.md
