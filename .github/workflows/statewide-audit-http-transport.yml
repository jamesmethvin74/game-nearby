name: Statewide Audit One-Shot HTTP Transport

on:
  push:
    paths:
      - ".github/workflows/statewide-audit-http-transport.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - name: Run protected statewide read-only audit
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/coverage-report?view=data-integrity"
          HTTP_STATUS="$(curl -sS --max-time 300 -o statewide-audit.json -w '%{http_code}'             -H "x-refresh-token: $REFRESH_TOKEN"             -H 'accept: application/json'             -H 'cache-control: no-store'             "$URL")"
          echo "STATEWIDE_AUDIT_HTTP_STATUS=$HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            cat statewide-audit.json || true
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("statewide-audit.json","utf8"));
            const written=Number(p?.d1?.rows_written ?? p?.d1?.rowsWritten ?? 0);
            if(written!==0) throw new Error("Read-only audit reported rows_written="+written);
            if(!p?.audit_version) throw new Error("Audit result missing audit_version");
            console.log("STATEWIDE_AUDIT_VERSION="+p.audit_version);
            console.log("STATEWIDE_AUDIT_ROWS_WRITTEN="+written);
          '

      - name: Upload statewide audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: statewide-audit-json
          path: statewide-audit.json
          if-no-files-found: error
          retention-days: 1
