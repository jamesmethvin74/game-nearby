name: M8 reapply two bounded volleyball finals

on:
  push:
    branches:
      - m8/results-completeness-20260914
    paths:
      - .github/workflows/m8-reapply-two-volleyball-finals.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preflight, execute exact repair, and verify four affected teams
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          PLAN="$BASE/api/v1/internal/final-missing-score-plan-20260912-4fd5a1c7"
          EXEC="$BASE/api/v1/internal/final-missing-score-execute-20260912-4fd5a1c7"

          curl -fsS --max-time 30 "$PLAN" -o plan-before.json
          jq -e '.safe == true' plan-before.json >/dev/null
          jq -e '([.cases[].key] | sort) == (["central-forrest-city-20260825","farmington-huntsville-20260825"] | sort)' plan-before.json >/dev/null
          jq -e '[.cases[].action] | all(. == "apply_canonical_resolution" or . == "already_complete")' plan-before.json >/dev/null
          fingerprint=$(jq -r '.fingerprint' plan-before.json)
          test -n "$fingerprint"

          curl -fsS --max-time 45 -X POST \
            -H 'content-type: application/json' \
            --data "{\"fingerprint\":\"$fingerprint\"}" \
            "$EXEC" -o execute.json

          jq -e '.status == "SUCCESS" or .status == "ALREADY_COMPLETE"' execute.json >/dev/null
          if jq -e '.status == "SUCCESS"' execute.json >/dev/null; then
            jq -e '(.direct_write_telemetry.canonical_rows_written|tonumber) <= 2' execute.json >/dev/null
            jq -e '(.direct_write_telemetry.game_rows_written|tonumber) == 0' execute.json >/dev/null
            jq -e '(.direct_write_telemetry.conflict_rows_written|tonumber) == 0' execute.json >/dev/null
          fi

          curl -fsS --max-time 30 "$PLAN" -o plan-after.json
          jq -e '.safe == true and ([.cases[].action] | all(. == "already_complete"))' plan-after.json >/dev/null

          node <<'NODE'
          const fs=require('fs');
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const cases=[
            {
              key:'central-forrest-city-20260825',
              canonicalId:'ce:volleyball:girls:2026:df-7kza8c:df-cqpax3:20260825:df-695fcf130e0845562900001c',
              teams:['df-cqpax3-volleyball-2026','df-7kza8c-volleyball-2026'],
              canonicalHome:'df-cqpax3-volleyball-2026',
              homeScore:0,
              awayScore:3
            },
            {
              key:'farmington-huntsville-20260825',
              canonicalId:'ce:volleyball:girls:2026:df-8pkud7:df-qgka87:20260825:df-69babe474fd8441434000004',
              teams:['df-8pkud7-volleyball-2026','df-qgka87-volleyball-2026'],
              canonicalHome:'df-8pkud7-volleyball-2026',
              homeScore:0,
              awayScore:3
            }
          ];
          const fetchJson=async url=>{
            const r=await fetch(url,{headers:{accept:'application/json'}});
            if(!r.ok) throw new Error(`${url} HTTP ${r.status}`);
            return r.json();
          };
          const result=[];
          for(const c of cases){
            for(const teamId of c.teams){
              const schedule=await fetchJson(`${BASE}/api/v1/teams/${encodeURIComponent(teamId)}/schedule`);
              const record=await fetchJson(`${BASE}/api/v1/teams/${encodeURIComponent(teamId)}/record`);
              const games=Array.isArray(schedule.games)?schedule.games:[];
              const target=games.find(g=>g.canonical_event_id===c.canonicalId);
              if(!target) throw new Error(`${teamId}: target canonical event missing`);
              if(String(target.status||'').toUpperCase()!=='FINAL') throw new Error(`${teamId}: target not FINAL`);
              if(target.team_score==null || target.opponent_score==null) throw new Error(`${teamId}: target score incomplete`);
              const teamScore=Number(target.team_score), oppScore=Number(target.opponent_score);
              if(!Number.isFinite(teamScore)||!Number.isFinite(oppScore)) throw new Error(`${teamId}: target score nonnumeric`);
              const expectedTeamScore=teamId===c.canonicalHome?c.homeScore:c.awayScore;
              const expectedOppScore=teamId===c.canonicalHome?c.awayScore:c.homeScore;
              if(teamScore!==expectedTeamScore || oppScore!==expectedOppScore) throw new Error(`${teamId}: expected ${expectedTeamScore}-${expectedOppScore}, got ${teamScore}-${oppScore}`);

              const expected={wins:0,losses:0,ties:0,conference_wins:0,conference_losses:0,conference_ties:0};
              for(const g of games){
                if(String(g.status||'').toUpperCase()!=='FINAL' || Number(g.counts_for_record||0)===0 || g.team_score==null || g.opponent_score==null) continue;
                const a=Number(g.team_score),b=Number(g.opponent_score);
                if(!Number.isFinite(a)||!Number.isFinite(b)) continue;
                const suffix=a===b?'ties':a>b?'wins':'losses';
                expected[suffix]++;
                if(Number(g.conference_game||0)===1) expected[`conference_${suffix}`]++;
              }
              const actual=record.record||{};
              for(const field of Object.keys(expected)) {
                if(Number(actual[field]||0)!==expected[field]) throw new Error(`${teamId}: record ${field} expected ${expected[field]}, got ${actual[field]}`);
              }
              result.push({team_id:teamId,school_name:schedule.school_name||schedule.team?.school_name||null,target_score:`${teamScore}-${oppScore}`,record:actual});
            }
          }
          if(result.length!==4) throw new Error(`Expected 4 verified teams, got ${result.length}`);
          fs.writeFileSync('verification.json',JSON.stringify({verified_teams:result},null,2));
          console.log(JSON.stringify({verified_teams:result},null,2));
          NODE

      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-two-volleyball-finals-repair
          path: |
            plan-before.json
            execute.json
            plan-after.json
            verification.json
          if-no-files-found: warn
          retention-days: 1
