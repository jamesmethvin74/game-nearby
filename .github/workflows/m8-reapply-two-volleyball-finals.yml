name: M8 verify four repaired volleyball teams

on:
  push:
    branches:
      - m8/results-completeness-20260914
    paths:
      - .github/workflows/m8-reapply-two-volleyball-finals.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify repaired canonicals and four affected team records only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          PLAN="$BASE/api/v1/internal/final-missing-score-plan-20260912-4fd5a1c7"

          curl -fsS --max-time 30 "$PLAN" -o plan-after.json
          jq -e '.safe == true and ([.cases[].action] | all(. == "already_complete"))' plan-after.json >/dev/null
          jq -e '.d1.rows_written == 0' plan-after.json >/dev/null

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const cases=[
            {
              canonicalId:'ce:volleyball:girls:2026:df-7kza8c:df-cqpax3:20260825:df-695fcf130e0845562900001c',
              teams:[
                {teamId:'df-7kza8c-volleyball-2026',score:[3,0],record:{wins:2,losses:3,ties:0,conference_wins:0,conference_losses:0,conference_ties:0}},
                {teamId:'df-cqpax3-volleyball-2026',score:[0,3],record:{wins:0,losses:5,ties:0,conference_wins:0,conference_losses:1,conference_ties:0}}
              ]
            },
            {
              canonicalId:'ce:volleyball:girls:2026:df-8pkud7:df-qgka87:20260825:df-69babe474fd8441434000004',
              teams:[
                {teamId:'df-8pkud7-volleyball-2026',score:[0,3],record:{wins:3,losses:4,ties:0,conference_wins:1,conference_losses:1,conference_ties:0}},
                {teamId:'df-qgka87-volleyball-2026',score:[3,0],record:{wins:10,losses:3,ties:0,conference_wins:1,conference_losses:0,conference_ties:0}}
              ]
            }
          ];
          const fetchJson=async url=>{
            const response=await fetch(url,{headers:{accept:'application/json'}});
            if(!response.ok) throw new Error(`${url} HTTP ${response.status}`);
            return response.json();
          };
          const verified=[];
          for(const c of cases){
            for(const expected of c.teams){
              const schedule=await fetchJson(`${BASE}/api/v1/teams/${encodeURIComponent(expected.teamId)}/schedule`);
              const recordPayload=await fetchJson(`${BASE}/api/v1/teams/${encodeURIComponent(expected.teamId)}/record`);
              const games=Array.isArray(schedule.games)?schedule.games:[];
              const target=games.find(g=>g.canonical_event_id===c.canonicalId);
              if(!target) throw new Error(`${expected.teamId}: target canonical event missing`);
              const score=[Number(target.team_score),Number(target.opponent_score)];
              if(String(target.status||'').toUpperCase()!=='FINAL' || target.team_score==null || target.opponent_score==null) throw new Error(`${expected.teamId}: target is not a complete FINAL`);
              if(score[0]!==expected.score[0] || score[1]!==expected.score[1]) throw new Error(`${expected.teamId}: expected ${expected.score.join('-')}, got ${score.join('-')}`);
              const actual=recordPayload.record||{};
              for(const [field,value] of Object.entries(expected.record)) {
                if(Number(actual[field]||0)!==value) throw new Error(`${expected.teamId}: ${field} expected ${value}, got ${actual[field]}`);
              }
              verified.push({team_id:expected.teamId,target_score:score.join('-'),record:expected.record});
            }
          }
          if(verified.length!==4) throw new Error(`Expected 4 verified teams, got ${verified.length}`);
          fs.writeFileSync('verification.json',JSON.stringify({verified_teams:verified},null,2));
          console.log(JSON.stringify({verified_teams:verified},null,2));
          NODE

      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-four-team-volleyball-verification
          path: |
            plan-after.json
            verification.json
          if-no-files-found: warn
          retention-days: 1
