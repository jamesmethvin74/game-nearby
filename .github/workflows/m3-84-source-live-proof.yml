name: M3 Little Rock schedule markup proof

on:
  pull_request:
    branches:
      - feature/m3-arkansas-college-coverage
    paths:
      - .github/workflows/m3-84-source-live-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Capture current Little Rock schedule structures
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          urls={
            'soccer_grid':'https://lrtrojans.com/sports/womens-soccer/schedule/2026?grid=true',
            'volleyball_grid':'https://lrtrojans.com/sports/womens-volleyball/schedule/2026?grid=true',
            'mbb_current':'https://lrtrojans.com/sports/mens-basketball/schedule/',
            'wbb_current':'https://lrtrojans.com/sports/womens-basketball/schedule/'
          }
          for name,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'LocalBleachersAR-M3-source-proof/1.0','Accept':'text/html,application/xhtml+xml'})
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              print(f'===== {name} STATUS={r.status} URL={r.geturl()} LEN={len(body)} =====')
              for needle in ['<table','schedule','August 15','Jackson State','Oct 17']:
                idx=body.lower().find(needle.lower())
                print(f'--- {needle} idx={idx} ---')
                if idx>=0: print(body[max(0,idx-2500):idx+8500])
          PY
