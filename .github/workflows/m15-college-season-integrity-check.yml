name: M15 college season integrity check

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-college-season-integrity-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted college season tests
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          node --test test/schedule-response-normalizer.test.js test/sidearm-modern.test.js

      - name: Audit every Arkansas college public schedule
        env:
          BASE_URL: https://localbleachersar-sports-api.james-methvin74.workers.dev
        run: |
          cat > /tmp/audit.mjs <<'NODE'
          const base=process.env.BASE_URL;
          const cacheBust=Date.now();
          const catalogResponse=await fetch(`${base}/api/v1/schools?integrity=${cacheBust}`,{headers:{'cache-control':'no-cache'}});
          if(!catalogResponse.ok) throw new Error(`catalog HTTP ${catalogResponse.status}`);
          const catalog=await catalogResponse.json();
          const colleges=(catalog.schools||[]).filter(s=>String(s.level||'').toLowerCase()==='college');
          const nonRecord=/\b(?:benefit game|exhibition|scrimmage|jamboree|meet the cats)\b/i;
          const terminal=new Set(['FINAL','CANCELED','CANCELLED','POSTPONED']);
          const problems=[];
          const summaries=[];

          for(let offset=0;offset<colleges.length;offset+=8){
            const chunk=colleges.slice(offset,offset+8);
            const results=await Promise.all(chunk.map(async school=>{
              const response=await fetch(`${base}/api/v1/schools/${encodeURIComponent(school.id)}/schedule?integrity=${cacheBust}`,{headers:{'cache-control':'no-cache'}});
              if(!response.ok) return {school,error:`HTTP ${response.status}`};
              return {school,payload:await response.json()};
            }));

            for(const item of results){
              if(item.error){
                problems.push({school_id:item.school.id,school_name:item.school.name,code:'SCHEDULE_FETCH_FAILED',detail:item.error});
                continue;
              }
              const games=Array.isArray(item.payload.games)?item.payload.games:[];
              summaries.push({school_id:item.school.id,school_name:item.school.name,games:games.length});

              const byTeam=new Map();
              for(const game of games){
                const key=[game.reporting_team_id||game.team_id||'',game.sport||'',game.gender||'',game.season||''].join('|');
                if(!byTeam.has(key)) byTeam.set(key,[]);
                byTeam.get(key).push(game);

                const descriptive=[game.notes,game.opponent,game.venue,game.location_text].filter(Boolean).join(' ');
                if(nonRecord.test(descriptive)){
                  problems.push({
                    school_id:item.school.id,school_name:item.school.name,code:'NON_RECORD_EVENT_VISIBLE',
                    sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent
                  });
                }
                if(Number(game.counts_for_record)===0 && ['sidearm','dragonfly-public'].includes(String(game.parser_type||'').toLowerCase())){
                  problems.push({
                    school_id:item.school.id,school_name:item.school.name,code:'EXPLICIT_NON_RECORD_FLAG_VISIBLE',
                    sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent
                  });
                }
              }

              for(const [teamKey,rows] of byTeam){
                const finals=rows.filter(g=>String(g.status||'').toUpperCase()==='FINAL' && g.team_score!=null && g.opponent_score!=null)
                  .map(g=>Date.parse(g.scheduled_at||g.canonical_scheduled_at)).filter(Number.isFinite);
                if(!finals.length) continue;
                const firstFinal=Math.min(...finals);
                for(const game of rows){
                  const when=Date.parse(game.scheduled_at||game.canonical_scheduled_at);
                  if(!Number.isFinite(when)||when>=firstFinal) continue;
                  const status=String(game.status||'').toUpperCase();
                  if(terminal.has(status)) continue;
                  if(game.team_score!=null||game.opponent_score!=null||String(game.result||'').trim()) continue;
                  problems.push({
                    school_id:item.school.id,school_name:item.school.name,code:'PREFINAL_SCORELESS_NONTERMINAL_VISIBLE',
                    team_key:teamKey,sport:game.sport,gender:game.gender,scheduled_at:game.scheduled_at,opponent:game.opponent,status:game.status
                  });
                }
              }
            }
          }

          const uca=await fetch(`${base}/api/v1/schools/uca/schedule?integrity=uca-${cacheBust}`,{headers:{'cache-control':'no-cache'}}).then(r=>r.json());
          const ucaVolleyball=(uca.games||[]).filter(g=>String(g.sport||'').toLowerCase()==='volleyball');
          const ucaOpponents=ucaVolleyball.map(g=>g.opponent);
          const ucaProof={
            hasArkansasTech:ucaOpponents.some(x=>/Arkansas Tech/i.test(String(x))),
            hasMissouriState:ucaOpponents.some(x=>/Missouri State/i.test(String(x))),
            hasDenver:ucaOpponents.some(x=>/^Denver$/i.test(String(x))),
            firstFive:ucaVolleyball.slice(0,5).map(g=>({scheduled_at:g.scheduled_at,opponent:g.opponent,status:g.status,result:g.result}))
          };

          console.log('COLLEGE_SCHEDULE_AUDIT='+JSON.stringify({
            colleges:colleges.length,
            schedules_checked:summaries.length,
            total_games:summaries.reduce((n,s)=>n+s.games,0),
            problems,
            ucaProof
          }));

          if(problems.length) throw new Error(`college schedule integrity defects remain: ${JSON.stringify(problems.slice(0,20))}`);
          if(ucaProof.hasArkansasTech||ucaProof.hasMissouriState||!ucaProof.hasDenver){
            throw new Error(`UCA regular-season boundary still wrong: ${JSON.stringify(ucaProof)}`);
          }
          NODE
          node /tmp/audit.mjs
