name: Harrison Mountain Home audit HTTP

on:
  push:
    branches:
      - volleyball/harrison-mh-audit-http

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact production audit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/harrison-mountain-home-audit-42f7c9b1'
          for i in $(seq 1 20); do
            code=$(curl -sS --max-time 30 -o audit.json -w '%{http_code}' "$URL" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "${code:-}" = "200"
          cat audit.json
          node <<'NODE'
          const r=require('./audit.json');
          if(r.fingerprint!=='harrison-mountain-home-audit-v1') throw new Error(JSON.stringify(r));
          if(Number(r.d1?.rows_written||0)!==0) throw new Error('audit wrote to D1');
          if(Number(r.d1?.rows_read||0)>500) throw new Error(`read fuse ${r.d1?.rows_read}`);
          console.log('\nAUDIT_OK='+JSON.stringify(r));
          NODE
