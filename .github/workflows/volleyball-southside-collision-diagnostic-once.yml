name: One-shot Southside volleyball identity diagnostic

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - backend/src/logo-bootstrap-worker.js
      - .github/workflows/volleyball-southside-collision-diagnostic-once.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch zero-write Southside identity rows
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          URL="$BASE/api/v1/diagnostics/volleyball-membership/southside-collision-20260910-73e29c"
          code=000
          for attempt in $(seq 1 18); do
            code=$(curl -sS --max-time 30 -o result.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo "HTTP ${code}"
          cat result.json || true
          echo
          test "$code" = "200"
          node <<'NODE'
          const p=require('./result.json');
          if(p.status!=='DIAGNOSTIC'||p.d1Statements!==0||p.teamWrites!==0||p.conferenceWrites!==0) process.exit(1);
          console.log('VOLLEYBALL_SOUTHSIDE_IDENTITY='+JSON.stringify(p));
          NODE
