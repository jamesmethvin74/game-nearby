name: DragonFly Raw Audit Transport
on:
  push:
    branches:
      - "feature/live-sports-pipeline-m1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and audit fixed DragonFly statewide feeds
        shell: bash
        run: |
          cat > ./.dragonfly-raw-audit.mjs <<'NODE'
          import { fetchDragonFlyPagedPayload } from "./backend/src/dragonfly-feed.js";
          import { buildCertifiedStatewideRows } from "./backend/src/dragonfly-certified-statewide.js";
          import { STATEWIDE_HIGH_SCHOOL_SPORTS } from "./backend/src/statewide-sport-config.js";
          import { certifiedTargetSchoolIds } from "./backend/src/dragonfly-certified-sport-catalog.js";
          import inventoryNames from "./backend/data/arkansas-high-school-team-inventory-names.json" with { type: "json" };

          const targets = STATEWIDE_HIGH_SCHOOL_SPORTS.filter(c =>
            ["WVB_Varsity","MBB_Varsity","WBB_Varsity"].includes(c.feedCode)
          );
          const now = new Date("2026-09-26T13:36:00.000Z");
          const clean = v => String(v ?? "").replace(/\s+/g," ").trim();
          const num = v => {
            if (v === null || v === undefined || v === "") return null;
            const n = Number(String(v).replace(/[^0-9.-]/g,""));
            return Number.isFinite(n) ? n : null;
          };
          const explicitStatus = e => clean(e?.status?.name || e?.status || e?.gameStatus || e?.state).toUpperCase();
          const finalExplicit = e => /FINAL|COMPLETE|COMPLETED/.test(explicitStatus(e));
          const eventDate = e => clean(e?.date || e?.startDateTime || e?.scheduledAt || e?.startTime || e?.dateTime || e?.eventDateTime || e?.start);
          const participants = e => Array.isArray(e?.participants) ? e.participants : [];
          const hasParticipantResult = e => participants(e).some(p => p?.result && typeof p.result === "object");
          const hasResultsArray = e => Array.isArray(e?.results) && e.results.length > 0;
          const legacyScores = e => [
            e?.homeScore,e?.awayScore,e?.visitorScore,
            e?.score?.home,e?.score?.away,e?.home?.score,e?.away?.score,
            e?.home_team?.score,e?.away_team?.score
          ].map(num).filter(v => v !== null);
          const hasLegacy = e => legacyScores(e).length > 0;
          const anyScoreResult = e => hasParticipantResult(e) || hasResultsArray(e) || hasLegacy(e);
          const providerStatusFinal = e => finalExplicit(e);
          const participantPair = e => {
            const ps = participants(e);
            if (ps.length < 2) return false;
            for (let i=0;i<ps.length;i++) {
              const own=num(ps[i]?.result?.score);
              const oppExplicit=num(ps[i]?.result?.opponentScore);
              const other=ps.find((_,j)=>j!==i);
              const opp=oppExplicit ?? num(other?.result?.score);
              if (own!==null && opp!==null) return true;
            }
            return false;
          };
          const resultsPair = e => {
            const rs=Array.isArray(e?.results)?e.results:[];
            if (rs.length<1) return false;
            const scores=[];
            for(const r of rs){
              for(const v of [r?.score,r?.teamScore,r?.homeScore,r?.awayScore,r?.points]) {
                const n=num(v); if(n!==null) scores.push(n);
              }
            }
            return scores.length>=2;
          };
          const legacyPair = e => legacyScores(e).length>=2;
          const finalWithBothUsable = e => providerStatusFinal(e) && (participantPair(e)||resultsPair(e)||legacyPair(e));
          const safe = value => clean(value).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

          const out={audited_at:now.toISOString(), sports:{}};
          for(const config of targets){
            const fetched=await fetchDragonFlyPagedPayload(config.feedUrl,{
              headers:{"user-agent":"LocalBleachersAR-dragonfly-raw-audit/1.0","accept":"application/json"}
            });
            const payload=fetched.payload;
            const schedule=Array.isArray(payload?.schedule)?payload.schedule:[];
            const teamIds=[...new Set(schedule.flatMap(e=>participants(e).map(p=>clean(p?.team?.teamId)).filter(Boolean)))];
            const mappings=teamIds.map(id=>({
              external_team_id:id,
              team_id:"audit-team-"+safe(id),
              school_id:"audit-school-"+safe(id),
              source_id:"audit-source-"+safe(id),
              source_url:config.feedUrl,
              school_name:id,
              latitude:null,longitude:null
            }));
            const normalized=buildCertifiedStatewideRows(payload,mappings,config,{checkedAt:now.toISOString()});
            const normalizedFinalKeys=new Set(normalized.games
              .filter(g=>g.status==="FINAL" && g.team_score!==null && g.opponent_score!==null)
              .map(g=>String(g.source_event_key||"")));
            const inferredFinal=e=>providerStatusFinal(e)||participants(e).some(p=>p?.result && p.result.score!==undefined);
            const rawFinalScored=schedule.filter(e=>inferredFinal(e)&&(participantPair(e)||resultsPair(e)||legacyPair(e)));
            const rawFinalIds=rawFinalScored.map(e=>clean(e?.eventId||e?.id)).filter(Boolean);
            const normalizedRawFinalIds=rawFinalIds.filter(id=>normalizedFinalKeys.has("native:"+safe(id)));
            const notNormalized=rawFinalScored.filter(e=>!normalizedFinalKeys.has("native:"+safe(clean(e?.eventId||e?.id))));
            const scoredTeamIds=[...new Set(rawFinalScored.flatMap(e=>participants(e).map(p=>clean(p?.team?.teamId)).filter(Boolean)))].sort();
            const scoredSchoolCodes=[...new Set(rawFinalScored.flatMap(e=>participants(e).map(p=>clean(p?.orgShortCode).toUpperCase()).filter(Boolean)))].sort();
            const certifiedTargets=certifiedTargetSchoolIds(config);
            const scoredCertifiedCodes=scoredSchoolCodes.filter(code=>certifiedTargets.has(code));
            const missingCertifiedCodes=[...certifiedTargets].filter(code=>!scoredSchoolCodes.includes(code)).sort();
            const scoreSamples=rawFinalScored.slice(0,10).map(e=>({
              eventId:clean(e?.eventId||e?.id),date:eventDate(e),status:explicitStatus(e),
              participants:participants(e).map(p=>({name:clean(p?.name),teamId:clean(p?.team?.teamId),orgShortCode:clean(p?.orgShortCode).toUpperCase(),result:p?.result??null})),
              results:e?.results??null
            }));
            out.sports[config.feedCode]={
              pages:fetched.pageCount,
              total_events:schedule.length,
              past_events:schedule.filter(e=>{const d=Date.parse(eventDate(e)); return Number.isFinite(d)&&d<now.getTime();}).length,
              explicit_status_events:schedule.filter(e=>Boolean(explicitStatus(e))).length,
              explicit_final_complete_events:schedule.filter(providerStatusFinal).length,
              any_score_result_structure:schedule.filter(anyScoreResult).length,
              participant_result_events:schedule.filter(hasParticipantResult).length,
              results_array_events:schedule.filter(hasResultsArray).length,
              legacy_home_away_score_events:schedule.filter(hasLegacy).length,
              explicit_final_with_both_usable_scores:schedule.filter(finalWithBothUsable).length,
              current_collector_inferred_final_events:schedule.filter(inferredFinal).length,
              inferred_final_with_both_usable_scores:rawFinalScored.length,
              participant_score_pair_events:schedule.filter(participantPair).length,
              results_array_score_pair_events:schedule.filter(resultsPair).length,
              legacy_score_pair_events:schedule.filter(legacyPair).length,
              normalized_scored_final_events:normalizedFinalKeys.size,
              inferred_scored_finals_normalized:normalizedRawFinalIds.length,
              scored_finals_not_normalized:notNormalized.length,
              scored_final_participant_team_count:scoredTeamIds.length,
              scored_final_school_code_count:scoredSchoolCodes.length,
              certified_target_count:certifiedTargets.size,
              scored_final_certified_target_count:scoredCertifiedCodes.length,
              scored_final_certified_targets:scoredCertifiedCodes.map(code=>({code,name:inventoryNames.certified_school_names?.[code]||code})),
              missing_scored_final_certified_targets:missingCertifiedCodes.map(code=>({code,name:inventoryNames.certified_school_names?.[code]||code})),
              scored_final_participant_team_ids:scoredTeamIds,
              scored_final_school_codes:scoredSchoolCodes,
              score_samples:scoreSamples,
              not_normalized_examples:notNormalized.slice(0,30).map(e=>({
                eventId:clean(e?.eventId||e?.id),
                date:eventDate(e),
                status:explicitStatus(e),
                participants:participants(e).map(p=>({
                  name:clean(p?.name),
                  teamId:clean(p?.team?.teamId),
                  result:p?.result??null
                })),
                results:e?.results??null,
                homeScore:e?.homeScore??e?.score?.home??e?.home?.score??null,
                awayScore:e?.awayScore??e?.score?.away??e?.away?.score??null
              })),
              raw_scored_final_event_ids:rawFinalIds,
              normalized_scored_final_event_ids:normalizedRawFinalIds
            };
          }
          console.log("DRAGONFLY_RAW_AUDIT_BEGIN");
          console.log(JSON.stringify(out));
          console.log("DRAGONFLY_RAW_AUDIT_END");
          NODE
          node ./.dragonfly-raw-audit.mjs
          rm -f ./.dragonfly-raw-audit.mjs
