name: Aug24 volleyball final state

on:
  push:
    branches:
      - diagnostic/aug24-volleyball-final-state

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      marion: ${{ steps.check.outputs.marion }}
      columbia: ${{ steps.check.outputs.columbia }}
      magnolia: ${{ steps.check.outputs.magnolia }}
    steps:
      - name: Fetch Aug 24 volleyball scores once
        id: check
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS --max-time 60 -H 'cache-control: no-store' \
            "$API/api/v1/scores?since=2026-08-24T05%3A00%3A00.000Z&until=2026-08-25T05%3A00%3A00.000Z&sport=volleyball&proof=${GITHUB_RUN_ID}" \
            -o scores.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('scores.json','utf8'));
          const games=Array.isArray(p.games)?p.games:[];
          const norm=v=>String(v||'').toLowerCase().replace(/\b(high school|high|school|hs)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const expected={
            marion:{local:'Marion High School',opp:'Collierville',localScore:3,oppScore:1},
            columbia:{local:'Columbia Christian School',opp:'Word of God Academy',localScore:3,oppScore:1},
            magnolia:{local:'Magnolia High School',opp:'Pleasant Grove',localScore:1,oppScore:3}
          };
          const out=[];
          for(const [key,e] of Object.entries(expected)){
            const local=norm(e.local),opp=norm(e.opp);
            const row=games.find(g=>{
              const h=norm(g.home_school_name),a=norm(g.away_school_name);
              return (h===local&&a===opp)||(h===opp&&a===local);
            });
            let ok=false;
            if(row&&row.status==='FINAL'){
              const localIsHome=norm(row.home_school_name)===local;
              const ls=Number(localIsHome?row.home_score:row.away_score);
              const os=Number(localIsHome?row.away_score:row.home_score);
              ok=ls===e.localScore&&os===e.oppScore;
            }
            out.push(`${key}=${ok}`);
            console.log(`${key.toUpperCase()}_FINAL=${ok}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,out.join('\n')+'\n');
          NODE

  marion:
    name: Marion 3-1 Collierville
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.fetch.outputs.marion }}" = "true"

  columbia:
    name: Columbia Christian 3-1 Word of God Academy
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.fetch.outputs.columbia }}" = "true"

  magnolia:
    name: Magnolia 1-3 Pleasant Grove
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.fetch.outputs.magnolia }}" = "true"
