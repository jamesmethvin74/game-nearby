name: DragonFly public probe

on:
  pull_request:
    paths:
      - "backend/src/dragonfly-*.js"
      - "backend/src/schedule-authority-core.js"
      - "backend/migrations/0004_schedule_authority_v2.sql"
      - "backend/migrations/0005_statewide_volleyball_discovery.sql"
      - "backend/test/**"
      - ".github/workflows/dragonfly-public-probe.yml"
  push:
    branches: [feature/schedule-authority-v2, feature/statewide-volleyball-discovery]
    paths:
      - "backend/src/dragonfly-*.js"
      - "backend/src/schedule-authority-core.js"
      - "backend/migrations/0004_schedule_authority_v2.sql"
      - "backend/migrations/0005_statewide_volleyball_discovery.sql"
      - "backend/test/**"
      - ".github/workflows/dragonfly-public-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production DragonFly ingestion against current Arkansas feed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Buffer } from 'node:buffer';
          import { fetchDragonFlyPagedPayload } from './src/dragonfly-feed.js';
          import { normalizeDragonFlyPayload } from './src/dragonfly-core.js';
          import { catalogAmbiguities, discoverDragonFlyVarsityVolleyballTeams } from './src/dragonfly-discovery.js';
          import { buildStatewideDragonFlyRows } from './src/dragonfly-statewide.js';
          import { resolveCanonicalEvent } from './src/schedule-authority-core.js';

          const url='https://maxinfosite-api-live.dragonflyathletics.com/states/ArkAA/schedules/2026/WVB_Varsity/0';
          const {payload,pageCount}=await fetchDragonFlyPagedPayload(url,{
            headers:{'user-agent':'LocalBleachersAR-public-source-validation/6.0','accept':'application/json'}
          });
          assert.ok(pageCount > 1, `expected paginated statewide feed, got ${pageCount} page`);
          assert.ok(payload.schedule.length > 1000, `suspicious statewide schedule count ${payload.schedule.length}`);

          const discovered=discoverDragonFlyVarsityVolleyballTeams(payload);
          const discoveredSchools=new Set(discovered.map(entry=>entry.orgShortCode));
          const ambiguous=catalogAmbiguities(discovered);
          const ambiguousEntries=discovered
            .filter(entry=>ambiguous.has(entry.normalizedSchoolName))
            .map(entry=>({name:entry.schoolName,orgShortCode:entry.orgShortCode,teamId:entry.teamId,eventCount:entry.eventCount}));
          const ambiguousOrgCodes=new Set(ambiguousEntries.map(entry=>entry.orgShortCode));
          const ambiguousEvidence=payload.schedule
            .filter(event=>(event.participants||[]).some(participant=>ambiguousOrgCodes.has(String(participant.orgShortCode||'').toUpperCase())))
            .map(event=>({
              eventId:event.eventId,date:event.date,name:event.name,hostOrgName:event.hostOrgName,facility:event.facility?.name||null,
              participants:(event.participants||[]).map(participant=>({name:participant.name,orgShortCode:participant.orgShortCode,teamId:participant.team?.teamId,isHome:participant.isHome}))
            }));
          assert.ok(discovered.length > 100, `suspicious varsity volleyball team count ${discovered.length}`);
          assert.ok(discoveredSchools.size > 100, `suspicious school count ${discoveredSchools.size}`);
          assert.ok(discovered.every(entry=>entry.orgShortCode && entry.teamId && entry.schoolName),'discovery produced an incomplete external identity');

          const syntheticMappings=discovered.map(entry=>({
            external_team_id:entry.teamId,
            source_id:`source-${entry.orgShortCode.toLowerCase()}`,
            source_url:url,
            team_id:`team-${entry.orgShortCode.toLowerCase()}`,
            school_id:`school-${entry.orgShortCode.toLowerCase()}`,
            school_name:entry.schoolName,
            latitude:null,
            longitude:null
          }));
          const bulkRows=buildStatewideDragonFlyRows(payload,syntheticMappings,{checkedAt:'2026-08-31T20:00:00.000Z'});
          assert.ok(bulkRows.canonicals.length > 1500, `bulk transformer produced only ${bulkRows.canonicals.length} canonical events`);
          assert.ok(bulkRows.games.length > 3000, `bulk transformer produced only ${bulkRows.games.length} observations`);
          assert.equal(bulkRows.members.length,bulkRows.games.length,'every bulk observation should have a canonical membership row');
          assert.ok(bulkRows.games.every(game=>game.opponent_school_id && game.canonical_event_id),'bulk transformer produced unresolved identities');

          const chunkBytes=rows=>{
            let max=0;
            for (let i=0;i<rows.length;i+=400) max=Math.max(max,Buffer.byteLength(JSON.stringify(rows.slice(i,i+400)),'utf8'));
            return max;
          };
          const maxCanonicalChunkBytes=chunkBytes(bulkRows.canonicals);
          const maxGameChunkBytes=chunkBytes(bulkRows.games);
          const maxMemberChunkBytes=chunkBytes(bulkRows.members);
          for (const [label,bytes] of Object.entries({maxCanonicalChunkBytes,maxGameChunkBytes,maxMemberChunkBytes})) {
            assert.ok(bytes < 1500000, `${label}=${bytes} is too close to D1 2 MB bound-value ceiling`);
          }

          const bentonSchoolIds=new Set(ambiguousEntries.filter(entry=>entry.name==='Benton High School').map(entry=>`school-${entry.orgShortCode.toLowerCase()}`));
          if (bentonSchoolIds.size>1) {
            for (const schoolId of bentonSchoolIds) assert.ok(bulkRows.games.some(game=>game.team_id===`team-${schoolId.replace(/^school-/, '')}`),`bulk transformer lost ambiguous Benton identity ${schoolId}`);
          }

          const base={sport:'volleyball',gender:'girls',season:'2026',timezone:'America/Chicago'};
          const conway=normalizeDragonFlyPayload(payload,{...base,school_name:'Conway High School',home_latitude:35.0887,home_longitude:-92.4421});
          const greenbrier=normalizeDragonFlyPayload(payload,{...base,school_name:'Greenbrier High School',home_latitude:35.2334,home_longitude:-92.3870});
          const vilonia=normalizeDragonFlyPayload(payload,{...base,school_name:'Vilonia High School',home_latitude:35.0839,home_longitude:-92.2029});
          assert.ok(conway.length >= 5, `Conway DragonFly schedule suspiciously small: ${conway.length}`);
          assert.ok(greenbrier.length >= 5, `Greenbrier DragonFly schedule suspiciously small: ${greenbrier.length}`);
          assert.ok(vilonia.length >= 5, `Vilonia DragonFly schedule suspiciously small: ${vilonia.length}`);

          const historicalKey='native:69cbc6e2a49cc05727000000';
          const gbHistorical=greenbrier.find(game=>game.sourceEventKey===historicalKey);
          const vilHistorical=vilonia.find(game=>game.sourceEventKey===historicalKey);
          assert.ok(gbHistorical,'Greenbrier perspective missing Aug 25 validation event');
          assert.ok(vilHistorical,'Vilonia perspective missing Aug 25 validation event');
          assert.equal(gbHistorical.scheduledAt,'2026-08-25T22:30:00.000Z');
          assert.equal(gbHistorical.homeAway,'away');
          assert.equal(vilHistorical.homeAway,'home');
          assert.equal(gbHistorical.status,'FINAL');
          assert.equal(gbHistorical.teamScore,3);
          assert.equal(vilHistorical.teamScore,0);

          const observation=(game,reportingSchoolId,opponentSchoolId,sourceId)=>({
            ...base,
            id:`${sourceId}:${game.sourceEventKey}`,
            source_id:sourceId,
            source_type:'official-conference',
            parser_type:'dragonfly-public',
            authority_rank:10,
            reporting_school_id:reportingSchoolId,
            opponent_school_id:opponentSchoolId,
            source_event_key:game.sourceEventKey,
            scheduled_at:game.scheduledAt,
            scheduled_time_known:game.scheduledTimeKnown?1:0,
            home_away:game.homeAway,
            venue:game.venue,
            location_text:game.locationText,
            status:game.status,
            team_score:game.teamScore,
            opponent_score:game.opponentScore
          });
          const historicalCanonical=resolveCanonicalEvent([
            observation(gbHistorical,'greenbrier','vilonia','greenbrier-volleyball-dragonfly'),
            observation(vilHistorical,'vilonia','greenbrier','vilonia-volleyball-dragonfly')
          ]);
          assert.equal(historicalCanonical.id,'ce:volleyball:girls:2026:greenbrier:vilonia:20260825:df-69cbc6e2a49cc05727000000');
          assert.equal(historicalCanonical.trustState,'CORROBORATED');
          assert.equal(historicalCanonical.conflicts.length,0);
          assert.equal(historicalCanonical.homeSchoolId,'vilonia');
          assert.equal(historicalCanonical.awaySchoolId,'greenbrier');

          const futureKey='native:69cbc91fa49cc0572700000a';
          const gbFuture=greenbrier.find(game=>game.sourceEventKey===futureKey);
          const vilFuture=vilonia.find(game=>game.sourceEventKey===futureKey);
          assert.ok(gbFuture && vilFuture,'reciprocal Sep 24 validation event missing');
          assert.equal(gbFuture.homeAway,'home');
          assert.equal(vilFuture.homeAway,'away');
          const futureCanonical=resolveCanonicalEvent([
            observation(gbFuture,'greenbrier','vilonia','greenbrier-volleyball-dragonfly'),
            observation(vilFuture,'vilonia','greenbrier','vilonia-volleyball-dragonfly')
          ]);
          assert.equal(futureCanonical.homeSchoolId,'greenbrier');
          assert.equal(futureCanonical.awaySchoolId,'vilonia');
          assert.equal(futureCanonical.conflicts.length,0);

          console.log(JSON.stringify({
            verified:true,
            pages:pageCount,
            statewideEvents:payload.schedule.length,
            discoveredTeams:discovered.length,
            discoveredSchools:discoveredSchools.size,
            bulkCanonicalEvents:bulkRows.canonicals.length,
            bulkObservations:bulkRows.games.length,
            bulkMembers:bulkRows.members.length,
            maxCanonicalChunkBytes,maxGameChunkBytes,maxMemberChunkBytes,
            ambiguousNames:ambiguous.size,
            ambiguousKeys:[...ambiguous].sort(),
            ambiguousEntries,
            ambiguousEvidence,
            conwayEvents:conway.length,
            greenbrierEvents:greenbrier.length,
            viloniaEvents:vilonia.length,
            historicalCanonical:{id:historicalCanonical.id,trust:historicalCanonical.trustState,date:historicalCanonical.scheduledAt,home:historicalCanonical.homeSchoolId,away:historicalCanonical.awaySchoolId,score:[historicalCanonical.homeScore,historicalCanonical.awayScore]},
            reciprocalFuture:{id:futureCanonical.id,date:futureCanonical.scheduledAt,home:futureCanonical.homeSchoolId,away:futureCanonical.awaySchoolId}
          },null,2));
          JS
