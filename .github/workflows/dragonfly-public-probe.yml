name: DragonFly public probe

on:
  push:
    branches: [feature/schedule-authority-v2]
    paths:
      - ".github/workflows/dragonfly-public-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture exact Arkansas validation event
        shell: bash
        run: |
          set -euo pipefail
          API='https://maxinfosite-api-live.dragonflyathletics.com/states/ArkAA/schedules/2026/WVB_Varsity'
          UA='LocalBleachersAR-public-source-validation/1.0'
          rm -f all.ndjson
          for PAGE in $(seq 0 20); do
            URL="$API/$PAGE"
            CODE=$(curl -L --silent --show-error -A "$UA" -o out.json -w '%{http_code}' "$URL")
            echo "PAGE=$PAGE HTTP=$CODE BYTES=$(wc -c < out.json)"
            python3 - "$PAGE" <<'PY'
          import json,sys
          from pathlib import Path
          page=int(sys.argv[1]); x=json.loads(Path('out.json').read_text())
          schedule=x.get('schedule') or []
          print('count=',len(schedule),'hasNextPage=',x.get('hasNextPage'),'timestamp=',x.get('timestamp'))
          def names(e): return [str(p.get('name','')).strip().upper() for p in e.get('participants') or []]
          exact=[]
          for e in schedule:
              ns=names(e)
              if any(n=='GREENBRIER HIGH SCHOOL' for n in ns) and any(n=='VILONIA HIGH SCHOOL' for n in ns): exact.append(e)
          for e in exact:
              clean=dict(e)
              clean['participants']=[]
              for p in e.get('participants') or []:
                  q={k:v for k,v in p.items() if k!='media'}
                  clean['participants'].append(q)
              print('EXACT_EVENT',json.dumps(clean,separators=(',',':')))
          Path('hasnext').write_text('1' if x.get('hasNextPage') else '0')
          PY
            [ "$(cat hasnext)" = "1" ] || break
          done
