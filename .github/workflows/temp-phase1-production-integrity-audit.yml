name: Temporary Phase 1 Production Integrity Audit
on:
  push:
    paths:
      - '.github/workflows/temp-phase1-production-integrity-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke deployed read-only statewide integrity audit
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REFRESH_TOKEN:-}" ]; then
            echo "REFRESH_TOKEN secret unavailable"
            exit 2
          fi
          body="$RUNNER_TEMP/statewide-audit.json"
          status=$(curl --silent --show-error --location --max-time 300 \
            --output "$body" \
            --write-out "%{http_code}" \
            --header "x-refresh-token: $REFRESH_TOKEN" \
            "https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/coverage-report?view=data-integrity")
          echo "HTTP_STATUS=$status"
          python3 - "$body" "$status" <<'PY'
          import json, sys

          body_path = sys.argv[1]
          http_status = int(sys.argv[2])
          with open(body_path, 'r', encoding='utf-8') as fh:
              data = json.load(fh)

          groups = {}
          for issue in data.get('issues') or []:
              severity = str(issue.get('severity') or 'unknown')
              code = str(issue.get('code') or 'UNKNOWN')
              surface = str(issue.get('surface') or 'unspecified')
              key = (severity, code, surface)
              g = groups.setdefault(key, {
                  'severity': severity, 'code': code, 'surface': surface,
                  'count': 0, 'teams': set(), 'team_ids': set(),
                  'games': set(), 'canonical_ids': set(), 'details': set()
              })
              g['count'] += 1
              if issue.get('school_name'): g['teams'].add(str(issue['school_name']))
              if issue.get('team_id'): g['team_ids'].add(str(issue['team_id']))
              for k in ('game_id','other_game_id'):
                  if issue.get(k): g['games'].add(str(issue[k]))
              for k in ('canonical_event_id','other_canonical_event_id'):
                  if issue.get(k): g['canonical_ids'].add(str(issue[k]))
              if issue.get('detail'): g['details'].add(str(issue['detail']))

          issue_groups = []
          for key in sorted(groups):
              g = groups[key]
              issue_groups.append({
                  'severity': g['severity'], 'code': g['code'], 'surface': g['surface'],
                  'count': g['count'], 'teams': sorted(g['teams']),
                  'team_ids': sorted(g['team_ids']), 'games': sorted(g['games']),
                  'canonical_ids': sorted(g['canonical_ids']), 'details': sorted(g['details'])
              })

          out = {
              'http_status': http_status,
              'audit_version': data.get('audit_version'),
              'generated_at': data.get('generated_at'),
              'season': data.get('season'),
              'clean': data.get('clean'),
              'summary': data.get('summary'),
              'source_surface': data.get('source_surface'),
              'one_truth_surface': data.get('one_truth_surface'),
              'source_vs_truth_summary': (data.get('source_vs_truth') or {}).get('summary'),
              'd1': data.get('d1'),
              'issue_groups': issue_groups,
              'issue_count_returned': len(data.get('issues') or []),
          }
          print('AUDIT_RESULT_BEGIN')
          print(json.dumps(out, ensure_ascii=False, separators=(',', ':')))
          print('AUDIT_RESULT_END')
          PY
          test "$status" = "200"
