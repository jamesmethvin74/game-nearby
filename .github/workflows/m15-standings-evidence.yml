name: M15 standings live evidence
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-standings-evidence.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: inspect-live-standings
    name: inspect-membership-truth-exact-v2
    steps:
      - name: Pull live 7A standings and membership truth
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const get=async path=>{
            const r=await fetch(base+path,{headers:{accept:'application/json'}});
            const text=await r.text();
            let body={}; try{body=JSON.parse(text);}catch{body={raw:text.slice(0,4000)}}
            return {status:r.status,body};
          };

          const conferences=['7a-central','7a-west'];
          const publishedNames=new Set();
          for(const conference of conferences){
            const res=await get('/api/v1/standings?sport=football&conference='+conference);
            const body=res.body||{};
            for(const row of body.standings||[]) publishedNames.add(String(row.school_name||''));
            console.log('STANDINGS='+JSON.stringify({
              conference,http:res.status,conference_meta:body.conference||null,
              standings:(body.standings||[]).map(row=>({
                team_id:row.team_id||null,school_name:row.school_name,
                conference_record:row.conference_record??null,overall_record:row.overall_record??null,
                published_conference_record:row.published_conference_record??null,
                published_overall_record:row.published_overall_record??null
              }))
            }));
          }

          const schoolsRes=await get('/api/v1/schools');
          const schools=schoolsRes.body.schools||[];
          const normalize=s=>String(s||'').toLowerCase().replace(/\bhigh school\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const wanted=[...publishedNames];
          for(const wantedName of wanted){
            const key=normalize(wantedName);
            const school=schools.find(s=>normalize(s.name)===key);
            if(!school){
              console.log('MEMBERSHIP='+JSON.stringify({school_name:wantedName,school_id:null,error:'school_not_found'}));
              continue;
            }
            const res=await get('/api/v1/schools/'+encodeURIComponent(school.id)+'/schedule');
            const football=(res.body.team_statuses||[]).find(row=>String(row.sport||'').toLowerCase()==='football');
            console.log('MEMBERSHIP='+JSON.stringify({
              school_name:wantedName,school_id:school.id,http:res.status,
              team_id:football?.team_id||null,
              legacy_conference_id:football?.conference_id??null,
              conference_membership_state:football?.conference_membership_state??null,
              verified_conference_id:football?.conference_id??null,
              conference_name:football?.conference_name??null,
              membership_source:football?.membership_source??null,
              membership_verified_at:football?.membership_verified_at??null
            }));
          }
          NODE
