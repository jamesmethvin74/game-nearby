name: Volleyball DragonFly event dump

on:
  pull_request:
    paths:
      - ".github/workflows/volleyball-dragonfly-event-dump.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Dump two DragonFly event shapes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://maxinfosite-api-live.dragonflyathletics.com/states/ArkAA/schedules/2026/WVB_Varsity';
          const wanted=new Set(['698a07913f3e5e1fbb00000e','69cbf80b0d417b1cfe000002']);
          const found=[];
          for(let page=0;page<50;page++){
            const response=await fetch(`${base}/${page}`,{headers:{accept:'application/json','user-agent':'LocalBleachersAR-diagnostic/1.0'}});
            if(!response.ok) throw new Error(`DragonFly page ${page}: HTTP ${response.status}`);
            const payload=await response.json();
            for(const event of payload.schedule||[]){
              const id=String(event?.eventId||event?.id||'');
              if(wanted.has(id)) found.push(event);
            }
            if(found.length===wanted.size||!payload.hasNextPage) break;
          }
          const summarize=e=>({
            eventId:e.eventId||e.id,
            topLevelKeys:Object.keys(e).sort(),
            conferenceLike:Object.fromEntries(Object.entries(e).filter(([k])=>/conference|region|district|league/i.test(k))),
            sport:e.sport||null,
            associatedSports:e.associatedSports||null,
            participants:e.participants||null,
            contestType:e.contestType||null,
            eventType:e.eventType||null,
            notes:e.notes||e.locationNotes||null
          });
          console.log(JSON.stringify(found.map(summarize),null,2));
          if(found.length!==wanted.size) throw new Error(`Found ${found.length}/2 target events`);
          NODE
