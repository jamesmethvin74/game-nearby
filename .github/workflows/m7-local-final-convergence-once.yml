name: One-shot M7 local-final convergence

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-local-final-convergence-once.yml

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Plan and execute bounded production local-final convergence
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          PLAN="$BASE/api/v1/internal/m7-vb-local-final-plan-c4189f7a5dd948b7"
          EXEC="$BASE/api/v1/internal/m7-vb-local-final-execute-a73e5d81f34146dd"
          ready=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 180 -o m7-plan.json -w '%{http_code}' "$PLAN" || true)
            echo "M7_LOCAL_PLAN_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then ready=1; break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then cat m7-plan.json || true; exit 1; fi
            sleep 5
          done
          test "$ready" = "1"
          node <<'NODE'
          const p=require('./m7-plan.json');
          console.log('M7_LOCAL_PLAN='+JSON.stringify({fingerprint:p.plan_fingerprint,authority:p.authority,d1:p.d1,candidates:p.candidates,write_scope:p.write_scope,blocked:p.blocked?.length||0,excluded:p.excluded?.length||0}));
          if(!p.safe_to_execute) throw new Error('Live plan is not safe to execute');
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Planner wrote to D1');
          if(Number(p.d1?.rows_read||0)>100000) throw new Error(`Planner rows_read too high: ${p.d1.rows_read}`);
          if(Number(p.write_scope?.logical_application_rows||0)>1200) throw new Error('Logical write cap exceeded');
          if(Number(p.write_scope?.expected_d1_rows_written_max||0)>1800) throw new Error('D1 write cap exceeded');
          if(Number(p.candidates?.total||0)<1) throw new Error('No safe candidates');
          NODE
          code=$(curl -sS --max-time 300 -o m7-result.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"approved_scope":"m7-local-local-finals-preapproved"}' \
            "$EXEC")
          echo "M7_LOCAL_EXEC_HTTP=$code"
          cat m7-result.json
          test "$code" = "200"
          node <<'NODE'
          const r=require('./m7-result.json');
          console.log('M7_LOCAL_RESULT='+JSON.stringify({status:r.status,fingerprint:r.plan_fingerprint,candidates:r.candidates,write_scope:r.write_scope,d1:r.d1,verified:r.verified,blocked:r.blocked?.length||0,excluded:r.excluded?.length||0}));
          if(r.status!=='SUCCESS') throw new Error(`Unexpected status ${r.status}`);
          if(Number(r.d1?.repair?.rows_written||0)>Number(r.write_scope?.expected_d1_rows_written_max||0)) throw new Error('Observed D1 writes exceeded planned maximum');
          if(Number(r.d1?.verification?.rows_written||0)!==0) throw new Error('Verification wrote to D1');
          NODE
