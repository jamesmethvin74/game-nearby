name: One-shot M7 post-local-final audit

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-post-local-final-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run zero-write statewide verification audit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-audit-7e49c2a1bd6f4083'
          code=$(curl -sS --max-time 240 -o m7-audit.json -w '%{http_code}' "$URL")
          echo "M7_POST_LOCAL_AUDIT_HTTP=$code"
          test "$code" = "200"
          node <<'NODE'
          const p=require('./m7-audit.json');
          const counts=Object.fromEntries(Object.entries(p.exceptions_by_deficiency||{}).map(([k,v])=>[k,v.count]));
          console.log('M7_POST_LOCAL_D1='+JSON.stringify(p.d1||{}));
          console.log('M7_POST_LOCAL_SUMMARY='+JSON.stringify(p.summary||{}));
          console.log('M7_POST_LOCAL_COUNTS='+JSON.stringify(counts));
          console.log('M7_POST_LOCAL_FINAL_PLAN='+JSON.stringify(p.final_gap_plan||{}));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error(`Audit wrote ${p.d1.rows_written} rows`);
          NODE
