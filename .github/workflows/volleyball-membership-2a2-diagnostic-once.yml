name: One-shot approved 2A 2 volleyball membership repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/volleyball-membership-2a2-diagnostic-once.yml

permissions:
  contents: read

jobs:
  approved-write:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Invoke exact approved 2A 2 Worker repair and verify response
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"

          health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/v1/health" || true)
          echo "Health HTTP ${health_code}"
          cat health.json || true
          echo
          test "$health_code" = "200"
          node -e "const p=require('./health.json'); if(p.ok!==true||p.service!=='localbleachersar-sports-api') process.exit(1);"

          URL="$BASE/api/v1/maintenance/volleyball-membership/2a2-approved-20260909-f6c4317d"
          code=$(curl -sS --retry 2 --retry-all-errors --retry-delay 1 --max-time 60 -o repair.json -w '%{http_code}' "$URL" || true)
          echo "2A2 Approved Repair HTTP ${code}"
          cat repair.json || true
          echo
          test "$code" = "200"

          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('repair.json','utf8'));
          const ids=new Set([
            'df-sz3b5e-volleyball-2026',
            'df-ltv6cw-volleyball-2026',
            'df-mr3rj5-volleyball-2026',
            'df-st7tzg-volleyball-2026'
          ]);
          const rows=Array.isArray(p.verification)?p.verification:[];
          const verified=rows.length===4
            && rows.every(row=>ids.has(String(row.team_id)) && row.conference_id==='2a-2-volleyball');
          const success=p.status==='SUCCESS'
            && p.plan?.change_count===4
            && p.plan?.wrong_count===0
            && p.d1Statements===2
            && p.teamWrites===4
            && Number(p.conferenceWrites)<=1
            && verified;
          const already=p.status==='ALREADY_APPLIED'
            && p.teamWrites===0
            && p.conferenceWrites===0
            && verified;
          if(!success && !already) {
            console.error('Approved 2A 2 production repair validation failed');
            process.exit(1);
          }
          console.log('VOLLEYBALL_2A2_PRODUCTION_REPAIR='+JSON.stringify(p));
          NODE
