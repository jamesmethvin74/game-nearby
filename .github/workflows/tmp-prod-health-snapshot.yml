name: Temporary production health snapshot

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - ".github/workflows/tmp-prod-health-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read production health
        shell: bash
        run: |
          set -euo pipefail
          echo "observed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS --max-time 30 "https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/health"
          echo
