name: M15 Conway Marion runtime proof

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/m15-conway-marion-runtime-proof.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduce Conway and Marion followed-team runtime
        env:
          BASE_URL: https://jamesmethvin74.github.io/game-nearby
        run: |
          cat > proof.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:430,height:932}});
          const page = await context.newPage();
          const clean = v => String(v || '').replace(/\s+/g,' ').trim();

          await page.goto(process.env.BASE_URL + '/?cmproof=76final', {waitUntil:'domcontentloaded', timeout:45000});
          await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v76', null, {timeout:45000});
          await page.waitForFunction(() => typeof SCHOOL_REGISTRY !== 'undefined' && SCHOOL_REGISTRY.some(s => /Marion High School/i.test(String(s.name||''))), null, {timeout:45000});
          await page.waitForFunction(() => window.LocalBleachersLive?.getState?.().nearbyLoadedAt, null, {timeout:45000});

          const ids = await page.evaluate(() => {
            const find = rx => SCHOOL_REGISTRY.find(s => rx.test(String(s.name||''))) || null;
            const mandatory = [
              find(/^Conway High School$/i),
              find(/^Marion High School$/i),
              find(/^Maumelle High School$/i),
              find(/Morrilton.*High School/i),
              find(/^North Little Rock High School$/i)
            ].filter(Boolean);
            const nearbyIds = [...new Set((window.LocalBleachersLive?.getNearbyEvents?.() || []).map(e => e.teamId).filter(Boolean))];
            const extras = nearbyIds
              .map(id => SCHOOL_REGISTRY.find(s => s.id === id))
              .filter(s => s && String(s.level || '').toLowerCase().includes('high'))
              .filter(s => !mandatory.some(m => m.id === s.id))
              .slice(0, 8);
            const followed = [...new Set([...mandatory, ...extras].map(s => s.id))];
            const marion = mandatory.find(s => /Marion High School/i.test(String(s.name||'')));
            return {conway:'conway', marion:marion?.id || null, marionName:marion?.name || null, followed};
          });
          console.log('CM_IDS=' + JSON.stringify(ids));
          if (!ids.marion) throw new Error('Marion school id not resolved');
          if (ids.followed.length < 9) throw new Error('Need 9+ followed schools to prove multi-chunk truth retention: ' + JSON.stringify(ids.followed));

          await page.evaluate(ids => localStorage.setItem('followedTeams', JSON.stringify(ids.followed)), ids);
          await page.reload({waitUntil:'domcontentloaded', timeout:45000});
          await page.waitForFunction(() => window.LocalBleachersRuntime?.releaseGeneration === 'm15-presentation-v76', null, {timeout:45000});
          await page.waitForFunction(() => window.LocalBleachersLive?.getState?.().nearbyLoadedAt, null, {timeout:45000});
          await page.waitForTimeout(1500);

          const snap = async label => {
            const data = await page.evaluate((ids) => {
              const status = (id,sport,gender) => window.LocalBleachersLive?.getPresentationStatus?.(id,sport,gender) || null;
              const cards = [...document.querySelectorAll('.event-card .team-detail-trigger')].map(t => ({
                teamId:t.dataset.teamId || '',
                sport:t.dataset.sport || '',
                gender:t.dataset.gender || '',
                text:String(t.closest('.event-card')?.innerText || '').replace(/\s+/g,' ').trim()
              }));
              return {
                state:window.LocalBleachersLive?.getState?.(),
                conwayVolleyball:status(ids.conway,'volleyball','girls'),
                marionBasketball:status(ids.marion,'basketball','girls'),
                followed:JSON.parse(localStorage.getItem('followedTeams') || '[]'),
                cards
              };
            }, ids);
            console.log(label + '=' + JSON.stringify(data));
            return data;
          };

          const startup = await snap('CM_STARTUP');
          await page.evaluate(async () => { await window.LocalBleachersLive.refreshNearby(); });
          await page.waitForTimeout(750);
          const refreshed = await snap('CM_REFRESHED');

          const conwayCards = refreshed.cards.filter(c => c.teamId === 'conway' && c.sport === 'volleyball');
          if (!refreshed.conwayVolleyball) throw new Error('Conway canonical volleyball status is missing after current-main refresh');
          if (!conwayCards.length) throw new Error('No Conway volleyball cards rendered');
          if (conwayCards.some(c => !/9-4/.test(c.text) || !/4-0/.test(c.text) || !/#1/.test(c.text))) {
            throw new Error('At least one Conway volleyball card is not rendering canonical truth: ' + JSON.stringify(conwayCards));
          }
          if (!refreshed.marionBasketball) throw new Error('Marion canonical girls basketball status is missing');
          if (Number(refreshed.marionBasketball.overall_games || 0) !== 0 || refreshed.marionBasketball.record_verified !== false) {
            throw new Error('Marion basketball truth unexpectedly contains a played record: ' + JSON.stringify(refreshed.marionBasketball));
          }

          const audit = await page.evaluate(() => {
            const clean = value => String(value || '').replace(/\s+/g,' ').trim();
            const issues = [];
            let audited = 0;
            for (const trigger of document.querySelectorAll('.event-card .team-detail-trigger')) {
              const teamId = trigger.dataset.teamId || '';
              const sport = trigger.dataset.sport || '';
              const gender = trigger.dataset.gender || '';
              if (!['football','volleyball','basketball'].includes(String(sport).toLowerCase())) continue;
              const school = SCHOOL_REGISTRY.find(s => s.id === teamId);
              if (!school || !String(school.level || '').toLowerCase().includes('high')) continue;
              audited += 1;
              const raw = window.LocalBleachersLive?.getPresentationStatus?.(teamId,sport,gender) || null;
              const expected = window.LocalBleachersPresentation?.teamStatus?.(raw) || null;
              const text = clean(trigger.closest('.event-card')?.innerText);
              if (!expected) {
                issues.push({teamId,sport,gender,reason:'missing canonical status',text});
                continue;
              }
              for (const [field,value] of Object.entries({overall:expected.overall,conference:expected.conference,standing:expected.standing})) {
                if (value && value !== '—' && value !== 'N/A' && !text.includes(String(value))) {
                  issues.push({teamId,sport,gender,reason:`missing ${field} ${value}`,text});
                }
              }
            }
            return {audited,issues};
          });
          console.log('CM_CARD_AUDIT=' + JSON.stringify(audit));
          if (!audit.audited) throw new Error('No high-school cards audited');
          if (audit.issues.length) throw new Error('Card truth mismatches: ' + JSON.stringify(audit.issues.slice(0,10)));

          await browser.close();
          NODE
          node proof.mjs
