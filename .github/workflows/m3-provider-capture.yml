name: M3 provider capture

on:
  pull_request:
    branches:
      - feature/m3-arkansas-college-coverage
    paths:
      - .github/workflows/m3-provider-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Presto integration surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error

          def get(url, accept):
              req=urllib.request.Request(url,headers={
                  'User-Agent':'LocalBleachersAR/2.0 (+https://github.com/jamesmethvin74/game-nearby)',
                  'Accept':accept,
                  'Accept-Language':'en-US,en;q=0.9'
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,r.headers.get('content-type'),r.geturl(),r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get('content-type'),e.geturl(),e.read().decode('utf-8','replace')

          urls={
              'champion_ical':'https://championchristian.prestosports.com/sports/mbkb/2025-26/schedule?print=ical',
              'naia_amc_ical':'https://naiastats.prestosports.com/sports/mbkb/2025-26/conf/American_Midwest/Schedule?print=ical',
              'njcaa_d2_ical':'https://njcaastats.prestosports.com/sports/mbkb/2025-26/div2/schedule?print=ical',
              'champion_rss':'https://championchristian.prestosports.com/sports/mbkb/2025-26/schedule?print=rss',
          }
          for name,url in urls.items():
              status,ctype,final,body=get(url,'text/calendar,application/ics,application/rss+xml,application/xml,text/plain;q=0.9,*/*;q=0.8')
              print(f'===== {name} STATUS={status} TYPE={ctype} URL={final} LEN={len(body)} =====')
              print(body[:12000])
          PY
