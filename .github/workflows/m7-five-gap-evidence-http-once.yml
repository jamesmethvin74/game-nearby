name: M7 five-gap evidence HTTP once

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/m7-five-gap-evidence-http-once.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify zero-D1 marker then read exact five-gap evidence once
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER_URL="$BASE/api/v1/internal/m7-five-gap-evidence-version-20b84b91"
          EVIDENCE_URL="$BASE/api/v1/internal/m7-five-gap-evidence-20b84b91"

          marker_code=$(curl -sS --max-time 30 -o marker.json -w '%{http_code}' "$MARKER_URL")
          echo "marker HTTP=$marker_code"
          test "$marker_code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('marker.json','utf8'));
          console.log('MARKER='+JSON.stringify(r));
          if(r.marker!=='m7-five-gap-evidence-v1-e1ea7d47') throw new Error(`Unexpected marker: ${r.marker}`);
          if(r.d1_access!==false) throw new Error('Marker did not prove d1_access=false');
          NODE

          code=$(curl -sS --max-time 120 -o evidence.json -w '%{http_code}' "$EVIDENCE_URL")
          echo "evidence HTTP=$code"
          cat evidence.json
          echo
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('evidence.json','utf8'));
          console.log('M7_FIVE_GAP_EVIDENCE='+JSON.stringify(r));
          const reads=Number(r.d1?.rows_read||0);
          const writes=Number(r.d1?.rows_written||0);
          if(writes!==0) throw new Error(`Evidence wrote ${writes} rows`);
          if(reads>10000) throw new Error(`Read fuse exceeded: ${reads}`);
          if(!Array.isArray(r.expected_ids)||r.expected_ids.length!==5) throw new Error('Unexpected evidence scope');
          NODE
