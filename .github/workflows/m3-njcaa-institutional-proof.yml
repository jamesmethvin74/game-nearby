name: M3 NJCAA institutional fallback proof

on:
  pull_request:
    branches:
      - feature/m3-arkansas-college-coverage
    paths:
      - .github/workflows/m3-njcaa-institutional-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe direct NJCAA school-host RSS fallbacks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const targets=[
            ['rich','https://bucksathletics.com/composite?print=rss',['msoc','wsoc']],
            ['rich-presto','https://bucksathletics.prestosports.com/composite?print=rss',['msoc','wsoc']],
            ['seark','https://searksharks.com/composite?print=rss',['mbkb','wbkb']],
            ['asu-mid','https://www.asumidsouthsports.com/composite?print=rss',['mbkb','wbkb']],
            ['southark-rss','https://www.southarkstars.com/composite?print=rss',['mbkb','wbkb']],
            ['cossatot-guess1','https://uacossatot.prestosports.com/composite?print=rss',['mbkb','wbkb','msoc','wsoc']],
            ['cossatot-guess2','https://uacossatotcolts.com/composite?print=rss',['mbkb','wbkb','msoc','wsoc']]
          ];
          const field=(item,name)=>item.match(new RegExp(`<${name}[^>]*>([\\s\\S]*?)<\\/${name}>`,'i'))?.[1]||'';
          const clean=s=>String(s||'').replace(/<!\[CDATA\[|\]\]>/g,'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
          for(const [name,url,sports] of targets){
            try{
              const r=await fetch(url,{redirect:'follow',headers:{'user-agent':'LocalBleachersAR-M3-NJCAA-direct-rss/1.0','accept':'application/rss+xml,text/xml,text/html,*/*'}});
              const text=await r.text();
              const items=[...text.matchAll(/<item\b[\s\S]*?<\/item>/gi)].map(m=>m[0]);
              const result={name,status:r.status,finalUrl:r.url,type:r.headers.get('content-type'),size:text.length,challenge:/cf-chl|challenge-platform|Just a moment/i.test(text),items:items.length,sports:{}};
              for(const code of sports){
                const matches=items.filter(item=>new RegExp(`/sports/${code}/2026-27/schedule`,'i').test(clean(field(item,'link'))) && !/2026-27jv/i.test(clean(field(item,'link'))));
                result.sports[code]={count:matches.length,sample:matches.slice(0,2).map(item=>({category:clean(field(item,'category')),link:clean(field(item,'link')),date:clean(field(item,'dc:date')),opponent:clean(field(item,'ps:opponent')),score:clean(field(item,'ps:score'))}))};
              }
              console.log(JSON.stringify(result));
            }catch(e){console.log(JSON.stringify({name,url,error:String(e?.message||e)}));}
          }
          NODE
