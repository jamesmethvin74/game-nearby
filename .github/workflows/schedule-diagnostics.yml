name: Schedule diagnostics

on:
  push:
    branches: [fix/schedule-quality-v1]
    paths:
      - ".github/workflows/schedule-diagnostics.yml"
      - "backend/**"
      - "live-data.js"
      - "polish.js"
      - "school-follow-logic.js"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production schedule data
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS "$API/api/v1/schools" -o schools.json
          node <<'NODE' > ids.env
          const p=require('./schools.json');
          const schools=p.schools||[];
          for (const wanted of ['Conway High School','Valley Springs High School']) {
            const s=schools.find(x=>String(x.location_matched_name||x.name).toLowerCase()===wanted.toLowerCase());
            if(!s) throw new Error(`Missing ${wanted}`);
            const key=wanted.startsWith('Conway')?'CONWAY':'VALLEY';
            console.log(`${key}_SCHOOL=${s.id}`);
            console.log(`${key}_TEAM=${s.id}-volleyball-2026`);
          }
          NODE
          cat ids.env
          source ids.env
          for team in "$CONWAY_TEAM" "$VALLEY_TEAM"; do
            echo "===== TEAM $team ====="
            curl -fsS "$API/api/v1/teams/$team/schedule" -o schedule.json
            node <<'NODE'
          const p=require('./schedule.json');
          const games=p.games||[];
          console.log('count',games.length);
          for(const g of games.slice(0,40)) console.log(JSON.stringify({id:g.id,ce:g.canonical_event_id,school:g.school_name,opp:g.opponent,at:g.scheduled_at,homeAway:g.home_away,venue:g.venue,canonicalVenue:g.canonical_venue,source:g.source_type,parser:g.parser_type,trust:g.data_trust,home:g.canonical_home_name,away:g.canonical_away_name}));
          NODE
          done
          echo "===== CONWAY NEARBY ====="
          curl -fsS "$API/api/v1/games?lat=35.0887&lon=-92.4421&radius=10&since=2026-08-30T00%3A00%3A00.000Z&until=2026-09-03T23%3A59%3A59.000Z" -o nearby.json
          node <<'NODE'
          const p=require('./nearby.json');
          const games=(p.games||[]).filter(g=>/conway|lakeside/i.test(`${g.school_name} ${g.opponent} ${g.canonical_home_name} ${g.canonical_away_name}`));
          console.log('matching nearby rows',games.length);
          for(const g of games) console.log(JSON.stringify({id:g.id,ce:g.canonical_event_id,school:g.school_name,opp:g.opponent,at:g.scheduled_at,homeAway:g.home_away,venue:g.venue,canonicalVenue:g.canonical_venue,source:g.source_type,parser:g.parser_type,trust:g.data_trust,home:g.canonical_home_name,away:g.canonical_away_name}));
          NODE
