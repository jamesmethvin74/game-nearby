name: One-shot M7 final read-only audit

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-final-audit-closeout-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify final M7 state without writes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          AUDIT="$BASE/api/v1/internal/m7-vb-final-audit-8e04df761c9142f1"
          PLAN="$BASE/api/v1/internal/m7-vb-finalization-plan-7bc9c3e42f6a4f8b"

          code=$(curl -sS --max-time 600 -o audit.json -w '%{http_code}' "$AUDIT")
          echo "M7_FINAL_AUDIT_HTTP=$code"
          test "$code" = "200" || { cat audit.json; exit 1; }

          code=$(curl -sS --max-time 300 -o plan.json -w '%{http_code}' "$PLAN")
          echo "M7_FINAL_PLAN_HTTP=$code"
          test "$code" = "200" || { cat plan.json; exit 1; }

          node <<'NODE'
          const a=require('./audit.json');
          const p=require('./plan.json');
          const out={
            audit_generated_at:a.generated_at,
            summary:a.summary,
            deficiencies:a.deficiencies,
            audit_d1:a.d1,
            membership_unmatched:a.membership_unmatched,
            membership_ambiguous:a.membership_ambiguous,
            convergence:a.convergence,
            finalization:{
              safe:p.safe_to_execute,
              fingerprint:p.plan_fingerprint,
              membership_changes:Number(p.membership?.plan?.change_count||0),
              local_team_count:p.local_team_count,
              d1:p.d1
            }
          };
          console.log('M7_FINAL_READ_ONLY_AUDIT='+JSON.stringify(out));
          if(Number(a.d1?.rows_written||0)!==0) throw new Error('Final completeness audit wrote to D1');
          if(Number(a.convergence?.d1?.rows_written||0)!==0) throw new Error('Final convergence verification wrote to D1');
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('Finalization verification wrote to D1');
          if(Number(a.convergence?.candidates?.total||0)!==0) throw new Error(`Safe final-result candidates remain: ${a.convergence?.candidates?.total}`);
          if(Number(p.membership?.plan?.change_count||0)!==0) throw new Error('Conference membership changes remain');
          NODE
