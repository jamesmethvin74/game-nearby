name: M15 live team presentation verify
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-live-team-presentation-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: verify-live-team-presentation
    steps:
      - name: Verify factual team cards and official-season schedules
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://localbleachersar-sports-api.james-methvin74.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const get=async path=>{
            const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});
            const text=await r.text();
            let body={}; try{body=JSON.parse(text);}catch{body={raw:text.slice(0,3000)}}
            return {status:r.status,body,text};
          };
          const normalize=s=>String(s||'').toLowerCase().replace(/\bhigh school\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();

          let schools=[];
          let ready=false;
          for(let attempt=1;attempt<=120;attempt++){
            const root=await get('/');
            const schoolRes=await get('/api/v1/schools');
            schools=schoolRes.body.schools||[];
            const nlr=schools.find(s=>normalize(s.name)===normalize('North Little Rock High School'));
            if(!nlr){console.log('VERIFY_WAIT='+JSON.stringify({attempt,error:'nlr_not_found'}));await sleep(5000);continue;}
            const nlrRes=await get('/api/v1/schools/'+encodeURIComponent(nlr.id)+'/schedule');
            const fb=(nlrRes.body.team_statuses||[]).find(s=>String(s.sport||'').toLowerCase()==='football'&&String(s.gender||'').toLowerCase()==='boys');
            const hasDisplay=fb && Object.prototype.hasOwnProperty.call(fb,'display_conference_record') && Object.prototype.hasOwnProperty.call(fb,'display_rank');
            const shellReady=/team-detail\.js\?v=66/.test(root.text);
            console.log('VERIFY_WAIT='+JSON.stringify({attempt,http:nlrRes.status,hasDisplay,shellReady,display_conf:fb?.display_conference_record??null,display_rank:fb?.display_rank??null}));
            if(nlrRes.status===200 && hasDisplay && shellReady){ready=true;break;}
            await sleep(5000);
          }
          if(!ready) throw new Error('new factual team presentation contract never reached production');

          const wanted=['North Little Rock High School','Bryant High School','Van Buren High School'];
          const outputs=[];
          for(const name of wanted){
            const school=schools.find(s=>normalize(s.name)===normalize(name));
            if(!school) throw new Error(name+' not found');
            const res=await get('/api/v1/schools/'+encodeURIComponent(school.id)+'/schedule');
            const rows=res.body.games||[];
            const statuses=res.body.team_statuses||[];
            outputs.push({name,id:school.id,rows,statuses});
          }

          const byName=Object.fromEntries(outputs.map(x=>[x.name,x]));
          const nlr=byName['North Little Rock High School'];
          const bryant=byName['Bryant High School'];
          const van=byName['Van Buren High School'];
          const dateOf=g=>String(g.scheduled_at||g.canonical_scheduled_at||'').slice(0,10);
          const hasRow=(obj,sport,opponent,datePrefix)=>obj.rows.some(g=>
            String(g.sport||'').toLowerCase()===sport &&
            String(g.opponent||'').toLowerCase().includes(opponent.toLowerCase()) &&
            dateOf(g)===datePrefix
          );
          const findStatus=(obj,sport,gender)=>obj.statuses.find(s=>String(s.sport||'').toLowerCase()===sport&&String(s.gender||'').toLowerCase()===gender);

          const nlrFootball=findStatus(nlr,'football','boys');
          const checks={
            nlr_benefit_hidden:!hasRow(nlr,'football','joe t. robinson','2026-08-22'),
            nlr_regular_present:hasRow(nlr,'football','rogers','2026-08-28'),
            bryant_bauxite_hidden:!hasRow(bryant,'volleyball','bauxite','2026-08-18'),
            bryant_regular_present:hasRow(bryant,'volleyball','lakeside','2026-08-24'),
            van_buren_benefit_hidden:!hasRow(van,'volleyball','mena','2026-08-20'),
            van_buren_regular_present:hasRow(van,'volleyball','rogers','2026-08-24'),
            nlr_display_overall:Boolean(nlrFootball?.display_overall_record),
            nlr_display_conference:Boolean(nlrFootball?.display_conference_record),
            nlr_display_fields_present:Boolean(nlrFootball&&Object.prototype.hasOwnProperty.call(nlrFootball,'display_rank'))
          };
          console.log('TEAM_PRESENTATION_CHECKS='+JSON.stringify(checks));
          console.log('NLR_FOOTBALL_STATUS='+JSON.stringify(nlrFootball||null));
          console.log('NLR_FOCUS='+JSON.stringify(nlr.rows.filter(g=>String(g.sport||'').toLowerCase()==='football').map(g=>({opponent:g.opponent,date:dateOf(g),status:g.status})).slice(0,8)));
          console.log('BRYANT_VB_FOCUS='+JSON.stringify(bryant.rows.filter(g=>String(g.sport||'').toLowerCase()==='volleyball').map(g=>({opponent:g.opponent,date:dateOf(g),status:g.status})).slice(0,8)));
          console.log('VANBUREN_VB_FOCUS='+JSON.stringify(van.rows.filter(g=>String(g.sport||'').toLowerCase()==='volleyball').map(g=>({opponent:g.opponent,date:dateOf(g),status:g.status,notes:g.notes||null})).slice(0,8)));

          const failed=Object.entries(checks).filter(([,ok])=>!ok);
          if(failed.length) throw new Error('verification failures: '+JSON.stringify(failed));
          NODE
