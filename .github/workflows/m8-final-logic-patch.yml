name: M8 final logic patch

on:
  push:
    branches:
      - m8/results-completeness-20260914
    paths:
      - .github/workflows/m8-final-logic-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8/results-completeness-20260914
      - name: Apply exact M8 safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          q=Path('backend/src/result-source-quarantine.js')
          q.write_text('''const RESULT_SOURCE_QUARANTINES = Object.freeze([\n  Object.freeze({\n    provider:"maxpreps",\n    native_event_id:"68e6ca03-cd54-40c8-9bff-4abd5d8871f6",\n    reason:"MaxPreps statewide scoreboard reports a 1-1 final while the provider matchup page reports that no result has been reported.",\n    evidence_url:"https://www.maxpreps.com/ar/volleyball/match/batesville-vs-brookland/8-29-2026/?c=68e6ca03-cd54-40c8-9bff-4abd5d8871f6"\n  })\n]);\n\nfunction text(value) { return String(value ?? "").trim().toLowerCase(); }\n\nfunction rowIdentifiers(row={}) {\n  const values=[\n    row.source_event_key,\n    row.sourceEventKey,\n    row.canonical_event_id,\n    row.canonicalEventId,\n    row.source_url,\n    row.sourceUrl\n  ].map(text).filter(Boolean);\n  return values;\n}\n\nexport function resultSourceQuarantine(row={}) {\n  const identifiers=rowIdentifiers(row);\n  if (!identifiers.length) return null;\n  return RESULT_SOURCE_QUARANTINES.find(entry=>{\n    const id=text(entry.native_event_id);\n    return identifiers.some(value=>\n      value===`native:${id}`\n      || value.includes(`mp-${id}`)\n      || value.includes(`c=${id}`)\n      || value===id\n    );\n  }) || null;\n}\n\nexport function isResultSourceQuarantined(row={}) {\n  return Boolean(resultSourceQuarantine(row));\n}\n\nexport { RESULT_SOURCE_QUARANTINES };\n''')

          p=Path('backend/src/final-result-truth.js')
          s=p.read_text()
          if 'result-source-quarantine.js' not in s:
            s='import { resultSourceQuarantine } from "./result-source-quarantine.js";\n\n'+s
          needle='''  if (teamScore == null || opponentScore == null) {\n'''
          insert='''  const quarantine = resultSourceQuarantine(row);\n  if (quarantine) {\n    normalized.result = null;\n    return {\n      row: normalized,\n      state: "QUARANTINED",\n      reason: "SOURCE_RESULT_AMBIGUITY",\n      corrected: false,\n      explicit_result: explicitResult,\n      numeric_result: resultFromTeamScores(teamScore, opponentScore),\n      orientation_source: "source-quarantine",\n      quarantine\n    };\n  }\n\n'''
          if insert not in s:
            assert needle in s
            s=s.replace(needle,insert+needle,1)
          p.write_text(s)

          p=Path('backend/src/schedule-response-normalizer.js')
          s=p.read_text()
          old='''  const rawRows = Array.isArray(games) ? games : [];\n  const evaluations = rawRows.map(row => ({ original: row, ...evaluateFinalResultTruth(row) }));\n'''
          new='''  // Collapse proven duplicate observations before unresolved-final accounting.\n  // This lets verified canonical truth supersede a stale source placeholder while\n  // the distinct-canonical-id guard above still preserves legitimate rematches.\n  const rawRows = dedupeScheduleRows(Array.isArray(games) ? games : [], options);\n  const evaluations = rawRows.map(row => ({ original: row, ...evaluateFinalResultTruth(row) }));\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('backend/src/record-truth-audit.js')
          s=p.read_text()
          old='''    canonical_event_id:row.canonical_event_id || null,\n    source_id:row.source_id || null,\n'''
          new='''    canonical_event_id:row.canonical_event_id || null,\n    source_event_key:row.source_event_key || null,\n    source_url:row.source_url || null,\n    source_id:row.source_id || null,\n'''
          assert old in s
          s=s.replace(old,new,1)

          marker='''function classificationFrom({truth,issues}) {\n'''
          helper='''function verifiedCanonicalDuplicate(candidate,candidates) {\n  if (!candidate || candidate.canonical_event_id) return false;\n  return (candidates || []).some(other => {\n    if (!other || !other.canonical_event_id) return false;\n    if (!scheduleRowsLikelyDuplicate(candidate,other,{reportingSchoolId:candidate.school_id,maxMinutes:15})) return false;\n    if (String(other.status||"").toUpperCase()!=="FINAL" || !rowCountsForRecord(other)) return false;\n    return evaluateFinalResultTruth(other).state === "VERIFIED";\n  });\n}\n\n'''
          if helper not in s:
            assert marker in s
            s=s.replace(marker,helper+marker,1)

          old='''  if (truth.state === "INCOMPLETE" || issues.some(item => item.code === "SOURCE_COMPLETENESS_GAP" || item.code === "PAST_DUE_NONTERMINAL" || item.code.includes("EXCEEDS_FINAL_EVIDENCE"))) return "INCOMPLETE";\n'''
          new='''  if (truth.state === "INCOMPLETE" || issues.some(item => item.code === "SOURCE_RESULT_AMBIGUITY" || item.code === "SOURCE_COMPLETENESS_GAP" || item.code === "PAST_DUE_NONTERMINAL" || item.code.includes("EXCEEDS_FINAL_EVIDENCE"))) return "INCOMPLETE";\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='''    if (countable && String(effective.status||"").toUpperCase()==="FINAL" && effectiveEval.state === "UNRESOLVED") {\n      addIssue(issues,issue(\n        "FINAL_MISSING_SCORE",\n        `${effective.opponent}: FINAL row does not contain both scores.`,\n        {severity:"blocking",gameId:row.game_id,sourceId:row.source_id,canonicalEventId:row.canonical_event_id}\n      ));\n    }\n'''
          new='''    if (countable && String(effective.status||"").toUpperCase()==="FINAL" && effectiveEval.state === "UNRESOLVED") {\n      const superseded=verifiedCanonicalDuplicate(effective,candidates);\n      addIssue(issues,issue(\n        superseded ? "SUPERSEDED_UNRESOLVED_FINAL_OBSERVATION" : "FINAL_MISSING_SCORE",\n        superseded\n          ? `${effective.opponent}: stale unresolved source observation is superseded by verified canonical final truth.`\n          : `${effective.opponent}: FINAL row does not contain both scores.`,\n        {severity:superseded?"info":"blocking",resolved:superseded,gameId:row.game_id,sourceId:row.source_id,canonicalEventId:row.canonical_event_id}\n      ));\n    }\n    if (countable && String(effective.status||"").toUpperCase()==="FINAL" && effectiveEval.state === "QUARANTINED") {\n      addIssue(issues,issue(\n        "SOURCE_RESULT_AMBIGUITY",\n        `${effective.opponent}: provider result is quarantined because the provider's own result surfaces disagree.`,\n        {severity:"blocking",gameId:row.game_id,sourceId:row.source_id,canonicalEventId:row.canonical_event_id}\n      ));\n    }\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('backend/src/m8-completeness-report.js')
          s=p.read_text()
          needle='''const CATEGORY_RULES = [\n'''
          category='''const CATEGORY_RULES = [\n  {\n    id:"source_result_ambiguity",\n    label:"provider result surfaces disagree",\n    codes:new Set(["SOURCE_RESULT_AMBIGUITY"]),\n    actionable:true,\n    systemic_fix_available:"provider_resolution_required",\n    requires_source_recovery:true,\n    legitimate_expected_gap:true\n  },\n'''
          assert needle in s
          s=s.replace(needle,category,1)
          p.write_text(s)
          PY

          rm .github/workflows/m8-final-logic-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/final-result-truth.js backend/src/result-source-quarantine.js backend/src/schedule-response-normalizer.js backend/src/record-truth-audit.js backend/src/m8-completeness-report.js .github/workflows/m8-final-logic-patch.yml
          git commit -m 'M8: fail closed ambiguous finals and supersede stale placeholders'
          git push origin HEAD:m8/results-completeness-20260914
