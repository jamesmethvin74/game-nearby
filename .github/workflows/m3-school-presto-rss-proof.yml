name: M3 school Presto RSS proof

on:
  pull_request:
    branches:
      - feature/m3-arkansas-college-coverage
    paths:
      - .github/workflows/m3-school-presto-rss-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe current raw Presto RSS item structure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const schools=[['cbc','https://cbcmustangs.com'],['crc','https://crcpioneers.com'],['wbu','https://www.wbueagles.com']];
          const wanted=['Men\'s Basketball','Women\'s Basketball','Men\'s Soccer','Women\'s Soccer','Women\'s Volleyball'];
          const field=(item,name)=>item.match(new RegExp(`<${name}[^>]*>([\\s\\S]*?)<\\/${name}>`,'i'))?.[1]||'';
          const plain=s=>String(s||'').replace(/<!\[CDATA\[|\]\]>/g,'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
          for(const [school,base] of schools){
            const r=await fetch(`${base}/composite?print=rss`,{headers:{'user-agent':'LocalBleachersAR-M3-rss-structure/1.0','accept':'application/rss+xml,text/xml,*/*'}});
            const text=await r.text();
            const items=[...text.matchAll(/<item\b[\s\S]*?<\/item>/gi)].map(m=>m[0]);
            console.log(`===== ${school} status=${r.status} items=${items.length} =====`);
            for(const category of wanted){
              const hit=items.find(item=>plain(field(item,'category'))===category && /2026/.test(`${plain(field(item,'pubDate'))} ${plain(field(item,'link'))} ${plain(field(item,'description'))}`) && !/\/\d{4}-\d{2}jv\//i.test(plain(field(item,'link'))));
              if(!hit) continue;
              console.log(`--- ${school} ${category} ---`);
              console.log(hit.slice(0,7000));
            }
          }
          NODE
