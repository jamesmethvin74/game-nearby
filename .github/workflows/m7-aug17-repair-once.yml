name: One-shot M7 Aug 17 approved repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-aug17-repair-once.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute approved fingerprinted production repair
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-repair-aug17-bfe0c8f493a14f8a'
          code=000
          for attempt in $(seq 1 24); do
            code=$(curl -sS --max-time 60 -o m7-repair.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              --data '{"plan_fingerprint":"m7-aug17-ae53a9b4"}' \
              "$URL" || true)
            echo "M7_REPAIR_ATTEMPT=$attempt HTTP=$code"
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              cat m7-repair.json || true
              exit 1
            fi
            sleep 5
          done
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('m7-repair.json','utf8'));
          console.log('M7_REPAIR_RESULT='+JSON.stringify(payload));
          if(payload.status!=='SUCCESS') throw new Error(`Unexpected repair status ${payload.status}`);
          if(payload.approved_fingerprint!=='m7-aug17-ae53a9b4') throw new Error('Fingerprint mismatch');
          if(Number(payload.d1?.repair?.rows_written)!==14) throw new Error(`Expected 14 writes, got ${payload.d1?.repair?.rows_written}`);
          if(Number(payload.post_repair?.expected_rows_written_if_replayed)!==0) throw new Error('Repair did not converge to zero replay writes');
          const states=payload.post_repair?.canonical_states||[];
          if(states.length!==2 || states.some(row=>row.state!=='ALREADY_CONVERGED'||row.status!=='FINAL')) throw new Error('Canonical verification failed');
          if((payload.post_repair?.remaining_blockers||[]).length) throw new Error('Repair left blockers');
          NODE
