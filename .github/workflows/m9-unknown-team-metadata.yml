name: M9 unknown team metadata probe

on:
  push:
    branches:
      - m9/statewide-conference-membership-20260915
    paths:
      - .github/workflows/m9-unknown-team-metadata.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify duplicate Forrest City catalog identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-unknown
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/schools'
          code=$(curl --silent --show-error --max-time 120 -w '%{http_code}' "$URL" -o m9-unknown/all-schools.json)
          if [ "$code" != "200" ]; then
            echo "school catalog probe HTTP $code" >&2
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('m9-unknown/all-schools.json','utf8'));
          const ids=new Set(['aaa-rp6yzq','df-cqpax3']);
          const rows=(body.schools||[]).filter(x=>ids.has(String(x.id))).map(x=>({id:x.id,name:x.name,city:x.city,state:x.state,level:x.level,catalog_scope:x.catalog_scope,team_count:x.team_count,mascot:x.mascot}));
          fs.writeFileSync('m9-unknown/forrest-city.json',JSON.stringify(rows,null,2));
          console.log(JSON.stringify(rows,null,2));
          if(rows.length!==2) throw new Error(`expected 2 Forrest City identities, found ${rows.length}`);
          NODE

      - name: Upload catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: m9-forrest-city-duplicate-evidence
          path: m9-unknown/forrest-city.json
          retention-days: 3
