name: M9 unknown team metadata probe

on:
  push:
    branches:
      - m9/statewide-conference-membership-20260915
    paths:
      - .github/workflows/m9-unknown-team-metadata.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read school catalog once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m9-unknown
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/schools'
          code=$(curl --silent --show-error --max-time 120 -w '%{http_code}' "$URL" -o m9-unknown/all-schools.json)
          if [ "$code" != "200" ]; then
            echo "school catalog probe HTTP $code" >&2
            cat m9-unknown/all-schools.json >&2
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('m9-unknown/all-schools.json','utf8'));
          const residual=new Set([
            'aaa-kkngn2','aaa-qtg924','aaa-rp6yzq','aaa-y7mrh7','aaa-zbqf4u','df-28tzpd','df-354bu3','df-5xyspt','df-6blldr','df-76naez','df-7wy9aj','df-7x4sxh','df-8ak58a','df-epraq7','df-ht8yyh','df-jpcbnr','df-k7ketx','df-ktr7yd','df-pucby7','df-qlkhe2','df-qrvx97','df-qtvk53','df-qx6b5u','df-qyakr5','df-srqlt7','df-suqu5r','df-t2mq54','df-vvme46','df-w9t9gr'
          ]);
          const clean=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\b(high|school|academy|christian|collegiate|university|studies|athletics)\b/g,' ').replace(/\s+/g,' ').trim();
          const schools=Array.isArray(body.schools)?body.schools:[];
          const rows=[];
          for(const s of schools.filter(x=>residual.has(String(x.id)))) {
            const key=clean(s.name);
            const near=schools.filter(x=>String(x.id)!==String(s.id) && clean(x.name)===key).map(x=>({id:x.id,name:x.name,level:x.level,catalog_scope:x.catalog_scope,team_count:x.team_count}));
            rows.push({id:s.id,name:s.name,level:s.level,catalog_scope:s.catalog_scope,team_count:s.team_count,exact_normalized_duplicates:near});
          }
          fs.writeFileSync('m9-unknown/residual-catalog.json',JSON.stringify(rows,null,2));
          console.log(JSON.stringify(rows,null,2));
          NODE

      - name: Upload catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: m9-residual-school-catalog
          path: m9-unknown/residual-catalog.json
          retention-days: 3
