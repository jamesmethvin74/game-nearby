name: Source audit error probe once
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/source-audit-error-probe-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read audit response only
        shell: bash
        run: |
          set -euo pipefail
          URL="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/source-recovery-audit-20260920-b72f9c31"
          code=$(curl --max-time 120 -sS -o /tmp/body -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          cat /tmp/body
