name: One-shot M7 Sep 8 plan proof

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m7-sep8-plan-proof-once.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Sep 8 convergence plan
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m7-vb-statewide-final-plan-1f2b3ac4d5e64788?through=2026-09-08'
          code=$(curl -sS --max-time 180 -o plan.json -w '%{http_code}' "$URL")
          echo "M7_SEP8_PLAN_HTTP=$code"
          test "$code" = "200" || { cat plan.json; exit 1; }
          node <<'NODE'
          const p=require('./plan.json');
          console.log('M7_SEP8_PLAN='+JSON.stringify({safe_to_execute:p.safe_to_execute,fingerprint:p.plan_fingerprint,d1:p.d1,catalog:p.catalog_plan,candidates:p.candidates,write_scope:p.write_scope,blocked:p.blocked,excluded:p.excluded,blocked_identity:(p.blocked_identity||[]).slice(0,25)}));
          if(Number(p.d1?.rows_written||0)!==0) throw new Error('planner wrote to D1');
          NODE
