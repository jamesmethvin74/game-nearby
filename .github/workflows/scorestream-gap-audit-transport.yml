name: ScoreStream gap audit transport
on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/scorestream-gap-audit-transport.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch bounded production WVB sample
        shell: bash
        run: |
          set -euo pipefail
          API='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 90             "${API}/api/v1/schools" -o /tmp/schools.json
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 120             "${API}/api/v1/games?lat=34.7465&lon=-92.2896&radius=500&since=2026-08-01T00%3A00%3A00Z&until=2026-11-15T23%3A59%3A59Z"             -o /tmp/games.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          sample = [
            "BENTONVILLE HIGH SCHOOL","Bentonville West High School","Fayetteville High School","Har-Ber High School",
            "Rogers High School","Rogers Heritage High School","Springdale High School","Farmington High School",
            "Prairie Grove High School","Siloam Springs High School",
            "CONWAY HIGH SCHOOL","Bryant High School","CABOT HIGH SCHOOL","North Little Rock High School",
            "Little Rock Central High School","Little Rock Southwest High School","Pulaski Academy High School",
            "Little Rock Christian Academy","GREENBRIER HIGH SCHOOL","VILONIA HIGH SCHOOL",
            "Jonesboro High School","BROOKLAND HIGH SCHOOL","Batesville High School","Nettleton High School",
            "Valley View High School","Paragould High School","Cave City High School","Pocahontas High School",
            "Greene County Tech High School","Rivercrest High School",
            "MOUNTAIN HOME HIGH SCHOOL","HARRISON HIGH SCHOOL","COTTER HIGH SCHOOL","VALLEY SPRINGS HIGH SCHOOL",
            "BERGMAN HIGH SCHOOL","FLIPPIN HIGH SCHOOL","Huntsville High School","BERRYVILLE HIGH SCHOOL",
            "Greenwood High School","VAN BUREN HIGH SCHOOL","Russellville High School","Paris High School",
            "CHARLESTON HIGH SCHOOL","HACKETT HIGH SCHOOL","Lavaca High School","Alma High School",
            "Mena High School","Magnolia High School","CAMDEN FAIRVIEW HIGH SCHOOL","Genoa Central High School",
            "NASHVILLE HIGH SCHOOL","Arkadelphia High School"
          ]
          schools=json.load(open('/tmp/schools.json')).get('schools',[])
          games=json.load(open('/tmp/games.json')).get('games',[])
          def norm(s):
            return ''.join(ch.lower() for ch in str(s or '') if ch.isalnum())
          by_name={norm(s.get('name')):s for s in schools}
          wvb=[g for g in games if str(g.get('sport','')).lower()=='volleyball' and str(g.get('gender','')).lower()=='girls' and str(g.get('season',''))=='2026']
          now=datetime(2026,10,1,23,30,tzinfo=timezone.utc)
          out=[]
          for name in sample:
            s=by_name.get(norm(name))
            sid=s.get('id') if s else None
            matched=[]
            if sid:
              for g in wvb:
                ids={str(g.get(k) or '') for k in ('school_id','canonical_home_school_id','canonical_away_school_id')}
                if sid in ids:
                  matched.append(g)
            # dedupe canonical event / fallback game id
            seen={}
            for g in matched:
              key=str(g.get('canonical_event_id') or g.get('id'))
              seen[key]=g
            matched=list(seen.values())
            finals=[g for g in matched if str(g.get('status','')).upper()=='FINAL']
            missing=[g for g in finals if g.get('team_score') is None and (g.get('canonical_home_score') is None or g.get('canonical_away_score') is None)]
            future=[]
            for g in matched:
              raw=g.get('scheduled_at') or g.get('canonical_scheduled_at')
              try:
                dt=datetime.fromisoformat(str(raw).replace('Z','+00:00'))
                if dt.astimezone(timezone.utc)>now: future.append(g)
              except: pass
            out.append({
              'school':name,'school_id':sid,'games':len(matched),'finals':len(finals),
              'future':len(future),'finals_missing_score':len(missing),
              'game_ids':[str(g.get('canonical_event_id') or g.get('id')) for g in sorted(matched,key=lambda x:str(x.get('scheduled_at') or x.get('canonical_scheduled_at') or ''))],
              'opponents':[g.get('opponent') or g.get('canonical_away_name') or g.get('canonical_home_name') for g in sorted(matched,key=lambda x:str(x.get('scheduled_at') or x.get('canonical_scheduled_at') or ''))]
            })
          print("AUDIT_JSON_START")
          print(json.dumps({'sample_size':len(sample),'production_wvb_rows':len(wvb),'rows':out},separators=(',',':')))
          print("AUDIT_JSON_END")
          PY
