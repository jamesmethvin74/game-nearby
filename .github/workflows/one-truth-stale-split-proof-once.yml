name: ONE_TRUTH remaining issue extraction once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/one-truth-stale-split-proof-once.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve remaining ONE_TRUTH issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --max-time 90 -fsS "$BASE/api/v1/internal/one-truth-audit-20260919-7c4b1d9e3" > /tmp/audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const issues=(a.statewide_audit?.issues||[]).filter(x=>x.surface==='ONE_TRUTH_TB');
          const grouped={};
          for(const x of issues) (grouped[x.code]??=[]).push(x);
          const payload={
            marker:'ONE_TRUTH_REMAINING_ISSUES_20260920',
            problems:a.problems,
            counts:Object.fromEntries(Object.entries(grouped).map(([k,v])=>[k,v.length])),
            issues:grouped
          };
          fs.writeFileSync('/tmp/comment.md','### ONE_TRUTH remaining issues\n\n```json\n'+JSON.stringify(payload,null,2)+'\n```');
          NODE
          gh pr comment 366 --repo jamesmethvin74/game-nearby --body-file /tmp/comment.md
