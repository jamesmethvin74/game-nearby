name: One-shot execute final missing score repair

on:
  pull_request:
    branches: [feature/live-sports-pipeline-m1]

jobs:
  execute:
    if: github.head_ref == 'audit/execute-final-missing-score-repair-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Execute approved bounded production repair
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/final-missing-score-execute-20260912-4fd5a1c7'
          BODY='{"fingerprint":"final-missing-score-two-games-v2-19a75d21"}'
          curl --fail --silent --show-error \
            -X POST \
            -H 'content-type: application/json' \
            --data "$BODY" \
            "$URL" -o result.json
          jq . result.json
          jq -e '
            .status == "SUCCESS" and
            (.corrected_cases | length) == 2 and
            .direct_write_telemetry.rows_written == 2 and
            .direct_write_telemetry.game_rows_written == 0 and
            .direct_write_telemetry.conflict_rows_written == 0 and
            .verification.safe == true and
            .verification.d1.rows_written == 0 and
            ([.verification.cases[].action] | all(. == "already_complete"))
          ' result.json >/dev/null
