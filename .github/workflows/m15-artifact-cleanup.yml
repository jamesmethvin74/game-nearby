name: M15 artifact cleanup
on:
  push:
    branches:
      - m15/statewide-repair-reconciliation-20260917
    paths:
      - .github/workflows/m15-artifact-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete temporary M15 evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact_id in 10514154426 10509886548 10509009150; do
            code="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$artifact_id")"
            if [[ "$code" != "204" && "$code" != "404" ]]; then
              cat /tmp/delete.json
              echo "artifact $artifact_id delete failed with HTTP $code" >&2
              exit 1
            fi
            echo "artifact $artifact_id delete HTTP $code"
          done
