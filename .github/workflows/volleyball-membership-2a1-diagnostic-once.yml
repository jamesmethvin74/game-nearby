name: One-shot approved 2A 1 volleyball membership repair

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - backend/src/logo-bootstrap-worker.js
      - .github/workflows/volleyball-membership-2a1-diagnostic-once.yml

permissions:
  contents: read

jobs:
  approved-write:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Invoke exact approved 2A 1 Worker repair and verify response
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"

          health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/v1/health" || true)
          echo "Health HTTP ${health_code}"
          cat health.json || true
          echo
          test "$health_code" = "200"
          node -e "const p=require('./health.json'); if(p.ok!==true||p.service!=='localbleachersar-sports-api') process.exit(1);"

          URL="$BASE/api/v1/maintenance/volleyball-membership/2a1-approved-20260910-94d7e1"
          code=000
          for attempt in $(seq 1 18); do
            code=$(curl -sS --max-time 60 -o repair.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo "2A 1 Approved Repair HTTP ${code}"
          cat repair.json || true
          echo
          test "$code" = "200"

          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('repair.json','utf8'));
          const ids=new Set([
            'df-mvcc4m-volleyball-2026',
            'df-ev2nv9-volleyball-2026',
            'df-z5qhew-volleyball-2026',
            'df-np64rf-volleyball-2026',
            'df-8cunsm-volleyball-2026'
          ]);
          const rows=Array.isArray(p.verification)?p.verification:[];
          const verified=rows.length===5
            && rows.every(row=>ids.has(String(row.team_id)) && row.conference_id==='2a-1-volleyball');
          const success=p.status==='SUCCESS'
            && p.plan?.change_count===5
            && p.plan?.wrong_count===0
            && p.d1Statements===2
            && p.teamWrites===5
            && Number(p.conferenceWrites)<=1
            && verified;
          const already=p.status==='ALREADY_APPLIED'
            && p.teamWrites===0
            && p.conferenceWrites===0
            && verified;
          if(!success && !already) {
            console.error('Approved 2A 1 production repair validation failed');
            process.exit(1);
          }
          console.log('VOLLEYBALL_2A1_PRODUCTION_REPAIR='+JSON.stringify(p));
          NODE
