name: M8 bounded diagnostic transport

on:
  push:
    branches:
      - ops/m8-bounded-diagnostic-20260914
    paths:
      - .github/workflows/m8-bounded-diagnostic-transport.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm exact football canonical orientation
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/schools/df-jys3ef/schedule'
          curl --fail-with-body --silent --show-error "$URL" -o schedule.json
          python - <<'PY'
          import json
          p=json.load(open('schedule.json'))
          rows=p if isinstance(p,list) else p.get('games',p.get('schedule',[]))
          cid='ce:football:boys:2026:df-jys3ef:df-vm7v8n:20260911:df-69d51fb3f977a82d28000000'
          for r in rows or []:
            if r.get('canonical_event_id')==cid:
              keys=['id','canonical_event_id','reporting_team_id','opponent','scheduled_at','status','team_score','opponent_score','result','canonical_home_school_id','canonical_away_school_id','canonical_home_name','canonical_away_name','canonical_home_score','canonical_away_score','canonical_status','conflict_count','counts_for_record']
              print(json.dumps({k:r.get(k) for k in keys},separators=(',',':')))
          PY
