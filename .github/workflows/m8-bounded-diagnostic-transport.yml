name: M8 bounded diagnostic transport

on:
  push:
    branches:
      - ops/m8-bounded-repair-20260914
    paths:
      - .github/workflows/m8-bounded-diagnostic-transport.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact remaining result blockers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/schools'
          for school in df-hrdb8f df-vt4unv df-jys3ef df-vm7v8n; do
            curl --fail-with-body --silent --show-error "$BASE/$school/schedule" -o "$school.json"
          done
          python - <<'PY'
          import json
          schools=['df-hrdb8f','df-vt4unv','df-jys3ef','df-vm7v8n']
          for sid in schools:
            p=json.load(open(sid+'.json'))
            rows=p if isinstance(p,list) else p.get('games',p.get('schedule',[]))
            out=[]
            for r in rows or []:
              s=(str(r.get('scheduled_at',''))+' '+str(r.get('opponent',''))).lower()
              if ('2026-08-27' in s and ('lakeside' in s or sid in ('df-hrdb8f','df-vt4unv'))) or ('2026-09-11' in s and ('harrisburg' in s or 'trumann' in s or sid in ('df-jys3ef','df-vm7v8n'))):
                out.append({k:r.get(k) for k in ['id','canonical_event_id','reporting_team_id','team_id','opponent','opponent_school_id','scheduled_at','status','team_score','opponent_score','result','source_id','source_type','parser_type','data_trust','conflict_count','counts_for_record']})
            print(json.dumps({'school_id':sid,'matches':out},separators=(',',':')))
          PY
