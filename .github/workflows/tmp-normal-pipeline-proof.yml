name: tmp-normal-pipeline-proof
on:
  push:
    paths:
      - ".github/workflows/tmp-normal-pipeline-proof.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      BASE_URL: https://localbleachersar-sports-api.james-methvin74.workers.dev
    steps:
      - name: Observe normal scheduled production pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lb-proof
          echo "TRANSPORT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          target=$(date -u -d '2026-09-22 22:05:00 UTC' +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            sleep $((target-now))
          fi

          curl -fsS "$BASE_URL/api/v1/health" -o /tmp/lb-proof/health.json
          curl -fsS "$BASE_URL/api/v1/sources" -o /tmp/lb-proof/sources.json
          curl -fsS "$BASE_URL/api/v1/conflicts" -o /tmp/lb-proof/conflicts.json

          audit_http=$(curl -sS -o /tmp/lb-proof/audit.json -w '%{http_code}'             -H "x-refresh-token: $REFRESH_TOKEN"             "$BASE_URL/api/v1/coverage-report?view=data-integrity")
          record_http=$(curl -sS -o /tmp/lb-proof/record.json -w '%{http_code}'             -H "x-refresh-token: $REFRESH_TOKEN"             "$BASE_URL/api/v1/coverage-report?view=record-truth")

          echo "AUDIT_HTTP=$audit_http"
          echo "RECORD_HTTP=$record_http"

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/lb-proof")
          def load(name):
              return json.loads((root/name).read_text())
          health=load("health.json")
          sources=load("sources.json")
          conflicts=load("conflicts.json")
          audit=load("audit.json")
          record=load("record.json")

          print("HEALTH="+json.dumps(health,sort_keys=True,separators=(",",":")))

          refreshed=[]
          for s in sources.get("sources",[]):
              checked=str(s.get("last_checked_at") or "")
              success=str(s.get("last_successful_fetch_at") or "")
              if checked >= "2026-09-22T22:00:00":
                  refreshed.append({
                      "id":s.get("id"),"team_id":s.get("team_id"),"source_type":s.get("source_type"),
                      "parser_type":s.get("parser_type"),"last_checked_at":checked,
                      "last_successful_fetch_at":success,"last_http_status":s.get("last_http_status"),
                      "consecutive_failures":s.get("consecutive_failures"),"health_state":s.get("health_state")
                  })
          print("SCHEDULED_SOURCE_REFRESH_COUNT="+str(len(refreshed)))
          print("SCHEDULED_SOURCE_REFRESHES="+json.dumps(refreshed,sort_keys=True,separators=(",",":")))

          active_conflicts=conflicts.get("conflicts",[])
          print("ACTIVE_CONFLICT_COUNT="+str(len(active_conflicts)))
          print("ACTIVE_CONFLICTS="+json.dumps(active_conflicts[:50],sort_keys=True,separators=(",",":")))

          summary=audit.get("summary",{})
          print("AUDIT_SUMMARY="+json.dumps(summary,sort_keys=True,separators=(",",":")))
          print("AUDIT_CLEAN="+str(audit.get("clean")))
          print("AUDIT_ISSUES="+json.dumps(audit.get("issues",[])[:100],sort_keys=True,separators=(",",":")))

          rs=record.get("summary",{})
          print("RECORD_SUMMARY="+json.dumps(rs,sort_keys=True,separators=(",",":")))
          recent=[]
          for t in record.get("teams",[]):
              stored=t.get("stored_record") or {}
              calc=str(stored.get("calculated_at") or "")
              if calc >= "2026-09-22T22:00:00":
                  recent.append({
                      "team_id":t.get("team_id"),"school_id":t.get("school_id"),
                      "school_name":t.get("school_name"),"sport":t.get("sport"),
                      "gender":t.get("gender"),"conference_id":t.get("conference_id"),
                      "classification":t.get("classification"),"evidence_games":t.get("evidence_games"),
                      "evidence_conference_games":t.get("evidence_conference_games"),
                      "stored_record":stored,"derived_record":t.get("derived_record"),
                      "public_record_verified":t.get("public_record_verified")
                  })
          print("RECENTLY_RECALCULATED_TEAM_COUNT="+str(len(recent)))
          print("RECENTLY_RECALCULATED_TEAMS="+json.dumps(recent,sort_keys=True,separators=(",",":")))
          print("TRANSPORT_FINISHED_AT=NOW")
          PY
