name: Milestone 1 ADE grade span diagnostic

on:
  push:
    branches:
      - diagnostics/milestone1-ade-grade-spans
    paths:
      - .github/workflows/milestone1-ade-grade-span-diagnostic.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Arkansas school locator once
        shell: python
        run: |
          import urllib.request
          url='https://adedata.arkansas.gov/LEA/Home/schools'
          req=urllib.request.Request(url,headers={'User-Agent':'LocalBleachersAR-milestone1-diagnostic/1.0','Accept':'text/html'})
          with urllib.request.urlopen(req,timeout=45) as response:
              body=response.read()
              print('HTTP',response.status,'bytes',len(body),'content-type',response.headers.get('content-type'))
          open('ade-school-locator.html','wb').write(body)
          if len(body)<100000:
              raise SystemExit('ADE school locator response unexpectedly small')

      - name: Upload locator snapshot
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-ade-school-locator
          path: ade-school-locator.html
          retention-days: 1
