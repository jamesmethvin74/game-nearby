name: One-shot presentation contract probe
on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths: [.github/workflows/m15-presentation-contract-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live Conway presentation surfaces
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS "$API/api/v1/team-statuses?school_ids=conway" -o batch.json
          curl -fsS "$API/api/v1/schools/conway/schedule" -o schedule.json
          curl -fsS "$API/api/v1/standings?sport=volleyball&conference=6a-central" -o standings.json
          python - <<'PY'
          import json
          b=json.load(open("batch.json"))
          s=json.load(open("schedule.json"))
          st=json.load(open("standings.json"))
          def vb(rows):
              return next((x for x in rows if x.get("sport")=="volleyball"),{})
          print("BATCH",json.dumps(vb(b.get("team_statuses",[])),sort_keys=True))
          print("SCHEDULE",json.dumps(vb(s.get("team_statuses",[])),sort_keys=True))
          row=next((x for x in st.get("standings",[]) if x.get("school_name")=="Conway"),{})
          print("STANDINGS",json.dumps(row,sort_keys=True))
          PY
