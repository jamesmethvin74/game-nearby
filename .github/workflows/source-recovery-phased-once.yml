name: Source recovery phased once

on:
  push:
    branches: [feature/live-sports-pipeline-m1]
    paths:
      - .github/workflows/source-recovery-phased-once.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test bounded recovery code
        working-directory: backend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/statewide-data-integrity-repair.js
          node --check src/m8-final-audit-worker.js
          node --test test/statewide-data-integrity-repair.test.js test/one-truth-contract.test.js

      - name: Wait for exact Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          for attempt in $(seq 1 36); do
            body=$(gh api repos/jamesmethvin74/game-nearby/issues/366/comments --paginate \
              --jq '[.[] | select(.user.login=="cloudflare-workers-and-pages[bot]")] | last | .body // ""')
            if printf '%s' "$body" | grep -q "Deployment successful" && printf '%s' "$body" | grep -q "$SHORT_SHA"; then
              echo "Cloudflare deployed $SHORT_SHA"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Snapshot current source defects
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --retry 2 --retry-all-errors --retry-delay 2 --max-time 120 -fsS \
            "$BASE/api/v1/internal/source-recovery-audit-20260920-b72f9c31" > /tmp/before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));
          const body={audit:a};
          fs.writeFileSync('/tmp/apply.json',JSON.stringify(body));
          console.log('BEFORE='+JSON.stringify({
            active_teams:a.summary?.total_active_teams_examined,
            source_issues:a.summary?.upstream_source_observation_issues,
            source_codes:a.summary?.upstream_source_issues_by_code,
            one_truth_blocking:a.summary?.one_truth_surface_blocking_issues,
            source_vs_truth_blocking:a.summary?.source_vs_truth_blocking_issues
          }));
          NODE

      - name: Apply audited source fixes once
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          code=$(curl --max-time 120 -sS -o /tmp/apply-result.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data-binary @/tmp/apply.json \
            "$BASE/api/v1/internal/source-recovery-apply-20260920-b72f9c31")
          echo "APPLY_HTTP=$code"
          cat /tmp/apply-result.json
          test "$code" = "200"

      - name: Rebuild ONE_TRUTH once
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          code=$(curl --max-time 120 -sS -o /tmp/rebuild.json -w '%{http_code}' \
            -X POST "$BASE/api/v1/internal/source-recovery-rebuild-20260920-b72f9c31")
          echo "REBUILD_HTTP=$code"
          cat /tmp/rebuild.json
          test "$code" = "200"

      - name: Verify after state
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl --retry 2 --retry-all-errors --retry-delay 2 --max-time 120 -fsS \
            "$BASE/api/v1/internal/source-recovery-audit-20260920-b72f9c31" > /tmp/after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));
          const apply=JSON.parse(fs.readFileSync('/tmp/apply-result.json','utf8'));
          const rebuild=JSON.parse(fs.readFileSync('/tmp/rebuild.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));
          const result={
            before:{
              source_issues:before.summary?.upstream_source_observation_issues,
              source_codes:before.summary?.upstream_source_issues_by_code,
              one_truth_blocking:before.summary?.one_truth_surface_blocking_issues,
              source_vs_truth_blocking:before.summary?.source_vs_truth_blocking_issues
            },
            apply:{
              source_issue_count:apply.source_issue_count,
              canonical:apply.canonical,
              suppression_rows:apply.suppression?.rows_written,
              affected_team_count:(apply.affected_team_ids||[]).length,
              record_rebuild:apply.record_rebuild,
              d1:apply.d1
            },
            rebuild:rebuild.one_truth,
            after:{
              source_issues:after.summary?.upstream_source_observation_issues,
              source_codes:after.summary?.upstream_source_issues_by_code,
              one_truth_blocking:after.summary?.one_truth_surface_blocking_issues,
              source_vs_truth_blocking:after.summary?.source_vs_truth_blocking_issues,
              presentation_codes:after.summary?.issues_by_code
            }
          };
          fs.writeFileSync('/tmp/result.json',JSON.stringify(result,null,2));
          console.log('SOURCE_RECOVERY_RESULT='+JSON.stringify(result));
          if(Number(rebuild.one_truth?.teams)!==1227) throw new Error('ONE_TRUTH team count not 1227');
          NODE
