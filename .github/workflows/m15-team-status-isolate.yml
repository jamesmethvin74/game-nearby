name: M15 team-status isolate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m15-team-status-isolate.yml

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe exact school IDs individually
        run: |
          base="https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/team-statuses?school_ids="
          for id in conway df-ezw3f9 df-xpb38v df-wlwrfa df-hrdb8f df-h73ln2 df-kq5hlr df-pz2b7r; do
            code=$(curl -sS -o "/tmp/$id.json" -w "%{http_code}" "${base}${id}")
            echo "M15_STATUS_SINGLE ${id} ${code} $(head -c 180 "/tmp/$id.json" | tr '\n' ' ')"
          done
