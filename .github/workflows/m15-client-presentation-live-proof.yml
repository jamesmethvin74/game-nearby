name: One-shot M15 client presentation live proof

on:
  push:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - .github/workflows/m15-client-presentation-live-proof.yml

permissions:
  contents: read

concurrency:
  group: m15-client-presentation-live-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve live production school IDs
        shell: bash
        run: |
          set -euo pipefail
          API="https://localbleachersar-sports-api.james-methvin74.workers.dev"
          curl -fsS --max-time 20 "$API/api/v1/schools" -o schools.json
          python - <<'PY'
          import json
          p=json.load(open("schools.json",encoding="utf-8"))
          schools=p.get("schools",[])
          targets=("maumelle","north little rock","morrilton","conway")
          print("LIVE_SCHOOL_ID_RESOLUTION")
          for target in targets:
              matches=[]
              for s in schools:
                  hay=" ".join(str(s.get(k) or "") for k in ("id","name","location_matched_name","city","mascot")).lower()
                  if target in hay:
                      matches.append({
                        "id":s.get("id"),
                        "name":s.get("name"),
                        "location_matched_name":s.get("location_matched_name"),
                        "city":s.get("city"),
                        "catalog_scope":s.get("catalog_scope"),
                        "team_count":s.get("team_count")
                      })
              print(target, json.dumps(matches, sort_keys=True))
          PY
