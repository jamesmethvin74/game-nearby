name: One-shot final missing score audit

on:
  pull_request:
    branches: [feature/live-sports-pipeline-m1]

jobs:
  audit:
    if: github.head_ref == 'audit/final-missing-score-targets-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact team rows and verify two source events
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          DRAGONFLY='https://maxinfosite-api-live.dragonflyathletics.com/states/ArkAA/schedules/2026/WVB_Varsity/0'
          mkdir -p final-score-audit
          teams=(
            df-7kza8c-volleyball-2026
            df-qgka87-volleyball-2026
            df-cqpax3-volleyball-2026
            df-8pkud7-volleyball-2026
          )
          : > final-score-audit/candidates.ndjson
          for team in "${teams[@]}"; do
            curl --fail --silent --show-error \
              -H 'x-localbleachers-diagnostic: final-score-target-audit' \
              "$BASE/api/v1/teams/$team/schedule" \
              -o "final-score-audit/$team.json"
            jq -c --arg team "$team" '
              .games[]
              | select(.status == "FINAL" and ((.team_score == null) or (.opponent_score == null)))
              | {
                  team_id:$team,
                  game_id:.id,
                  canonical_event_id:(.canonical_event_id // null),
                  opponent:(.opponent // null),
                  opponent_school_id:(.opponent_school_id // null),
                  scheduled_at:(.scheduled_at // null),
                  home_away:(.home_away // null),
                  status:.status,
                  team_score:(.team_score // null),
                  opponent_score:(.opponent_score // null),
                  result:(.result // null),
                  source_id:(.source_id // null),
                  source_type:(.source_type // null),
                  parser_type:(.parser_type // null),
                  source_url:(.source_url // null),
                  notes:(.notes // null)
                }
            ' "final-score-audit/$team.json" >> final-score-audit/candidates.ndjson
          done
          echo '=== MISSING-SCORE FINAL CANDIDATES ==='
          cat final-score-audit/candidates.ndjson
          test "$(wc -l < final-score-audit/candidates.ndjson)" -eq 4

          curl --fail --silent --show-error "$DRAGONFLY" -o final-score-audit/dragonfly-wvb-page0.json
          jq -c '
            .schedule[]
            | select((.eventId // .id) == "695fcf130e0845562900001c" or (.eventId // .id) == "69babe474fd8441434000004")
            | {
                eventId:(.eventId // .id),
                date:(.date // .startDateTime // .scheduledAt),
                status:(.status.name // .status // .gameStatus),
                participants:[(.participants // [])[] | {
                  name:(.name // null),
                  orgShortCode:(.orgShortCode // null),
                  teamId:(.team.teamId // null),
                  isHome:(.isHome // null),
                  score:(.result.score // null),
                  opponentScore:(.result.opponentScore // null),
                  result:(.result.code // null)
                }]
              }
          ' final-score-audit/dragonfly-wvb-page0.json > final-score-audit/authority-events.ndjson
          echo '=== DRAGONFLY AUTHORITY EVENTS ==='
          cat final-score-audit/authority-events.ndjson
          test "$(wc -l < final-score-audit/authority-events.ndjson)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: final-missing-score-targets
          path: final-score-audit/
          retention-days: 1
