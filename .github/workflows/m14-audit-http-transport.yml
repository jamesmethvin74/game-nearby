name: M14 audit HTTP transport

on:
  push:
    branches: [ops/m14-audit-http-transport-20260917]
    paths: [.github/workflows/m14-audit-http-transport.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invoke deployed read-only audit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://localbleachersar-sports-api.james-methvin74.workers.dev/api/v1/internal/m14-statewide-data-integrity-audit-20260916-4d8c7a2f'
          code=$(curl -sS --max-time 240 -o audit.json -w '%{http_code}' -H 'accept: application/json' -H 'cache-control: no-store' "$URL" || true)
          echo "HTTP_STATUS=$code"
          if [ "$code" != "200" ]; then
            cat audit.json 2>/dev/null || true
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log('M14_AUDIT_RESULT_BEGIN');
          console.log(JSON.stringify({audit_version:p.audit_version,generated_at:p.generated_at,season:p.season,clean:p.clean,summary:p.summary,d1:p.d1,issues:p.issues},null,2));
          console.log('M14_AUDIT_RESULT_END');
          NODE
