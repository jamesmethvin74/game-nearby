name: Backend check

on:
  pull_request:
    paths:
      - "backend/**"
      - "live-data.js"
      - "school-schedule.js"
      - "polish.js"
      - "RESOURCE_BUDGETS.md"
      - ".github/workflows/backend-check.yml"
      - ".github/workflows/production-statewide-smoke.yml"
  push:
    branches: [main, feature/live-sports-pipeline-m1]
    paths:
      - "backend/**"
      - "live-data.js"
      - "school-schedule.js"
      - "polish.js"
      - "RESOURCE_BUDGETS.md"
      - ".github/workflows/backend-check.yml"
      - ".github/workflows/production-statewide-smoke.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Apply D1 migrations in SQLite
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const db=new DatabaseSync(':memory:');
          for (const file of fs.readdirSync('migrations').filter(name=>name.endsWith('.sql')).sort()) {
            db.exec(fs.readFileSync(`migrations/${file}`,'utf8'));
            console.log('APPLIED',file);
          }
          const tables=db.prepare("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").all().map(row=>row.name);
          for (const required of ['canonical_events','canonical_event_members','event_conflicts','school_aliases','school_external_identities','team_external_identities','catalog_sync_state','statewide_collection_state','school_location_sync_state']) {
            if (!tables.includes(required)) throw new Error(`missing required table ${required}`);
          }
          const triggerNames=new Set(db.prepare("SELECT name FROM sqlite_master WHERE type='trigger'").all().map(row=>row.name));
          for (const required of [
            'trg_games_inherit_canonical_location_insert',
            'trg_games_inherit_canonical_location_update',
            'trg_canonical_location_propagates_to_games',
            'trg_statewide_team_scope_updates_source_authority',
            'trg_statewide_source_scope_on_insert',
            'trg_dragonfly_school_starts_unverified'
          ]) {
            if (!triggerNames.has(required)) throw new Error(`missing required trigger ${required}`);
          }
          const sourceColumns=db.prepare("PRAGMA table_info(sources)").all().map(row=>row.name);
          if (!sourceColumns.includes('collection_mode')) throw new Error('sources.collection_mode missing');
          const schoolColumns=db.prepare("PRAGMA table_info(schools)").all().map(row=>row.name);
          for (const required of ['address','postal_code','location_source','location_matched_name','location_updated_at','catalog_scope','membership_source','membership_verified_at']) {
            if (!schoolColumns.includes(required)) throw new Error(`schools.${required} missing`);
          }
          const scopeSql=db.prepare("SELECT sql FROM sqlite_master WHERE type='table' AND name='schools'").get()?.sql||'';
          for (const scope of ['local','opponent-only','unknown']) if (!scopeSql.includes(scope)) throw new Error(`schools.catalog_scope missing ${scope} constraint`);
          const sources=db.prepare("SELECT id,parser_type,authority_rank,expected_min_games,collection_mode FROM sources WHERE parser_type='dragonfly-public' ORDER BY id").all();
          if (sources.length!==3) throw new Error(`expected 3 seeded DragonFly validation sources, found ${sources.length}`);
          if (sources.some(source=>source.authority_rank!==10 || source.expected_min_games<5 || source.collection_mode!=='team')) throw new Error('DragonFly source authority/safety/collection-mode configuration is wrong');
          console.log('VERIFIED D1 V2 plus statewide discovery/location/catalog-scope schema and triggers',sources);
          JS


  scheduled-pipeline-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check scheduled presentation pipeline syntax
        run: >
          node --check src/index.js &&
          node --check src/canonical-observation-writer.js &&
          node --check src/dragonfly-statewide.js &&
          node --check src/dragonfly-certified-statewide.js &&
          node --check src/scoped-cadence-runner.js &&
          node --check src/milestone2-scheduled-worker.js &&
          node --check src/one-truth-worker.js
      - name: Run scheduled presentation pipeline regression tests
        run: >
          node --test
          test/milestone2-scheduled-worker.test.js
          test/m11-live-freshness.test.js
          test/dragonfly-certified-statewide.test.js
          test/dragonfly-statewide.test.js
          test/canonical-final-score-monotonicity.test.js
          test/final-score-preservation.test.js
          test/record-rebuild.test.js
          test/record-rebuild-db.test.js
          test/record-rebuild-conference-db.test.js
          test/immediate-standings-final.test.js
          test/m10-conference-standings-truth.test.js
          test/volleyball-live-results-standings.test.js
          test/one-truth-contract.test.js
          test/maxpreps-volleyball-result-collector-db.test.js
          test/hootens-resilient-results.test.js
          test/hootens-statewide-results.test.js
          test/hootens-team-page-catchup.test.js
