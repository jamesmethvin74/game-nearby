name: One-shot final record truth audit

on:
  pull_request:
    branches:
      - feature/live-sports-pipeline-m1
    paths:
      - '.github/workflows/one-shot-final-record-truth-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact zero-D1 marker, then run final audit once
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://localbleachersar-sports-api.james-methvin74.workers.dev'
          MARKER="$BASE/api/v1/internal/record-truth-audit-marker-9e302844"
          AUDIT="$BASE/api/v1/internal/record-truth-audit-9e302844"

          rm -f marker.json audit.json audit-summary.json
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o marker.tmp -w '%{http_code}' "$MARKER" || true)
            if [ "$code" = "200" ] && node <<'NODE'
          const fs=require('fs');
          try {
            const r=JSON.parse(fs.readFileSync('marker.tmp','utf8'));
            process.exit(r.marker==='record-truth-audit-temp-9e302844' && r.d1_access===false && Number(r.rows_written||0)===0 ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then
              mv marker.tmp marker.json
              break
            fi
            sleep 2
          done
          test -f marker.json

          # EXACTLY ONE statewide D1 audit request after deployment is proven by the zero-D1 marker.
          curl -fsS --max-time 180 "$AUDIT" -o audit.json

          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('audit.json','utf8'));
          if(r?.audit_contract?.version!=='record-truth-v1') throw new Error(`Unexpected audit contract: ${JSON.stringify(r?.audit_contract||null)}`);
          if(Number(r?.d1?.rows_written||0)!==0) throw new Error(`Audit wrote D1 rows: ${r?.d1?.rows_written}`);
          const s=r.summary||{};
          for(const key of ['total_active_teams_examined','total_active_teams_with_finals','total_active_teams_requiring_record_audit','verified','incomplete','contradictory','unresolved','non_verified','orientation_corrections','unexplained_record_contradictions']) {
            if(!Number.isFinite(Number(s[key]))) throw new Error(`Missing/invalid summary field ${key}: ${s[key]}`);
          }
          const teams=Array.isArray(r.teams)?r.teams:[];
          const nonVerified=Array.isArray(r.non_verified_teams)?r.non_verified_teams:[];
          const issueCounts={};
          for(const team of nonVerified) for(const issue of team.issues||[]) issueCounts[issue.code]=(issueCounts[issue.code]||0)+1;
          const contradictions=teams.filter(t=>Number(t.unexplained_contradiction_count||0)>0).map(t=>({
            team_id:t.team_id,school_name:t.school_name,sport:t.sport,classification:t.classification,
            unexplained_contradiction_count:t.unexplained_contradiction_count,
            issues:(t.issues||[]).filter(i=>i.severity!=='info' && i.resolved!==true && /CONTRADICTION/.test(String(i.code||'')))
          }));
          const arkansas=teams.find(t=>t.school_id==='arkansas' && t.school_name==='University of Arkansas' && t.sport==='football') || null;
          const out={generated_at:r.generated_at,d1:r.d1,summary:s,arkansas,contradictions,issue_counts:Object.fromEntries(Object.entries(issueCounts).sort((a,b)=>b[1]-a[1]))};
          fs.writeFileSync('audit-summary.json',JSON.stringify(out,null,2));
          console.log('FINAL_RECORD_TRUTH_AUDIT='+JSON.stringify(out,null,2));
          if(Number(s.unexplained_record_contradictions)!==0) throw new Error(`Merge gate failed: ${s.unexplained_record_contradictions} teams have unexplained record contradictions`);
          NODE

      - name: Preserve exact final audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-record-truth-audit-9e302844
          path: |
            marker.json
            audit.json
            audit-summary.json
          if-no-files-found: warn
          retention-days: 1
