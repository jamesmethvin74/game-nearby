name: M2 DragonFly feed probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate statewide feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          : > probe/summary.txt
          for code in MFB_Varsity; do
            url="https://maxinfosite-api-live.dragonflyathletics.com/states/ArkAA/schedules/2026/${code}/0"
            status=$(curl -sS -L --max-time 30 -o "probe/${code}.json" -w '%{http_code}' "$url" || true)
            bytes=$(wc -c < "probe/${code}.json" 2>/dev/null || printf '0')
            printf '%s status=%s bytes=%s ' "$code" "$status" "$bytes" | tee -a probe/summary.txt
            CODE="$code" node <<'NODE' | tee -a probe/summary.txt
          const fs=require('fs');
          const code=process.env.CODE;
          try {
            const data=JSON.parse(fs.readFileSync(`probe/${code}.json`,'utf8'));
            const shape=Array.isArray(data)?`array:${data.length}`:`object:${Object.keys(data).slice(0,12).join(',')}`;
            const schedule=Array.isArray(data?.schedule)?data.schedule:[];
            const sport=schedule[0]?.associatedSports?.[0] || null;
            console.log(`json=${shape} schedule=${schedule.length} sport=${JSON.stringify(sport)}`);
          } catch (e) {
            console.log('json=invalid');
          }
          NODE
          done
      - uses: actions/upload-artifact@v4
        with:
          name: m2-dragonfly-feed-probe
          path: probe/
          if-no-files-found: error
