<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071426" />
  <title>Game Nearby</title>
  <link rel="manifest" href="manifest.json?v=5" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">LOCAL SPORTS</p>
      <h1>Game Nearby</h1>
    </div>
    <button id="locateBtn" class="icon-btn" aria-label="Use my location">◎</button>
  </header>

  <main>
    <section class="controls card">
      <div class="location-row">
        <div>
          <span class="label">Search center</span>
          <strong id="locationLabel">Conway, Arkansas</strong>
        </div>
        <div class="radius-control">
          <label for="radius">Radius</label>
          <select id="radius">
            <option value="10">10 mi</option>
            <option value="25" selected>25 mi</option>
            <option value="50">50 mi</option>
            <option value="100">100 mi</option>
          </select>
        </div>
      </div>

      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="high-school">High school</button>
        <button class="filter" data-filter="college">College</button>
        <button class="filter" data-filter="football">Football</button>
        <button class="filter" data-filter="basketball">Basketball</button>
      </div>
    </section>

    <section class="followed">
      <div class="section-title">
        <div>
          <p class="eyebrow">PRIORITY</p>
          <h2>Your teams nearby</h2>
        </div>
        <button id="editTeamsBtn" class="text-btn">Edit teams</button>
      </div>
      <div id="followedEvents" class="event-list"></div>
    </section>

    <section>
      <div class="section-title">
        <div>
          <p class="eyebrow">EXPLORE</p>
          <h2>Other games nearby</h2>
        </div>
        <span id="resultCount" class="count-pill"></span>
      </div>
      <div id="otherEvents" class="event-list"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active">⌂<span>Home</span></button>
    <button id="teamsNav" class="nav-item">★<span>Teams</span></button>
    <button class="nav-item">⌖<span>Map</span></button>
    <button class="nav-item">☰<span>More</span></button>
  </nav>

  <dialog id="teamsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">PERSONALIZE</p>
          <h2>Follow teams</h2>
        </div>
        <button value="cancel" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div id="teamChoices" class="team-choices"></div>
      <button id="saveTeamsBtn" value="default" class="primary-btn">Save teams</button>
    </form>
  </dialog>

  <script src="app.js?v=5"></script>
  <script src="tickets.js?v=5"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.update());
      });
    }
  </script>
</body>
</html>
