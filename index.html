  <header class="app-header branded-header"><button id="menuBtn" class="header-btn" aria-label="Open menu"><span class="menu-glyph" aria-hidden="true"><span></span><span></span><span></span></span></button><div class="brand-lockup" aria-label="LocalBleachersAR"><span class="brand-name"><span class="brand-local">Local</span><span class="brand-core">Bleachers</span><span class="brand-ar">AR</span></span></div><div class="header-actions"><button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">☾</button><button id="locateBtn" class="header-btn" type="button" aria-label="Use my location">◎</button></div></header>
  <main><section class="discovery-panel" aria-label="Find nearby games"><div class="location-strip"><div class="location-summary"><span class="location-pin" aria-hidden="true">●</span><div class="location-copy"><strong id="locationLabel">Conway, Arkansas</strong></div></div><div class="radius-control"><label for="radius">Radius:</label><select id="radius"><option value="10">10 miles</option><option value="25" selected>25 miles</option><option value="50">50 miles</option><option value="100">100 miles</option></select></div></div><div class="date-filters" aria-label="Date filters"><button class="date-filter active" type="button" data-date-filter="upcoming">Upcoming</button><button class="date-filter" type="button" data-date-filter="today">Today</button><button class="date-filter" type="button" data-date-filter="tomorrow">Tomorrow</button><button class="date-filter" type="button" data-date-filter="weekend">This Weekend</button><button class="date-filter" type="button" data-date-filter="pick">Pick Date</button><input id="datePicker" type="date" hidden /></div><div class="filters" aria-label="Game filters"><button class="filter active" type="button" data-filter="all">All Sports</button><button class="filter" type="button" data-filter="football">Football</button><button class="filter" type="button" data-filter="basketball">Basketball</button><button class="filter" type="button" data-filter="soccer">Soccer</button><button class="filter" type="button" data-filter="volleyball">Volleyball</button><button class="filter" type="button" data-filter="high-school">High School</button><button class="filter" type="button" data-filter="college">College</button><button class="filter" type="button" data-filter="male">Boys &amp; Men</button><button class="filter" type="button" data-filter="female">Girls &amp; Women</button></div></section>
    <section class="followed"><div class="section-title"><div class="section-heading"><span class="section-icon" aria-hidden="true">★</span><div><p class="eyebrow">PRIORITY</p><h2>Your teams nearby</h2></div></div><button id="editTeamsBtn" class="text-btn" type="button">Edit teams</button></div><div id="followedEvents" class="event-list"></div></section><section><div class="section-title"><div class="section-heading"><span class="section-icon" aria-hidden="true">◉</span><div><p class="eyebrow">EXPLORE</p><h2>Other games nearby</h2></div></div><span id="resultCount" class="count-pill"></span></div><div id="otherEvents" class="event-list"></div></section><aside class="alerts-promo" aria-label="Game alerts"><div class="alert-bell" aria-hidden="true">●</div><div class="alert-copy"><strong>Never miss a game!</strong><span>Get notified when your teams play nearby.</span></div><button id="alertsBtn" class="alert-cta" type="button">Turn On Alerts</button></aside></main>
