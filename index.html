<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071426" />
  <title>Game Nearby</title>
  <link rel="manifest" href="manifest.json?v=7" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <style>
    .event-card.home-game {
      background: linear-gradient(145deg,#142b50,#171f46) !important;
      border-color: #385a88 !important;
    }
    .event-card.away-game {
      background: linear-gradient(145deg,#3a1720,#24131a) !important;
      border-color: #b3536e !important;
      box-shadow: 0 14px 34px rgba(45,8,18,.42) !important;
    }
    .event-card.away-game .team-badge {
      background: linear-gradient(135deg,#b8325c,#762842) !important;
    }
    .home-away-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin: 6px 0 1px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: .65rem;
      font-weight: 900;
      letter-spacing: .1em;
      background: rgba(77,163,255,.14);
      color: #8bcaff;
      border: 1px solid rgba(77,163,255,.4);
    }
    .away-game .home-away-badge {
      background: rgba(255,117,148,.14);
      color: #ff9cb5;
      border-color: rgba(255,117,148,.45);
    }
    .away-game .event-actions {
      background: rgba(47,8,18,.28) !important;
      border-top-color: #7f3a4d !important;
    }
    .event-actions .ticket-action {
      color: #ffd166 !important;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">LOCAL SPORTS</p>
      <h1>Game Nearby</h1>
    </div>
    <button id="locateBtn" class="icon-btn" aria-label="Use my location">◎</button>
  </header>

  <main>
    <section class="controls card">
      <div class="location-row">
        <div>
          <span class="label">Search center</span>
          <strong id="locationLabel">Conway, Arkansas</strong>
        </div>
        <div class="radius-control">
          <label for="radius">Radius</label>
          <select id="radius">
            <option value="10">10 mi</option>
            <option value="25" selected>25 mi</option>
            <option value="50">50 mi</option>
            <option value="100">100 mi</option>
          </select>
        </div>
      </div>

      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="high-school">High school</button>
        <button class="filter" data-filter="college">College</button>
        <button class="filter" data-filter="football">Football</button>
        <button class="filter" data-filter="basketball">Basketball</button>
      </div>
    </section>

    <section class="followed">
      <div class="section-title">
        <div>
          <p class="eyebrow">PRIORITY</p>
          <h2>Your teams nearby</h2>
        </div>
        <button id="editTeamsBtn" class="text-btn">Edit teams</button>
      </div>
      <div id="followedEvents" class="event-list"></div>
    </section>

    <section>
      <div class="section-title">
        <div>
          <p class="eyebrow">EXPLORE</p>
          <h2>Other games nearby</h2>
        </div>
        <span id="resultCount" class="count-pill"></span>
      </div>
      <div id="otherEvents" class="event-list"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active">⌂<span>Home</span></button>
    <button id="teamsNav" class="nav-item">★<span>Teams</span></button>
    <button class="nav-item">⌖<span>Map</span></button>
    <button class="nav-item">☰<span>More</span></button>
  </nav>

  <dialog id="teamsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">PERSONALIZE</p>
          <h2>Follow teams</h2>
        </div>
        <button value="cancel" class="icon-btn" aria-label="Close">×</button>
      </div>
      <div id="teamChoices" class="team-choices"></div>
      <button id="saveTeamsBtn" value="default" class="primary-btn">Save teams</button>
    </form>
  </dialog>

  <script src="app.js?v=7"></script>
  <script>
    const CONWAY_TICKETS_URL = "https://gofan.co/school/AR4663";

    function enhanceEventCards() {
      document.querySelectorAll('.event-card').forEach(card => {
        const main = card.querySelector('.event-main');
        if (!main) return;

        const text = main.textContent || '';
        const isAway = /·\s*at\s+/i.test(text) || /\bat\s+[A-Z]/.test(text);
        card.classList.toggle('away-game', isAway);
        card.classList.toggle('home-game', !isAway);

        let badge = card.querySelector('.home-away-badge');
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'home-away-badge';
          const title = card.querySelector('.event-title');
          if (title && title.parentElement) title.parentElement.insertBefore(badge, title.nextSibling);
        }
        if (badge) badge.textContent = isAway ? 'AWAY' : 'HOME';

        const actions = card.querySelector('.event-actions');
        if (actions && !actions.querySelector('.ticket-action')) {
          const ticket = document.createElement('a');
          ticket.className = 'ticket-action';
          ticket.href = CONWAY_TICKETS_URL;
          ticket.target = '_blank';
          ticket.rel = 'noopener';
          ticket.textContent = 'Tickets';
          ticket.setAttribute('aria-label','View or buy tickets on GoFan');
          const calendar = [...actions.querySelectorAll('a')].find(a => a.textContent.trim() === 'Calendar');
          if (calendar) actions.insertBefore(ticket, calendar);
          else actions.appendChild(ticket);
        }
      });
    }

    const cardObserver = new MutationObserver(enhanceEventCards);
    cardObserver.observe(document.body,{childList:true,subtree:true});
    enhanceEventCards();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.update());
      });
    }
  </script>
</body>
</html>
